#*******************************************************************************
#                       OpenNebula Configuration file
#*******************************************************************************

#*******************************************************************************
# ILP Optimizer configuration attributes
#-------------------------------------------------------------------------------
#  DEFAULT_SCHED: Definition of the default scheduling algorithm
#    - solver: Specifies the ILP solver to be used. Available options:
#      "CBC"   -> CBC solver:  https://coin-or.github.io/pulp/technical/solvers.html#pulp.apis.PULP_CBC_CMD
#      "GLPK"  -> GLPK solver: https://coin-or.github.io/pulp/technical/solvers.html#pulp.apis.GLPK_CMD
#      "COINMP"-> COINMP_DLL solver: https://coin-or.github.io/pulp/technical/solvers.html#pulp.apis.COINMP_DLL
#    - solver_path: Specifies the path to the solver binary. The "$arch"
#      placeholder is resolved at runtime to the host architecture
#      ("i64" on x86_64, "arm64" on aarch64).
#
# PLACEMENT: The initial placement settings
#    - POLICY:
#         - "BALANCE": Specifies that VMs should be distributed to ensure an even load across hosts.
#         - "PACK": Indicates that VMs should be placed onto the minimum number of hosts.
#    - WEIGHTS:
#         - CPU: Relative importance of the total CPU.
#         - MEMORY: Relative importance of total memory.
#
# OPTIMIZATION: The optimization settings
#    - POLICY: 
#         - "BALANCE": Specifies that VMs should be distributed to ensure an even load across hosts.
#         - "PACK": Indicates that VMs should be placed onto the minimum number of hosts.
#    - MIGRATION_THRESHOLD: Sets the maximum combined number of host and
#      datastore migrations. Default is -1 that means no migration
#      threshold is configured and imposed.
#    - HOST_MIGRATION_THRESHOLD: Sets the maximum number of VM
#      migrations allowed between hosts. Default is -1 that means no
#      host migration threshold is configured and imposed.
#    - DS_MIGRATION_THRESHOLD: Sets the maximum number of VM migrations
#      allowed between datastores. Default is 0 that means migrations
#      between datastores are not allowed. Use -1 for unlimited
#      storage migrations.
#    - MIGRATION_COOLDOWN_SECONDS: Minimum time before a healthy VM may be
#      host-migrated again by OneDRS. Failure/maintenance recovery and hard
#      placement reconciliation bypass the cooldown.
#    - WEIGHTS:
#         - CPU_USAGE: Relative importance of the CPU usage metric.
#         - CPU: Relative importance of the total CPU.
#         - MEMORY: Relative importance of total memory.
#         - DISK: Relative importance of disk usage (read and written).
#         - NET: Relative importanve of network usage (transmitted and received)
#
#  PREDICTIVE: Integrates both current and forecasted resource usage into scheduling decisions.
#  A value of 0.3 means that 30% of the optimization is based on predicted resource usage,
#  with the remaining 70% derived from current resource usage.
#
#  MEMORY_SYSTEM_DS_SCALE: This factor scales the VM usage of the system DS with
#  the memory size. This factor can be use to make the scheduler consider the
#  overhead of checkpoint files:
#       system_ds_usage = system_ds_usage + memory_system_ds_scale * memory
#
#  DIFFERENT_VNETS: When set (YES) the NICs of a VM will be forced to be in
#  different Virtual Networks.
#*******************************************************************************

DEFAULT_SCHED:
  SOLVER: "CBC"
  SOLVER_PATH: "/usr/lib/one/python/pulp/solverdir/cbc/linux/$arch/cbc"

PLACE:
  POLICY: "BALANCE"
  WEIGHTS:
    CPU: 1

OPTIMIZE:
  POLICY: "BALANCE"
  MIGRATION_THRESHOLD: -1
  HOST_MIGRATION_THRESHOLD: -1
  DS_MIGRATION_THRESHOLD: 0
  MIGRATION_COOLDOWN_SECONDS: 0
  PRIORITIZE_STORAGE_MIGRATIONS: "NO"
  WEIGHTS:
    CPU_USAGE: 1

PREDICTIVE: 0

MEMORY_SYSTEM_DS_SCALE: 0

DIFFERENT_VNETS: YES

# RESILIENCE: LayerSentry production admission and disruption controls.
# These controls complement the native OneDRS ILP optimizer.
#
# HOST_FAILURE_TOLERANCE: Number of simultaneous host failures the remaining
# healthy hosts must be able to absorb. Set 2+ for multi-node failure SLAs.
# FAILURE_DOMAIN_TOLERANCE: Number of whole labeled failure domains (rack/zone)
# the cluster must survive. Hosts may declare LAYERSENTRY_FAILURE_DOMAIN,
# FAILURE_DOMAIN, ZONE or RACK in their host template.
# CPU_RESERVE_PERCENT / MEMORY_RESERVE_PERCENT: Additional survivor headroom
# retained after the configured failures.
# MIN_HEALTHY_HOSTS: Fail closed when fewer monitored hosts remain.
# FAILURE_DOMAIN_SPREAD: Extends native VM Group anti-affinity across labeled
# rack/zone domains, falling back to host-level domains when unlabeled.
# Host warm-up/readiness: a MONITORED Host with template
# LAYERSENTRY_DRS_READY=NO is excluded from placement and resilience capacity
# until the external maintenance/auto-heal owner marks it ready after checks.
# ENABLED: Explicit resilience admission switch. Keep NO for unqualified/lab
# clusters; LayerSentry production profiles enable it deliberately.
# REQUIRE_FAILURE_DOMAIN_LABELS: Fail closed if rack/zone protection is
# requested but any healthy Host lacks an explicit domain label.
# COMBINED_FAILURE_MODES: Validate correlated rack/zone loss plus additional
# Host loss when both failure tolerances are configured.
# MAX_GROUP_MIGRATIONS: Maximum anti-affined replicas migrated by one plan.
# Use -1 to disable this additional disruption budget.
# MAX_FAILURE_SCENARIOS: Upper bound for exact Host/domain loss combinations.
RESILIENCE:
  # Disabled by default to preserve native OneDRS behavior for single-host,
  # lab and unqualified clusters. LayerSentry production policy enables this
  # explicitly after topology/capacity qualification.
  ENABLED: NO
  HOST_FAILURE_TOLERANCE: 0
  FAILURE_DOMAIN_TOLERANCE: 0
  CPU_RESERVE_PERCENT: 0
  MEMORY_RESERVE_PERCENT: 0
  MIN_HEALTHY_HOSTS: 1
  FAILURE_DOMAIN_SPREAD: NO
  REQUIRE_FAILURE_DOMAIN_LABELS: NO
  # When YES and both tolerances are non-zero, also validate simultaneous
  # failure-domain loss plus additional Host loss.
  COMBINED_FAILURE_MODES: NO
  # -1 disables the per-group migration budget; production stateful/quorum
  # profiles normally set this to 1.
  MAX_GROUP_MIGRATIONS: -1
  # Exact host/domain failure combinations are enumerated. Refuse policies
  # that would require an unbounded combinatorial search.
  MAX_FAILURE_SCENARIOS: 1024

