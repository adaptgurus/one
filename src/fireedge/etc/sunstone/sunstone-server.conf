################################################################################
# Protected Settings
################################################################################

# Zendesk support URL
support_url: 'https://opennebula.zendesk.com/api/v2'

# LayerSentry DR control-plane API. Keep the shared gateway token in a
# root/FireEdge-readable file; the token itself is never exposed to the browser.
#layersentry_dr_api: 'https://127.0.0.1:2617'
#layersentry_dr_gateway_token_file: '/etc/one/layersentry-dr.gateway-token'

# Optional parameter for Sunstone commands
sunstone_prepend: ''

# Directory to store temporal files when uploading images
tmpdir: '/var/tmp'

# Max size upload file (bytes)
max_upload_file_size: 10737418240 # 10 GiB


################################################################################
# Proxy
################################################################################

#Enable an http proxy for the support portal and to download MarketPlaceApps
# from the MarketPlace to the user's desktop.

#proxy: ""

################################################################################
# Check Official support - Support enterprise token
################################################################################

#token_remote_support: ""

################################################################################
# UI Settings
################################################################################

# LayerSentry production capability model.
#
# Empty or omitted means fail closed: backend-backed menus and direct URLs remain
# hidden until the deployment explicitly records every mandatory production gate.
# This shipped profile prequalifies only the three read-only core inventories whose
# native OpenNebula APIs and contained UI states are implemented and qualified.
# Create/deploy/update/delete operations use separate capability IDs and remain
# absent here, so read-only qualification never authorizes a mutation.
layersentry_capabilities:
  COMPUTE:
    enabled: true
    implementation: true
    backend: true
    configuration: true
    health: true
    authorization: true
    compatibility: true
    qualification: true
    readOnly: true
    reason: 'Qualified read-only VM inventory; mutations remain separately gated.'
  BLUEPRINTS:
    enabled: true
    implementation: true
    backend: true
    configuration: true
    health: true
    authorization: true
    compatibility: true
    qualification: true
    readOnly: true
    reason: 'Qualified read-only VM template inventory; mutations remain separately gated.'
  AFFINITY:
    enabled: true
    implementation: true
    backend: true
    configuration: true
    health: true
    authorization: true
    compatibility: true
    qualification: true
    readOnly: true
    reason: 'Qualified read-only VM group inventory; mutations remain separately gated.'
  SITE_RECOVERY_DR:
    enabled: true
    implementation: true
    backend: true
    configuration: true
    health: true
    authorization: true
    compatibility: true
    qualification: true
    dataSafety: true
    readOnly: true
    reason: 'Qualified Site Recovery inventory; Protection Domain changes and checkpoint execution remain backend-gated.'


# Enforces 2FA authentication for ALL users.
enforce_2fa: false

# True to display 'Keep me logged in' option
keep_me_logged: true

# This automatically adds scheduling actions
#
# Allowed periods: years, months, weeks, days, hours, minutes
# eg: execute_after_minutes: 30
#
# edit:                allows to edit the form
# execute_after_weeks: days to execute the action
# warn_before_days:    alert a time before the action (in days)
leases:
  terminate:
    edit: false
    execute_after_weeks: 2
    warn_before_days: 1

# Support filesystem
# You may want to update SUPPORTED_FS in datastore.conf
supported_fs:
    - ext4
    - ext3
    - ext2
    - xfs

# Use the extended VM pool 
# By default this value is true
# https://docs.opennebula.io/6.8/integration_and_development/system_interfaces/api.html#one-vmpool-infoextended
#use_extended_vmpool: true

# Currency formatting
# Possible values are the ISO 4217 currency codes
# https://www.six-group.com/en/products-services/financial-information/data-standards.html
currency: EUR

# Default language setting
default_lang: en

# Translations: use it if you want to use certain languages on the client
# Check that the language exists in client/assets/languages
langs:
  # bg_BG: 'Bulgarian (Bulgaria)'
  # bg: 'Bulgarian'
  # ca: 'Catalan'
  # cs_CZ: 'Czech'
  # da: 'Danish'
  # de_CH: 'German (Switzerland)'
  de: 'German'
  # el_GR: 'Greek (Greece)'
  en: 'English'
  es_ES: 'Spanish'
  # et_EE: 'Estonian'
  # fa_IR: 'Persian (Iran)'
  # fa: 'Persian'
  # fr_CA: 'French (Canada)'
  fr_FR: 'French'
  # hu_HU: 'Hungary'
  it_IT: 'Italian'
  # ja: 'Japanese'
  # ka: 'Georgian'
  # lt_LT: 'Lithuanian'
  # nl_NL: 'Dutch'
  # pl: Polish
  # pt_PT: 'Portuguese'
  # ro_RO: 'Romanian'
  # ru_RU: 'Russian'
  ru: 'Russian'
  # si: 'Sinhala'
  sk_SK: 'Slavak'
  # sr_RS: 'Serbian'
  # sv: 'Swedish'
  # th_TH: 'Thai (Thailand)'
  # th: 'Thai'
  # tr_TR: 'Turkish (Turkey)'
  # tr: 'Turkish'
  # uk_UA: 'Ukrainian (Ukraine)'
  # uk: 'Ukrainian'
  # vi: 'Vietnamese'
  zh_CN: 'Chinese (China)'
  # zh_TW: 'Chinese (Taiwan)'

# Time Zone
# You may use it to change the time zone.
# https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
# currentTimeZone: "Europe/Madrid"

# Type of rows of data tables.
# Styles can be "card" or "list", default is card.                                         
rowStyle: 'card'

# Show resources info in full mode
fullViewMode: 'false'
