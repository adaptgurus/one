---
# This file describes the information and actions available in the VM Template tab
resource_name: "VM-TEMPLATE"

features:
  hide_cpu: true
  cpu_factor: 1

actions:
  create_dialog: false
  import_dialog: false
  update_dialog: false
  instantiate_dialog: true
  create_app_dialog: false
  clone: false
  delete: true
  chown: false
  chgrp: false
  lock: false
  unlock: false
  share: false
  unshare: false
  edit_labels: false

filters:
  owner: true
  group: true
  locked: true
  vrouter: true

info-tabs:
  info:
    enabled: true
    information_panel:
      enabled: true
      actions:
        rename: false
    permissions_panel:
      enabled: true
      actions:
        chmod: false
    ownership_panel:
      enabled: true
      actions:
        chown: false
        chgrp: false
  template:
    enabled: true

dialogs:
  instantiate_dialog:
    information: true
    ownership: true
    capacity: true
    vm_group: true
    network: true
    storage: true
    protection: true
    placement: true
    sched_action: true
    booting: true
  create_dialog:
    ownership: true
    capacity: true
    showback: true
    vm_group: true
    network: true
    storage: true
    placement: true
    input_output: true
    sched_action: true
    context: true
    booting: true
    numa:
      enabled: true
      not_on:
        - lxc
    backup: true
