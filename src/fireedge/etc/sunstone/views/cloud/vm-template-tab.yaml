---
# LayerSentry customer VM-template view. Provider templates are read-only.
resource_name: "VM-TEMPLATE"

features:
  # Customer chooses vCPU only. OpenNebula CPU scheduling weight is derived.
  hide_cpu: true
  cpu_factor: 0.5

actions:
  create_dialog: false
  import_dialog: false
  update_dialog: false
  instantiate_dialog: true
  create_app_dialog: false
  clone: false
  delete: false
  chown: false
  chgrp: false
  lock: false
  unlock: false
  share: false
  unshare: false
  edit_labels: false

filters:
  owner: false
  group: false
  locked: false
  vrouter: false

info-tabs:
  info:
    enabled: true
    information_panel:
      enabled: true
      actions:
        rename: false
    permissions_panel:
      enabled: false
      actions:
        chmod: false
    ownership_panel:
      enabled: false
      actions:
        chown: false
        chgrp: false
  template:
    enabled: false

dialogs:
  instantiate_dialog:
    information: true
    capacity: true
    ownership: false
    vm_group: false
    # LayerSentry cloud resources replace the native storage/network dialogs.
    network: false
    storage: false
    pci: false
    placement: false
    sched_action: false
    booting: false
    # Safe LayerSentry request-only options remain available.
    gpu: true
    protection: true
  create_dialog:
    ownership: false
    capacity: false
    showback: false
    vm_group: false
    network: false
    storage: false
    pci: false
    placement: false
    input_output: false
    sched_action: false
    context: false
    booting: false
    numa: false
    backup: false
