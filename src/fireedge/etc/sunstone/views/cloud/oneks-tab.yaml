---
# Native OneKS lifecycle exposed to the customer view. OpenNebula/OneKS remain
# the lifecycle authority; this file changes only view availability.
resource_name: "KUBERNETES"
actions:
  create_dialog: true
  recover: true
  upgrade: true
  edit_labels: true
  delete: true
filters:
  id: true
  name: true
  state: true
  version: true
  locked: true
  created: true
info-tabs:
  info:
    enabled: true
    information_panel:
      enabled: true
    permissions_panel:
      enabled: true
      actions:
        chmod: true
    ownership_panel:
      enabled: true
      actions:
        chown: false
        chgrp: false
  nodegroup:
    enabled: true
    actions:
      create_dialog: true
  logs:
    enabled: true
  events:
    enabled: true
  kubeconfig:
    enabled: true
