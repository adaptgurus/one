---
# Customer-owned disk images. Provider ownership transfer and raw attribute
# mutation stay out of the self-service view.
resource_name: "IMAGE"
actions:
  create_dialog: true
  import_dialog: false
  clone: true
  lock: true
  unlock: true
  disable: true
  enable: true
  persistent: true
  nonpersistent: true
  chown: false
  chgrp: false
  delete: true
filters:
  state: true
  locked: true
info-tabs:
  info:
    enabled: true
    information_panel:
      enabled: true
      actions:
        rename: true
    permissions_panel:
      enabled: false
      actions:
        chmod: false
    ownership_panel:
      enabled: false
      actions:
        chown: false
        chgrp: false
    attributes_panel:
      enabled: false
      actions:
        copy: false
        add: false
        edit: false
        delete: false
  vms:
    enabled: true
  snapshot:
    enabled: true
    actions:
      snapshot_flatten: true
      snapshot_revert: true
      snapshot_delete: true
