---
# Logical network/IPAM self-service only. Physical bridge/VLAN/fabric setup is
# provider-owned and is not exposed here.
resource_name: "VIRTUAL-NETWORK"
actions:
  create_dialog: false
  import_dialog: false
  instantiate_dialog: true
  reserve_dialog: true
  update_dialog: false
  change_cluster: false
  chown: false
  chgrp: false
  lock: true
  unlock: true
  delete: true
filters:
  state: true
  owner: false
  group: false
  locked: false
  vn_mad: false
info-tabs:
  info:
    enabled: true
    information_panel:
      enabled: true
      actions:
        rename: true
    permissions_panel:
      enabled: false
      actions:
        chmod: false
    ownership_panel:
      enabled: false
      actions:
        chown: false
        chgrp: false
    qos_panel:
      enabled: true
    attributes_panel:
      enabled: false
      actions:
        copy: false
        add: false
        edit: false
        delete: false
  address:
    enabled: true
    actions:
      add_ar: true
      update_ar: true
      delete_ar: true
  lease:
    enabled: true
    actions:
      hold_lease: true
      release_lease: true
  security:
    enabled: true
    actions:
      add_secgroup: true
      delete_secgroup: true
  virtual_router:
    enabled: true
  cluster:
    enabled: false
