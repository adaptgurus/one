---
# Self account, quota, accounting and showback. Cloud users can update their
# own password/public SSH key through the existing authenticated user flow;
# private key material and authentication-driver changes stay disabled.
resource_name: "USER"
actions:
  create_dialog: false
  chgrp: false
  delete: false
  enable: false
  disable: false
filters:
  label: false
  state: false
info-tabs:
  info:
    enabled: true
    information_panel:
      enabled: true
      actions:
        rename: false
    attributes_panel:
      enabled: true
      actions:
        copy: false
        add: false
        edit: false
        delete: false
  group:
    enabled: false
    actions:
      chgrp: false
  quota:
    enabled: true
    actions:
      quotas_dialog: true
  accounting:
    enabled: true
    actions:
      get_accounting: true
  showback:
    enabled: true
    actions:
      get_showback: true
  authentication:
    enabled: true
    actions:
      change_authentication: false
      update_password: true
      login_token: false
      two_factor_auth: false
      public_ssh_key: true
      private_ssh_key: false
      private_ssh_key_passphrase: false
