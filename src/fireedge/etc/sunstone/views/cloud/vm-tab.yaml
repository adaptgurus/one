---
# LayerSentry customer VM view. Native lifecycle remains authoritative while
# provider-only hardware, placement and raw device controls stay hidden.
resource_name: "VM"

actions:
  create_dialog: true
  create_app_dialog: true
  deploy: false
  migrate: false
  migrate_live: false
  live-migrate: false
  hold: false
  release: false
  suspend: false
  resume: true
  stop: false
  recover: false
  reboot: true
  reboot-hard: true
  poweroff: true
  poweroff-hard: true
  undeploy: false
  undeploy-hard: false
  terminate: true
  terminate-hard: true
  resched: false
  unresched: false
  save_as_template: true
  chown: false
  chgrp: false
  lock: false
  unlock: false
  vnc: true
  ssh: true
  rdp: true
  edit_labels: false
  backup: true
  restore: false

filters:
  state: true
  owner: false
  group: false
  type: false
  locked: false
  ips: true
  hostname: true

info-tabs:
  info:
    enabled: true
    information_panel:
      enabled: true
      actions:
        rename: true
    permissions_panel:
      enabled: false
      actions:
        chmod: false
    ownership_panel:
      enabled: false
      actions:
        chown: false
        chgrp: false
    capacity_panel:
      enabled: true
      actions:
        resize: false
    monitoring_panel:
      enabled: true
      actions:
        copy: false
    attributes_panel:
      enabled: false
      actions:
        copy: false
        add: false
        edit: false
        delete: false

  vm_group:
    enabled: false
    actions:
      vmgroup-add: false
      vmgroup-del: false

  # Display disks but do not expose native bus/cache/driver attach forms.
  storage:
    enabled: true
    actions:
      disk-attach:
        enabled: false
      disk-attach-image: false
      disk-attach-volatile: false
      disk-detach: false
      disk-resize: false
      disk_saveas:
        enabled: false
      disk-saveas: false
      disk-snapshot-create: false
      disk-snapshot-delete: false
      disk-snapshot-rename: false
      disk-snapshot-revert: false

  # Display NICs but inherit network implementation from the provider VNet.
  network:
    enabled: true
    actions:
      nic-attach: false
      nic-attach-alias: false
      nic-detach: false
      nic-update: false
      sg-attach: false
      sg-detach: false

  pci:
    enabled: false
    actions:
      pci-attach: false
      pci-detach: false

  snapshot:
    enabled: true
    actions:
      snapshot-create: true
      snapshot-revert: true
      snapshot-delete: true

  backup:
    enabled: true
    actions:
      backup-configure: true
      backup-create: true
      backup-restore: true

  history:
    enabled: true

  sched_actions:
    enabled: false
    actions:
      sched-add: false
      sched-update: false
      sched-delete: false
      charter_create: false

  exec:
    enabled: true
    actions:
      exec: true
      exec-retry: true
      exec-cancel: true

  configuration:
    enabled: false
    actions:
      update_configuration: false

  template:
    enabled: false

  logs:
    enabled: true
