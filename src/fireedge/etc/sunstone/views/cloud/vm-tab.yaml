---
# LayerSentry customer VM view. Native OpenNebula actions remain authoritative.
resource_name: "VM"

actions:
  create_dialog: true
  create_app_dialog: true
  deploy: false
  migrate: false
  migrate_live: false
  live-migrate: false
  hold: false
  release: false
  suspend: false
  resume: true
  stop: false
  recover: false
  reboot: true
  reboot-hard: true
  poweroff: true
  poweroff-hard: true
  undeploy: false
  undeploy-hard: false
  terminate: true
  terminate-hard: true
  resched: false
  unresched: false
  save_as_template: true
  chown: false
  chgrp: false
  lock: false
  unlock: false
  vnc: true
  ssh: true
  rdp: true
  edit_labels: true
  backup: true

filters:
  state: true
  owner: true
  group: true
  type: true
  locked: true
  ips: true
  hostname: true

info-tabs:
  info:
    enabled: true
    information_panel:
      enabled: true
      actions:
        rename: true
    permissions_panel:
      enabled: true
      actions:
        chmod: false
    ownership_panel:
      enabled: true
      actions:
        chown: false
        chgrp: false
    capacity_panel:
      enabled: true
      actions:
        resize: true
    monitoring_panel:
      enabled: true
      actions:
        copy: true
    attributes_panel:
      enabled: false
      actions:
        copy: true
        add: false
        edit: false
        delete: false

  storage:
    enabled: true
    actions:
      disk-attach:
        enabled: true
      disk-attach-image: true
      disk-attach-volatile: true
      disk-detach: true
      disk-resize: true
      disk_saveas:
        enabled: true
      disk-saveas: true
      disk-snapshot-create: true
      disk-snapshot-delete: true
      disk-snapshot-rename: true
      disk-snapshot-revert: true

  network:
    enabled: true
    actions:
      nic-attach: true
      nic-attach-alias: true
      nic-detach: true
      nic-update: true
      sg-attach: true
      sg-detach: true

  # Dedicated accelerators use the existing native PCI inventory and
  # attach/detach handlers. Host preparation and device availability still gate it.
  pci:
    enabled: true
    actions:
      pci-attach: true
      pci-detach: true

  snapshot:
    enabled: true
    actions:
      snapshot-create: true
      snapshot-revert: true
      snapshot-delete: true

  backup:
    enabled: true

  history:
    enabled: true

  sched_actions:
    enabled: true
    actions:
      sched-add: true
      sched-update: true
      sched-delete: true
      charter_create: true

  configuration:
    enabled: false
    actions:
      update_configuration: false

  template:
    enabled: true
