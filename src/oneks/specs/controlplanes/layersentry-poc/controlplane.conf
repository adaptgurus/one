name: "LayerSentry P1 POC"
description: "Cluster configuration for general workloads"
family: "layersentry-poc"
supported_k8s_versions:
  - v1.36.4

dependencies:
  - object: seed_vm
    options:
      creation_timeout: 5400
      destroy_on_running: true
      appliance_id: layersentry-p1-seed-v7
      appliance_ds: 1
  - object: cluster_router
    options:
      creation_timeout: 5400
      destroy_on_running: false

user_inputs:
  - name: count
    description: "Number of Control Plane nodes"
    type: number
    mandatory: true
    match:
      type: number
      values:
        min: 1
        max: 7
  - name: cpu
    description: "CPU cores per Control Plane node"
    type: number
    mandatory: true
    match:
      type: number
      values:
        min: 1
  - name: vcpu
    description: "Number of VCPUs per Control Plane node"
    type: number
    mandatory: true
    match:
      type: number
      values:
        min: 1
  - name: memory
    description: "RAM in MB per Control Plane node"
    type: number
    mandatory: true
    match:
      type: number
      values:
        min: 2048
  - name: disk_size
    description: "Disk size in MB per Control Plane node"
    type: number
    mandatory: true
    match:
      type: number
      values:
        min: 4096

  - name: node_image_id
    description: "Approved node image ID"
    type: number
    mandatory: true
    match:
      type: number
      values:
        min: 0
  - name: system_datastore_id
    description: "Local system datastore ID"
    type: number
    mandatory: true
    match:
      type: number
      values:
        min: 0
  - name: router_image_id
    description: "Verified VRouter image ID"
    type: number
    mandatory: true
    match:
      type: number
      values:
        min: 0
  - name: router_vmgroup_id
    description: "Task-owned endpoint anti-affinity VM group ID"
    type: number
    mandatory: true
    match:
      type: number
      values:
        min: 0

flavours:
  standalone:
    label: "LayerSentry Control Plane"
    description: |
      <p>Defaults to one Control Plane node for lab use. Explicit replica counts are preserved so the same native CAPRKE2 lifecycle can create or scale multi-node control planes.</p>
    override_defaults: true
    defaults:
      count: 1
      cpu: 6
      vcpu: 6
      memory: 8192
      disk_size: 16384

metadata:
  fireedge:
