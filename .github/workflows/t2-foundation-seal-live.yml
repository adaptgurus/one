name: T2 Foundation Live Seal

on:
  push:
    branches:
      - ops/t2-foundation-iso-qualification-20260921
    paths:
      - .github/workflows/t2-foundation-seal-live.yml

permissions:
  contents: read

concurrency:
  group: t2-foundation-seal-live
  cancel-in-progress: true

jobs:
  inspect-state:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Inspect controller job state without mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $q='C:\LayerSentryLab\qualification'
          $source=Join-Path $q 'iso-builder-key'
          $known=Join-Path $q 'known_hosts_builder'
          & icacls.exe $source /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe $known /grant:r '*S-1-5-18:(R)' | Out-Null
          $key=Join-Path $env:RUNNER_TEMP 't2-state-builder-key'
          Copy-Item -LiteralPath $source -Destination $key -Force
          & icacls.exe $key /setowner '*S-1-5-18' | Out-Null
          & icacls.exe $key /inheritance:r | Out-Null
          & icacls.exe $key /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe $source /remove:g '*S-1-5-18' | Out-Null
          $ssh=(Get-Command ssh.exe).Source
          $scp=(Get-Command scp.exe).Source
          $base=@('-o','BatchMode=yes','-o','ConnectTimeout=10','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$known",'-i',$key)
          $local=Join-Path $env:GITHUB_WORKSPACE 'qualification\t2-live-state.py'
          & $scp @base $local 'builder@10.250.10.40:/home/builder/t2-live-state.py'
          if($LASTEXITCODE -ne 0){throw 'Could not stage state helper'}
          & $ssh @base 'builder@10.250.10.40' 'python3 /home/builder/t2-live-state.py'
          if($LASTEXITCODE -ne 0){throw 'Controller state probe failed'}
          & $ssh @base 'builder@10.250.10.40' 'rm -f /home/builder/t2-live-state.py' 2>$null
          & icacls.exe $key /grant:r '*S-1-5-18:(F)' | Out-Null
          Remove-Item -LiteralPath $key -Force
