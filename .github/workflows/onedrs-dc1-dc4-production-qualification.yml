name: OneDRS dc1 dc4 Production Qualification

on:
  push:
    branches:
      - qual/onedrs-dc1-dc4-20261007
    paths:
      - ".github/workflows/onedrs-dc1-dc4-production-qualification.yml"

permissions:
  contents: read

concurrency:
  group: onedrs-dc1-dc4-production-qualification
  cancel-in-progress: false

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Bind dc1
        id: bind
        shell: bash
        run: |
          if [ "$RUNNER_NAME" = "dc1" ] && [ "$(hostname -s)" = "dc1" ]; then
            echo "dc1=true" >> "$GITHUB_OUTPUT"
            echo "DC1_AUTHORITY=PASS"
          else
            echo "dc1=false" >> "$GITHUB_OUTPUT"
            echo "SKIP_WRONG_RUNNER=PASS runner=$RUNNER_NAME host=$(hostname -s)"
          fi

      - name: Inspect live migration plane
        if: steps.bind.outputs.dc1 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "== control plane =="
          export ONE_AUTH=/var/lib/one/.one/one_auth
          onezone show 0
          onehost list
          for h in dc1 dc2 dc3 dc4; do
            echo "===== $h ====="
            if [ "$h" = dc1 ]; then
              RUN=""
            else
              RUN="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@$h"
            fi
            $RUN bash -s <<'EOS'
          set -e
          hostname -f
          echo "-- addr --"
          ip -br addr
          echo "-- routes --"
          ip route
          echo "-- hosts --"
          grep -E '(^|[[:space:]])dc[1-4]([[:space:]]|$)' /etc/hosts || true
          echo "-- qemu migration config --"
          grep -nE '^[[:space:]]*(migration_address|migration_port_min|migration_port_max|migrate_tls_force|migrate_tls_x509_cert_dir)[[:space:]]*=' /etc/libvirt/qemu.conf 2>/dev/null || true
          echo "-- libvirt daemon config --"
          grep -nE '^[[:space:]]*(listen_tls|listen_tcp|tcp_port|auth_tcp|auth_tls)[[:space:]]*=' /etc/libvirt/libvirtd.conf 2>/dev/null || true
          echo "-- firewalld --"
          firewall-cmd --state 2>/dev/null || true
          firewall-cmd --get-active-zones 2>/dev/null || true
          firewall-cmd --list-all-zones 2>/dev/null | grep -E '^(  interfaces:|  ports:|  services:|[a-zA-Z].*\\(active\\))' || true
          echo "-- libvirt sockets/listeners --"
          ss -lntp | grep -E ':(16509|4915[2-9]|4916[0-9]|4917[0-9]|4918[0-9]|4919[0-9]|4920[0-9]|4921[0-5])\\b' || true
          systemctl is-active libvirtd virtqemud virtproxyd 2>/dev/null || true
          EOS
          done

          echo "== pairwise migration-interface reachability =="
          for src in dc2 dc3 dc4; do
            for dst in dc2 dc3 dc4; do
              [ "$src" = "$dst" ] && continue
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@"$src" \
                "echo src=\$(hostname -s) dst=$dst; getent hosts $dst; ip route get \$(getent ahostsv4 $dst | awk 'NR==1{print \$1}') || true"
            done
          done
