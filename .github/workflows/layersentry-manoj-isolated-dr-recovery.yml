name: LayerSentry Manoj Isolated DR Recovery

on:
  push:
    branches:
      - dr-threepoint-ssh-20260924
    paths:
      - ".github/workflows/layersentry-manoj-isolated-dr-recovery.yml"
  pull_request:
    branches:
      - fix/layersentry-vm-network-backup-20260921
    paths:
      - ".github/workflows/layersentry-manoj-isolated-dr-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layersentry-manoj-isolated-dr-recovery
  cancel-in-progress: false

jobs:
  isolated-recovery:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Bind exact Manoj host and start only isolated KVM2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'MANOJ-TEST-INST') { throw "Wrong runner: $env:RUNNER_NAME" }
          if ($env:COMPUTERNAME -ine 'MANOJ-TEST-INST') { throw "Wrong computer: $env:COMPUTERNAME" }

          function Start-IsolatedKVM2 {
            param([Microsoft.HyperV.PowerShell.VirtualMachine]$VM)
            try {
              Start-VM -VM $VM -ErrorAction Stop | Out-Null
              return $true
            } catch {
              $message = $_.Exception.Message
              if ($message -notmatch 'Not enough memory|memory resources') { throw }
              Write-Host "KVM2_START_MEMORY_PRESSURE=YES"
              return $false
            }
          }

          $vm = Get-VM -Name 'ls-kvm2' -ErrorAction Stop
          Write-Host "KVM2_INITIAL_STATE=$($vm.State)"
          if ($vm.State -eq 'Off' -or $vm.State -eq 'Saved') {
            $started = Start-IsolatedKVM2 -VM $vm
            if (-not $started) {
              $reclaim = @('ls-appliance-4c4ac81-qual','ls-appliance-bootstrapfix-qual')
              foreach ($candidate in $reclaim) {
                $q = Get-VM -Name $candidate -ErrorAction SilentlyContinue
                if ($null -eq $q -or $q.State -ne 'Running') { continue }
                Write-Host "MEMORY_RECLAIM_SAVE_REQUESTED=$candidate"
                Save-VM -VM $q -ErrorAction Stop
                $saveDeadline = (Get-Date).AddMinutes(2)
                do {
                  Start-Sleep -Seconds 2
                  $q = Get-VM -Name $candidate
                } while ($q.State -ne 'Saved' -and (Get-Date) -lt $saveDeadline)
                if ($q.State -ne 'Saved') { throw "Qualification VM $candidate did not reach Saved state" }
                Write-Host "MEMORY_RECLAIM_SAVED=$candidate"
                $vm = Get-VM -Name 'ls-kvm2'
                $started = Start-IsolatedKVM2 -VM $vm
                if ($started) { break }
              }
            }
            if (-not $started) { throw 'ls-kvm2 still cannot start after bounded qualification-only memory reclaim' }
            Write-Host "KVM2_START_REQUESTED=YES"
          } elseif ($vm.State -ne 'Running') {
            throw "ls-kvm2 is in unexpected Hyper-V state $($vm.State)"
          }

          $deadline = (Get-Date).AddMinutes(4)
          do {
            Start-Sleep -Seconds 3
            $vm = Get-VM -Name 'ls-kvm2'
          } while ($vm.State -ne 'Running' -and (Get-Date) -lt $deadline)
          if ($vm.State -ne 'Running') { throw 'ls-kvm2 did not reach Running' }

          $nic = Get-VMNetworkAdapter -VMName 'ls-kvm2'
          $ips = @($nic.IPAddresses | Where-Object { $_ -match '^10\.250\.10\.\d+$' })
          Write-Host "KVM2_HYPERV_RUNNING=PASS"
          Write-Host ("KVM2_REPORTED_IPS=" + ($ips -join ','))
          $tcp = [System.Net.Sockets.TcpClient]::new()
          $sshReachable = $false
          try {
            $task = $tcp.ConnectAsync('10.250.10.21',22)
            if ($task.Wait(1500)) { $sshReachable = $tcp.Connected }
          } finally {
            $tcp.Dispose()
          }
          if (-not $sshReachable) { throw 'ls-kvm2 SSH port 10.250.10.21:22 is not reachable' }
          Write-Host "KVM2_SSH_REACHABLE=PASS IP=10.250.10.21"

      - name: Enable and pin empty OpenNebula host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import pathlib
          import time
          import xml.etree.ElementTree as ET
          from xmlrpc.client import ServerProxy
          from dissect.target import Target

          ENDPOINT = "http://10.250.10.10:2633/RPC2"
          AUTH_IMAGE = pathlib.Path(r"C:\LayerSentryLab\Recovery\fe2-lvm\2.img")
          HOST_NAME = "ls-kvm2"

          target = Target.open(str(AUTH_IMAGE))
          auth = target.fs.path("/var/lib/one/.one/one_auth").open("rb").read().decode().strip()
          if ":" not in auth or len(auth) > 1024:
              raise SystemExit("invalid independent OpenNebula auth shape")
          one = ServerProxy(ENDPOINT, allow_none=True)
          version = one.one.system.version(auth)
          if not version[0] or str(version[1]) != "7.4.1":
              raise SystemExit("independent OpenNebula authentication/version failed")
          print("INDEPENDENT_ONE_VERSION=" + str(version[1]))

          def host_by_name():
              res = one.one.hostpool.info(auth, -2, -1, -1)
              if not res[0]:
                  raise RuntimeError("host pool query failed: " + str(res[1])[:400])
              pool = ET.fromstring(res[1])
              matches = [h for h in pool.findall("HOST") if (h.findtext("NAME") or "").strip() == HOST_NAME]
              if len(matches) != 1:
                  raise RuntimeError(f"{HOST_NAME} host count={len(matches)}")
              return matches[0]

          host = host_by_name()
          host_id = int(host.findtext("ID"))
          initial_running = int(host.findtext("./HOST_SHARE/RUNNING_VMS") or 0)
          print(f"KVM2_PRE_MONITOR_RUNNING_VMS={initial_running}")

          # Hyper-V was just started; stale HOST_SHARE counters are not an
          # authoritative safety decision. Enable monitoring first, then require
          # a fresh host readback before checking occupancy.
          status = one.one.host.status(auth, host_id, 0)
          if not status[0]:
              raise SystemExit("enable host failed: " + str(status[1])[:400])

          deadline = time.time() + 120
          refreshed = None
          while time.time() < deadline:
              info = one.one.host.info(auth, host_id, False)
              if not info[0]:
                  time.sleep(2)
                  continue
              root = ET.fromstring(info[1])
              state = int(root.findtext("STATE") or -1)
              total_cpu = int(root.findtext("./HOST_SHARE/MAX_CPU") or root.findtext("./HOST_SHARE/TOTAL_CPU") or 0)
              # OpenNebula state 2 is MONITORED. This nested lab does not
              # populate LAST_MON_TIME/FREE_* reliably, so those are evidence
              # fields rather than readiness prerequisites.
              if total_cpu > 0 and state == 2:
                  refreshed = root
                  break
              time.sleep(2)
          if refreshed is None:
              raise SystemExit("ls-kvm2 did not reach OpenNebula MONITORED state with capacity")

          running = int(refreshed.findtext("./HOST_SHARE/RUNNING_VMS") or 0)
          max_cpu = int(refreshed.findtext("./HOST_SHARE/MAX_CPU") or refreshed.findtext("./HOST_SHARE/TOTAL_CPU") or 0)
          max_mem = int(refreshed.findtext("./HOST_SHARE/MAX_MEM") or 0)
          free_cpu_raw = refreshed.findtext("./HOST_SHARE/FREE_CPU")
          free_mem_raw = refreshed.findtext("./HOST_SHARE/FREE_MEM")
          vm_ids = [int((n.text or "-1").strip()) for n in refreshed.findall("./VMS/ID") if (n.text or "").strip()]
          diagnostics = []
          blocking = []
          for vm_id in vm_ids:
              info = one.one.vm.info(auth, vm_id, False)
              if not info[0]:
                  diagnostics.append({"id": vm_id, "info_error": str(info[1])[:200]})
                  blocking.append({"id": vm_id, "reason": "unreadable active allocation"})
                  continue
              vm = ET.fromstring(info[1])
              histories = vm.findall("./HISTORY_RECORDS/HISTORY")
              vm_host = histories[-1].findtext("HOSTNAME") if histories else ""
              state = int(vm.findtext("STATE") or -1)
              lcm_state = int(vm.findtext("LCM_STATE") or -1)
              deploy_id = (vm.findtext("DEPLOY_ID") or "").strip()
              row = {
                  "id": vm_id,
                  "name": (vm.findtext("NAME") or "").strip(),
                  "state": state,
                  "lcm_state": lcm_state,
                  "host": vm_host,
                  "deploy_id": deploy_id,
              }
              diagnostics.append(row)
              # ACTIVE + provider deploy identity means a live/ambiguous
              # hypervisor workload. Failure-without-deploy and POWEROFF do not.
              if state == 3 and deploy_id:
                  blocking.append(row)
          print("KVM2_POST_MONITOR_VM_DIAGNOSTICS=" + repr(diagnostics))
          if blocking:
              raise SystemExit("refusing isolated-host preparation: active deployed workloads=" + repr(blocking))
          free_cpu = int(free_cpu_raw) if free_cpu_raw not in (None, "") else max_cpu
          free_mem = int(free_mem_raw) if free_mem_raw not in (None, "") else max_mem
          print(f"KVM2_CAPACITY running_counter={running} max_cpu={max_cpu} free_cpu={free_cpu} max_mem={max_mem} free_mem={free_mem}")
          if free_cpu < 100 or free_mem < 262144:
              raise SystemExit(f"refusing isolated-host preparation: insufficient effective capacity free_cpu={free_cpu} free_mem={free_mem}")
          if running != 0:
              print("KVM2_STALE_OR_NONRUNNING_OCCUPANCY_ACCEPTED=YES")

          updated = one.one.host.update(auth, host_id, 'PIN_POLICY="PINNED"\nVMS_THREAD="1"', 1)
          if not updated[0]:
              raise SystemExit("host pinning update failed: " + str(updated[1])[:400])

          deadline = time.time() + 120
          last = None
          while time.time() < deadline:
              info = one.one.host.info(auth, host_id, False)
              if not info[0]:
                  last = ("info_error", str(info[1])[:200])
                  time.sleep(2)
                  continue
              root = ET.fromstring(info[1])
              state = int(root.findtext("STATE") or -1)
              running = int(root.findtext("./HOST_SHARE/RUNNING_VMS") or 0)
              total_cpu = int(root.findtext("./HOST_SHARE/MAX_CPU") or root.findtext("./HOST_SHARE/TOTAL_CPU") or 0)
              max_mem = int(root.findtext("./HOST_SHARE/MAX_MEM") or 0)
              free_cpu_raw = root.findtext("./HOST_SHARE/FREE_CPU")
              free_mem_raw = root.findtext("./HOST_SHARE/FREE_MEM")
              free_cpu = int(free_cpu_raw) if free_cpu_raw not in (None, "") else total_cpu
              free_mem = int(free_mem_raw) if free_mem_raw not in (None, "") else max_mem
              pin = (root.findtext("./TEMPLATE/PIN_POLICY") or "").strip().upper()
              vms_thread = (root.findtext("./TEMPLATE/VMS_THREAD") or "1").strip()
              last = (state, running, total_cpu, free_cpu, free_mem, pin, vms_thread)
              if state == 2 and free_cpu >= 100 and free_mem >= 262144 and total_cpu > 0 and pin == "PINNED" and vms_thread == "1":
                  print(f"MANOJ_ISOLATED_HOST_READY=PASS HOST={HOST_NAME} HOST_ID={host_id} STATE={state} TOTAL_CPU={total_cpu} FREE_CPU={free_cpu} FREE_MEM={free_mem} PIN_POLICY={pin} VMS_THREAD={vms_thread}")
                  break
              time.sleep(2)
          else:
              raise SystemExit("isolated host did not become pin-ready: " + repr(last))
          '@
          $path = Join-Path $env:RUNNER_TEMP 'prepare_isolated_kvm2.py'
          Set-Content -Path $path -Value $script -Encoding UTF8
          & 'C:\LayerSentryLab\tools\Python313\python.exe' $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import recovery material and boot CPU-pinned VM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import functools
          import hashlib
          import http.server
          import json
          import os
          import pathlib
          import threading
          import time
          import xml.etree.ElementTree as ET
          from xmlrpc.client import ServerProxy
          from dissect.target import Target

          ENDPOINT = "http://10.250.10.10:2633/RPC2"
          HOST_HTTP_IP = "10.250.10.1"
          HTTP_PORT = 18085
          DATASTORE_ID = 1
          TARGET_HOST = "ls-kvm2"
          RECOVERY_DIR = pathlib.Path(r"C:\LayerSentryLab\dr-recovery\tester-vm220-20260923")
          DISK = RECOVERY_DIR / "vm220-dr-recovered.qcow2"
          AUTH_IMAGE = pathlib.Path(r"C:\LayerSentryLab\Recovery\fe2-lvm\2.img")

          if not DISK.is_file():
              raise SystemExit("staged recovery disk missing")
          digest = hashlib.sha256(DISK.read_bytes()).hexdigest()
          print("RECOVERY_SOURCE_SHA256=" + digest)
          print("RECOVERY_SOURCE_BYTES=" + str(DISK.stat().st_size))

          target = Target.open(str(AUTH_IMAGE))
          auth = target.fs.path("/var/lib/one/.one/one_auth").open("rb").read().decode().strip()
          one = ServerProxy(ENDPOINT, allow_none=True)

          class QuietHandler(http.server.SimpleHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  pass

          handler = functools.partial(QuietHandler, directory=str(RECOVERY_DIR))
          server = http.server.ThreadingHTTPServer(("0.0.0.0", HTTP_PORT), handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()

          run_id = os.environ.get("GITHUB_RUN_ID", "manual")
          image_name = "ls-dr-pinned-recovery-" + run_id
          vm_name = "ls-dr-pinned-boot-" + run_id
          image_template = f'''NAME="{image_name}"
          PATH="http://{HOST_HTTP_IP}:{HTTP_PORT}/{DISK.name}"
          TYPE="OS"
          PERSISTENT="NO"
          DESCRIPTION="LayerSentry CPU-pinned independent DR recovery qualification"
          '''
          alloc = one.one.image.allocate(auth, image_template, DATASTORE_ID)
          if not alloc[0]:
              raise SystemExit("image allocate failed: " + str(alloc[1])[:500])
          image_id = int(alloc[1])
          print("PINNED_RECOVERY_IMAGE_ID=" + str(image_id))

          image_state = None
          for _ in range(180):
              info = one.one.image.info(auth, image_id, False)
              if not info[0]:
                  raise SystemExit("image info failed")
              root = ET.fromstring(info[1])
              image_state = int(root.findtext("STATE") or -1)
              if image_state == 1:
                  break
              if image_state in (5, 7):
                  err = root.findtext("./TEMPLATE/ERROR") or root.findtext("ERROR") or "provider error"
                  raise SystemExit("image terminal state: " + err[:500])
              time.sleep(2)
          if image_state != 1:
              raise SystemExit("image did not become READY")

          vm_template = f'''NAME="{vm_name}"
          CPU="1"
          VCPU="1"
          MEMORY="256"
          TOPOLOGY=[
            PIN_POLICY="CORE",
            CORES="1",
            SOCKETS="1",
            THREADS="1"
          ]
          DISK=[IMAGE_ID="{image_id}"]
          SCHED_REQUIREMENTS="NAME = \\\"{TARGET_HOST}\\\""
          '''
          va = one.one.vm.allocate(auth, vm_template, False)
          if not va[0]:
              raise SystemExit("VM allocate failed: " + str(va[1])[:500])
          vm_id = int(va[1])
          print("PINNED_RECOVERY_VM_ID=" + str(vm_id))

          final = None
          for _ in range(180):
              info = one.one.vm.info(auth, vm_id, False)
              if not info[0]:
                  raise SystemExit("VM info failed")
              root = ET.fromstring(info[1])
              state = int(root.findtext("STATE") or -1)
              lcm = int(root.findtext("LCM_STATE") or -1)
              histories = root.findall("./HISTORY_RECORDS/HISTORY")
              host = histories[-1].findtext("HOSTNAME") if histories else ""
              pin = (root.findtext("./TEMPLATE/TOPOLOGY/PIN_POLICY") or "").strip().upper()
              numa_cpus = [x.text for x in root.findall("./TEMPLATE/NUMA_NODE/CPUS") if x.text]
              final = (state, lcm, host, pin, numa_cpus)
              if state == 3 and lcm == 3 and host == TARGET_HOST:
                  if pin != "CORE":
                      raise SystemExit(f"VM running but PIN_POLICY={pin!r}, expected CORE")
                  print(f"MANOJ_PINNED_RECOVERY_BOOT=PASS VM_ID={vm_id} IMAGE_ID={image_id} HOST={host} PIN_POLICY={pin} NUMA_CPUS={numa_cpus}")
                  break
              if state == 6 or lcm in (14,15,36,44,48,49,50,56,57,58,59,60):
                  raise SystemExit("VM entered terminal/failure state: " + repr(final))
              time.sleep(2)
          else:
              raise SystemExit("pinned recovery VM did not become RUNNING: " + repr(final))

          evidence = {
              "vm_id": vm_id,
              "image_id": image_id,
              "host": TARGET_HOST,
              "pin_policy": "CORE",
              "source_sha256": digest,
              "source_bytes": DISK.stat().st_size,
              "preserved": True,
          }
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "manoj-pinned-recovery.json"
          out.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          print("MANOJ_PINNED_RECOVERY_PRESERVED=YES")
          server.shutdown()
          '@
          $path = Join-Path $env:RUNNER_TEMP 'pinned_recovery.py'
          Set-Content -Path $path -Value $script -Encoding UTF8
          $rule = "LayerSentry-Pinned-DR-$env:GITHUB_RUN_ID"
          try {
            New-NetFirewallRule -DisplayName $rule -Direction Inbound -Action Allow -Protocol TCP -LocalPort 18085 -RemoteAddress 10.250.10.0/24 -Profile Any | Out-Null
            & 'C:\LayerSentryLab\tools\Python313\python.exe' $path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          }

      - name: Upload preserved recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: manoj-pinned-recovery-evidence
          path: ${{ runner.temp }}\manoj-pinned-recovery.json
          if-no-files-found: error
          retention-days: 7
