name: LayerSentry dependency lock remediation

on:
  pull_request:
    paths:
      - 'src/fireedge/package.json'
      - 'src/fireedge/package-lock.json'
      - '.github/workflows/layersentry-lock-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Generate security modernization candidate lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact \
            axios@1.20.0 \
            dompurify@3.4.15 \
            express@4.22.2 \
            fast-xml-parser@4.5.7 \
            immutable@4.3.9 \
            jsonwebtoken@9.0.3 \
            lodash@4.18.1 \
            luxon@2.5.2 \
            multer@2.3.0 \
            socket.io@4.8.3 \
            socket.io-client@4.8.3 \
            webpack@5.110.3
      - name: Install candidate lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: LayerSentry regression tests
        run: node --test tests/layersentry/*.test.cjs
      - name: Full FireEdge production build
        run: NODE_ENV=production npm run build
      - name: Audit candidate runtime tree
        run: |
          npm audit --omit=dev --json > dependency-audit.json || true
          node -e "const a=require('./dependency-audit.json'); console.log('RUNTIME_AUDIT_COUNTS=' + JSON.stringify(a.metadata?.vulnerabilities ?? {}))"
          node - <<'NODE'
          const p=require('./package-lock.json')
          for (const [name, expected] of Object.entries({
            axios:'1.20.0', dompurify:'3.4.15', express:'4.22.2',
            'fast-xml-parser':'4.5.7', immutable:'4.3.9', jsonwebtoken:'9.0.3',
            lodash:'4.18.1', luxon:'2.5.2', multer:'2.3.0',
            'socket.io':'4.8.3', 'socket.io-client':'4.8.3', webpack:'5.110.3'
          })) {
            const actual=p.packages[`node_modules/${name}`]?.version
            console.log(`LOCKED_${name}=${actual}`)
            if (actual !== expected) process.exitCode=2
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fireedge-security-modernization-candidate
          path: |
            src/fireedge/package.json
            src/fireedge/package-lock.json
            src/fireedge/dependency-audit.json
          if-no-files-found: error
          retention-days: 1
