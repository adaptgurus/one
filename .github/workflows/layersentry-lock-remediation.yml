name: LayerSentry dependency lock remediation

on:
  pull_request:
    paths:
      - 'src/fireedge/package.json'
      - 'src/fireedge/package-lock.json'
      - 'src/fireedge/src/server/routes/api/zendesk/**'
      - 'src/fireedge/src/server/routes/websockets/guacamoleProxy.js'
      - 'src/fireedge/tests/layersentry/zendesk*.test.cjs'
      - 'src/fireedge/tests/layersentry/guacamole-proxy.test.cjs'
      - '.github/workflows/layersentry-lock-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Verify migrated integration contracts
        run: |
          grep -q "await zendeskClient.users.auth()" src/server/routes/api/zendesk/functions.js
          grep -q "await zendeskClient.requests.list" src/server/routes/api/zendesk/functions.js
          grep -q "await zendeskClient.requests.listComments" src/server/routes/api/zendesk/functions.js
          grep -q "await zendeskClient.requests.create" src/server/routes/api/zendesk/functions.js
          grep -q "await zendeskClient.requests.update" src/server/routes/api/zendesk/functions.js
          if grep -nE "users\.auth\([^)]*=>|requests\.(getRequest|listComments|create|update)\([^;]*=>" src/server/routes/api/zendesk/functions.js; then
            echo 'Legacy node-zendesk callback use remains.' >&2
            exit 2
          fi
          grep -q 'pathFilter: endpointExternalGuacamole' src/server/routes/websockets/guacamoleProxy.js
          grep -q 'proxyReqWs: setHeaders' src/server/routes/websockets/guacamoleProxy.js
          grep -q 'proxyReq: setHeaders' src/server/routes/websockets/guacamoleProxy.js
      - name: Generate zero-critical security modernization candidate
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact \
            axios@1.20.0 \
            d3-scale@4.0.2 \
            dompurify@3.4.15 \
            express@4.22.2 \
            fast-xml-parser@4.5.7 \
            http-proxy-middleware@3.0.7 \
            immutable@4.3.9 \
            jsonwebtoken@9.0.3 \
            lodash@4.18.1 \
            luxon@2.5.2 \
            multer@2.3.0 \
            node-zendesk@6.0.1 \
            socket.io@4.8.3 \
            socket.io-client@4.8.3 \
            webpack@5.110.3
          npm pkg set 'engines.node=>=18'
          npm pkg set \
            'overrides.d3-color=3.1.0' \
            'overrides.opennebula-guacamole.luxon=1.28.1' \
            'overrides.opennebula-guacamole.ws=5.2.5'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --omit=dev --package-lock-only --ignore-scripts --no-fund || true
      - name: Install candidate lock on Node 22
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: LayerSentry integration and regression tests on Node 22
        run: node --test tests/layersentry/*.test.cjs
      - name: Full FireEdge production build on Node 22
        run: NODE_ENV=production npm run build
      - name: Audit candidate runtime tree
        run: |
          npm audit --omit=dev --json > dependency-audit.json || true
          node - <<'NODE'
          const a=require('./dependency-audit.json')
          const counts=a.metadata?.vulnerabilities ?? {}
          console.log('RUNTIME_AUDIT_COUNTS=' + JSON.stringify(counts))
          const highCritical=Object.entries(a.vulnerabilities ?? {})
            .filter(([, finding]) => ['high','critical'].includes(finding.severity))
            .map(([name, finding]) => ({ name, severity:finding.severity, fixAvailable:finding.fixAvailable, effects:finding.effects }))
          console.log('RUNTIME_HIGH_CRITICAL=' + JSON.stringify(highCritical))
          if ((counts.critical ?? 0) !== 0) process.exitCode=2
          NODE
          node - <<'NODE'
          const p=require('./package-lock.json')
          const expected={
            axios:'1.20.0', 'd3-scale':'4.0.2', dompurify:'3.4.15',
            express:'4.22.2', 'fast-xml-parser':'4.5.7',
            'http-proxy-middleware':'3.0.7', immutable:'4.3.9',
            jsonwebtoken:'9.0.3', lodash:'4.18.1', luxon:'2.5.2',
            multer:'2.3.0', 'node-zendesk':'6.0.1', 'socket.io':'4.8.3',
            'socket.io-client':'4.8.3', webpack:'5.110.3'
          }
          for (const [name, wanted] of Object.entries(expected)) {
            const actual=p.packages[`node_modules/${name}`]?.version
            console.log(`LOCKED_${name}=${actual}`)
            if (actual !== wanted) process.exitCode=2
          }
          const d3Color=p.packages['node_modules/d3-color']?.version
          const nestedLuxon=p.packages['node_modules/opennebula-guacamole/node_modules/luxon']?.version
          const nestedWs=p.packages['node_modules/opennebula-guacamole/node_modules/ws']?.version
          console.log(`LOCKED_D3_COLOR=${d3Color}`)
          console.log(`LOCKED_OPENNEBULA_GUACAMOLE_LUXON=${nestedLuxon}`)
          console.log(`LOCKED_OPENNEBULA_GUACAMOLE_WS=${nestedWs}`)
          if (d3Color !== '3.1.0' || nestedLuxon !== '1.28.1' || nestedWs !== '5.2.5') process.exitCode=2
          NODE
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Verify declared Node 18 floor
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/layersentry/*.test.cjs
          NODE_ENV=production npm run build-server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fireedge-security-modernization-zero-critical
          path: |
            src/fireedge/package.json
            src/fireedge/package-lock.json
            src/fireedge/dependency-audit.json
          if-no-files-found: error
          retention-days: 1
      - name: Commit validated manifest and lock atomically
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fireedge/package.json src/fireedge/package-lock.json
          if git diff --cached --quiet; then
            echo 'Validated manifest and lock already match the branch.'
            exit 0
          fi
          git commit -m 'fix(fireedge): land validated security dependency lock'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}