name: KubeOne Backend Crosscheck

on:
  push:
    branches:
      - feat/kubeone-applications-ui-20260925
    paths:
      - '.github/workflows/kubeone-backend-crosscheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: adaptgurus/layersentry-platform
          ref: feat/kubeone-multicluster-apps-20260925
          path: backend
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: KubeOne backend gate
        working-directory: backend
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/kubeone cmd/layersentry-kubeone-portal)"
          go test -count=1 ./internal/kubeone ./cmd/layersentry-kubeone-portal
          go vet ./internal/kubeone ./cmd/layersentry-kubeone-portal
          go build -buildvcs=false -trimpath -o /tmp/layersentry-kubeone-portal ./cmd/layersentry-kubeone-portal
          git diff --check
          sha256sum /tmp/layersentry-kubeone-portal
