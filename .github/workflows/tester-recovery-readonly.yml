name: Tester Recovery Read-Only Preflight

on:
  push:
    branches:
      - dr-threepoint-ssh-20260924
    paths:
      - ".github/workflows/tester-recovery-readonly.yml"
  pull_request:
    branches:
      - fix/layersentry-vm-network-backup-20260921
    paths:
      - ".github/workflows/tester-recovery-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-recovery-readonly
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind Manoj host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "runner=$env:RUNNER_NAME computer=$env:COMPUTERNAME user=$env:USERNAME"
          if ($env:RUNNER_NAME -ne 'MANOJ-TEST-INST') { throw "Wrong runner" }
          if ($env:COMPUTERNAME -ine 'MANOJ-TEST-INST') { throw "Wrong computer" }

      - name: Read-only Hyper-V KVM2 inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vm = Get-VM -Name 'ls-kvm2' -ErrorAction Stop
          $nic = @(Get-VMNetworkAdapter -VMName 'ls-kvm2' -ErrorAction Stop)
          $vm | Select-Object Name,State,ProcessorCount,@{n='MemoryAssignedGB';e={[math]::Round($_.MemoryAssigned/1GB,2)}},Uptime | Format-Table -AutoSize
          $nic | Select-Object VMName,Name,SwitchName,MacAddress,Status,IPAddresses,DynamicMacAddressEnabled | Format-List
          Write-Host "=== KVM2 INTEGRATION SERVICES ==="
          Get-VMIntegrationService -VMName 'ls-kvm2' -ErrorAction SilentlyContinue |
            Select-Object Name,Enabled,PrimaryStatusDescription,SecondaryStatusDescription |
            Format-Table -AutoSize
          Write-Host "=== KVM2 COM PORTS ==="
          Get-VMComPort -VMName 'ls-kvm2' -ErrorAction SilentlyContinue |
            Select-Object Name,Path |
            Format-Table -AutoSize
          $macs = @($nic.MacAddress | Where-Object { $_ } | ForEach-Object {
            ($_ -replace '[:-]', '').ToUpperInvariant()
          })
          Write-Host ("KVM2_MACS=" + ($macs -join ','))
          $neighbors = @(
            Get-NetNeighbor -AddressFamily IPv4 -ErrorAction SilentlyContinue |
              Where-Object {
                $_.LinkLayerAddress -and
                $macs -contains (($_.LinkLayerAddress -replace '[:-]', '').ToUpperInvariant())
              }
          )
          $neighbors | Select-Object InterfaceAlias,IPAddress,LinkLayerAddress,State | Format-Table -AutoSize
          $candidateIPs = @($neighbors.IPAddress | Where-Object { $_ -match '^10\.250\.10\.\d+$' } | Sort-Object -Unique)
          foreach ($ip in @('10.250.10.20','10.250.10.21','10.250.10.22','10.250.10.23','10.250.10.24','10.250.10.25')) {
            if ($candidateIPs -notcontains $ip) { $candidateIPs += $ip }
          }
          foreach ($ip in $candidateIPs) {
            $client = [System.Net.Sockets.TcpClient]::new()
            $ok = $false
            try {
              $task = $client.ConnectAsync($ip,22)
              if ($task.Wait(800)) { $ok = $client.Connected }
            } catch {
              $ok = $false
            } finally {
              $client.Dispose()
            }
            Write-Host "KVM2_SSH_PROBE IP=$ip TCP=$ok"
          }

      - name: Read-only independent OpenNebula KVM2 detail
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import pathlib
          import xml.etree.ElementTree as ET
          from xmlrpc.client import ServerProxy
          from dissect.target import Target

          auth_image = pathlib.Path(r"C:\LayerSentryLab\Recovery\fe2-lvm\2.img")
          target = Target.open(str(auth_image))
          auth = target.fs.path("/var/lib/one/.one/one_auth").open("rb").read().decode().strip()
          one = ServerProxy("http://10.250.10.10:2633/RPC2", allow_none=True)
          version = one.one.system.version(auth)
          if not version[0]:
              raise SystemExit("OpenNebula authentication failed")
          print("INDEPENDENT_ONE_VERSION=" + str(version[1]))
          hp = one.one.hostpool.info(auth, -2, -1, -1)
          if not hp[0]:
              raise SystemExit("host pool query failed")
          pool = ET.fromstring(hp[1])
          matches = [h for h in pool.findall("HOST") if (h.findtext("NAME") or "").strip() == "ls-kvm2"]
          if len(matches) != 1:
              raise SystemExit(f"ls-kvm2 host count={len(matches)}")
          h = matches[0]
          fields = {
              "ID": h.findtext("ID"),
              "STATE": h.findtext("STATE"),
              "PREV_STATE": h.findtext("PREV_STATE"),
              "LAST_MON_TIME": h.findtext("LAST_MON_TIME"),
              "IM_MAD": h.findtext("IM_MAD"),
              "VM_MAD": h.findtext("VM_MAD"),
              "CLUSTER_ID": h.findtext("CLUSTER_ID"),
              "MAX_CPU": h.findtext("./HOST_SHARE/MAX_CPU"),
              "FREE_CPU": h.findtext("./HOST_SHARE/FREE_CPU"),
              "MAX_MEM": h.findtext("./HOST_SHARE/MAX_MEM"),
              "FREE_MEM": h.findtext("./HOST_SHARE/FREE_MEM"),
              "RUNNING_VMS": h.findtext("./HOST_SHARE/RUNNING_VMS"),
              "PIN_POLICY": h.findtext("./TEMPLATE/PIN_POLICY"),
              "VMS_THREAD": h.findtext("./TEMPLATE/VMS_THREAD"),
              "ERROR": h.findtext("./TEMPLATE/ERROR") or h.findtext("ERROR"),
          }
          print("KVM2_HOST_DETAIL=" + repr(fields))
          vm_ids = [int((n.text or "-1").strip()) for n in h.findall("./VMS/ID") if (n.text or "").strip()]
          rows = []
          for vmid in vm_ids:
              info = one.one.vm.info(auth, vmid, False)
              if not info[0]:
                  rows.append({"id": vmid, "error": str(info[1])[:200]})
                  continue
              vm = ET.fromstring(info[1])
              histories = vm.findall("./HISTORY_RECORDS/HISTORY")
              rows.append({
                  "id": vmid,
                  "name": (vm.findtext("NAME") or "").strip(),
                  "state": int(vm.findtext("STATE") or -1),
                  "lcm_state": int(vm.findtext("LCM_STATE") or -1),
                  "host": histories[-1].findtext("HOSTNAME") if histories else "",
                  "deploy_id": (vm.findtext("DEPLOY_ID") or "").strip(),
              })
          print("KVM2_VM_DIAGNOSTICS=" + repr(rows))
          template = h.find("TEMPLATE")
          if template is not None:
              print("KVM2_HOST_TEMPLATE_XML=" + ET.tostring(template, encoding="unicode")[:12000])
          '@
          $path = Join-Path $env:RUNNER_TEMP 'kvm2_host_detail.py'
          Set-Content -Path $path -Value $script -Encoding UTF8
          & 'C:\LayerSentryLab\tools\Python313\python.exe' $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read-only Windows runner and network inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Service | Where-Object { $_.Name -match 'actions|runner' -or $_.DisplayName -match 'actions|runner' } |
            Select-Object Name,DisplayName,Status,StartType | Format-Table -AutoSize
          Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object { $_.IPAddress -notlike '169.254.*' } |
            Select-Object InterfaceAlias,IPAddress,PrefixLength |
            Sort-Object InterfaceAlias,IPAddress | Format-Table -AutoSize
          $global:LASTEXITCODE = 0

