name: T2 Foundation Anaconda Continue

on:
  push:
    branches:
      - ops/t2-foundation-iso-qualification-20260921
    paths:
      - .github/workflows/t2-foundation-anaconda-continue.yml

permissions:
  contents: read

concurrency:
  group: t2-foundation-anaconda-continue
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    steps:
      - name: Bind existing disposable VM without mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host $env:COMPUTERNAME"}
          $name='ls-appliance-4c4ac81-qual'
          $vm=Get-VM -Name $name -ErrorAction Stop
          $fw=Get-VMFirmware -VMName $name
          $dvd=Get-VMDvdDrive -VMName $name -ErrorAction SilentlyContinue
          Write-Host "VM_STATE=$($vm.State) UPTIME=$($vm.Uptime) SECURE_BOOT=$($fw.SecureBoot) DVD=$($dvd.Path)"
          if($fw.SecureBoot -ne 'Off'){throw "Secure Boot is not disabled"}
      - name: Capture exact current console
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $script='C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1'
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\current-anaconda-state.png'
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
          & $script -VM $name -Out $out
          if(-not (Test-Path $out)){throw 'current console screenshot not created'}
          Write-Host ("SCREENSHOT_current_anaconda_state_B64="+[Convert]::ToBase64String([IO.File]::ReadAllBytes($out)))
          Write-Host 'CURRENT_CONSOLE_CAPTURE=PASS'
