name: T2 Foundation Anaconda Continue

on:
  push:
    branches:
      - ops/t2-foundation-iso-qualification-20260921
    paths:
      - .github/workflows/t2-foundation-anaconda-continue.yml

permissions:
  contents: read

concurrency:
  group: t2-foundation-anaconda-continue
  cancel-in-progress: true

jobs:
  install-and-boot:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 50
    steps:
      - name: Begin Anaconda installation with explicit virtual keys
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host $env:COMPUTERNAME"}
          $name='ls-appliance-4c4ac81-qual'
          $vm=Get-VM -Name $name -ErrorAction Stop
          $fw=Get-VMFirmware -VMName $name
          if($vm.State -ne 'Running'){throw "VM not running: $($vm.State)"}
          if($fw.SecureBoot -ne 'Off'){throw "Secure Boot is not disabled"}
          $wmi=Get-CimInstance -Namespace root/virtualization/v2 -ClassName Msvm_ComputerSystem |
            Where-Object { $_.ElementName -eq $name } | Select-Object -First 1
          $kbd=Get-CimAssociatedInstance -InputObject $wmi -Namespace root/virtualization/v2 -ResultClassName Msvm_Keyboard | Select-Object -First 1
          if(-not $kbd){throw 'Hyper-V virtual keyboard not found'}
          function Key([uint32]$code){
            $r=Invoke-CimMethod -InputObject $kbd -MethodName TypeKey -Arguments @{keyCode=$code}
            if([int]$r.ReturnValue -ne 0){throw "TypeKey $code failed rc=$($r.ReturnValue)"}
            Start-Sleep -Milliseconds 400
          }
          Key 0x42
          Key 0x0D
          Start-Sleep -Seconds 20
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\vk-install-started.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM $name -Out $out
          if(-not (Test-Path $out)){throw 'install-start screenshot missing'}
          Write-Host ("SCREENSHOT_vk_install_started_B64="+[Convert]::ToBase64String([IO.File]::ReadAllBytes($out)))
          Write-Host 'ANACONDA_BEGIN_SENT=PASS'

      - name: Wait for installer reboot and boot installed VHD
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $prev=[double](Get-VM -Name $name).Uptime.TotalSeconds
          $transition=$false
          for($i=0;$i -lt 420;$i++){
            Start-Sleep -Seconds 5
            $vm=Get-VM -Name $name
            if($vm.State -eq 'Off'){
              $transition=$true
              Write-Host 'INSTALLER_TRANSITION=VM_OFF'
              break
            }
            $now=[double]$vm.Uptime.TotalSeconds
            if($now + 20 -lt $prev){
              $transition=$true
              Write-Host "INSTALLER_REBOOT_DETECTED previous=$prev current=$now"
              break
            }
            $prev=$now
          }
          if(-not $transition){
            $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\vk-install-timeout.png'
            & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM $name -Out $out
            if(Test-Path $out){Write-Host ("SCREENSHOT_vk_install_timeout_B64="+[Convert]::ToBase64String([IO.File]::ReadAllBytes($out)))}
            throw 'Installation did not reach reboot transition within 35 minutes'
          }
          $vm=Get-VM -Name $name
          if($vm.State -ne 'Off'){Stop-VM -Name $name -TurnOff -Force}
          $dvd=Get-VMDvdDrive -VMName $name -ErrorAction SilentlyContinue
          if($dvd){Set-VMDvdDrive -VMName $name -Path $null}
          $disk=Get-VMHardDiskDrive -VMName $name | Where-Object ControllerLocation -eq 0 | Select-Object -First 1
          if(-not $disk){throw 'Installed VHD not found'}
          Set-VMFirmware -VMName $name -FirstBootDevice $disk
          Start-VM -Name $name
          Start-Sleep -Seconds 120
          $vm=Get-VM -Name $name
          $fw=Get-VMFirmware -VMName $name
          $dvd=Get-VMDvdDrive -VMName $name -ErrorAction SilentlyContinue
          if($vm.State -ne 'Running'){throw "Installed VHD did not boot: $($vm.State)"}
          if($fw.SecureBoot -ne 'Off'){throw 'Secure Boot changed unexpectedly'}
          if($dvd -and $dvd.Path){throw "ISO still mounted after install: $($dvd.Path)"}
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\vk-installed-firstboot.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM $name -Out $out
          if(-not (Test-Path $out)){throw 'installed firstboot screenshot missing'}
          Write-Host ("SCREENSHOT_vk_installed_firstboot_B64="+[Convert]::ToBase64String([IO.File]::ReadAllBytes($out)))
          Write-Host 'INSTALLED_VHD_BOOT=PASS ISO_EJECTED=PASS SECURE_BOOT=OFF'
