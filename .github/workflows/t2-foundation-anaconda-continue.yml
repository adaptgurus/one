name: T2 Foundation Anaconda Continue

on:
  push:
    branches:
      - ops/t2-foundation-iso-qualification-20260921
    paths:
      - .github/workflows/t2-foundation-anaconda-continue.yml

permissions:
  contents: read

concurrency:
  group: t2-foundation-anaconda-continue
  cancel-in-progress: true

jobs:
  finish-install-boot-vhd:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    steps:
      - name: Exit completed Anaconda and boot installed VHD
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host $env:COMPUTERNAME"}
          $name='ls-appliance-4c4ac81-qual'
          $vm=Get-VM -Name $name -ErrorAction Stop
          $fw=Get-VMFirmware -VMName $name
          $dvd=Get-VMDvdDrive -VMName $name -ErrorAction SilentlyContinue
          if($vm.State -ne 'Running'){throw "VM not running at installer completion: $($vm.State)"}
          if($fw.SecureBoot -ne 'Off'){throw "Secure Boot unexpectedly enabled"}
          if(-not $dvd.Path){throw 'Installer ISO is not mounted at completion'}

          $wmi=Get-CimInstance -Namespace root/virtualization/v2 -ClassName Msvm_ComputerSystem |
            Where-Object { $_.ElementName -eq $name } | Select-Object -First 1
          $kbd=Get-CimAssociatedInstance -InputObject $wmi -Namespace root/virtualization/v2 -ResultClassName Msvm_Keyboard | Select-Object -First 1
          if(-not $kbd){throw 'Hyper-V virtual keyboard not found'}
          $r=Invoke-CimMethod -InputObject $kbd -MethodName TypeKey -Arguments @{keyCode=[uint32]0x0D}
          if([int]$r.ReturnValue -ne 0){throw "Enter key failed rc=$($r.ReturnValue)"}
          Write-Host 'ANACONDA_COMPLETION_ENTER_SENT=PASS'

          $transition=$false
          $prev=[double](Get-VM -Name $name).Uptime.TotalSeconds
          for($i=0;$i -lt 24;$i++){
            Start-Sleep -Seconds 5
            $vm=Get-VM -Name $name
            if($vm.State -eq 'Off'){ $transition=$true; Write-Host 'INSTALLER_EXIT=OFF'; break }
            $now=[double]$vm.Uptime.TotalSeconds
            if($now + 20 -lt $prev){ $transition=$true; Write-Host 'INSTALLER_EXIT=REBOOT'; break }
            $prev=$now
          }
          $vm=Get-VM -Name $name
          if($vm.State -ne 'Off'){
            Write-Host 'Installer completed but VM remained running; stopping disposable installer VM before media detach.'
            Stop-VM -Name $name -TurnOff -Force
          }

          $dvd=Get-VMDvdDrive -VMName $name -ErrorAction SilentlyContinue
          if($dvd){Set-VMDvdDrive -VMName $name -Path $null}
          $disk=Get-VMHardDiskDrive -VMName $name | Where-Object ControllerLocation -eq 0 | Select-Object -First 1
          if(-not $disk){throw 'Installed VHD not found'}
          Set-VMFirmware -VMName $name -FirstBootDevice $disk
          Start-VM -Name $name

          $running=$false
          for($i=0;$i -lt 36;$i++){
            Start-Sleep -Seconds 5
            $vm=Get-VM -Name $name
            if($vm.State -eq 'Running' -and $vm.Uptime.TotalSeconds -gt 20){$running=$true; break}
          }
          if(-not $running){throw 'Installed VHD did not reach running state'}
          Start-Sleep -Seconds 60
          $vm=Get-VM -Name $name
          $fw=Get-VMFirmware -VMName $name
          $dvd=Get-VMDvdDrive -VMName $name -ErrorAction SilentlyContinue
          $net=Get-VMNetworkAdapter -VMName $name
          $hb=Get-VMIntegrationService -VMName $name -Name 'Heartbeat' -ErrorAction SilentlyContinue
          if($vm.State -ne 'Running'){throw "Installed VHD is not running: $($vm.State)"}
          if($fw.SecureBoot -ne 'Off'){throw 'Secure Boot changed unexpectedly'}
          if($dvd -and $dvd.Path){throw "ISO still mounted: $($dvd.Path)"}
          Write-Host "INSTALLED_VHD_BOOT=PASS ISO_EJECTED=PASS SECURE_BOOT=OFF"
          Write-Host "HEARTBEAT=$($hb.PrimaryStatusDescription)"
          Write-Host ("IP_ADDRESSES="+(($net.IPAddresses | Where-Object {$_}) -join ','))

          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\installed-vhd-firstboot.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM $name -Out $out
          if(-not (Test-Path $out)){throw 'installed firstboot screenshot missing'}
          Write-Host ("SCREENSHOT_installed_vhd_firstboot_B64="+[Convert]::ToBase64String([IO.File]::ReadAllBytes($out)))
