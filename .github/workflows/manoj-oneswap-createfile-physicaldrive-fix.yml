name: Manoj OneSwap PhysicalDrive CreateFile Fix

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-createfile-physicaldrive-fix.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-createfile-physicaldrive-fix
  cancel-in-progress: true

jobs:
  validate-deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Bind exact Manoj and protect post-shutdown state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          if($vm.State -ne 'Off'){throw "Source must remain Off; state=$($vm.State)"}
          if($n -ne 0){throw "Unexpected source checkpoints: $n"}
          if((Get-VM -Name 'ls-appliance-qual' -ErrorAction Stop).State -ne 'Running'){throw 'OneSwap appliance not Running'}
          if((Get-VM -Name 'ls-fe2' -ErrorAction Stop).State -ne 'Off'){throw 'FE2 must remain Off'}
          Write-Host 'POST_SHUTDOWN_CREATEFILE_GATE=PASS'

      - name: Prove Win32 CreateFile raw read on mounted source VHDX
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $drive=Get-VMHardDiskDrive -VM $vm -ErrorAction Stop | Sort-Object ControllerNumber,ControllerLocation | Select-Object -First 1
          if(-not $drive.Path){throw 'Source disk path missing'}
          $mount=Mount-VHD -Path $drive.Path -ReadOnly -NoDriveLetter -Passthru -ErrorAction Stop
          try {
            $diskObj=$mount | Get-Disk -ErrorAction Stop
            $slash=[string][char]92
            $rawPath=$slash+$slash+'.'+$slash+'PhysicalDrive'+$diskObj.Number
            if (-not ('LayerSentry.RawDiskNative' -as [type])) {
              Add-Type -TypeDefinition @"
using System;
using System.Runtime.InteropServices;
using Microsoft.Win32.SafeHandles;
namespace LayerSentry {
    public static class RawDiskNative {
        [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
        public static extern SafeFileHandle CreateFileW(
            string lpFileName,
            uint dwDesiredAccess,
            uint dwShareMode,
            IntPtr lpSecurityAttributes,
            uint dwCreationDisposition,
            uint dwFlagsAndAttributes,
            IntPtr hTemplateFile);
    }
}
"@
            }
            $handle=[LayerSentry.RawDiskNative]::CreateFileW(
              $rawPath,[uint32]2147483648,[uint32]3,[IntPtr]::Zero,[uint32]3,[uint32]0,[IntPtr]::Zero)
            if($handle.IsInvalid){
              $err=[Runtime.InteropServices.Marshal]::GetLastWin32Error()
              $handle.Dispose()
              throw "CreateFileW raw-device open failed path=$rawPath win32=$err"
            }
            $stream=[IO.FileStream]::new($handle,[IO.FileAccess]::Read)
            try {
              $buffer=New-Object byte[] 4096
              $read=$stream.Read($buffer,0,$buffer.Length)
              if($read -le 0){throw 'CreateFileW raw-device read returned no data'}
              Write-Host "RAW_DEVICE_CREATEFILE_READ=PASS path=$rawPath bytes=$read canSeek=$($stream.CanSeek)"
            } finally {
              $stream.Dispose()
            }
          } finally {
            Dismount-VHD -Path $drive.Path -ErrorAction SilentlyContinue
          }

      - name: Download exact OneSwap fix source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $head='43b21785820b3c519cc0d2e4962ce5f360ae96ca'
          $helper=Join-Path $env:RUNNER_TEMP 'hyperv_hot_helper.createfile.rb'
          & curl.exe -L --fail --silent --show-error --connect-timeout 8 --max-time 45 -o $helper "https://raw.githubusercontent.com/adaptgurus/one-swap/$head/hyperv_hot_helper.rb"
          if($LASTEXITCODE -ne 0){throw 'Exact helper download failed'}
          $text=Get-Content -LiteralPath $helper -Raw
          foreach($needle in @('CreateFileW','Microsoft.Win32.SafeHandles','GetLastWin32Error','[IO.FileStream]::new($handle,[IO.FileAccess]::Read)')){
            if(-not $text.Contains($needle)){throw "Exact helper missing invariant: $needle"}
          }
          if($text.Contains('[IO.File]::Open($rawPath')){throw 'Legacy unsupported File.Open raw-device path remains'}
          $sha=(Get-FileHash -Algorithm SHA256 $helper).Hash.ToLowerInvariant()
          "CREATEFILE_HELPER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CREATEFILE_HELPER_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EXACT_CREATEFILE_SOURCE=PASS head=$head sha256=$sha"

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-createfile-fix.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Gate durable DELTA_CAPTURING state and deploy helper atomically
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $common=@('-o','LogLevel=ERROR','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=4','-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$known",'-o','ConnectTimeout=8','-i',$env:ONESWAP_TEMP_KEY)
          & scp.exe @common $env:CREATEFILE_HELPER "ci@10.250.10.32:/tmp/hyperv_hot_helper.createfile.rb"
          if($LASTEXITCODE -ne 0){throw 'helper scp failed'}
          $script=@'
          set -euo pipefail
          expected="__SHA__"
          state=$(find /var/lib/layersentry-oneswap/reflink-work/oneswap-hyperv-hot -maxdepth 2 -type f -name state.json -path '*manoj-hv-ls-migration-source-test-20260924*' -print)
          [ "$(printf '%s\n' "$state" | sed '/^$/d' | wc -l)" -eq 1 ]
          python3 - "$state" <<'PY'
          import json,os,sys
          p=sys.argv[1]; s=json.load(open(p))
          print("DEPLOY_STATE_PHASE="+str(s.get("phase")))
          if s.get("phase")!="DELTA_CAPTURING": raise SystemExit("state is not DELTA_CAPTURING")
          if not s.get("source_off_at"): raise SystemExit("source_off_at missing")
          if s.get("delta_applied_at") or s.get("template_id") or s.get("imported_at"): raise SystemExit("later-phase evidence exists")
          if s.get("image_imports"): raise SystemExit("image import evidence exists")
          if len(s.get("disks",[]))!=2: raise SystemExit("prepared disk count mismatch")
          for i,d in enumerate(s["disks"]):
              q=d.get("prepared_raw_path","")
              if not os.path.isfile(q): raise SystemExit(f"prepared disk {i} missing")
              if os.path.getsize(q)!=int(d.get("virtual_size",-1)): raise SystemExit(f"prepared disk {i} size mismatch")
          print("CREATEFILE_DEPLOY_STATE_GATE=PASS")
          PY
          [ "$(sha256sum /tmp/hyperv_hot_helper.createfile.rb | awk '{print $1}')" = "$expected" ]
          ruby -c /tmp/hyperv_hot_helper.createfile.rb
          dst=/usr/lib/one/ruby/cli/one_helper/hyperv_hot_helper.rb
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          sudo cp -a "$dst" "$dst.before-createfile-$stamp"
          sudo install -o root -g root -m 0644 /tmp/hyperv_hot_helper.createfile.rb "$dst"
          [ "$(sudo sha256sum "$dst" | awk '{print $1}')" = "$expected" ]
          sudo ruby -c "$dst"
          sudo grep -q 'CreateFileW' "$dst"
          if sudo grep -Fq '[IO.File]::Open($rawPath' "$dst"; then
            echo 'legacy File.Open raw-device code remains'
            exit 71
          fi
          rm -f /tmp/hyperv_hot_helper.createfile.rb
          echo "CREATEFILE_RUNTIME_DEPLOY=PASS sha256=$expected"
          '@
          $script=$script.Replace('__SHA__',$env:CREATEFILE_HELPER_SHA)
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe @common "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'CreateFile runtime deploy failed'}

      - name: Re-prove source invariant
        if: always()
        shell: powershell
        run: |
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          Write-Host "FINAL_SOURCE_STATE=$($vm.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$n"
          if($vm.State -ne 'Off'){throw 'CreateFile qualification changed source state'}
          if($n -ne 0){throw 'CreateFile qualification created/found checkpoint'}
          if($env:ONESWAP_TEMP_KEY -and (Test-Path $env:ONESWAP_TEMP_KEY)){Remove-Item -Force $env:ONESWAP_TEMP_KEY -ErrorAction SilentlyContinue}
          Write-Host 'CREATEFILE_SOURCE_INVARIANT=PASS'
