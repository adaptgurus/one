name: LayerSentry cross-site read-only reachability probe

on:
  push:
    branches:
      - dr-threepoint-ssh-20260924
    paths:
      - .github/workflows/layersentry-crosssite-readonly-probe.yml
  pull_request:
    branches:
      - fix/layersentry-vm-network-backup-20260921
    paths:
      - .github/scripts/layersentry_three_point_source.py
      - .github/workflows/layersentry-crosssite-readonly-probe.yml

permissions:
  contents: read

concurrency:
  group: layersentry-crosssite-readonly-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Probe DC source endpoints from independent DR runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            @{Host='10.10.10.21'; Port=22;   Label='dc-fe-ssh'},
            @{Host='10.10.10.21'; Port=2633; Label='dc-fe-xmlrpc'},
            @{Host='10.10.10.22'; Port=22;   Label='dc-kvm1-ssh'},
            @{Host='10.10.10.23'; Port=22;   Label='dc-kvm2-ssh'},
            @{Host='10.10.10.23'; Port=13014;Label='dc-onebex'}
          )

          function Test-BoundedTcp {
            param([string]$HostName,[int]$Port,[int]$TimeoutMs=2000)
            $client = [System.Net.Sockets.TcpClient]::new()
            try {
              $task = $client.ConnectAsync($HostName,$Port)
              if (-not $task.Wait($TimeoutMs)) { return $false }
              return $client.Connected
            } catch {
              return $false
            } finally {
              $client.Dispose()
            }
          }

          $jobs = foreach ($t in $targets) {
            Start-Job -ScriptBlock {
              param($target)
              $client = [System.Net.Sockets.TcpClient]::new()
              $reachable = $false
              try {
                $task = $client.ConnectAsync($target.Host,[int]$target.Port)
                if ($task.Wait(2000)) { $reachable = $client.Connected }
              } catch {
                $reachable = $false
              } finally {
                $client.Dispose()
              }
              [pscustomobject]@{
                label=$target.Label
                host=$target.Host
                port=[int]$target.Port
                reachable=$reachable
              }
            } -ArgumentList $t
          }
          $rows = @($jobs | Wait-Job | Receive-Job)
          $jobs | Remove-Job -Force
          $rows | Sort-Object label | ConvertTo-Json -Depth 4
          $reachable = @($rows | Where-Object { $_.reachable }).Count
          Write-Host "CROSS_SITE_TCP_REACHABLE=$reachable/$($rows.Count)"

          $savedPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $sshOutput = & ssh.exe -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ConnectTimeout=3 opc@10.10.10.21 hostname 2>&1
          $sshExit = $LASTEXITCODE
          $ErrorActionPreference = $savedPreference
          if ($sshExit -eq 0) {
            Write-Host "CROSS_SITE_SOURCE_SSH=PASS"
            Write-Host ("CROSS_SITE_SOURCE_HOST=" + (($sshOutput | Out-String).Trim()))
          } else {
            Write-Host "CROSS_SITE_SOURCE_SSH=NO_AUTH_OR_ROUTE"
            Write-Host ("CROSS_SITE_SOURCE_SSH_DETAIL=" + (($sshOutput | Out-String).Trim()))
          }
          $global:LASTEXITCODE = 0
          Write-Host "CROSS_SITE_PROBE_COMPLETE=PASS"

