              if($state -ne 'Off'){throw 'Appliance did not shut down through guest OS; refusing -Force/-TurnOff'}
            } elseif($state -ne 'Off'){
              throw "Unexpected appliance state before seed attach: $state"
            }
            Set-VMNetworkAdapter -VMName $vm -StaticMacAddress '00155D001C05'
            Set-VMHardDiskDrive -VMName $vm -ControllerType SCSI -ControllerNumber 0 -ControllerLocation 3 -Path $v5
            $os=Get-VMHardDiskDrive -VMName $vm -ControllerType SCSI -ControllerNumber 0 -ControllerLocation 0 -ErrorAction Stop
            Set-VMFirmware -VMName $vm -FirstBootDevice $os
            Write-Host 'V5_ATTACHED=PASS'
          } else {
            Write-Host 'V5_ATTACHED=ALREADY'
            if($state -eq 'Running'){
              Write-Host 'APPLIANCE_ALREADY_RUNNING_WITH_V5=true'
              exit 0
            }
            if($state -ne 'Off'){throw "Unexpected appliance state with v5: $state"}
          }
          Start-VM -Name $vm | Out-Null
