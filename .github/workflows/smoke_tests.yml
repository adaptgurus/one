          Write-Host 'SOURCE_PROTECTION_BEFORE=PASS'

      - name: Classify builder key files without exposing key material
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification'
          $files=Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match '(?i)(builder.*key|key.*builder|iso-builder|id_ed25519|id_rsa|\.ppk$)'} |
            Sort-Object FullName
          foreach($f in $files){
            $first=''
            try{$first=(Get-Content -LiteralPath $f.FullName -TotalCount 1 -ErrorAction Stop).Trim()}catch{}
            $kind='unknown'
            if($first -match '^-----BEGIN OPENSSH PRIVATE KEY-----$'){$kind='openssh-private'}
            elseif($first -match '^-----BEGIN (RSA|EC|DSA) PRIVATE KEY-----$'){$kind='pem-private'}
            elseif($first -match '^PuTTY-User-Key-File-'){$kind='putty-private'}
            elseif($first -match '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-)'){$kind='public-key'}
            elseif($first -match '^-----BEGIN .*PUBLIC KEY-----$'){$kind='pem-public'}
