            if($kind -in @('openssh-private','pem-private')){
              $tmp=Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N')+'.key')
              try{
                Copy-Item -Force $f.FullName $tmp
                & icacls.exe $tmp /inheritance:r | Out-Null
                & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
                & ssh-keygen.exe -y -f $tmp 2>$null | Out-Null
                Write-Host "KEY_OPENSSH_VALID path=$($f.FullName) valid=$($LASTEXITCODE -eq 0)"
              }finally{Remove-Item -Force $tmp -ErrorAction SilentlyContinue}
            }
          }
