          $v5='C:\LayerSentryLab\qualification\oneswap-seed\cidata-v5.vhdx'
          $seed=Get-VMHardDiskDrive -VMName $vm -ControllerType SCSI -ControllerNumber 0 -ControllerLocation 3 -ErrorAction Stop
          $state=(Get-VM -Name $vm).State
          if($seed.Path -ne $v5){
