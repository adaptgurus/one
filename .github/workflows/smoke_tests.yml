              if($ok -and $client.Connected){$client.EndConnect($iar);$tcp=$true}
            } catch {} finally {$client.Close()}
            Write-Host "V5_WAIT attempt=$i vmstate=$($vm.State) ips=$ips ssh22=$tcp"
            if($tcp){$ready=$true;break}
            Start-Sleep -Seconds 5
          }
          if(-not $ready){throw 'v5 boot did not restore authoritative SSH endpoint'}
          & ssh-keygen.exe -F $ip -f $known *> $null
          if($LASTEXITCODE -ne 0){throw 'Authoritative IP missing from pinned known_hosts'}
          & ssh.exe -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=6 -i $key "ci@$ip" 'id -un; hostname; ip -4 -brief addr; cloud-init status --long || true'
          if($LASTEXITCODE -ne 0){throw 'Pinned ci SSH failed after v5 boot'}
          Write-Host 'ONESWAP_V5_NETWORK_RECOVERY=PASS'

      - name: Verify source remained untouched
