          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Protected source has checkpoints'}
          Write-Host 'SOURCE_PROTECTION_BEFORE=PASS'

      - name: Compare private-derived public key with sidecar and v8
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $key='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $pub=$key+'.pub'
          $ud='C:\LayerSentryLab\qualification\oneswap-seed\user-data-v8'
          foreach($p in @($key,$pub,$ud)){if(-not(Test-Path $p)){throw "Missing $p"}}
          $derived=(& ssh-keygen.exe -y -f $key 2>$null).Trim()
          if($LASTEXITCODE -ne 0 -or -not $derived){throw 'Unable to derive public key from client private key'}
          $dp=$derived -split '\s+'
          $derivedId=$dp[0]+' '+$dp[1]
          $side=(Get-Content -LiteralPath $pub -Raw).Trim()
          $sp=$side -split '\s+'
          $sideId=$sp[0]+' '+$sp[1]
          $text=Get-Content -LiteralPath $ud -Raw
          Write-Host ('PRIVATE_MATCHES_SIDECAR=' + ($derivedId -eq $sideId))
          Write-Host ('PRIVATE_DERIVED_KEY_PRESENT_IN_V8=' + [bool]($text -match [regex]::Escape($derivedId)))
          Write-Host ('SIDECAR_KEY_PRESENT_IN_V8=' + [bool]($text -match [regex]::Escape($sideId)))
          $sha=[Security.Cryptography.SHA256]::Create()
          try {
            $h1=[BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($derivedId))).Replace('-','')
            $h2=[BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($sideId))).Replace('-','')
          } finally { $sha.Dispose() }
          Write-Host ('PRIVATE_PUBLIC_ID_SHA256=' + $h1)
          Write-Host ('SIDECAR_PUBLIC_ID_SHA256=' + $h2)
          Write-Host 'PRIVATE_PUBLIC_KEY_MATCH_AUDIT=PASS'

