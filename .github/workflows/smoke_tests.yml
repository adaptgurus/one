            $root=($part.DriveLetter + ':\')
            Copy-Item -Force $userV6 (Join-Path $root 'user-data')
            Copy-Item -Force $metaV6 (Join-Path $root 'meta-data')
            Copy-Item -Force $network (Join-Path $root 'network-config')
          } finally {
            Dismount-VHD -ComputerName $hostName -Path $seedV6
          }
          $hash=(Get-FileHash -Algorithm SHA256 $seedV6).Hash
          Write-Host "CIDATA_V6_SHA256=$hash"
