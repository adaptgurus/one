          $userV6=Join-Path $base 'user-data-v6'
          $network=Join-Path $base 'network-config'
          $metaV6=Join-Path $base 'meta-data-v6'
          foreach($p in @($seedBase,$userV4,$network)){if(-not(Test-Path $p)){throw "Missing seed input: $p"}}
          @('instance-id: oneswap-qual-20260924-v6','local-hostname: oneswap-qual') | Set-Content -LiteralPath $metaV6 -Encoding ascii
          $ud=Get-Content -LiteralPath $userV4 -Raw
          if($ud -notmatch '(?m)^#cloud-config\s*$'){throw 'user-data-v4 is not cloud-config'}
          if($ud -match '(?m)^ssh_deletekeys\s*:'){
