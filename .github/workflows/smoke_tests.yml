name: OpenNebula Smoke Tests

# Controls when the action will run.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
      - name: Install rubocop
        run: gem install rubocop
      - name: Update apt packages
        run: sudo apt update
      - name: Install CppCheck
        run: sudo apt install -y cppcheck
      - name: Install AStyle
        run: sudo apt install -y astyle
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      # Runs a single command using the runners shell
      - name: Run Smoke Tests
        run: $GITHUB_WORKSPACE/share/smoke_tests/smoke_tests.sh

      - name: Create PR for new RuboCop rules
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z $(git status --porcelain share/linters/.rubocop.yml) ]]; then
            echo "No RuboCop config changes detected."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin ai/rubocop >/dev/null 2>&1; then
            echo "Branch ai/rubocop already exists. A PR should already exist, please close it and delete the branch to generate a new one."
            exit 0
          fi

          echo "New rules detected. Creating PR..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b ai/rubocop
          git add share/linters/.rubocop.yml
          git commit -m "M #-: Disable new rubocop cops"
          git push origin ai/rubocop

          gh pr create \
            --title "M #-: Disable RuboCop new cops" \
            --body "This automated PR disables RuboCop rules that were introduced in the latest version and broke the CI." \
            --base master \
            --head ai/rubocop


  manoj-hyperv-migration-gate:
    if: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Bind exact Manoj runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "runner=$env:RUNNER_NAME computer=$env:COMPUTERNAME user=$env:USERNAME os=$env:RUNNER_OS"
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          Get-Command Get-VM,Get-VHD,Get-VMHardDiskDrive,Get-VMNetworkAdapter,Get-VMSnapshot -ErrorAction Stop | Out-Null
          if(-not (Test-Path 'C:\LayerSentryLab\qualification')){throw 'LayerSentry qualification workspace missing'}
          Write-Host 'MANOJ_RUNNER_BOUND=PASS'

      - name: Qualify disposable Hyper-V source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-migration-source-test'
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "source must be Running for warm prepare; state=$($vm.State)"}
          if($vm.Generation -notin @(1,2)){throw "unsupported VM generation $($vm.Generation)"}
          $snaps=@(Get-VMSnapshot -VMName $name -ErrorAction SilentlyContinue)
          if($snaps.Count -ne 0){throw "source has $($snaps.Count) checkpoints"}
          $disks=@(Get-VMHardDiskDrive -VMName $name -ErrorAction Stop)
          if($disks.Count -eq 0){throw 'source has no disks'}
          foreach($d in $disks){
            if(-not $d.Path){throw 'disk path missing'}
            $v=Get-VHD -Path $d.Path -ErrorAction Stop
            if($v.VhdFormat -ne 'VHDX'){throw "warm path requires VHDX: $($d.Path)"}
            if($v.VhdType -eq 'Differencing' -or $v.ParentPath){throw "parent/differencing disk blocked: $($d.Path)"}
            Write-Host "SOURCE_DISK path=$($d.Path) type=$($v.VhdType) virtual=$($v.Size) file=$($v.FileSize)"
          }
          foreach($nic in @(Get-VMNetworkAdapter -VMName $name -ErrorAction Stop)){
            Write-Host "SOURCE_NIC switch=$($nic.SwitchName) mac=$($nic.MacAddress) ips=$($nic.IPAddresses -join ',')"
          }
          Write-Host "SOURCE_GATE=PASS name=$name state=$($vm.State) generation=$($vm.Generation) cpu=$($vm.ProcessorCount) disks=$($disks.Count)"

      - name: Verify secure OneSwap transport
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sshd=Get-Service sshd -ErrorAction SilentlyContinue
          if(-not $sshd){throw 'OpenSSH Server service is absent'}
          Write-Host "SSHD status=$($sshd.Status) startType=$($sshd.StartType)"
          if($sshd.Status -ne 'Running'){throw 'sshd is not Running'}
          $cfg='C:\ProgramData\ssh\sshd_config'
          if(-not (Test-Path $cfg)){throw 'sshd_config missing'}
          $effective=Get-Content -LiteralPath $cfg | Where-Object {$_ -match '^(?i)(PubkeyAuthentication|PasswordAuthentication|KbdInteractiveAuthentication|ChallengeResponseAuthentication)\s+'}
          $effective | ForEach-Object { Write-Host "SSHD_CONFIG=$($_.Trim())" }
          if($effective -match '(?i)^PasswordAuthentication\s+yes'){throw 'password SSH is enabled'}
          if($effective -match '(?i)^(KbdInteractiveAuthentication|ChallengeResponseAuthentication)\s+yes'){throw 'interactive SSH auth is enabled'}
          Write-Host 'HYPERV_SSH_GATE=PASS'

      - name: Inventory OneSwap qualification appliances
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('ls-appliance-qual','ls-appliance-dbe-qual','ls-iso-builder')){
            $vm=Get-VM -Name $name -ErrorAction SilentlyContinue
            if(-not $vm){Write-Host "APPLIANCE name=$name present=false";continue}
            Write-Host "APPLIANCE name=$name state=$($vm.State) gen=$($vm.Generation) cpu=$($vm.ProcessorCount)"
            foreach($nic in @(Get-VMNetworkAdapter -VMName $name -ErrorAction SilentlyContinue)){
              $ips=@($nic.IPAddresses | Where-Object {$_ -match '^\d+\.\d+\.\d+\.\d+$'})
              Write-Host "APPLIANCE_NIC name=$name switch=$($nic.SwitchName) mac=$($nic.MacAddress) ips=$($ips -join ',')"
              foreach($ip in $ips){
                foreach($port in @(22,9443,9444)){
                  $ok=Test-NetConnection -ComputerName $ip -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue
                  Write-Host "APPLIANCE_ROUTE name=$name ip=$ip port=$port tcp=$ok"
                }
              }
            }
          }
          Write-Host 'MANOJ_HYPERV_MIGRATION_READONLY_GATE=PASS'


  manoj-hyperv-runtime-discovery:
    if: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Bind exact Manoj runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          Write-Host "MANOJ_BOUND=PASS"

      - name: Discover OneSwap appliance address from qualification authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification'
          $seed=Join-Path $root 'oneswap-seed'
          foreach($f in @('network-config','meta-data')){
            $p=Join-Path $seed $f
            if(Test-Path $p){
              Write-Host "=== $p ==="
              Get-Content -LiteralPath $p |
                Where-Object {$_ -match '(?i)address|gateway|dhcp|nameserver|instance-id|local-hostname'} |
                ForEach-Object {Write-Host $_}
            }
          }
          Write-Host '=== candidate config files ==='
          Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match '(?i)(oneswap|known_hosts|client.*crt|client.*key|server.*crt|source.*json|config.*json|one_auth)'} |
            Select-Object FullName,Length,LastWriteTime |
            Format-Table -Wrap -AutoSize

      - name: Resolve appliance MAC to IPv4 from host neighbor tables
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('ls-appliance-qual','ls-appliance-dbe-qual')){
            $vm=Get-VM -Name $name -ErrorAction SilentlyContinue
            if(-not $vm){continue}
            foreach($nic in @(Get-VMNetworkAdapter -VMName $name -ErrorAction SilentlyContinue)){
              $mac=($nic.MacAddress -replace '[-:]','').ToUpper()
              Write-Host "VM=$name MAC=$mac SWITCH=$($nic.SwitchName)"
              Get-NetNeighbor -AddressFamily IPv4 -ErrorAction SilentlyContinue |
                Where-Object {(($_.LinkLayerAddress -replace '[-:]','').ToUpper()) -eq $mac} |
                Select-Object IPAddress,LinkLayerAddress,State,InterfaceAlias |
                Format-Table -AutoSize
            }
          }

      - name: Probe exact OneSwap service addresses
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates = New-Object System.Collections.Generic.HashSet[string]
          $seed='C:\\LayerSentryLab\\qualification\\oneswap-seed\\network-config'
          if(Test-Path $seed){
            foreach($line in Get-Content -LiteralPath $seed){
              foreach($m in [regex]::Matches($line,'(?<!\\d)(?:\\d{1,3}\\.){3}\\d{1,3}(?!\\d)')){
                if($m.Value -match '^10\\.') {[void]$candidates.Add($m.Value)}
              }
            }
          }
          $macs=@()
          foreach($name in @('ls-appliance-qual','ls-appliance-dbe-qual')){
            foreach($nic in @(Get-VMNetworkAdapter -VMName $name -ErrorAction SilentlyContinue)){
              $macs += (($nic.MacAddress -replace '[-:]','').ToUpper())
            }
          }
          foreach($n in Get-NetNeighbor -AddressFamily IPv4 -ErrorAction SilentlyContinue){
            $nm=(($n.LinkLayerAddress -replace '[-:]','').ToUpper())
            if($macs -contains $nm -and $n.IPAddress -match '^10\\.'){
              [void]$candidates.Add($n.IPAddress)
            }
          }
          if($candidates.Count -eq 0){
            foreach($ip in @('10.250.10.40','10.250.10.41','10.250.10.42','10.250.10.43')){
              [void]$candidates.Add($ip)
            }
            Write-Host 'DISCOVERY_FALLBACK=historical-qualified-candidates'
          }
          Write-Host "EXACT_CANDIDATES=$($candidates -join ',')"
          foreach($ip in $candidates){
            foreach($port in @(22,9443,9444)){
              $client=New-Object System.Net.Sockets.TcpClient
              try{
                $iar=$client.BeginConnect($ip,$port,$null,$null)
                $ok=$iar.AsyncWaitHandle.WaitOne(1500,$false)
                if($ok -and $client.Connected){
                  $client.EndConnect($iar)
                  Write-Host "ONESWAP_CANDIDATE ip=$ip port=$port tcp=true"
                } else {
                  Write-Host "ONESWAP_CANDIDATE ip=$ip port=$port tcp=false"
                }
              } catch {
                Write-Host "ONESWAP_CANDIDATE ip=$ip port=$port tcp=false"
              } finally {
                $client.Close()
              }
            }
          }
          Write-Host 'RUNTIME_DISCOVERY=PASS'


  cancel-stale-migration-discovery:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Cancel second stale Manoj discovery run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/actions/runs/35989706816/cancel || true


  manoj-oneswap-service-inspect:
    if: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind exact Manoj runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          Write-Host 'MANOJ_BOUND=PASS'

      - name: Verify pinned appliance host key and select login
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $key='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance.paramiko'
          foreach($p in @($key,$known)){ if(-not (Test-Path $p)){throw "Missing authority: $p"} }
          Write-Host "KEY_LENGTH=$((Get-Item $key).Length) KNOWN_HOSTS_LENGTH=$((Get-Item $known).Length)"
          & ssh-keygen.exe -F '10.250.10.42' -f $known
          if($LASTEXITCODE -ne 0){ throw 'Pinned known_hosts does not authorize 10.250.10.42' }
          $users=@('oneadmin','root','opc','rocky','cloud-user')
          $selected=$null
          foreach($u in $users){
            & ssh.exe -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=5 -i $key "$u@10.250.10.42" "printf 'LAYERSENTRY_SSH_OK user=%s host=%s\n' \$(id -un) \$(hostname)" 2>$null
            if($LASTEXITCODE -eq 0){$selected=$u;break}
          }
          if(-not $selected){throw 'No approved appliance login accepted the pinned key'}
          Write-Host "ONESWAP_SSH_USER=$selected"
          "ONESWAP_SSH_USER=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect OneSwap API service read-only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $key='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance.paramiko'
          $remote=@'
          set -eu
          echo "=== identity ==="
          id
          hostname
          echo "=== oneswap service ==="
          if command -v systemctl >/dev/null 2>&1; then
            systemctl is-enabled layersentry-oneswap.service 2>/dev/null || true
            systemctl is-active layersentry-oneswap.service 2>/dev/null || true
            systemctl is-enabled oneswapd.service 2>/dev/null || true
            systemctl is-active oneswapd.service 2>/dev/null || true
            systemctl --no-pager --full status layersentry-oneswap.service 2>/dev/null | head -40 || true
            systemctl --no-pager --full status oneswapd.service 2>/dev/null | head -40 || true
          fi
          echo "=== listener ==="
          ss -lntp 2>/dev/null | grep -E ':(22|9443|9444)[[:space:]]' || true
          echo "=== install metadata ==="
          command -v oneswap-hyperv || true
          command -v oneswap || true
          test -f /etc/layersentry/oneswapd/config.json && python3 - <<'PY'
          import json
          p='/etc/layersentry/oneswapd/config.json'
          d=json.load(open(p))
          safe={k:v for k,v in d.items() if k not in {'tls_key'}}
          for k in sorted(safe):
              v=safe[k]
              if any(x in k.lower() for x in ('key','auth','secret','password','token')):
                  print(f"{k}=<redacted>")
              else:
                  print(f"{k}={v}")
          PY
          echo "=== service journal tail ==="
          journalctl -u layersentry-oneswap.service -u oneswapd.service --no-pager -n 80 2>/dev/null || true
          '@
          $tmp=Join-Path $env:RUNNER_TEMP 'inspect-oneswap.sh'
          [IO.File]::WriteAllText($tmp,$remote,(New-Object Text.UTF8Encoding($false)))
          Get-Content $tmp | & ssh.exe -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $key "$env:ONESWAP_SSH_USER@10.250.10.42" 'bash -s'
          if($LASTEXITCODE -ne 0){throw "Read-only appliance inspection failed: $LASTEXITCODE"}
          Write-Host 'ONESWAP_SERVICE_INSPECTION=PASS'


  manoj-oneswap-authority-map:
    if: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind exact Manoj runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          Write-Host 'MANOJ_BOUND=PASS'

      - name: Print non-secret OneSwap seed network authority
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification'
          foreach($p in @(
            "$root\oneswap-seed\network-config",
            "$root\oneswap-seed\meta-data"
          )){
            if(Test-Path $p){
              Write-Host "=== $p ==="
              Get-Content -LiteralPath $p
            }
          }

      - name: Map pinned known-host authorities to candidate addresses
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification'
          $knowns=Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match '(?i)^known_hosts'}
          foreach($kh in $knowns){
            Write-Host "KNOWN_HOST_FILE=$($kh.FullName)"
            foreach($ip in @('10.250.10.40','10.250.10.41','10.250.10.42','10.250.10.43')){
              & ssh-keygen.exe -F $ip -f $kh.FullName 2>$null | ForEach-Object { Write-Host "PIN_MATCH ip=$ip file=$($kh.FullName) $_" }
            }
          }
          foreach($ip in @('10.250.10.40','10.250.10.41','10.250.10.42','10.250.10.43')){
            $scan=& ssh-keyscan.exe -T 3 $ip 2>$null
            if($scan){
              $tmp=Join-Path $env:RUNNER_TEMP ("scan-"+($ip -replace '\.','_')+".txt")
              [IO.File]::WriteAllLines($tmp,$scan)
              & ssh-keygen.exe -lf $tmp -E sha256 | ForEach-Object { Write-Host "LIVE_FINGERPRINT ip=$ip $_" }
            } else {
              Write-Host "LIVE_FINGERPRINT ip=$ip none"
            }
          }

      - name: Extract non-secret address hints from qualification scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification'
          $files=Get-ChildItem -Path $root -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match '(?i)(oneswap|appliance|builder|boot|swap).*(ps1|py|txt|md)$'}
          foreach($f in $files){
            Write-Host "=== HINT_FILE $($f.FullName) ==="
            Get-Content -LiteralPath $f.FullName -ErrorAction SilentlyContinue |
              Where-Object {
                $_ -match '(?i)10\.250\.10\.|ls-appliance|oneswap-qual|known_hosts|ssh|user(name)?|port\s*=|host\s*=' -and
                $_ -notmatch '(?i)password|secret|token|private.?key|authorization'
              } |
              Select-Object -First 120 |
              ForEach-Object { Write-Host $_ }
          }
          Write-Host 'ONESWAP_AUTHORITY_MAP=PASS'


  manoj-oneswap-authoritative-probe:
    if: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Bind exact Manoj runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}

      - name: Probe authoritative appliance IP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ip='10.250.10.32'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance.paramiko'
          $key='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          foreach($p in @($known,$key)){if(-not(Test-Path $p)){throw "Missing authority: $p"}}
          & ssh-keygen.exe -F $ip -f $known
          Write-Host "PIN_EXIT=$LASTEXITCODE"
          foreach($port in @(22,9443,9444)){
            $client=New-Object System.Net.Sockets.TcpClient
            try{
              $iar=$client.BeginConnect($ip,$port,$null,$null)
              $ok=$iar.AsyncWaitHandle.WaitOne(2000,$false)
              if($ok -and $client.Connected){
                $client.EndConnect($iar)
                Write-Host "AUTH_ENDPOINT ip=$ip port=$port tcp=true"
              } else {
                Write-Host "AUTH_ENDPOINT ip=$ip port=$port tcp=false"
              }
            } catch {
              Write-Host "AUTH_ENDPOINT ip=$ip port=$port tcp=false"
            } finally {$client.Close()}
          }
          ping.exe -n 2 -w 1000 $ip | Select-Object -Last 4 | ForEach-Object {Write-Host "PING $_"}
          Write-Host 'AUTHORITATIVE_APPLIANCE_PROBE=PASS'

      - name: Read-only SSH identity if pinned host is reachable
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ip='10.250.10.32'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance.paramiko'
          $key='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          & ssh-keygen.exe -F $ip -f $known *> $null
          if($LASTEXITCODE -ne 0){
            Write-Host 'AUTH_SSH=SKIP_NO_PIN'
            exit 0
          }
          $tcp=New-Object Net.Sockets.TcpClient
          try {
            $iar=$tcp.BeginConnect($ip,22,$null,$null)
            $ok=$iar.AsyncWaitHandle.WaitOne(1500,$false)
          } finally {$tcp.Close()}
          if(-not $ok){Write-Host 'AUTH_SSH=SKIP_PORT22_CLOSED'; exit 0}
          foreach($u in @('oneadmin','root','opc','rocky','cloud-user')){
            & ssh.exe -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=5 -i $key "$u@$ip" 'id -un; hostname' 2>$null
            if($LASTEXITCODE -eq 0){Write-Host "AUTH_SSH_USER=$u"; exit 0}
          }
          throw 'Pinned appliance accepted no approved login user'


  manoj-oneswap-hyperv-network-audit:
    if: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Bind exact Manoj runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}

      - name: Audit Hyper-V networking read-only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host '=== VSWITCHES ==='
          Get-VMSwitch | Select-Object Name,SwitchType,NetAdapterInterfaceDescription,AllowManagementOS | Format-Table -AutoSize
          Write-Host '=== HOST IP ==='
          Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object {$_.IPAddress -like '10.250.10.*'} |
            Select-Object InterfaceAlias,IPAddress,PrefixLength,AddressState |
            Format-Table -AutoSize
          foreach($name in @('ls-appliance-qual','ls-migration-source-test','ls-iso-builder')){
            Write-Host "=== VM $name ==="
            $vm=Get-VM -Name $name -ErrorAction SilentlyContinue
            if(-not $vm){Write-Host 'PRESENT=false';continue}
            $vm | Select-Object Name,State,Generation,Status,Heartbeat,OperationalStatus,Uptime | Format-List
            Get-VMNetworkAdapter -VMName $name -ErrorAction SilentlyContinue |
              Select-Object VMName,Name,SwitchName,MacAddress,DynamicMacAddressEnabled,Status,IPAddresses,DeviceNaming |
              Format-List
            Get-VMNetworkAdapterVlan -VMName $name -ErrorAction SilentlyContinue | Format-List *
            Get-VMIntegrationService -VMName $name -ErrorAction SilentlyContinue |
              Select-Object Name,Enabled,PrimaryStatusDescription,SecondaryStatusDescription |
              Format-Table -AutoSize
          }
          Write-Host '=== ARP/NEIGHBOR FOR AUTH IP ==='
          Get-NetNeighbor -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object {$_.IPAddress -eq '10.250.10.32'} |
            Format-List *
          Write-Host 'ONESWAP_HYPERV_NETWORK_AUDIT=PASS'


  manoj-oneswap-boot-seed-audit:
    if: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Bind exact Manoj runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}

      - name: Audit appliance storage and firmware read-only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-qual'
          Write-Host '=== VM ==='
