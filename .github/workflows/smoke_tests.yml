          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/layersentry/oneswap/hyperv/known_hosts -i /etc/layersentry/oneswap/hyperv/manoj-qual.key opc@10.250.10.1 "powershell.exe -NoProfile -NonInteractive -Command \"(Get-VM -Name 'ls-migration-source-test').State\""
