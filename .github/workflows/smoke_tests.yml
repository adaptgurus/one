          $builder=Get-VM -Name 'ls-iso-builder' -ErrorAction Stop
          if($builder.State -ne 'Running'){throw "Builder is not Running: $($builder.State)"}
          Write-Host 'PROTECTED_PATH_BEFORE=PASS'

      - name: Discover existing builder SSH account using pinned key only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $key='C:\LayerSentryLab\qualification\iso-builder-key'
          $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          $ip='10.250.10.40'
          & ssh-keygen.exe -F $ip -f $known 2>$null | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Builder host is not pinned in known_hosts_builder'}
          $selected=$null
          foreach($u in @('builder','opc','rocky','cloud-user','oneadmin')){
            $out=& ssh.exe -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o PreferredAuthentications=publickey -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=5 -i $key "$u@$ip" "printf 'SSH_ACCOUNT_OK user=%s host=%s\n' \`$(id -un) \`$(hostname)" 2>&1
            $rc=$LASTEXITCODE
            if($rc -eq 0){
              $out | ForEach-Object {Write-Host $_}
              $selected=$u
              "BUILDER_USER=$u" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              break
            } else {
              Write-Host "SSH_ACCOUNT_REJECTED user=$u rc=$rc"
            }
          }
          if(-not $selected){throw 'Existing builder key is not authorized for any qualified candidate account'}
          Write-Host "BUILDER_ACCOUNT_DISCOVERY=PASS user=$selected"

      - name: Inspect FE1 target authority metadata only
        shell: powershell
        run: |
