        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification'
          Write-Host '=== SSH CONFIG METADATA ==='
          foreach($cfg in @('C:\Users\opc\.ssh\config','C:\ProgramData\ssh\ssh_config')){
            if(Test-Path $cfg){
              Write-Host "SSH_CONFIG_FILE=$cfg"
              Get-Content -LiteralPath $cfg | Where-Object {
                $_ -match '(?i)^\s*(Host|HostName|User|IdentityFile|Port)\b' -and $_ -notmatch '(?i)password|secret|token'
              } | Select-Object -First 120 | ForEach-Object {Write-Host ('SSH_META=' + $_.Trim())}
            }
          }
          Write-Host '=== KNOWN HOST FILES ==='
          Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match '(?i)^known_hosts'} |
            ForEach-Object {Write-Host "KNOWN_HOST_FILE=$($_.FullName) length=$($_.Length)"}
          Write-Host '=== SAFE TARGET HINTS ==='
          $files=Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Extension -in @('.ps1','.sh','.py','.txt','.md','.json','.yaml','.yml','.conf')}
          foreach($file in $files){
            $hits=Select-String -Path $file.FullName -Pattern 'rocky-01|10\.10\.10\.|ONE_XMLRPC|one_auth|onehost list|onedatastore list|onevnet list|2633/RPC2|OpenNebula' -AllMatches -ErrorAction SilentlyContinue
            foreach($h in $hits | Select-Object -First 20){
              $line=$h.Line
              if($line -match '(?i)password|passwd|secret|token|private.?key|authorization|one_auth\s*='){continue}
              if($line.Length -gt 240){$line=$line.Substring(0,240)}
              Write-Host "TARGET_HINT file=$($file.Name) line=$($line.Trim())"
            }
          }
          Write-Host 'TARGET_HINT_INVENTORY=PASS'

      - name: Probe likely OpenNebula controller endpoints read-only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ips=New-Object System.Collections.Generic.HashSet[string]
          $root='C:\LayerSentryLab\qualification'
          Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Extension -in @('.ps1','.sh','.py','.txt','.md','.json','.yaml','.yml','.conf')} |
            ForEach-Object {
              $text=Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue
              if($text){
                [regex]::Matches($text,'\b10\.10\.10\.(?:[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4])\b') | ForEach-Object {[void]$ips.Add($_.Value)}
              }
            }
          foreach($ip in @('10.10.10.11','10.10.10.12','10.10.10.13')){[void]$ips.Add($ip)}
          foreach($ip in ($ips | Sort-Object)){
            foreach($port in @(22,2633,2616,9869)){
              $client=New-Object Net.Sockets.TcpClient
              $ok=$false
              try{
                $iar=$client.BeginConnect($ip,$port,$null,$null)
                $ok=$iar.AsyncWaitHandle.WaitOne(800,$false) -and $client.Connected
                if($ok){$client.EndConnect($iar)}
              }catch{}finally{$client.Close()}
              if($ok){Write-Host "TARGET_TCP ip=$ip port=$port open=true"}
            }
          }
          Write-Host 'TARGET_TCP_PROBE=PASS'

      - name: Confirm source remains Running and checkpoint-free
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source changed state: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source checkpoint invariant changed'}
          Write-Host 'SOURCE_PROTECTION_AFTER=PASS'


  manoj-opennebula-target-authority-ssh:
    if: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - name: Bind exact Manoj runner and protect source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source is not Running: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has checkpoints'}
          Write-Host 'SOURCE_PROTECTION_BEFORE=PASS'

      - name: Discover pinned frontend SSH authority without secrets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $targets=@('10.10.10.20','10.10.10.21','10.10.10.22','10.10.10.23')
          $knownCandidates=@(
            'C:\Users\opc\.ssh\known_hosts',
            'C:\ProgramData\ssh\ssh_known_hosts'
          )
          $knownCandidates += @(Get-ChildItem 'C:\LayerSentryLab\qualification' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match '^known_hosts'} | ForEach-Object {$_.FullName})
          $knownCandidates=@($knownCandidates | Where-Object {Test-Path $_} | Select-Object -Unique)
          foreach($known in $knownCandidates){
            foreach($ip in $targets){
              & ssh-keygen.exe -F $ip -f $known 2>$null | Out-Null
              if($LASTEXITCODE -eq 0){Write-Host "PINNED_HOST ip=$ip known=$known"}
            }
          }

          $inv=Get-ChildItem 'C:\LayerSentryLab\qualification' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match '(?i)one-deploy-inventory\.ya?ml$'} | Select-Object -First 5
          foreach($file in $inv){
            Get-Content -LiteralPath $file.FullName |
              Where-Object {$_ -match '(?i)^\s*(ansible_user|ansible_port|ansible_ssh_private_key_file|one_vip):|ls-fe0[123].*ansible_host'} |
              ForEach-Object {Write-Host ('TARGET_META=' + $_.Trim())}
          }
          Write-Host 'PINNED_AUTHORITY_DISCOVERY=PASS'

      - name: Read authoritative OpenNebula host datastore and VNet inventory over pinned SSH
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $targets=@('10.10.10.21','10.10.10.22','10.10.10.23','10.10.10.20')
          $knownCandidates=@(
            'C:\Users\opc\.ssh\known_hosts',
            'C:\ProgramData\ssh\ssh_known_hosts'
          )
          $knownCandidates += @(Get-ChildItem 'C:\LayerSentryLab\qualification' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match '^known_hosts'} | ForEach-Object {$_.FullName})
          $knownCandidates=@($knownCandidates | Where-Object {Test-Path $_} | Select-Object -Unique)

          $keyCandidates=@(
            'C:\Users\opc\.ssh\id_ed25519',
            'C:\Users\opc\.ssh\id_rsa'
          )
          $keyCandidates += @(Get-ChildItem 'C:\LayerSentryLab\qualification' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match '(?i)(^id_ed25519$|^id_rsa$|ssh.*key$|private.*key$|fe.*key$)' -and
              $_.Name -notmatch '(?i)\.pub$|known_hosts'
            } | ForEach-Object {$_.FullName})
          $keyCandidates=@($keyCandidates | Where-Object {Test-Path $_} | Select-Object -Unique)

          $users=@('oneadmin','opc')
          $success=$false
          foreach($ip in $targets){
            if($success){break}
            foreach($known in $knownCandidates){
              & ssh-keygen.exe -F $ip -f $known 2>$null | Out-Null
              if($LASTEXITCODE -ne 0){continue}
              foreach($sourceKey in $keyCandidates){
                if($success){break}
                $tmpKey=Join-Path $env:RUNNER_TEMP ("target-" + [IO.Path]::GetFileName($sourceKey) + "-" + [guid]::NewGuid().ToString('N'))
                try{
                  Copy-Item -Force $sourceKey $tmpKey
                  & icacls.exe $tmpKey /inheritance:r | Out-Null
                  & icacls.exe $tmpKey /grant:r '*S-1-5-18:F' | Out-Null
                  & icacls.exe $tmpKey /setowner '*S-1-5-18' | Out-Null
                  $pub=(& ssh-keygen.exe -y -f $tmpKey 2>$null | Select-Object -First 1)
                  if($LASTEXITCODE -ne 0 -or -not $pub){continue}
                  foreach($u in $users){
                    $cmd='hostname; id -un; command -v onehost >/dev/null 2>&1 || exit 41; echo ===HOSTS===; onehost list; echo ===DATASTORES===; onedatastore list; echo ===VNETS===; onevnet list'
                    $out=& ssh.exe -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=6 -i $tmpKey "$u@$ip" $cmd 2>&1
                    if($LASTEXITCODE -eq 0){
                      Write-Host "TARGET_OPENNEBULA_SSH ip=$ip user=$u known=$known"
                      $out | ForEach-Object {Write-Host ('TARGET_ONE=' + $_)}
                      $success=$true
                      break
                    }
                  }
                } finally {
                  Remove-Item -Force $tmpKey -ErrorAction SilentlyContinue
                }
              }
            }
          }
          if(-not $success){throw 'No previously pinned key-only SSH authority reached an OpenNebula frontend'}
          Write-Host 'TARGET_OPENNEBULA_AUTHORITY=PASS'

      - name: Confirm source remains Running and checkpoint-free
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source changed state: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source checkpoint invariant changed'}
          Write-Host 'SOURCE_PROTECTION_AFTER=PASS'

  manoj-oneswap-opennebula-authority:
    if: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind exact Manoj runner and protect source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source is not Running: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has checkpoints'}
          Write-Host 'SOURCE_PROTECTION_BEFORE=PASS'

      - name: Prepare LocalSystem-only appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $srcKey='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmpKey=Join-Path $env:RUNNER_TEMP 'oneswap_qual_ed25519.system'
          Copy-Item -Force $srcKey $tmpKey
          & icacls.exe $tmpKey /inheritance:r | Out-Null
          & icacls.exe $tmpKey /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmpKey /setowner '*S-1-5-18' | Out-Null
          $pub=(& ssh-keygen.exe -y -f $tmpKey 2>$null | Select-Object -First 1)
          if($LASTEXITCODE -ne 0 -or -not $pub){throw 'temporary appliance SSH key invalid'}
          "ONESWAP_TEMP_KEY=$tmpKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect appliance OpenNebula authority and read inventory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $appliance='10.250.10.32'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          echo APPLIANCE_HOST=$(hostname)
          echo APPLIANCE_USER=$(id -un)
          for cmd in onehost onedatastore onevnet oneimage onetemplate; do
            command -v "$cmd" >/dev/null 2>&1 && echo "ONECLI_${cmd}=PRESENT" || echo "ONECLI_${cmd}=ABSENT"
          done
          for p in /var/lib/one/.one/one_auth /root/.one/one_auth /etc/one/one_auth /etc/layersentry/oneswapd/credentials/*.one_auth; do
            for f in $p; do
              [ -f "$f" ] || continue
              stat -c 'AUTH_FILE=%n mode=%a uid=%u gid=%g size=%s' "$f"
            done
          done
          python3 - <<'PY'
          import glob,re
          for p in glob.glob('/etc/layersentry/oneswapd/sources/*.json') + glob.glob('/etc/layersentry/oneswapd/source-configs/*') + glob.glob('/etc/layersentry/oneswap/*.yaml'):
              try:
                  data=open(p,'r',encoding='utf-8',errors='replace').read()
              except Exception:
                  continue
              print('CFG_FILE='+p)
              for pat,label in [
                  (r'(?im)^\s*one_xmlrpc\s*[:=]\s*["\x27]?([^"\x27\s]+)','ONE_XMLRPC_HINT'),
                  (r'(?im)^\s*:one_xmlrpc:\s*["\x27]?([^"\x27\s]+)','ONE_XMLRPC_HINT'),
                  (r'(?im)^\s*one_auth\s*[:=]\s*["\x27]?([^"\x27\s]+)','ONE_AUTH_PATH_HINT'),
                  (r'(?im)^\s*:datastore:\s*([^\s#]+)','DATASTORE_HINT'),
                  (r'(?im)^\s*:network:\s*([^\s#]+)','NETWORK_HINT')]:
                  m=re.search(pat,data)
                  if m: print(label+'='+m.group(1))
          PY

          success=0
          endpoints="${ONE_XMLRPC:-}"
          [ -n "$endpoints" ] || endpoints="http://10.10.10.20:2633/RPC2 http://10.250.10.11:2633/RPC2"
          for auth in /var/lib/one/.one/one_auth /root/.one/one_auth /etc/one/one_auth /etc/layersentry/oneswapd/credentials/*.one_auth; do
            for af in $auth; do
              [ -f "$af" ] || continue
              for ep in $endpoints; do
                echo "TRY_ONE_AUTH=$af ENDPOINT=$ep"
                if ONE_AUTH="$af" ONE_XMLRPC="$ep" timeout 8 onehost list >/tmp/hosts.out 2>/tmp/hosts.err; then
                  echo "TARGET_ONE_ENDPOINT=$ep"
                  echo "TARGET_ONE_AUTH_PATH=$af"
                  echo '===HOSTS==='
                  cat /tmp/hosts.out
                  echo '===DATASTORES==='
                  ONE_AUTH="$af" ONE_XMLRPC="$ep" timeout 8 onedatastore list
                  echo '===VNETS==='
                  ONE_AUTH="$af" ONE_XMLRPC="$ep" timeout 8 onevnet list
                  echo TARGET_ONECLI_AUTHORITY=PASS
                  success=1
                  break 2
                fi
              done
            done
          done
          [ "$success" -eq 1 ] || { echo TARGET_ONECLI_AUTHORITY=NOT_FOUND; exit 42; }
          '@
          $script=$script -replace "`r",''
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@$appliance" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'OneSwap appliance has no proven OpenNebula CLI authority'}
          Write-Host 'ONESWAP_TARGET_AUTHORITY_DISCOVERY=PASS'

      - name: Confirm source remains Running and checkpoint-free
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source changed state: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source checkpoint invariant changed'}
          Write-Host 'SOURCE_PROTECTION_AFTER=PASS'


