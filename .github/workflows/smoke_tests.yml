          $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          $ip='10.250.10.40'
          $cmd='set -euo pipefail; p=/mnt/layersentry-work/ha-private/fe1/one_auth; if [ -f "$p" ]; then stat -c "FE1_AUTH_PRESENT=1 mode=%a uid=%u gid=%g size=%s" "$p"; else echo FE1_AUTH_PRESENT=0; exit 42; fi; grep -RhoE "http://10\.250\.10\.[0-9]+:2633/RPC2" /mnt/layersentry-work 2>/dev/null | sort -u | head -20'
          & ssh.exe -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o PreferredAuthentications=publickey -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $key "$env:BUILDER_USER@$ip" $cmd
          if($LASTEXITCODE -ne 0){throw 'Builder FE1 authority metadata validation failed'}
          Write-Host 'BUILDER_FE1_AUTHORITY_METADATA=PASS'

      - name: Confirm protected migration path remains intact
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Protected source changed state: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Protected source checkpoint invariant changed'}
          $active=Get-VM -Name 'ls-appliance-qual' -ErrorAction Stop
          if($active.State -ne 'Running'){throw "Active OneSwap appliance changed state: $($active.State)"}
          Write-Host 'PROTECTED_PATH_AFTER=PASS'


