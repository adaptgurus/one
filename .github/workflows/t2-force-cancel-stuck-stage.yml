name: T2 Force Cancel Stuck Stage

on:
  push:
    branches:
      - ops/t2-foundation-iso-qualification-20260921
    paths:
      - .github/workflows/t2-force-cancel-stuck-stage.yml

permissions:
  contents: read
  actions: write

jobs:
  force-cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Force cancel blocked Windows stage run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/adaptgurus/one/actions/runs/35795065321/force-cancel
          echo "FORCE_CANCEL_REQUESTED=PASS"
