name: Seven Node Proxmox Control Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - lab/seven-node-foundation-20260926
    paths:
      - '.github/workflows/seven-node-proxmox-control-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Bind exact Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME SLOT=${{ matrix.slot }}"
          if($env:RUNNER_NAME -ine 'WIN-GK6MO7T7OPC' -or $env:COMPUTERNAME -ine 'WIN-GK6MO7T7OPC'){
            'LS_TARGET=false' | Out-File $env:GITHUB_ENV -Append
            Write-Host 'NON_TARGET_RUNNER_HOLD'
            Start-Sleep -Seconds 90
            exit 0
          }
          'LS_TARGET=true' | Out-File $env:GITHUB_ENV -Append

      - name: Discover authorized Proxmox control path
        if: env.LS_TARGET == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host 'OPERATION_ID=smart-installer-proxmox-control-discovery-20260926'
          Write-Host '--- ROUTES ---'
          Get-NetRoute -AddressFamily IPv4 |
            Sort-Object DestinationPrefix,RouteMetric |
            Select-Object DestinationPrefix,NextHop,InterfaceAlias,RouteMetric |
            Format-Table -AutoSize
          Write-Host '--- DNS ---'
          Get-DnsClientServerAddress -AddressFamily IPv4 |
            Select-Object InterfaceAlias,ServerAddresses |
            Format-Table -AutoSize
          $names=@('LSM1','LSM2','LSM4','LSM5','LSM6','lsm1','lsm2','lsm4','lsm5','lsm6')
          foreach($name in $names){
            $addresses=@(Resolve-DnsName -Name $name -Type A -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty IPAddress -Unique)
            if($addresses.Count -eq 0){
              Write-Host "PROXMOX_NAME name=$name state=UNRESOLVED"
              continue
            }
            foreach($address in $addresses){
              $ssh=Test-NetConnection -ComputerName $address -Port 22 -InformationLevel Quiet -WarningAction SilentlyContinue
              $api=Test-NetConnection -ComputerName $address -Port 8006 -InformationLevel Quiet -WarningAction SilentlyContinue
              Write-Host "PROXMOX_NAME name=$name ip=$address ssh22=$ssh api8006=$api"
            }
          }
          Write-Host '--- BOUNDED PROXMOX API DISCOVERY ---'
          $candidateIps=@()
          foreach($prefix in @('192.168.14','172.17.60')){
            1..254 | ForEach-Object { $candidateIps += "$prefix.$_" }
          }
          129..158 | ForEach-Object { $candidateIps += "172.17.30.$_" }
          $checks=@()
          foreach($address in $candidateIps){
            $client=[System.Net.Sockets.TcpClient]::new()
            $checks += [pscustomobject]@{
              Address=$address
              Client=$client
              Connect=$client.BeginConnect($address,8006,$null,$null)
            }
          }
          foreach($check in $checks){
            $open=$check.Connect.AsyncWaitHandle.WaitOne(800)
            if($open -and $check.Client.Connected){
              try { $check.Client.EndConnect($check.Connect) } catch {}
              $ssh=Test-NetConnection -ComputerName $check.Address -Port 22 -InformationLevel Quiet -WarningAction SilentlyContinue
              Write-Host "PROXMOX_API_CANDIDATE ip=$($check.Address) api8006=True ssh22=$ssh"
            }
            $check.Client.Dispose()
          }
          Write-Host '--- NEIGHBORS ---'
          Get-NetNeighbor -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object State -notin @('Unreachable','Incomplete') |
            Sort-Object IPAddress |
            Select-Object IPAddress,LinkLayerAddress,State,InterfaceAlias |
            Format-Table -AutoSize
          Write-Host '--- AUTHORIZED CONTROL MATERIAL METADATA ---'
          $roots=@("$env:USERPROFILE\.ssh",'C:\ProgramData\LayerSentryLab','C:\LayerSentryLab')
          foreach($root in $roots){
            if(Test-Path $root){
              Get-ChildItem -Path $root -Force -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object Name -Match 'proxmox|pve|known_hosts|config|\.pub$' |
                Select-Object FullName,Length,LastWriteTime |
                Format-Table -AutoSize
            }
          }
          foreach($known in @("$env:USERPROFILE\.ssh\known_hosts",'C:\ProgramData\LayerSentryLab\seven-node-bootstrap\known_hosts')){
            if(Test-Path $known){
              Get-Content $known | Where-Object { $_ -and -not $_.StartsWith('#') } | ForEach-Object {
                $hostField=($_ -split ' ')[0]
                Write-Host "KNOWN_HOSTS_TARGET file=$known target=$hostField"
              }
            }
          }
          cmdkey.exe /list | Select-String -Pattern 'proxmox|pve|LSM' -CaseSensitive:$false
          Write-Host 'PROXMOX_CONTROL_DISCOVERY=COMPLETE'
