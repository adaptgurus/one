name: LayerSentry Manoj Pinned Recovery Service Validation

on:
  push:
    branches:
      - dr-threepoint-ssh-20260924
    paths:
      - ".github/workflows/layersentry-manoj-pinned-service-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Boot pinned guest-agent recovery VM and validate services
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'MANOJ-TEST-INST') { throw "Wrong runner" }
          $script = @'
          import base64, functools, hashlib, http.server, os, pathlib, threading, time, xml.etree.ElementTree as ET
          from xmlrpc.client import ServerProxy
          from dissect.target import Target

          ENDPOINT="http://10.250.10.10:2633/RPC2"
          AUTH_IMAGE=pathlib.Path(r"C:\LayerSentryLab\Recovery\fe2-lvm\2.img")
          RECOVERY_DIR=pathlib.Path(r"C:\LayerSentryLab\dr-recovery\tester-vm220-20260923")
          DISK=RECOVERY_DIR/"vm220-dr-recovered.qcow2"
          TARGET_HOST="ls-kvm2"
          DATASTORE_ID=1
          HOST_HTTP_IP="10.250.10.1"
          HTTP_PORT=18086

          if not DISK.is_file():
              raise SystemExit("recovery disk missing")
          offline=Target.open(str(DISK))
          os_release=offline.fs.path("/etc/os-release").open("rb").read()
          sshd_cfg=b""
          try:
              sshd_cfg=offline.fs.path("/etc/ssh/sshd_config").open("rb").read()
          except Exception:
              pass
          expected_os_sha=hashlib.sha256(os_release).hexdigest()
          expected_sshd_sha=hashlib.sha256(sshd_cfg).hexdigest() if sshd_cfg else ""
          print("EXPECTED_OS_RELEASE_SHA256="+expected_os_sha)
          if expected_sshd_sha: print("EXPECTED_SSHD_CONFIG_SHA256="+expected_sshd_sha)

          target=Target.open(str(AUTH_IMAGE))
          auth=target.fs.path("/var/lib/one/.one/one_auth").open("rb").read().decode().strip()
          one=ServerProxy(ENDPOINT, allow_none=True)

          hp_res=one.one.hostpool.info(auth,-2,-1,-1)
          if not hp_res[0]: raise SystemExit("host pool query failed")
          hp=ET.fromstring(hp_res[1])
          hs=[h for h in hp.findall("HOST") if (h.findtext("NAME") or "").strip()==TARGET_HOST]
          if len(hs)!=1: raise SystemExit("target host not unique")
          h=hs[0]
          state=int(h.findtext("STATE") or -1)
          max_cpu=int(h.findtext("./HOST_SHARE/MAX_CPU") or h.findtext("./HOST_SHARE/TOTAL_CPU") or 0)
          running_counter=int(h.findtext("./HOST_SHARE/RUNNING_VMS") or 0)
          pin=(h.findtext("./TEMPLATE/PIN_POLICY") or "").strip().upper()
          thread=(h.findtext("./TEMPLATE/VMS_THREAD") or "1").strip()
          if state!=2 or pin!="PINNED" or thread!="1" or max_cpu<200:
              raise SystemExit(f"unsafe target host state={state} pin={pin} thread={thread} max_cpu={max_cpu}")
          total_cores=max_cpu//100
          # HOST_SHARE/RUNNING_VMS is not authoritative in this nested lab and
          # includes stale/powered-off allocations. Capacity admission below is
          # based on active deployed VMs and their exact pinned CPU assignments.
          print(f"SERVICE_HOST_COUNTER_EVIDENCE running_counter={running_counter} total_cores={total_cores}")

          vmp=one.one.vmpool.info(auth,-2,-1,-1,-2,"")
          if not vmp[0]: raise SystemExit("VM pool query failed")
          vp=ET.fromstring(vmp[1])
          used=set()
          active=[]
          for summary in vp.findall("VM"):
              histories=summary.findall("./HISTORY_RECORDS/HISTORY")
              host=histories[-1].findtext("HOSTNAME") if histories else ""
              if host!=TARGET_HOST: continue
              vm_state=int(summary.findtext("STATE") or -1)
              deploy=(summary.findtext("DEPLOY_ID") or "").strip()
              if vm_state!=3 or not deploy:
                  continue
              vm_id=int(summary.findtext("ID"))
              full=one.one.vm.info(auth,vm_id,False)
              if not full[0]:
                  raise SystemExit(f"cannot read active VM {vm_id} for CPU isolation")
              vm=ET.fromstring(full[1])
              cpus=[x.text for x in vm.findall("./TEMPLATE/NUMA_NODE/CPUS") if x.text]
              for value in cpus:
                  for part in value.replace(",", " ").split():
                      if part.isdigit(): used.add(int(part))
              active.append((str(vm_id),vm.findtext("NAME"),cpus))
          # VM12 is a qualification-owned preserved recovery proof from the same
          # staged disk. The owner authorized shutting an unneeded non-K8s VM
          # when necessary. Power it off (never delete) to release its pinned core
          # for live service validation.
          if len(active)==1 and active[0][0]=="12" and active[0][1]=="ls-dr-pinned-boot-35960325463":
              print("SERVICE_CAPACITY_RELEASE_TARGET=VM12")
              action=one.one.vm.action(auth,"poweroff",12)
              if not action[0]:
                  raise SystemExit("failed to power off qualification VM12: "+str(action[1])[:300])
              for _ in range(90):
                  info=one.one.vm.info(auth,12,False)
                  if not info[0]:
                      raise SystemExit("cannot read VM12 after poweroff request")
                  vm12=ET.fromstring(info[1])
                  vm12_state=int(vm12.findtext("STATE") or -1)
                  vm12_lcm=int(vm12.findtext("LCM_STATE") or -1)
                  if vm12_state==8 and vm12_lcm==0:
                      break
                  time.sleep(1)
              else:
                  raise SystemExit("qualification VM12 did not reach POWEROFF")
              print("SERVICE_CAPACITY_RELEASE=PASS VM_ID=12 STATE=POWEROFF PRESERVED=YES")
              active=[]
              used=set()
              for _ in range(60):
                  hres=one.one.host.info(auth,host_id)
                  if not hres[0]:
                      raise SystemExit("cannot refresh target host after VM12 poweroff")
                  href=ET.fromstring(hres[1])
                  free_raw=href.findtext("./HOST_SHARE/FREE_CPU")
                  free_now=int(free_raw) if free_raw not in (None,"") else 0
                  if free_now>=100:
                      print(f"SERVICE_HOST_CAPACITY_REFRESH=PASS FREE_CPU={free_now}")
                      break
                  time.sleep(1)
              else:
                  raise SystemExit("target host CPU capacity did not refresh after VM12 poweroff")

          # Remove only failed/non-running service-validation allocations from
          # prior attempts. Never touch a RUNNING/deployed VM.
          stale=[]
          for summary in vp.findall("VM"):
              name=(summary.findtext("NAME") or "").strip()
              if not name.startswith("ls-dr-service-vm-"):
                  continue
              vm_state=int(summary.findtext("STATE") or -1)
              lcm_state=int(summary.findtext("LCM_STATE") or -1)
              deploy=(summary.findtext("DEPLOY_ID") or "").strip()
              if vm_state==3 and lcm_state==3 and deploy:
                  continue
              stale.append((int(summary.findtext("ID")),name,vm_state,lcm_state,deploy))
          for stale_id,stale_name,stale_state,stale_lcm,stale_deploy in stale:
              action=one.one.vm.action(auth,"terminate-hard",stale_id)
              if action[0]:
                  print(f"SERVICE_STALE_VM_CLEANUP=PASS VM_ID={stale_id} NAME={stale_name} STATE={stale_state} LCM={stale_lcm}")
              else:
                  print(f"SERVICE_STALE_VM_CLEANUP=WARNING VM_ID={stale_id} ERROR={str(action[1])[:200]}")

          total_cores=max_cpu//100
          print("PINNED_ACTIVE_VMS="+repr(active))
          print("PINNED_USED_CPUS="+repr(sorted(used)))
          if len(used)>=total_cores:
              raise SystemExit(f"no isolated CPU remains used={sorted(used)} total_cores={total_cores}")
          free_pinned=sorted(set(range(total_cores))-used)
          if not free_pinned:
              raise SystemExit(f"no isolated pinned CPU remains used={sorted(used)} total_cores={total_cores}")
          print(f"SERVICE_HOST_PREFLIGHT=PASS total_cores={total_cores} used={sorted(used)} free={free_pinned}")

          class QuietHandler(http.server.SimpleHTTPRequestHandler):
              def log_message(self, fmt, *args): pass
          handler=functools.partial(QuietHandler,directory=str(RECOVERY_DIR))
          server=http.server.ThreadingHTTPServer(("0.0.0.0",HTTP_PORT),handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()

          run_id=os.environ.get("GITHUB_RUN_ID","manual")
          image_name="ls-dr-service-image-"+run_id
          vm_name="ls-dr-service-vm-"+run_id
          image_id=4
          reusable=one.one.image.info(auth,image_id,False)
          if reusable[0]:
              reusable_root=ET.fromstring(reusable[1])
              reusable_state=int(reusable_root.findtext("STATE") or -1)
          else:
              reusable_state=-1
          if reusable_state==1:
              print("SERVICE_IMAGE_REUSE=PASS IMAGE_ID=4")
          else:
              image_template=f'''NAME="{image_name}"
              PATH="http://{HOST_HTTP_IP}:{HTTP_PORT}/{DISK.name}"
              TYPE="OS"
              PERSISTENT="NO"
              DESCRIPTION="LayerSentry pinned service recovery validation"
              '''
              alloc=one.one.image.allocate(auth,image_template,DATASTORE_ID)
              if not alloc[0]: raise SystemExit("service image allocate failed: "+str(alloc[1])[:500])
              image_id=int(alloc[1])
              print("SERVICE_IMAGE_ID="+str(image_id))
              for _ in range(180):
                  info=one.one.image.info(auth,image_id,False)
                  if not info[0]: raise SystemExit("service image info failed")
                  ir=ET.fromstring(info[1]); st=int(ir.findtext("STATE") or -1)
                  if st==1: break
                  if st in (5,7): raise SystemExit("service image failed: "+str(ir.findtext("./TEMPLATE/ERROR") or ""))
                  time.sleep(2)
              else: raise SystemExit("service image did not become READY")

          vm_template=f'''NAME="{vm_name}"
          CPU="1"
          VCPU="1"
          MEMORY="256"
          FEATURES=[GUEST_AGENT="YES"]
          TOPOLOGY=[
            PIN_POLICY="CORE",
            CORES="1",
            SOCKETS="1",
            THREADS="1"
          ]
          DISK=[IMAGE_ID="{image_id}"]
          SCHED_REQUIREMENTS="NAME = \\\"{TARGET_HOST}\\\""
          '''
          # Allocate on HOLD so the stale nested-lab host share counters cannot
          # race the scheduler. We already proved one physical pinned CPU is free.
          va=one.one.vm.allocate(auth,vm_template,True)
          if not va[0]: raise SystemExit("service VM allocate failed: "+str(va[1])[:500])
          vm_id=int(va[1])
          print("SERVICE_VALIDATION_VM_ID="+str(vm_id))

          host_id=int(h.findtext("ID") or -1)
          if host_id < 0:
              raise SystemExit("invalid target host id")
          deploy=one.one.vm.deploy(auth,vm_id,host_id,False,-1)
          if not deploy[0]:
              raise SystemExit("manual pinned VM deploy failed: "+str(deploy[1])[:500])
          print(f"SERVICE_MANUAL_DEPLOY=PASS VM_ID={vm_id} HOST_ID={host_id}")

          final_cpus=[]
          for _ in range(180):
              info=one.one.vm.info(auth,vm_id,False)
              if not info[0]: raise SystemExit("service VM info failed")
              root=ET.fromstring(info[1])
              state=int(root.findtext("STATE") or -1); lcm=int(root.findtext("LCM_STATE") or -1)
              histories=root.findall("./HISTORY_RECORDS/HISTORY")
              host=histories[-1].findtext("HOSTNAME") if histories else ""
              pin=(root.findtext("./TEMPLATE/TOPOLOGY/PIN_POLICY") or "").strip().upper()
              final_cpus=[x.text for x in root.findall("./TEMPLATE/NUMA_NODE/CPUS") if x.text]
              if state==3 and lcm==3 and host==TARGET_HOST:
                  if pin!="CORE": raise SystemExit("service VM not CORE pinned")
                  assigned=set()
                  for value in final_cpus:
                      for part in value.replace(","," ").split():
                          if part.isdigit(): assigned.add(int(part))
                  if assigned & used:
                      raise SystemExit(f"CPU overlap with existing recovery VM: assigned={assigned} used={used}")
                  print(f"SERVICE_VM_RUNNING=PASS vm={vm_id} image={image_id} host={host} pin={pin} cpus={final_cpus}")
                  break
              if state==6: raise SystemExit("service VM reached DONE")
              time.sleep(2)
          else: raise SystemExit("service VM did not become RUNNING")

          command="set -e; echo OS_SHA=$(sha256sum /etc/os-release | awk '{print $1}'); if [ -f /etc/ssh/sshd_config ]; then echo SSHD_SHA=$(sha256sum /etc/ssh/sshd_config | awk '{print $1}'); fi; echo SERVICES_BEGIN; rc-service sshd status; rc-service qemu-guest-agent status; rc-status -a; echo SERVICES_END"
          exec_method=getattr(one.one.vm,"exec")
          last_error=""
          for attempt in range(120):
              result=exec_method(auth,vm_id,command)
              if result[0]:
                  print("QGA_EXEC_SUBMITTED=PASS attempt="+str(attempt+1))
                  break
              last_error=str(result[1])
              time.sleep(2)
          else:
              raise SystemExit("qemu-ga exec unavailable: "+last_error[:500])

          qga=None
          for _ in range(120):
              info=one.one.vm.info(auth,vm_id,False)
              if not info[0]: raise SystemExit("service VM info during exec failed")
              root=ET.fromstring(info[1])
              qga=root.find("./TEMPLATE/QEMU_GA_EXEC")
              status=(qga.findtext("STATUS") or "").strip() if qga is not None else ""
              if status in ("DONE","ERROR","CANCELLED"): break
              time.sleep(2)
          if qga is None: raise SystemExit("QEMU_GA_EXEC missing")
          status=(qga.findtext("STATUS") or "").strip()
          rc=(qga.findtext("RETURN_CODE") or "").strip()
          out64=(qga.findtext("STDOUT") or "").strip()
          err64=(qga.findtext("STDERR") or "").strip()
          stdout=base64.b64decode(out64).decode("utf-8","replace") if out64 else ""
          stderr=base64.b64decode(err64).decode("utf-8","replace") if err64 else ""
          print("QGA_STATUS="+status); print("QGA_RETURN_CODE="+rc)
          print("QGA_STDOUT_BEGIN"); print(stdout); print("QGA_STDOUT_END")
          if stderr: print("QGA_STDERR="+stderr)
          if status!="DONE" or rc!="0": raise SystemExit("guest service command failed")
          if "OS_SHA="+expected_os_sha not in stdout: raise SystemExit("os-release continuity hash mismatch")
          if expected_sshd_sha and "SSHD_SHA="+expected_sshd_sha not in stdout: raise SystemExit("sshd config continuity hash mismatch")
          if "sshd" not in stdout or "qemu-guest-agent" not in stdout: raise SystemExit("required services absent")
          if "status: started" not in stdout and "started" not in stdout: raise SystemExit("required services not started")
          print("MANOJ_RECOVERY_SERVICE_VALIDATION=PASS")
          print(f"MANOJ_RECOVERY_SERVICE_PRESERVED=YES VM_ID={vm_id} IMAGE_ID={image_id}")
          server.shutdown()
          '@
          $p=Join-Path $env:RUNNER_TEMP 'pinned-service-validation.py'
          Set-Content -Path $p -Value $script -Encoding UTF8
          $rule="LayerSentry-Service-DR-$env:GITHUB_RUN_ID"
          try {
            New-NetFirewallRule -DisplayName $rule -Direction Inbound -Action Allow -Protocol TCP -LocalPort 18086 -RemoteAddress 10.250.10.0/24 -Profile Any | Out-Null
            & 'C:\LayerSentryLab\tools\Python313\python.exe' $p
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          }

# resume-service-validation-fix: 2026-09-24T15:11+05:30

# manual-pinned-deploy-fix: 2026-09-24T15:11+05:30

# half-share-pinned-core-fix: 2026-09-24T15:11+05:30

# qualification-vm12-capacity-release: 2026-09-24T15:11+05:30
