name: TESTSER Backup Plan Catalog UI Qualification

on:
  push:
    branches:
      - qual/testser-backup-plan-catalog-20260926
    paths:
      - '.github/workflows/testser-backup-plan-catalog.yml'
      - 'src/fireedge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@v6
      - name: Bind TESTSER runner
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME slot=${{ matrix.slot }}"
          if [ "$RUNNER_NAME" != "TESTSER-TWOSITE-ONE" ]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            sleep 60
            exit 0
          fi
          echo "execute=true" >> "$GITHUB_OUTPUT"
      - name: Runtime versions
        if: steps.bind.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
      - name: Locked install
        if: steps.bind.outputs.execute == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Backup-plan focused regression
        if: steps.bind.outputs.execute == 'true'
        run: node --test tests/layersentry/protection-integration.test.cjs tests/layersentry/production-service-blueprints.test.cjs
      - name: Full LayerSentry regression
        if: steps.bind.outputs.execute == 'true'
        run: node --test tests/layersentry/*.test.cjs
      - name: FireEdge lint
        if: steps.bind.outputs.execute == 'true'
        run: npm run lint
      - name: Full FireEdge production build
        if: steps.bind.outputs.execute == 'true'
        run: npm run build
      - name: Verify catalog bundle strings
        if: steps.bind.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q "Pre-baked plan templates" dist
          grep -R -q "Native backup jobs" dist
          echo TESTSER_BACKUP_PLAN_UI_QUALIFICATION=PASS
