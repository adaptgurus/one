name: Tester Foundation execution hold
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: true
jobs:
  hold:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 2
    steps:
      - name: Record unverified deployment boundary without guest access
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          echo 'FOUNDATION_SUBSTRATE_CREATED'
          echo 'ONEDEPLOY_APPLY_NOT_EXECUTED'
          echo 'RAFT_CLUSTER_NOT_VERIFIED'
          echo 'GALERA_CLUSTER_NOT_VERIFIED'
          echo 'NO_GUEST_ACCESS_OR_INFRASTRUCTURE_MUTATION_IN_THIS_JOB'
