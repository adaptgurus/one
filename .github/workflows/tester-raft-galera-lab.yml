name: Tester Foundation fresh VM replacement qualification
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  fresh-replacement:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    steps:
      - name: Bind exact original lab and reviewed replacement sources
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          test "$(git -C /home/opc/layersentry-platform rev-parse HEAD)" = 66065eda0b4ea050ae4ce7b1dbbba3519e428bf8
          test -z "$(git -C /home/opc/layersentry-platform status --porcelain)"
          test "$(git -C /home/opc/one-deploy rev-parse HEAD)" = faf53b034f7922746f35b033f2156a997b04fe00
          /home/opc/layersentry-foundation-qual-20260929/venv/bin/python -m py_compile /home/opc/layersentry-platform/tools/lab/tester_fresh_replacement.py /home/opc/layersentry-platform/tools/lab/tester_replacement_substrate.py
      - name: Prepare new empty-disk candidate without starting a duplicate identity
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/bin/python3 /home/opc/layersentry-platform/tools/lab/tester_replacement_substrate.py
      - name: Qualify Foundation enrollment and restore retained original
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python /home/opc/layersentry-platform/tools/lab/tester_fresh_replacement.py --execute
