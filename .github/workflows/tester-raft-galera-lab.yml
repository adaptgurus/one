name: Tester post-quorum independent audit
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  independent-audit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Bind authorized tester and exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          test "$(git -C /home/opc/layersentry-platform rev-parse HEAD)" = 9fa5b48105e3146b47dc65a10976b096d5099e6d
          test -z "$(git -C /home/opc/layersentry-platform status --porcelain)"
          test "$(git -C /home/opc/one-deploy rev-parse HEAD)" = faf53b034f7922746f35b033f2156a997b04fe00
      - name: Fresh raw-state audit and authenticated application SQL transaction
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python /home/opc/layersentry-platform/tools/lab/tester_cluster_health_audit.py
      - name: Independently confirm no paused members no test groups and timer removal
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python - <<'PY'
          import os,sys,json,subprocess,hashlib
          from pathlib import Path
          sys.path.insert(0,'/home/opc/layersentry-platform/tools/lab')
          import tester_native_qualification as n
          from tester_cluster_resilience import validate_domain,UUIDS
          out=n.WORK/'evidence'/('independent-health-'+os.environ['GITHUB_RUN_ID'])
          result={'VMs':{},'native_quorum_test_groups':[],'failsafe_timer_active':None,'passed':False}
          for name in n.NAMES:
              xml=subprocess.check_output(['sudo','-n','virsh','-c','qemu:///system','dumpxml',name],text=True)
              validate_domain(name,xml)
              state=subprocess.check_output(['sudo','-n','virsh','-c','qemu:///system','domstate',UUIDS[name]],text=True).strip()
              result['VMs'][name]={'uuid':UUIDS[name],'state':state}
              assert state=='running'
          groups=n.rows(n.native_json(n.NAMES[0],['onegroup','list','--json']).get('GROUP_POOL',{}).get('GROUP'))
          result['native_quorum_test_groups']=[r['NAME'] for r in groups if r['NAME'].startswith('lsf-quorum-')]
          assert not result['native_quorum_test_groups']
          p=subprocess.run(['sudo','-n','systemctl','is-active','lsf-quorum-restore-36528659790.timer'],text=True,capture_output=True)
          result['failsafe_timer_active']=p.stdout.strip()
          assert result['failsafe_timer_active'] in {'inactive','unknown'}
          result['passed']=True
          (out/'quorum-cleanup.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Verify and prepare only this new audit for artifact publication
        id: publication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          python3 - <<'PY'
          import os,json,hashlib,re
          from pathlib import Path
          out=Path('/home/opc/layersentry-foundation-qual-20260929/evidence')/('independent-health-'+os.environ['GITHUB_RUN_ID'])
          allowed={'audit.json','quorum-cleanup.json','SHA256SUMS'}
          assert out.is_dir() and {p.name for p in out.iterdir()}.issubset(allowed)
          assert (out/'audit.json').is_file()
          for p in out.iterdir():
              assert p.is_file() and not p.is_symlink()
              raw=p.read_bytes()
              for marker in [b'BEGIN OPENSSH PRIVATE KEY',b'BEGIN RSA PRIVATE KEY',b'Authorization: Bearer',b'github_pat_',b'ghp_']:
                  assert marker not in raw,'secret-like marker; publication refused'
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.name!='SHA256SUMS'))
          # An output is emitted only after validation; upload does not execute
          # when this step fails, including any failed secret-marker check.
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('accepted=true\n')
          PY
      - name: Upload new independently collected audit with checksums
        if: always() && steps.publication.outputs.accepted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tester-post-quorum-audit-${{ github.run_id }}
          path: /home/opc/layersentry-foundation-qual-20260929/evidence/independent-health-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: error
