name: Tester Foundation nested members
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  foundation-substrate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Create exact pinned disposable tester VM substrate
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          source=/home/opc/layersentry-platform
          test "$(git -C "$source" rev-parse HEAD)" = 29535b9c8c98b3e43004b2514c637265a1e30be8
          test -z "$(git -C "$source" status --porcelain --untracked-files=no)"
          w=/home/opc/layersentry-foundation-qual-20260929
          exec > >(tee "$w/evidence/substrate-create.log") 2>&1
          date -Is
          sudo -n python3 "$source/tools/lab/tester_foundation_substrate.py"
          sudo -n virsh list --all
          sudo -n virsh net-list --all
          echo 'THREE_NESTED_MEMBERS_CREATED_NOT_CLUSTER_READY'
