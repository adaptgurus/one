name: Tester Foundation validation
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  foundation-validation:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Verify tester identity and exact private source digests
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          cd /home/opc/layersentry-foundation-qual-20260929
          printf '%s\n' \
            'f9d2633643edd726ef641fb79f3841485ea443efa9326c23c15c11557d101d8b  deploy/layersentry_deployer/raft_acceptance.py' \
            '843beb4b1ad1f89bed54f715d9d1dc5cb7b54cfa04c02efe38c7187ef10a8643  tests/test_raft_acceptance.py' | sha256sum -c -
          echo 'IMPLEMENTATION_COMMIT=eca4acbbb946aac0a7ab6c693d6d0edae1ed3f4c'
          echo 'SCOPE=ISOLATED_FOUNDATION_RAFT_VALIDATOR_ONLY'
      - name: Run focused Foundation acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          cd /home/opc/layersentry-foundation-qual-20260929
          python3 -m py_compile deploy/layersentry_deployer/raft_acceptance.py tests/test_raft_acceptance.py
          python3 -m unittest discover -s tests -p 'test_raft_acceptance.py' -v 2>&1 | tee evidence/runner-raft-acceptance-tests.log
          echo 'FOUNDATION_RAFT_UNIT_VERIFIED_NOT_CLUSTER_READY'
