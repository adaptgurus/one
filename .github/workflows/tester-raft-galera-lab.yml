name: Tester post-cold-recovery independent audit
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  independent-audit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Bind tester and exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          test "$(git -C /home/opc/layersentry-platform rev-parse HEAD)" = 9fa5b48105e3146b47dc65a10976b096d5099e6d
          test -z "$(git -C /home/opc/layersentry-platform status --porcelain)"
          test "$(git -C /home/opc/one-deploy rev-parse HEAD)" = faf53b034f7922746f35b033f2156a997b04fe00
      - name: Independently query raw state and perform application SQL proxy transaction
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python /home/opc/layersentry-platform/tools/lab/tester_cluster_health_audit.py
      - name: Check new maintenance objects are absent and original power identities retained
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python - <<'PY'
          import sys,json,subprocess,os,hashlib
          from pathlib import Path
          sys.path.insert(0,'/home/opc/layersentry-platform/tools/lab')
          import tester_native_qualification as n
          import tester_galera_qualification as g
          from tester_cluster_resilience import validate_domain,UUIDS
          result={'original_vms':{},'restored_databases_remaining':{},'native_cold_groups_remaining':[]}
          for name in n.NAMES:
              xml=subprocess.check_output(['sudo','-n','virsh','--connect','qemu:///system','dumpxml',name],text=True)
              validate_domain(name,xml)
              state=subprocess.check_output(['sudo','-n','virsh','--connect','qemu:///system','domstate',name],text=True).strip()
              assert state=='running'
              result['original_vms'][name]={'uuid':UUIDS[name],'state':state}
              schemas=g.sql(name,"SELECT schema_name FROM information_schema.schemata WHERE schema_name LIKE 'lsf\\_qual\\_restore\\_%';").splitlines()
              result['restored_databases_remaining'][name]=schemas
              assert not schemas
          groups=n.rows(n.native_json(n.NAMES[0],['onegroup','list','--json']).get('GROUP_POOL',{}).get('GROUP'))
          result['native_cold_groups_remaining']=[r['NAME'] for r in groups if r['NAME'].startswith('lsf-cold-')]
          assert not result['native_cold_groups_remaining']
          result['passed']=True
          out=n.WORK/'evidence'/('independent-health-'+os.environ['GITHUB_RUN_ID'])/'maintenance-cleanup.json'
          out.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2));print('ARTIFACT_SHA256',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Execute complete focused Foundation test slice
        shell: bash
        run: |
          set -euo pipefail
          cd /home/opc/layersentry-platform
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          export PYTHONPATH=$PWD/deploy
          python - <<'PY'
          import unittest,json,os,sys
          from pathlib import Path
          names=['test_raft_acceptance.py','test_provider_preflight_regressions.py','test_management_ha.py','test_tester_substrate_labels.py','test_layersentry_deploy.py','test_tester_native_qualification.py','test_management_galera_safety.py','test_tester_galera_qualification.py','test_galera_health_responder.py','test_galera_recovery.py']
          suite=unittest.TestSuite()
          for name in names:suite.addTests(unittest.TestLoader().discover('tests',pattern=name))
          out=Path('/home/opc/layersentry-foundation-qual-20260929/evidence')/('independent-health-'+os.environ['GITHUB_RUN_ID'])
          with (out/'focused-tests.log').open('w') as log:r=unittest.TextTestRunner(stream=log,verbosity=2).run(suite)
          result={'source':'9fa5b48105e3146b47dc65a10976b096d5099e6d','tests':r.testsRun,'failures':len(r.failures),'errors':len(r.errors),'successful':r.wasSuccessful(),'scope':'focused Foundation modules','modules':names}
          (out/'focused-tests.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result))
          sys.exit(0 if r.wasSuccessful() else 1)
          PY
