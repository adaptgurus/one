name: Tester Foundation native provider deployment
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  native-provider:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    steps:
      - name: Bind exact tester Foundation source and run focused gates
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          cd /home/opc/layersentry-platform
          test "$(git rev-parse HEAD)" = 209c356346a4e1a847164faf89a3b177001cb003
          test -z "$(git status --porcelain)"
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          export PYTHONPATH="$PWD/deploy:$PWD/tests"
          python -m unittest test_management_ha test_provider_preflight_regressions test_raft_acceptance test_tester_substrate_labels test_layersentry_deploy -v
      - name: Call existing Foundation after actual EPEL prerequisite correction
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          cd /home/opc/layersentry-platform
          test "$(git rev-parse HEAD)" = 209c356346a4e1a847164faf89a3b177001cb003
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python tools/lab/tester_foundation_apply.py --stage provider
