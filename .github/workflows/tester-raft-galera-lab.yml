name: Tester Foundation guest boot diagnostics
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  guest-readback:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect actual guest boot without mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          w=/home/opc/layersentry-foundation-qual-20260929
          exec > >(tee "$w/evidence/guest-boot-readback.log") 2>&1
          date -Is
          sudo -n virsh list --all
          sudo -n virsh domiflist lsf-fe1
          sudo -n virsh domifstat lsf-fe1 vnet0 || true
          sudo -n virsh qemu-agent-command lsf-fe1 '{"execute":"guest-ping"}' || true
          ip neigh show dev virbr-lsf10
          sudo -n script -q -c 'timeout 12s virsh console lsf-fe1 --force' /dev/null || true
          echo 'GUEST_BOOT_READBACK_COMPLETE'
