name: Tester Foundation proxy health diagnosis
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  proxy-diagnosis:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect dedicated health-check execution without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python - <<'PY'
          import sys,json
          from pathlib import Path
          sys.path.insert(0,'/home/opc/layersentry-platform/tools/lab')
          from tester_native_qualification import remote,WORK
          results={}
          for name in ['lsf-fe1','lsf-fe2']:
              commands={
                  'log':['sudo','-n','journalctl','-u','haproxy','-n','40','--no-pager'],
                  'program_metadata':['sudo','-n','ls','-ldZ','/usr/local/libexec/layersentry-galera-check','/etc/haproxy','/etc/haproxy/layersentry-monitor.cnf'],
                  'manual_check':['sudo','-n','-u','haproxy','env','HAPROXY_SERVER_ADDR=10.250.10.12','HAPROXY_SERVER_PORT=3307','/usr/local/libexec/layersentry-galera-check'],
                  'haproxy_avc':['sudo','-n','ausearch','-m','AVC','-c','haproxy','-ts','recent','-i'],
                  'client_avc':['sudo','-n','ausearch','-m','AVC','-c','mariadb','-ts','recent','-i']}
              results[name]={}
              for label,argv in commands.items():
                  cp=remote(name,argv,timeout=20)
                  results[name][label]={'rc':cp.returncode,'stdout':cp.stdout[-12000:],'stderr':cp.stderr[-1000:]}
          p=WORK/'evidence'/('proxy-diagnosis-'+__import__('os').environ['GITHUB_RUN_ID']+'.json')
          p.write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          PY
