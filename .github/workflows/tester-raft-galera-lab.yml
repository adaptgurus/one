name: Tester Foundation Galera TCP health qualification
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  management-ha:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Bind exact tester and tested source
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          test "$(git -C /home/opc/layersentry-platform rev-parse HEAD)" = f7865b37ba869594fddbded5d9e712f2799c4575
          test -z "$(git -C /home/opc/layersentry-platform status --porcelain)"
          test "$(git -C /home/opc/one-deploy rev-parse HEAD)" = bbe15fb307819a59b4a959dd775b5636dc09f1ca
      - name: Execute complete focused Foundation test slice
        shell: bash
        run: |
          set -euo pipefail
          cd /home/opc/layersentry-platform
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          export PYTHONPATH=$PWD/deploy
          python - <<'PY'
          import unittest,sys
          names=['test_raft_acceptance.py','test_provider_preflight_regressions.py','test_management_ha.py','test_tester_substrate_labels.py','test_layersentry_deploy.py','test_tester_native_qualification.py','test_management_galera_safety.py','test_tester_galera_qualification.py','test_galera_health_responder.py']
          suite=unittest.TestSuite()
          for name in names: suite.addTests(unittest.TestLoader().discover('tests',pattern=name))
          r=unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if r.wasSuccessful() else 1)
          PY
      - name: Apply through existing Foundation management entrypoint
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          export PYTHONPATH=/home/opc/layersentry-platform/deploy
          python /home/opc/layersentry-platform/tools/lab/tester_foundation_apply.py --stage management
          echo MANAGEMENT_APPLY_EXITED_NOT_INDEPENDENT_READINESS
      - name: Independently exercise SQL replication quorum rejoin and VIP failover
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python /home/opc/layersentry-platform/tools/lab/tester_galera_qualification.py --exercise
