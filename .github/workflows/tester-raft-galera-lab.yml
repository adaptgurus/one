name: Tester graceful cold cluster recovery
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  cold-recovery:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Bind exact authorized tester and source objects
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          test "$(git -C /home/opc/layersentry-platform rev-parse HEAD)" = 9fa5b48105e3146b47dc65a10976b096d5099e6d
          test -z "$(git -C /home/opc/layersentry-platform status --porcelain)"
          test "$(git -C /home/opc/one-deploy rev-parse HEAD)" = faf53b034f7922746f35b033f2156a997b04fe00
      - name: Test rejection of unsafe cold recovery plans before maintenance
        shell: bash
        run: |
          set -euo pipefail
          cd /home/opc/layersentry-platform
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python -m unittest discover -s tests -p test_galera_recovery.py -v
          python -m py_compile tools/lab/tester_cold_recovery.py
          python - <<'PY'
          import sys
          from unittest.mock import patch
          sys.path.insert(0,'tools/lab')
          import tester_cold_recovery as q
          for argv,hostname in [(['q'],'tester'),(['q','--execute'],'foreign-host')]:
              with patch.object(sys,'argv',argv), patch.object(q.socket,'gethostname',return_value=hostname):
                  try: q.main()
                  except RuntimeError as exc:
                      assert 'authorization required' in str(exc)
                  else: raise AssertionError('execution guard did not reject')
          print('NO_EXECUTE_AND_FOREIGN_HOST_GUARDS_PASS')
          PY
      - name: Exercise logical restore and explicit graceful cold recovery
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python - <<'PY'
          import sys,threading
          sys.path.insert(0,'/home/opc/layersentry-platform/tools/lab')
          import tester_cold_recovery as q
          # Serialize evidence emission for the three concurrent native starts.
          # This wrapper is part of the exact versioned runner test recipe.
          mutex=threading.RLock()
          original=q.Evidence.event
          def event(self,*args,**kwargs):
              with mutex:
                  return original(self,*args,**kwargs)
          q.Evidence.event=event
          sys.argv=['tester_cold_recovery.py','--execute']
          q.main()
          PY
      - name: Independently verify event chain and actual result bytes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          d=Path('/home/opc/layersentry-foundation-qual-20260929/evidence')/('cold-recovery-'+os.environ['GITHUB_RUN_ID'])
          previous='0'*64;count=0
          for line in (d/'events.jsonl').read_text().splitlines():
              row=json.loads(line);digest=row.pop('sha256')
              assert row['previous_sha256']==previous
              assert row['sequence']==count+1
              assert hashlib.sha256(json.dumps(row,sort_keys=True,separators=(',',':')).encode()).hexdigest()==digest
              if row['action']=='artifact':
                  assert hashlib.sha256((d/row['path']).read_bytes()).hexdigest()==row['artifact_sha256']
              previous=digest;count+=1
          result=json.loads((d/'result.json').read_text())
          assert result['event_chain_head']==previous
          audit={'event_count':count,'chain_head':previous,'event_chain_verified':True,'result_sha256':hashlib.sha256((d/'result.json').read_bytes()).hexdigest(),'passed':result['passed'],'gates':result['gates'],'failures':result['failures']}
          (d/'independent-chain-audit.json').write_text(json.dumps(audit,indent=2)+'\n')
          print(json.dumps(audit,indent=2))
          assert audit['passed']
          PY
