name: Tester Foundation disk reconciliation evidence
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  substrate-readback:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Read owned failed-member disk and libvirt state
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          w=/home/opc/layersentry-foundation-qual-20260929
          exec > >(tee "$w/evidence/substrate-disk-readback.log") 2>&1
          date -Is
          sudo -n virsh list --all
          sudo -n cat /var/lib/libvirt/images/layersentry-tester-20260929/owner.json
          sudo -n qemu-img info --output=json /var/lib/libvirt/images/layersentry-tester-20260929/lsf-fe1.qcow2
          sudo -n stat -c '%a %U %G %n' /var/lib/libvirt/images/layersentry-tester-20260929 /var/lib/libvirt/images/layersentry-tester-20260929/lsf-fe1.qcow2
          echo 'READ_ONLY_DISK_RECONCILIATION_COMPLETE'
