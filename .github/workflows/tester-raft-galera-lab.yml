name: Tester Foundation proxy execution policy
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  inspect-policy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Read live proxy diagnostics and install read-only policy query utility
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python - <<'PY'
          import sys,json,os
          from pathlib import Path
          sys.path.insert(0,'/home/opc/layersentry-platform/tools/lab')
          from tester_native_qualification import remote,WORK
          commands={
              'package':['sudo','-n','dnf','-y','install','setools-console'],
              'log':['sudo','-n','journalctl','-u','haproxy','-n','8','--no-pager'],
              'label':['sudo','-n','ls','-lZ','/usr/local/libexec/layersentry-galera-check','/usr/bin/bash','/usr/bin/env','/usr/bin/mariadb'],
              'execution_policy':['sudo','-n','sesearch','-A','-s','haproxy_t','-c','file','-p','execute'],
              'transition_policy':['sudo','-n','sesearch','-T','-s','haproxy_t'],
              'audit_state':['systemctl','is-active','auditd'],
              'kernel_denials':['sudo','-n','journalctl','-k','-n','80','--no-pager'],
              'unit':['systemctl','cat','haproxy']}
          results={}
          for label,argv in commands.items():
              cp=remote('lsf-fe1',argv,timeout=100 if label=='package' else 20)
              results[label]={'rc':cp.returncode,'stdout':cp.stdout[-18000:],'stderr':cp.stderr[-1500:]}
          p=WORK/'evidence'/('proxy-policy-'+os.environ['GITHUB_RUN_ID']+'.json'); p.write_text(json.dumps(results,indent=2)+'\n')
          print(json.dumps(results,indent=2))
          PY
