name: Tester Foundation six-node lab substrate
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  foundation-substrate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Reconcile provenance-verified substrate and boot members
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          source=/home/opc/layersentry-platform
          test "$(git -C "$source" rev-parse HEAD)" = 100c29e0a91885af0ec9824e8c14ffe37a81cf2e
          test -z "$(git -C "$source" status --porcelain --untracked-files=no)"
          w=/home/opc/layersentry-foundation-qual-20260929
          exec > >(tee "$w/evidence/substrate-verified-resume.log") 2>&1
          date -Is
          sudo -n python3 "$source/tools/lab/tester_foundation_substrate.py"
          sudo -n virsh list --all
          sudo -n virsh net-list --all
          echo 'SIX_NESTED_GUESTS_CREATED_NOT_CLUSTER_READY'
