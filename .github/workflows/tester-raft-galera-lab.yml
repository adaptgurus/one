name: Tester Foundation SELinux disk diagnosis
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  disk-labels:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Read exact owned disk labels and AVC records
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          test "$(sudo -n virsh domuuid lsf-fe1)" = 59b15120-8865-54a6-abc6-66ccb404f799
          {
            date -Is
            getenforce
            sudo -n ls -lZ /var/lib/libvirt/images/layersentry-tester-20260929/
            for vm in lsf-fe1 lsf-fe2 lsf-fe3 lsf-kvm1 lsf-kvm2 lsf-kvm3; do
              echo "VM=$vm"
              sudo -n virsh domstate "$vm" --reason
              sudo -n virsh dumpxml "$vm" | sed -n '/<seclabel/,/<\/seclabel>/p'
            done
            sudo -n ausearch -m AVC,USER_AVC -ts today -i | grep -E 'lsf-fe|lsf-kvm|svirt|virt_image' | tail -30 || true
          } 2>&1 | tee /home/opc/layersentry-foundation-qual-20260929/evidence/selinux-disk-readback.log
