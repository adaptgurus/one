name: Tester Foundation native Raft qualification
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  native-qualification:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Bind exact tester and source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          test "$(git -C /home/opc/layersentry-platform rev-parse HEAD)" = 88533490ba0608eab2d58f20bca5f865820d49bd
          test "$(git -C /home/opc/one-deploy rev-parse HEAD)" = bbe15fb307819a59b4a959dd775b5636dc09f1ca
      - name: Verify exact native host identity regression tests
        shell: bash
        run: |
          set -euo pipefail
          source /home/opc/layersentry-foundation-qual-20260929/venv/bin/activate
          cd /home/opc/layersentry-platform
          PYTHONPATH=deploy python -m unittest discover -s tests -p test_tester_native_qualification.py -v
      - name: Verify native cluster then test one leader outage with recovery
        shell: bash
        run: |
          set -euo pipefail
          source /home/opc/layersentry-foundation-qual-20260929/venv/bin/activate
          cd /home/opc/layersentry-platform
          python tools/lab/tester_native_qualification.py --failover
