name: Tester Foundation native privilege correction
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  native-provider:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Bind corrected Foundation and OneDeploy pins
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          test "$(git -C /home/opc/layersentry-platform rev-parse HEAD)" = 2289f9313778624f85a93ecafa9e0050c540ecf1
          test "$(git -C /home/opc/one-deploy rev-parse HEAD)" = d32205fd31743d54837973b42ce3e63f96f1007e
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          cd /home/opc/layersentry-platform
          export PYTHONPATH="$PWD/deploy:$PWD/tests"
          python -m unittest test_management_ha test_provider_preflight_regressions test_raft_acceptance test_tester_substrate_labels test_layersentry_deploy -v
      - name: Call canonical Foundation with native privilege keywords preserved
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          cd /home/opc/layersentry-platform
          python tools/lab/tester_foundation_apply.py --stage provider
