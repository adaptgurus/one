name: Tester Foundation corrected HA synchronization
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  native-provider:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Bind exact corrected OneDeploy and verified Foundation
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          test "$(git -C /home/opc/layersentry-platform rev-parse HEAD)" = 209c356346a4e1a847164faf89a3b177001cb003
          test "$(git -C /home/opc/one-deploy rev-parse HEAD)" = d32205fd31743d54837973b42ce3e63f96f1007e
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          cd /home/opc/one-deploy
          python -m unittest discover -s tests -p 'test_layersentry_controller_ha_sync.py' -v
          ANSIBLE_HOST_KEY_CHECKING=True ansible-playbook -i /home/opc/layersentry-foundation-qual-20260929/one-deploy-inventory.yml --syntax-check opennebula.deploy.main
      - name: Execute canonical Foundation after HA transport correction
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          cd /home/opc/layersentry-platform
          python tools/lab/tester_foundation_apply.py --stage provider
