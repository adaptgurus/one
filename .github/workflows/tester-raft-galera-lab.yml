name: Tester quorum evidence reconciliation and final audit
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-raft-galera-lab.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  reconcile-and-audit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Bind exact tester and avoid repeating the outage
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          test "$(git -C /home/opc/layersentry-platform rev-parse HEAD)" = 9fa5b48105e3146b47dc65a10976b096d5099e6d
          test -z "$(git -C /home/opc/layersentry-platform status --porcelain)"
          test "$(git -C /home/opc/one-deploy rev-parse HEAD)" = faf53b034f7922746f35b033f2156a997b04fe00
      - name: Verify original event chain and reconcile only its exact native canary
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python - <<'PY'
          import sys,json,os,re,hashlib,fcntl,subprocess,datetime,inspect
          from pathlib import Path
          sys.path.insert(0,'/home/opc/layersentry-platform/tools/lab')
          import tester_native_qualification as n
          import tester_galera_qualification as g
          from tester_cluster_resilience import Evidence,UUIDS,validate_domain
          lock=(n.WORK/'.execution.lock').open('a');fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)
          out=n.WORK/'evidence'/('quorum-reconciliation-'+os.environ['GITHUB_RUN_ID']);out.mkdir()
          prior=n.WORK/'evidence'/'raft-commit-barrier-36529114931'
          result=json.loads((prior/'result.json').read_text())
          assert result['operation_id']=='raft-commit-barrier-36529114931' and result['workflow_commit']=='12f52da411c5ecee25e10856aa9b1a873ed68757'
          previous='0'*64;count=0
          for line in (prior/'events.jsonl').read_text().splitlines():
              row=json.loads(line);digest=row.pop('sha256')
              assert row['sequence']==count+1 and row['previous_sha256']==previous
              assert hashlib.sha256(json.dumps(row,sort_keys=True,separators=(',',':')).encode()).hexdigest()==digest
              if row['action']=='artifact':assert hashlib.sha256((prior/row['path']).read_bytes()).hexdigest()==row['artifact_sha256']
              previous=digest;count+=1
          assert result['event_chain_head']==previous
          initial=json.loads((prior/'before_attempt_local_raft.json').read_text())
          samples=json.loads((prior/'without_majority_local_raft_samples.json').read_text())
          restored=json.loads((prior/'after_majority_return.json').read_text())
          assert len(samples)==3 and all(x['COMMIT']==initial['COMMIT'] and int(x['LOG_INDEX'])>int(x['COMMIT']) for x in samples)
          assert result['request_response']['rc']==124 and result['request_response']['request_count']==1
          assert all(v['eligible'] for v in restored['raft'].values())
          assert all(int(s['COMMIT'])>int(initial['COMMIT']) for v in restored['raft'].values() for s in v['servers'])
          signature=inspect.signature(Evidence.gate)
          signature.bind(None,'reconciled','PASS',object_name='test')
          try:signature.bind(None,'reconciled','PASS',name='test')
          except TypeError:reporting_collision_reproduced=True
          else:raise AssertionError('original reporting failure not reproduced')
          report={'observed_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'9fa5b48105e3146b47dc65a10976b096d5099e6d','original_run':36529114931,'original_run_status':'FAIL_PRESERVED_REPORTING_ERROR','original_event_count':count,'original_event_chain_verified':True,'original_event_chain_head':previous,'original_events_sha256':hashlib.sha256((prior/'events.jsonl').read_bytes()).hexdigest(),'commit_before':initial['COMMIT'],'without_majority_samples':samples,'reporting_collision_reproduced':reporting_collision_reproduced,'replacement_event_field':'object_name','outage_repeated':False,'blind_mutation_retries':0,'production_certified':False,'gates':{}}
          def gate(key,passed,**detail):
              report['gates'][key]={'status':'PASS' if passed else 'FAIL',**detail}
              if not passed:raise RuntimeError(key)
          gate('direct_commit_barrier_verified_from_original_snapshots',True)
          vms={}
          for name in n.NAMES:
              xml=subprocess.check_output(['sudo','-n','virsh','-c','qemu:///system','dumpxml',name],text=True);validate_domain(name,xml)
              state=subprocess.check_output(['sudo','-n','virsh','-c','qemu:///system','domstate',UUIDS[name]],text=True).strip()
              assert state=='running';vms[name]={'uuid':UUIDS[name],'state':state}
          (out/'VM-readback.json').write_text(json.dumps(vms,indent=2)+'\n')
          n.converge(attempts=30);g.healthy(attempts=30)
          name=result['request_response']['object_name']
          assert re.fullmatch(r'lsf-quorum-barrier-[0-9a-f]{16}',name)
          all_groups=n.rows(n.native_json(n.NAMES[0],['onegroup','list','--json']).get('GROUP_POOL',{}).get('GROUP'))
          found=[r for r in all_groups if r['NAME']==name]
          assert len(found)==1,'exact timed-out operation must resolve before cleanup'
          item=found[0];identity={'ID':item['ID'],'NAME':item['NAME']}
          for member in n.NAMES:
              observed=n.native_json(member,['onegroup','show',item['ID'],'--json'])['GROUP']
              assert observed['NAME']==name and observed['ID']==item['ID']
          gate('one_timed_out_request_reconciled_on_all_members',True,object_identity=identity,acknowledged_before_quorum=False)
          n.require(n.remote(n.NAMES[0],['onegroup','delete',item['ID']],native=True),'delete only reconciled test group')
          for member in n.NAMES:
              groups=n.rows(n.native_json(member,['onegroup','list','--json']).get('GROUP_POOL',{}).get('GROUP'))
              assert not any(r['NAME'].startswith('lsf-quorum-') for r in groups)
          gate('exact_canary_cleanup_verified_on_every_member',True,object_identity=identity)
          for unit in ['lsf-quorum-restore-36528659790.timer','lsf-raft-barrier-restore-36529114931.timer']:
              cp=subprocess.run(['sudo','-n','systemctl','is-active',unit],capture_output=True,text=True)
              assert cp.stdout.strip() in {'inactive','unknown'}
          gate('no_VM_left_paused_and_no_active_failsafe_timer',True)
          report['current_raft']=n.converge(attempts=30);report['current_galera']=g.healthy(attempts=30)
          report['sql_proxy']=g.proxy();report['https']=g.https_check();report['all_gates_passed']=True
          (out/'reconciliation.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Fresh independent cluster and application-account audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python /home/opc/layersentry-platform/tools/lab/tester_cluster_health_audit.py
      - name: Execute focused Foundation regression suite after recovery
        shell: bash
        run: |
          set -euo pipefail
          cd /home/opc/layersentry-platform
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          export PYTHONPATH=$PWD/deploy
          python - <<'PY'
          import unittest,json,os,sys
          from pathlib import Path
          names=['test_raft_acceptance.py','test_provider_preflight_regressions.py','test_management_ha.py','test_tester_substrate_labels.py','test_layersentry_deploy.py','test_tester_native_qualification.py','test_management_galera_safety.py','test_tester_galera_qualification.py','test_galera_health_responder.py','test_galera_recovery.py']
          suite=unittest.TestSuite()
          for name in names:suite.addTests(unittest.TestLoader().discover('tests',pattern=name))
          out=Path('/home/opc/layersentry-foundation-qual-20260929/evidence')/('independent-health-'+os.environ['GITHUB_RUN_ID'])
          with (out/'focused-tests.log').open('w') as log:r=unittest.TextTestRunner(stream=log,verbosity=2).run(suite)
          data={'source':'9fa5b48105e3146b47dc65a10976b096d5099e6d','scope':'focused Foundation suite, not entire repository','tests':r.testsRun,'failures':len(r.failures),'errors':len(r.errors),'successful':r.wasSuccessful(),'modules':names}
          (out/'focused-tests.json').write_text(json.dumps(data,indent=2)+'\n');print(json.dumps(data))
          sys.exit(0 if r.wasSuccessful() else 1)
          PY
      - name: Validate exact newly generated evidence before upload
        id: publication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          python3 - <<'PY'
          import os,hashlib
          from pathlib import Path
          root=Path('/home/opc/layersentry-foundation-qual-20260929/evidence')
          for prefix,allowed in [('quorum-reconciliation-',{'VM-readback.json','reconciliation.json'}),('independent-health-',{'audit.json','SHA256SUMS','focused-tests.log','focused-tests.json'})]:
              folder=root/(prefix+os.environ['GITHUB_RUN_ID']);assert folder.is_dir()
              assert {p.name for p in folder.iterdir()}.issubset(allowed)
              for p in folder.iterdir():
                  assert p.is_file() and not p.is_symlink()
                  data=p.read_bytes()
                  for marker in [b'BEGIN OPENSSH PRIVATE KEY',b'BEGIN RSA PRIVATE KEY',b'Authorization: Bearer',b'github_pat_',b'ghp_']:
                      assert marker not in data,'publication refused'
              (folder/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(folder.iterdir()) if p.name!='SHA256SUMS'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('accepted=true\n')
          PY
      - name: Upload full reconciliation and independent audit records
        if: always() && steps.publication.outputs.accepted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tester-quorum-final-${{ github.run_id }}
          path: |
            /home/opc/layersentry-foundation-qual-20260929/evidence/quorum-reconciliation-${{ github.run_id }}/
            /home/opc/layersentry-foundation-qual-20260929/evidence/independent-health-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
