name: Manoj Replication v2 Workspace Bind

on:
  push:
    branches: [layersentry/dr-site-pairing-workflow-20260924]

permissions:
  contents: read

concurrency:
  group: manoj-replication-v2-workspace-bind
  cancel-in-progress: true

jobs:
  bind:
    runs-on: Manoj-Test-Inst
    timeout-minutes: 15
    steps:
      - name: Bind runner and locate LayerSentry platform checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          Write-Host "RUNNER_BIND=PASS name=$env:RUNNER_NAME computer=$env:COMPUTERNAME"

          $roots=@(
            'C:\LayerSentryLab\qualification',
            'C:\LayerSentryLab',
            (Join-Path $env:USERPROFILE 'actions-runner\_work'),
            (Join-Path $env:USERPROFILE 'actions-runner-one\_work')
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          $repos=@()
          foreach($root in $roots){
            Get-ChildItem -LiteralPath $root -Directory -Recurse -Depth 4 -ErrorAction SilentlyContinue |
              ForEach-Object {
                $git=Join-Path $_.FullName '.git'
                if(Test-Path $git){
                  try {
                    $remote=(git -C $_.FullName remote get-url origin 2>$null)
                    if($LASTEXITCODE -eq 0 -and $remote -match 'adaptgurus/layersentry-platform'){
                      $head=(git -C $_.FullName rev-parse HEAD 2>$null)
                      $branch=(git -C $_.FullName branch --show-current 2>$null)
                      $dirty=@(git -C $_.FullName status --porcelain 2>$null)
                      $repos += [pscustomobject]@{
                        Path=$_.FullName
                        Remote=$remote
                        Head=$head
                        Branch=$branch
                        Dirty=$dirty.Count
                      }
                    }
                  } catch {}
                }
              }
          }
          if($repos.Count -lt 1){
            throw 'No local adaptgurus/layersentry-platform checkout found on Manoj runner.'
          }
          $repos | Sort-Object Dirty,Path | Format-Table -AutoSize
          $best=$repos | Sort-Object Dirty,Path | Select-Object -First 1
          Write-Host "LAYERENTRY_PLATFORM_PATH=$($best.Path)"
          Write-Host "LAYERENTRY_PLATFORM_HEAD=$($best.Head)"
          Write-Host "LAYERENTRY_PLATFORM_BRANCH=$($best.Branch)"
          Write-Host "LAYERENTRY_PLATFORM_DIRTY=$($best.Dirty)"
          Write-Host 'MANOJ_PLATFORM_WORKSPACE_BIND=PASS'

      - name: Read-only two-site candidate inventory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $rows=@()
          Get-VM | Where-Object State -eq 'Running' | ForEach-Object {
            $vm=$_
            Get-VMNetworkAdapter -VMName $vm.Name -ErrorAction SilentlyContinue | ForEach-Object {
              $adapter=$_
              $adapter.IPAddresses | Where-Object {
                $_ -match '^10\.' -or $_ -match '^192\.168\.' -or $_ -match '^172\.(1[6-9]|2[0-9]|3[01])\.'
              } | ForEach-Object {
                $rows += [pscustomobject]@{VM=$vm.Name;IP=$_;Switch=$adapter.SwitchName}
              }
            }
          }
          $rows | Sort-Object VM,IP | Format-Table -AutoSize

          $verified=@()
          foreach($row in $rows){
            if(-not (Test-NetConnection -ComputerName $row.IP -Port 22 -InformationLevel Quiet -WarningAction SilentlyContinue)){continue}
            $target="opc@$($row.IP)"
            $out=& ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new $target "sudo -n bash -lc 'systemctl is-active opennebula >/dev/null && command -v onehost >/dev/null && onehost list >/dev/null && printf SITE_OK'" 2>$null
            if($LASTEXITCODE -eq 0 -and ($out -join '') -match 'SITE_OK'){
              $verified += $row
            }
          }
          $verified=$verified | Sort-Object VM,IP -Unique
          Write-Host "VERIFIED_OPENNEBULA_SITE_CANDIDATES=$($verified.Count)"
          $verified | Format-Table -AutoSize
          if($verified.Count -ne 2){
            throw "Expected exactly 2 verified OpenNebula site candidates; found $($verified.Count)."
          }
          Write-Host 'MANOJ_TWO_SITE_PREFLIGHT=PASS'
