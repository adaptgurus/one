name: Manoj OneSwap Large PowerShell Transport E2E

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-large-stdin-e2e.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-large-stdin-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Bind exact Manoj and preserve source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "Source not Running: $($vm.State)"}
          if(@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has checkpoints'}
          Write-Host 'SOURCE_BEFORE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-large-stdin-e2e.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise PR18 large stdin transport end to end
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          cat >/tmp/ls-large-stdin-e2e.rb <<'RUBY'
          require 'yaml'
          require '/usr/lib/one/ruby/cli/one_helper/hyperv_helper'
          cfg=YAML.load_file('/etc/layersentry/oneswap/manoj-qual.yaml') || {}
          normalized={}
          cfg.each{|k,v| normalized[k.to_s.sub(/^:/,'').to_sym]=v}
          normalized[:hyperv_connection]='manoj-qual'
          profile=OneSwapHyperV::ConnectionProfile.from_options(normalized)
          transport=OneSwapHyperV::SSHTransport.new(profile)
          payload="$ErrorActionPreference='Stop'\n" + ("# layersentry-large-stdin-padding-0123456789abcdef\n" * 400) + "Write-Output 'LS_LARGE_STDIN_TRANSPORT_PASS'\n"
          encoded=OneSwapHyperV::Util.powershell_encoded(payload)
          puts "ENCODED_BYTES=#{encoded.bytesize}"
          raise "payload did not cross stdin threshold" unless encoded.bytesize > OneSwapHyperV::SSHTransport::POWERSHELL_ENCODED_COMMAND_MAX_BYTES
          out=transport.powershell(payload, timeout: 60)
          puts out
          raise "marker missing" unless out.include?('LS_LARGE_STDIN_TRANSPORT_PASS')
          puts 'ONESWAP_LARGE_STDIN_E2E=PASS'
          RUBY
          timeout --signal=TERM --kill-after=5s 90s ruby /tmp/ls-large-stdin-e2e.rb
          rc=$?
          rm -f /tmp/ls-large-stdin-e2e.rb
          exit $rc
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw "large stdin transport E2E failed rc=$LASTEXITCODE"}

      - name: Verify source invariant
        if: always()
        shell: powershell
        run: |
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $snaps=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue)
          Write-Host "SOURCE_AFTER_STATE=$($vm.State)"
          Write-Host "SOURCE_AFTER_CHECKPOINTS=$($snaps.Count)"
          if($vm.State -ne 'Running'){throw 'Transport test changed source state'}
          if($snaps.Count -ne 0){throw 'Transport test found/created checkpoint'}
          Write-Host 'SOURCE_AFTER=PASS'
