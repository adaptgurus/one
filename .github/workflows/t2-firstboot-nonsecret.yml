name: T2 Firstboot Nonsecret Fields

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-firstboot-nonsecret.yml

permissions:
  contents: read

jobs:
  enter:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Enter non-secret fields with explicit Enter events
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $ns='root\virtualization\v2'
          $vm=Get-CimInstance -Namespace $ns -ClassName Msvm_ComputerSystem | Where-Object ElementName -eq 'ls-appliance-4c4ac81-qual'
          $kbd=Get-CimAssociatedInstance -InputObject $vm -Namespace $ns -Association Msvm_SystemDevice -ResultClassName Msvm_Keyboard | Select-Object -First 1
          if(-not $kbd){throw 'VM keyboard missing'}
          function K([uint32]$k){$r=Invoke-CimMethod -InputObject $kbd -MethodName TypeKey -Arguments @{KeyCode=$k};if([uint32]$r.ReturnValue -ne 0){throw "TypeKey failed $k"};Start-Sleep -Milliseconds 35}
          function SK([uint32]$k){Invoke-CimMethod -InputObject $kbd -MethodName PressKey -Arguments @{KeyCode=[uint32]0x10}|Out-Null;K $k;Invoke-CimMethod -InputObject $kbd -MethodName ReleaseKey -Arguments @{KeyCode=[uint32]0x10}|Out-Null}
          function ENTER(){Invoke-CimMethod -InputObject $kbd -MethodName PressKey -Arguments @{KeyCode=[uint32]0x0D}|Out-Null;Start-Sleep -Milliseconds 120;Invoke-CimMethod -InputObject $kbd -MethodName ReleaseKey -Arguments @{KeyCode=[uint32]0x0D}|Out-Null;Start-Sleep -Milliseconds 900}
          function T([string]$s){foreach($c in $s.ToCharArray()){
            if($c -ge 'a'-and$c -le 'z'){K ([uint32][char]([string]$c).ToUpperInvariant())}
            elseif($c -ge 'A'-and$c -le 'Z'){SK ([uint32][char]$c)}
            elseif($c -ge '0'-and$c -le '9'){K ([uint32][char]$c)}
            elseif($c -eq '.'){K 0xBE}elseif($c -eq '-'){K 0xBD}elseif($c -eq '/'){K 0xBF}elseif($c -eq ':'){SK 0xBA}elseif($c -eq '_'){SK 0xBD}
            else{throw ('unsupported character '+[int][char]$c)}};ENTER}
          T 'lsappliancequal'
          T 'qualification'
          T '10.250.10.40:9443'
          T '10.250.10.41/24'
          T '10.250.10.1'
          T '1.1.1.1'
          Write-Host 'FIRSTBOOT_NONSECRET_FIELDS=PASS'

      - name: Capture enrollment-code prompt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 2
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\enrollment-code-prompt-4c4ac81.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not(Test-Path $out)){throw 'Framebuffer missing'}

      - name: Upload enrollment-code prompt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-enrollment-code-prompt
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\enrollment-code-prompt-4c4ac81.png
          if-no-files-found: error
          retention-days: 7