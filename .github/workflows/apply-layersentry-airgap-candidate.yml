name: Apply LayerSentry air-gap candidate

on:
  push:
    branches:
      - layersentry/p1-rke2-day2-airgap-candidate-20260914

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply reviewed candidate payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/layersentry-airgap-candidate.b64 | tar -xzf - -C "$GITHUB_WORKSPACE"
          git rm --ignore-unmatch \
            .github/workflows/apply-layersentry-airgap-candidate.yml \
            .github/layersentry-airgap-candidate.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/layersentry-day2-ci.yml \
            src/oneks/app/models/groups/nodegroup_day2.rb \
            src/oneks/lib/helpers/worker_disk_manager.rb \
            src/oneks/specs/controlplanes/layersentry-poc/spec.erb \
            src/oneks/specs/nodegroups/layersentry-poc/spec.erb \
            src/oneks/test/disk_reconciliation_test.rb \
            src/oneks/test/layersentry_profile_test.rb \
            src/oneks/test/worker_disk_manager_test.rb
          git diff --cached --check
          git commit -m 'Fix air-gapped RKE2 bootstrap and guest disk growth'
          git push origin HEAD:layersentry/p1-rke2-day2-airgap-candidate-20260914
