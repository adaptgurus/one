name: Apply LayerSentry air-gap candidate

on:
  push:
    branches:
      - layersentry/p1-rke2-day2-airgap-candidate-20260914

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decode reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/layersentry-airgap-candidate.b64 | tar -xzf - -C "$GITHUB_WORKSPACE"
          git checkout -- .github/workflows/layersentry-day2-ci.yml
          git diff --check
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install scoped test dependencies
        run: |
          gem install rubocop -v 1.91.0 --no-document
          gem install activesupport minitest --no-document
      - name: Normalize scoped style
        shell: bash
        run: |
          set -euo pipefail
          ln -sf "$GITHUB_WORKSPACE/share/linters/.rubocop.yml" "$HOME/.rubocop.yml"
          rubocop -A \
            src/oneks/app/models/groups/nodegroup_day2.rb \
            src/oneks/lib/helpers/worker_disk_manager.rb \
            src/oneks/test/disk_reconciliation_test.rb \
            src/oneks/test/worker_disk_manager_test.rb || true
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/oneks/test/disk_reconciliation_test.rb')
          text = path.read_text()
          text = text.replace(
              'module OpenNebula\n',
              '# Minimal OpenNebula error stub for isolated reconciliation tests.\nmodule OpenNebula\n',
              1,
          )
          text = text.replace(
              '    module WorkerDiskManager\n',
              '    # Controllable worker disk stub used by reconciliation tests.\n    module WorkerDiskManager\n',
              1,
          )
          text = text.replace(
              '    class NodeGroupHarness < OneKS::NodeGroup\n',
              '    # Minimal NodeGroup harness that persists body updates in memory.\n    class NodeGroupHarness < OneKS::NodeGroup\n',
              1,
          )
          text = text.replace(
              '        def initialize(body)\n',
              '        # The production superclass requires live OpenNebula state; this isolated\n'
              '        # harness intentionally supplies only the collaborators under test.\n'
              '        # rubocop:disable Lint/MissingSuper\n'
              '        def initialize(body)\n',
              1,
          )
          text = text.replace(
              '            @client = Object.new\n        end\n\n        def parent_cluster',
              '            @client = Object.new\n        end\n'
              '        # rubocop:enable Lint/MissingSuper\n\n        def parent_cluster',
              1,
          )
          path.write_text(text)

          path = Path('src/oneks/test/worker_disk_manager_test.rb')
          text = path.read_text()
          text = text.replace(
              'module OpenNebula\n',
              '# Minimal OpenNebula namespace used by worker disk manager unit tests.\nmodule OpenNebula\n',
              1,
          )
          text = text.replace(
              '    class Error\n',
              '    # Minimal OpenNebula error type used by the helper contract.\n    class Error\n',
              1,
          )
          text = text.replace(
              '    module VirtualMachine\n',
              '    # Captures qemu-guest-agent commands issued by the disk manager.\n    module VirtualMachine\n',
              1,
          )
          text = text.replace(
              'class WorkerDiskManagerTest < Minitest::Test\n',
              '# Unit tests for the restricted qemu-guest-agent disk helper contract.\nclass WorkerDiskManagerTest < Minitest::Test\n',
              1,
          )
          path.write_text(text)
          PY
          git diff --check
      - name: Ruby syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -c src/oneks/app/models/groups/nodegroup_day2.rb
          ruby -c src/oneks/lib/helpers/worker_disk_manager.rb
          ruby -c src/oneks/test/disk_reconciliation_test.rb
          ruby -c src/oneks/test/layersentry_profile_test.rb
          ruby -c src/oneks/test/worker_disk_manager_test.rb
      - name: RuboCop scoped files
        shell: bash
        run: |
          set -euo pipefail
          ln -sf "$GITHUB_WORKSPACE/share/linters/.rubocop.yml" "$HOME/.rubocop.yml"
          rubocop \
            src/oneks/app/models/groups/nodegroup_day2.rb \
            src/oneks/lib/helpers/worker_disk_manager.rb \
            src/oneks/test/disk_reconciliation_test.rb \
            src/oneks/test/worker_disk_manager_test.rb
      - name: OneKS regressions
        shell: bash
        run: |
          set -euo pipefail
          ruby src/oneks/test/day2_lifecycle_test.rb
          ruby src/oneks/test/disk_reconciliation_test.rb
          ruby src/oneks/test/bootstrap_recovery_test.rb
          ruby src/oneks/test/layersentry_profile_test.rb
          ruby src/oneks/test/worker_disk_manager_test.rb
      - name: Commit source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/oneks/app/models/groups/nodegroup_day2.rb \
            src/oneks/lib/helpers/worker_disk_manager.rb \
            src/oneks/specs/controlplanes/layersentry-poc/spec.erb \
            src/oneks/specs/nodegroups/layersentry-poc/spec.erb \
            src/oneks/test/disk_reconciliation_test.rb \
            src/oneks/test/layersentry_profile_test.rb \
            src/oneks/test/worker_disk_manager_test.rb
          git diff --cached --check
          git commit -m 'Fix air-gapped RKE2 bootstrap and guest disk growth'
          git push origin HEAD:layersentry/p1-rke2-day2-airgap-candidate-20260914
