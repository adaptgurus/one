name: Manoj OneSwap MORPHING Recovery Runtime Deploy

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-morphing-recovery-runtime-deploy.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-morphing-recovery-runtime-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Bind Manoj and require proven MORPHING source state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          if($vm.State -ne 'Off'){throw "Source must remain Off: $($vm.State)"}
          if($n -ne 0){throw 'Unexpected checkpoint'}
          if((Get-VM -Name 'ls-appliance-qual' -ErrorAction Stop).State -ne 'Running'){throw 'OneSwap appliance not Running'}
          Write-Host 'MORPHING_DEPLOY_SOURCE_GATE=PASS'

      - name: Prepare appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-morphing-runtime.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove exact prelaunch recovery gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          operation="manoj-hv-ls-migration-source-test-20260924"
          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"
            safe=op.gsub(/[^A-Za-z0-9_.-]/,"_"); suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$operation")
          python3 - "$state" <<'PY'
          import json,os,sys
          s=json.load(open(sys.argv[1])); root=os.path.dirname(sys.argv[1])
          print("DEPLOY_STATE_PHASE="+str(s.get("phase")))
          print("DEPLOY_DELTA_INDICES="+str(s.get("delta_applied_indices")))
          if s.get("phase")!="MORPHING": raise SystemExit("not MORPHING")
          if sorted(int(x) for x in (s.get("delta_applied_indices") or [])) != list(range(len(s.get("disks") or []))):
              raise SystemExit("not all deltas marked applied")
          if s.get("delta_applied_at") or s.get("import_started_at") or s.get("template_id") or s.get("imported_at"):
              raise SystemExit("later phase evidence exists")
          if s.get("morph_prelaunch_recovery_started_at"):
              raise SystemExit("recovery already attempted")
          xml=os.path.join(root,"final-libvirt.xml")
          print("FINAL_LIBVIRT_XML="+xml)
          print("FINAL_LIBVIRT_XML_EXISTS="+str(os.path.isfile(xml)))
          print("FINAL_LIBVIRT_XML_SIZE="+str(os.path.getsize(xml) if os.path.isfile(xml) else -1))
          if not os.path.isfile(xml) or os.path.getsize(xml)!=0:
              raise SystemExit("zero-length prelaunch XML evidence missing")
          print("MORPHING_PRELAUNCH_DEPLOY_GATE=PASS")
          PY
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'prelaunch recovery gate failed'}

      - name: Download coherent OneSwap recovery runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $head='7828bd3e898ce4b52026c59ff42e90672b190341'
          $files=@(
            'oneswap-hyperv',
            'hyperv_helper.rb',
            'hyperv_hot_helper.rb',
            'hyperv_hot_hardening.rb',
            'hyperv_import_recovery.rb',
            'hyperv_virtio_hardening.rb'
          )
          foreach($name in $files){
            $dst=Join-Path $env:RUNNER_TEMP $name
            & curl.exe -L --fail --silent --show-error --connect-timeout 8 --max-time 45 -o $dst "https://raw.githubusercontent.com/adaptgurus/one-swap/$head/$name"
            if($LASTEXITCODE -ne 0){throw "download failed: $name"}
            Write-Host ("MORPHING_RUNTIME_SOURCE name={0} sha256={1}" -f $name,(Get-FileHash -Algorithm SHA256 $dst).Hash.ToLower())
          }
          $helper=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'hyperv_helper.rb') -Raw
          if($helper -notmatch "when '.raw' then 'raw'"){throw 'RAW libvirt driver fix missing'}
          if($helper -notmatch 'run_remote_script_capture'){throw 'robust PowerShell remote-file transport missing'}
          $hot=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'hyperv_hot_helper.rb') -Raw
          if($hot -notmatch 'CreateFileW'){throw 'canonical CreateFileW hot-helper fix missing'}
          $hard=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'hyperv_hot_hardening.rb') -Raw
          if($hard -notmatch 'CreateFileW' -or $hard.Contains('[IO.File]::Open($rawPath')){throw 'hardened CreateFileW override missing'}
          $virtio=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'hyperv_virtio_hardening.rb') -Raw
          if($virtio -notmatch 'def final_raw_libvirt_xml'){throw 'RAW XML builder missing'}
          $recovery=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'hyperv_import_recovery.rb') -Raw
          if($recovery -notmatch 'def recover_morphing_prelaunch' -or $recovery -notmatch 'verify_morphing_delta_application'){throw 'MORPHING recovery code missing'}
          $cli=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'oneswap-hyperv') -Raw
          if($cli -notmatch 'recover-morphing-prelaunch'){throw 'MORPHING recovery CLI option missing'}
          "MORPHING_RUNTIME_HEAD=$head" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deploy coherent runtime atomically
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $common=@('-o','LogLevel=ERROR','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=4','-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$known",'-o','ConnectTimeout=8','-i',$env:ONESWAP_TEMP_KEY)
          $files=@('oneswap-hyperv','hyperv_helper.rb','hyperv_hot_helper.rb','hyperv_hot_hardening.rb','hyperv_import_recovery.rb','hyperv_virtio_hardening.rb')
          foreach($name in $files){
            & scp.exe @common (Join-Path $env:RUNNER_TEMP $name) "ci@10.250.10.32:/tmp/$name.morphing"
            if($LASTEXITCODE -ne 0){throw "scp failed: $name"}
          }
          $script=@'
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          deploy(){
            src="$1"; dst="$2"; mode="$3"
            rubycheck="$4"
            [ -f "$src" ]
            if [ "$rubycheck" = yes ]; then ruby -c "$src"; fi
            sudo cp -a "$dst" "$dst.before-morphing-recovery-$stamp"
            sudo install -o root -g root -m "$mode" "$src" "$dst"
            if [ "$rubycheck" = yes ]; then sudo ruby -c "$dst"; fi
          }
          deploy /tmp/oneswap-hyperv.morphing /usr/bin/oneswap-hyperv 0755 yes
          deploy /tmp/hyperv_helper.rb.morphing /usr/lib/one/ruby/cli/one_helper/hyperv_helper.rb 0644 yes
          deploy /tmp/hyperv_hot_helper.rb.morphing /usr/lib/one/ruby/cli/one_helper/hyperv_hot_helper.rb 0644 yes
          deploy /tmp/hyperv_hot_hardening.rb.morphing /usr/lib/one/ruby/cli/one_helper/hyperv_hot_hardening.rb 0644 yes
          deploy /tmp/hyperv_import_recovery.rb.morphing /usr/lib/one/ruby/cli/one_helper/hyperv_import_recovery.rb 0644 yes
          deploy /tmp/hyperv_virtio_hardening.rb.morphing /usr/lib/one/ruby/cli/one_helper/hyperv_virtio_hardening.rb 0644 yes
          rm -f /tmp/*.morphing
          grep -Fq -- '--recover-morphing-prelaunch' /usr/bin/oneswap-hyperv
          grep -Fq "when '.raw' then 'raw'" /usr/lib/one/ruby/cli/one_helper/hyperv_helper.rb
          grep -Fq 'run_remote_script_capture' /usr/lib/one/ruby/cli/one_helper/hyperv_helper.rb
          grep -Fq 'CreateFileW' /usr/lib/one/ruby/cli/one_helper/hyperv_hot_helper.rb
          grep -Fq 'CreateFileW' /usr/lib/one/ruby/cli/one_helper/hyperv_hot_hardening.rb
          ! grep -Fq '[IO.File]::Open($rawPath' /usr/lib/one/ruby/cli/one_helper/hyperv_hot_hardening.rb
          grep -Fq 'def recover_morphing_prelaunch' /usr/lib/one/ruby/cli/one_helper/hyperv_import_recovery.rb
          grep -Fq 'def final_raw_libvirt_xml' /usr/lib/one/ruby/cli/one_helper/hyperv_virtio_hardening.rb
          echo 'MORPHING_RUNTIME_DEPLOY=PASS'
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe @common "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'coherent runtime deployment failed'}

      - name: Re-prove source invariant
        if: always()
        shell: powershell
        run: |
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          Write-Host "FINAL_SOURCE_STATE=$($vm.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$n"
          if($vm.State -ne 'Off'){throw 'Deployment changed source state'}
          if($n -ne 0){throw 'Unexpected checkpoint'}
          Write-Host 'MORPHING_DEPLOY_SOURCE_INVARIANT=PASS'
