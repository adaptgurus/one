name: LayerSentry Production Service Autofix

on:
  push:
    branches:
      - layersentry/vm-service-blueprints-production-20260919
    paths:
      - '.github/workflows/layersentry-production-service-autofix.yml'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@v6
        with:
          ref: layersentry/vm-service-blueprints-production-20260919

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json

      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply repository lint fixes
        run: |
          npx eslint --fix \
            src/client/apps/layersentry/serviceBlueprints.js \
            src/client/apps/layersentry/pages/ProductionServiceWizard.js \
            src/client/apps/layersentry/pages/ApplicationsWorkspace.js \
            src/client/apps/layersentry/Portal.js

      - name: Verify lint clean
        run: |
          npx eslint \
            src/client/apps/layersentry/serviceBlueprints.js \
            src/client/apps/layersentry/pages/ProductionServiceWizard.js \
            src/client/apps/layersentry/pages/ApplicationsWorkspace.js \
            src/client/apps/layersentry/Portal.js

      - name: Re-run production service regression matrix
        run: node --test tests/layersentry/production-service-blueprints.test.cjs

      - name: Commit mechanical formatting
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/fireedge/src/client/apps/layersentry/serviceBlueprints.js \
            src/fireedge/src/client/apps/layersentry/pages/ProductionServiceWizard.js \
            src/fireedge/src/client/apps/layersentry/pages/ApplicationsWorkspace.js \
            src/fireedge/src/client/apps/layersentry/Portal.js
          git commit -m "style: apply FireEdge lint formatting"
          git push origin HEAD:layersentry/vm-service-blueprints-production-20260919
