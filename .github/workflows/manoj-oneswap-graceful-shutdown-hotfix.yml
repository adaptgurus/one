name: Manoj OneSwap Graceful Shutdown Hotfix

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-graceful-shutdown-hotfix.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-graceful-shutdown-hotfix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Bind Manoj and verify resumable source state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "Source must still be Running before hotfix: $($vm.State)"}
          if(@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has user-visible checkpoints'}
          $refs=@(Get-WmiObject -Namespace root/virtualization/v2 -Class Msvm_VirtualSystemReferencePoint -Filter "VirtualSystemIdentifier='$($vm.VMId.Guid)'" -ErrorAction Stop)
          Write-Host "HOTFIX_SOURCE_STATE=$($vm.State)"
          Write-Host "HOTFIX_REFERENCE_COUNT=$($refs.Count)"
          if($refs.Count -ne 1){throw "Expected one prepared RCT reference; found $($refs.Count)"}
          Write-Host "HOTFIX_REFERENCE_ID=$($refs[0].InstanceID)"
          Write-Host 'HOTFIX_SOURCE_ADMISSION=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-shutdown-hotfix.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download exact CI-green helper
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $head='ea0557467099960ff5febd13d3da7587fb0d3ca1'
          $url="https://raw.githubusercontent.com/adaptgurus/one-swap/$head/hyperv_hot_helper.rb"
          $file=Join-Path $env:RUNNER_TEMP 'hyperv_hot_helper.shutdown-hotfix.rb'
          & curl.exe -L --fail --silent --show-error --connect-timeout 8 --max-time 45 -o $file $url
          if($LASTEXITCODE -ne 0){throw "helper download failed rc=$LASTEXITCODE"}
          $hash=(Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          Write-Host "HOTFIX_HEAD=$head"
          Write-Host "HOTFIX_SHA256=$hash"
          "HOTFIX_HELPER=$file" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOTFIX_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install exact helper on OneSwap appliance
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          & scp.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY $env:HOTFIX_HELPER "ci@10.250.10.32:/tmp/hyperv_hot_helper.shutdown-hotfix.rb"
          if($LASTEXITCODE -ne 0){throw 'hotfix scp failed'}
          $script=@'
          set -euo pipefail
          src=/tmp/hyperv_hot_helper.shutdown-hotfix.rb
          dst=/usr/lib/one/ruby/cli/one_helper/hyperv_hot_helper.rb
          expected="__EXPECTED__"
          [ "$(sha256sum "$src" | awk '{print $1}')" = "$expected" ]
          ruby -c "$src"
          grep -Fq 'Stop-VM -VM $vm -ErrorAction Stop' "$src"
          ! grep -Fq 'Stop-VM -VM $vm -Shutdown' "$src"
          ! grep -Fq 'Stop-VM -VM $vm -TurnOff' "$src"
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          sudo cp -a "$dst" "$dst.before-graceful-shutdown-$stamp"
          sudo install -o root -g root -m 0644 "$src" "$dst"
          [ "$(sudo sha256sum "$dst" | awk '{print $1}')" = "$expected" ]
          sudo ruby -c "$dst"
          sudo grep -Fq 'Stop-VM -VM $vm -ErrorAction Stop' "$dst"
          ! sudo grep -Fq 'Stop-VM -VM $vm -Shutdown' "$dst"
          ! sudo grep -Fq 'Stop-VM -VM $vm -TurnOff' "$dst"
          rm -f "$src"
          echo "ONESWAP_GRACEFUL_SHUTDOWN_HOTFIX=PASS sha256=$expected"
          '@
          $script=$script.Replace('__EXPECTED__',$env:HOTFIX_SHA256)
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'OneSwap graceful shutdown hotfix install failed'}

      - name: Inspect durable state and preserve source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          operation="manoj-hv-ls-migration-source-test-20260924"
          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"
            safe=op.gsub(/[^A-Za-z0-9_.-]/,"_"); suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$operation")
          python3 - "$state" <<'PY'
          import json,sys,os
          p=sys.argv[1]
          if not os.path.isfile(p): raise SystemExit('durable state missing')
          s=json.load(open(p))
          print('HOTFIX_STATE_PATH='+p)
          print('HOTFIX_PHASE='+str(s.get('phase')))
          print('HOTFIX_SOURCE_VM_ID='+str(s.get('source_vm_id')))
          print('HOTFIX_REFERENCE='+str(s.get('reference_point_id')))
          print('HOTFIX_TEMPLATE_ID='+str(s.get('template_id')))
          if s.get('phase') not in ('PREPARED','CUTOVER_STARTED'):
              raise SystemExit('state is not safely resumable before source shutdown')
          PY
          '@
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'durable state is not safely resumable'}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          Write-Host "HOTFIX_FINAL_SOURCE_STATE=$($vm.State)"
          Write-Host "HOTFIX_FINAL_CHECKPOINTS=$n"
          if($vm.State -ne 'Running' -or $n -ne 0){throw 'hotfix changed source invariant'}
          Write-Host 'HOTFIX_RESUME_ADMISSION=PASS'
