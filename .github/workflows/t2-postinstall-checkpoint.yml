name: T2 Post-Install Checkpoint

on:
  push:
    branches:
      - ops/t2-foundation-live-qual-20260921
    paths:
      - .github/workflows/t2-postinstall-checkpoint.yml

permissions:
  contents: read

concurrency:
  group: t2-exact-live-vm
  cancel-in-progress: false

jobs:
  wait:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Bind exact disposable disk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw 'wrong runner'}
          $d=Get-VMHardDiskDrive -VMName 'ls-appliance-dbe-qual' -ControllerType SCSI -ControllerNumber 0 -ControllerLocation 0
          if($d.Path -ne 'C:\LayerSentryLab\qualification\ls-appliance-dbe-qual\os-4c4ac81-live.vhdx'){throw 'fresh disk mismatch'}
          Start-Sleep -Seconds 180
      - name: Capture post-install state
        shell: powershell
        run: |
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\live\postinstall-8m.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-dbe-qual' -Out $out
          $vm=Get-VM -Name 'ls-appliance-dbe-qual'
          $d=Get-Item 'C:\LayerSentryLab\qualification\ls-appliance-dbe-qual\os-4c4ac81-live.vhdx'
          Write-Host "VM_STATE=$($vm.State) UPTIME=$($vm.Uptime) VHD_BYTES=$($d.Length) VHD_LASTWRITE=$($d.LastWriteTimeUtc.ToString('o'))"
          if(-not(Test-Path $out) -or (Get-Item $out).Length -lt 1000){throw 'postinstall screenshot missing'}
      - name: Upload post-install state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-postinstall-8m
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\live\postinstall-8m.png
          if-no-files-found: error
          retention-days: 7