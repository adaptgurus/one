name: T2 Recover VHD Only Boot

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-recover-vhd-only-boot.yml

permissions:
  contents: read

concurrency:
  group: t2-install-4c4ac81
  cancel-in-progress: true

jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Bind completed disposable VHD and absent media
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $name='ls-appliance-4c4ac81-qual'
          $vhd='C:\LayerSentryLab\qualification\ls-appliance-4c4ac81-qual\os.vhdx'
          $vm=Get-VM -Name $name -ErrorAction Stop
          $disks=@(Get-VMHardDiskDrive -VMName $name)
          if($disks.Count -ne 1 -or $disks[0].Path -ne $vhd){throw 'Installed VHD binding changed'}
          if((Get-Item $vhd).Length -lt 3500000000){throw 'Installed VHD unexpectedly small'}
          $dvd=Get-VMDvdDrive -VMName $name -ErrorAction SilentlyContinue
          if($dvd -and $dvd.Path){throw "ISO/media unexpectedly still attached: $($dvd.Path)"}
          Write-Host "RECOVERY_BIND=PASS state=$($vm.State) vhd_file_bytes=$((Get-Item $vhd).Length) dvd_path=$($dvd.Path)"

      - name: Power off dead installer console
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $vm=Get-VM -Name $name
          if($vm.State -ne 'Off'){Stop-VM -Name $name -TurnOff -Force}
          for($i=0;$i -lt 20;$i++){
            $vm=Get-VM -Name $name
            if($vm.State -eq 'Off'){break}
            Start-Sleep -Seconds 1
          }
          if((Get-VM -Name $name).State -ne 'Off'){throw 'VM did not power off'}
          Write-Host 'QUAL_VM_OFF=PASS'

      - name: Remove virtual DVD and pin VHD
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $dvd=Get-VMDvdDrive -VMName $name -ErrorAction SilentlyContinue
          if($dvd){Remove-VMDvdDrive -VMDvdDrive $dvd}
          if(@(Get-VMDvdDrive -VMName $name -ErrorAction SilentlyContinue).Count -ne 0){throw 'DVD drive still exists'}
          $disk=Get-VMHardDiskDrive -VMName $name | Select-Object -First 1
          Set-VMFirmware -VMName $name -FirstBootDevice $disk
          Write-Host 'DVD_DEVICE_REMOVED=PASS VHD_FIRST_BOOT=PASS'

      - name: Boot installed VHD only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          Start-VM -Name $name
          Start-Sleep -Seconds 120
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "VM not running: $($vm.State)"}
          if(@(Get-VMDvdDrive -VMName $name -ErrorAction SilentlyContinue).Count -ne 0){throw 'DVD drive unexpectedly returned'}
          $hb=(Get-VMIntegrationService -VMName $name -Name 'Heartbeat' -ErrorAction SilentlyContinue).PrimaryStatusDescription
          $ips=@((Get-VMNetworkAdapter -VMName $name).IPAddresses | Where-Object {$_ -match '^\d+\.'})
          Write-Host "VHD_ONLY_RECOVERY_BOOT=PASS state=$($vm.State) uptime=$($vm.Uptime) heartbeat=$hb ips=$($ips -join ',')"

      - name: Capture recovered VHD-only boot
        shell: powershell
        run: |
          $dir='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $out=Join-Path $dir 'recovered-vhd-only-boot.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not (Test-Path $out)){throw 'Recovered boot screenshot missing'}

      - name: Upload recovered VHD-only boot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-recovered-vhd-only-boot
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\recovered-vhd-only-boot.png
          if-no-files-found: error
          retention-days: 7