name: T2 Firstboot Port Select

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-firstboot-port-select.yml

permissions:
  contents: read

jobs:
  select:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Bind live VM
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $vm=Get-VM -Name 'ls-appliance-4c4ac81-qual' -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "VM not running: $($vm.State)"}

      - name: Send port one only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ns='root\virtualization\v2'
          $vm=Get-CimInstance -Namespace $ns -ClassName Msvm_ComputerSystem | Where-Object ElementName -eq 'ls-appliance-4c4ac81-qual'
          $kbd=Get-CimAssociatedInstance -InputObject $vm -Namespace $ns -Association Msvm_SystemDevice -ResultClassName Msvm_Keyboard | Select-Object -First 1
          if(-not $kbd){throw 'VM keyboard missing'}
          $r=Invoke-CimMethod -InputObject $kbd -MethodName TypeKey -Arguments @{KeyCode=[uint32]0x31}
          if([uint32]$r.ReturnValue -ne 0){throw 'VK_1 failed'}
          Start-Sleep -Milliseconds 500
          $r=Invoke-CimMethod -InputObject $kbd -MethodName TypeKey -Arguments @{KeyCode=[uint32]0x0D}
          if([uint32]$r.ReturnValue -ne 0){throw 'Enter failed'}
          Start-Sleep -Seconds 3

      - name: Capture prompt after port selection
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\after-port-select.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not(Test-Path $out)){throw 'Framebuffer missing'}

      - name: Upload prompt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-after-port-select
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\after-port-select.png
          if-no-files-found: error
          retention-days: 7