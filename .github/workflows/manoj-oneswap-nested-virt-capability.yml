name: Manoj OneSwap Nested Virtualization Capability

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-nested-virt-capability.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-nested-virt-capability
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect Hyper-V appliance processor settings
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Off'){throw "Source must remain Off: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Unexpected source checkpoint'}
          $ap=Get-VM -Name 'ls-appliance-qual' -ErrorAction Stop
          $cpu=Get-VMProcessor -VMName $ap.Name -ErrorAction Stop
          Write-Host "APPLIANCE_STATE=$($ap.State)"
          Write-Host "APPLIANCE_GENERATION=$($ap.Generation)"
          Write-Host "APPLIANCE_CPU_COUNT=$($cpu.Count)"
          Write-Host "APPLIANCE_EXPOSE_VIRT=$($cpu.ExposeVirtualizationExtensions)"
          Write-Host "APPLIANCE_COMPAT_MIGRATION=$($cpu.CompatibilityForMigrationEnabled)"
          Write-Host "HOST_LOGICAL_PROCESSORS=$((Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors)"
          Write-Host 'NESTED_HOST_CAPABILITY_PROBE=PASS'

      - name: Prepare appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-nested-capability.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect guest virtualization capability
        shell: powershell
        run: |
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          echo "CPU_FLAGS=$(grep -m1 -Eo '\b(vmx|svm)\b' /proc/cpuinfo | tr '\n' ',' || true)"
          echo "DEV_KVM_PRESENT=$(test -c /dev/kvm && echo true || echo false)"
          echo "KVM_MODULES:"
          lsmod | grep -E '^kvm' || true
          echo "QEMU_ACCEL:"
          qemu-system-x86_64 -accel help 2>&1 || true
          echo "NESTED_GUEST_CAPABILITY_PROBE=PASS"
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'nested guest capability probe failed'}

      - name: Final source invariant
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count
          Write-Host "FINAL_SOURCE_STATE=$($src.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$n"
          if($src.State -ne 'Off'){throw 'Probe changed source state'}
          if($n -ne 0){throw 'Unexpected checkpoint'}
