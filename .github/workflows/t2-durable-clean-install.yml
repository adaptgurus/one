name: T2 Durable Clean Install

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-durable-clean-install.yml

permissions:
  contents: read

concurrency:
  group: t2-durable-clean-install
  cancel-in-progress: true

jobs:
  install:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Create fresh durable qualification VM
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $name='ls-appliance-durable-qual'
          $root='C:\LayerSentryLab\qualification\ls-appliance-durable-qual'
          $vhd=Join-Path $root 'os.vhdx'
          $iso='C:\LayerSentryLab\qualification\durable-5f3bda7\LayerSentry-Rocky-9.8-durable-5f3bda7-generic-x86_64.iso'
          $switch='layersentry vswtich'
          $sha=(Get-FileHash -Algorithm SHA256 $iso).Hash.ToLowerInvariant()
          if($sha -ne 'b32fef3b5eb659b89e5aae6c1f0f692342d42bfbe9ddb0cd3756d0bf04a1b0d6'){throw "Durable ISO digest mismatch $sha"}
          $old=Get-VM -Name $name -ErrorAction SilentlyContinue
          if($old){if($old.State -ne 'Off'){Stop-VM -Name $name -TurnOff -Force};Remove-VM -Name $name -Force}
          if(Test-Path $root){Remove-Item $root -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-VHD -Path $vhd -Dynamic -SizeBytes 80GB | Out-Null
          New-VM -Name $name -Generation 2 -MemoryStartupBytes 2GB -VHDPath $vhd -SwitchName $switch | Out-Null
          Set-VMProcessor -VMName $name -Count 2
          Set-VM -Name $name -AutomaticCheckpointsEnabled $false
          Set-VMFirmware -VMName $name -EnableSecureBoot On -SecureBootTemplate 'MicrosoftUEFICertificateAuthority'
          Add-VMDvdDrive -VMName $name -Path $iso
          $dvd=Get-VMDvdDrive -VMName $name
          Set-VMFirmware -VMName $name -FirstBootDevice $dvd
          $disks=@(Get-VMHardDiskDrive -VMName $name)
          if($disks.Count -ne 1 -or $disks[0].Path -ne $vhd){throw 'Fresh durable VM disk binding invalid'}
          Write-Host "DURABLE_VM_CREATE=PASS sha=$sha"

      - name: Boot through media validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-VM -Name 'ls-appliance-durable-qual'
          Start-Sleep -Seconds 240
          $vm=Get-VM -Name 'ls-appliance-durable-qual'
          if($vm.State -ne 'Running'){throw "Durable VM not running: $($vm.State)"}
          Write-Host "DURABLE_MEDIA_WAIT=PASS uptime=$($vm.Uptime)"

      - name: Configure disposable storage with proven LVM sequence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-durable-qual'
          $vm=Get-WmiObject -Namespace root\virtualization\v2 -Class Msvm_ComputerSystem | Where-Object ElementName -eq $name
          $kb=Get-WmiObject -Namespace root\virtualization\v2 -Query "ASSOCIATORS OF {$($vm.__PATH)} WHERE ResultClass=Msvm_Keyboard"
          if(-not $kb){throw 'Hyper-V keyboard missing'}
          function Key([uint32]$v){$r=$kb.TypeKey($v);if($r.ReturnValue -ne 0){throw "TypeKey failed $v"};Start-Sleep -Milliseconds 300}
          Key 0x35; Key 0x0D; Start-Sleep -Seconds 3
          Key 0x43; Key 0x0D; Start-Sleep -Seconds 3
          Key 0x32; Key 0x0D; Start-Sleep -Seconds 3
          Key 0x43; Key 0x0D; Start-Sleep -Seconds 3
          Key 0x32; Key 0x0D; Start-Sleep -Seconds 3
          Key 0x43; Key 0x0D; Start-Sleep -Seconds 12
          Key 0x52; Key 0x0D; Start-Sleep -Seconds 6
          $out='C:\LayerSentryLab\evidence\t2-durable-5f3bda7\summary-ready.png'
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM $name -Out $out
          if(-not(Test-Path $out)){throw 'Durable summary capture missing'}
          Write-Host 'DURABLE_STORAGE_SEQUENCE=PASS'

      - name: Begin installation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-durable-qual'
          $iso='C:\LayerSentryLab\qualification\durable-5f3bda7\LayerSentry-Rocky-9.8-durable-5f3bda7-generic-x86_64.iso'
          $disks=@(Get-VMHardDiskDrive -VMName $name)
          if($disks.Count -ne 1){throw 'Unexpected durable VM disk count'}
          if((Get-VMDvdDrive -VMName $name).Path -ne $iso){throw 'Durable ISO binding changed'}
          Set-VMFirmware -VMName $name -FirstBootDevice $disks[0]
          $vm=Get-WmiObject -Namespace root\virtualization\v2 -Class Msvm_ComputerSystem | Where-Object ElementName -eq $name
          $kb=Get-WmiObject -Namespace root\virtualization\v2 -Query "ASSOCIATORS OF {$($vm.__PATH)} WHERE ResultClass=Msvm_Keyboard"
          $a=$kb.TypeKey([uint32]0x42);Start-Sleep -Milliseconds 300;$b=$kb.TypeKey([uint32]0x0D)
          if($a.ReturnValue -ne 0 -or $b.ReturnValue -ne 0){throw 'Begin-install key injection failed'}
          Start-Sleep -Seconds 15
          Write-Host 'DURABLE_INSTALL_STARTED=PASS'

      - name: Wait for installation completion window
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 600
          $name='ls-appliance-durable-qual'
          $vhd='C:\LayerSentryLab\qualification\ls-appliance-durable-qual\os.vhdx'
          $vm=Get-VM -Name $name
          if($vm.State -ne 'Running'){throw "Durable VM stopped unexpectedly: $($vm.State)"}
          if((Get-Item $vhd).Length -lt 3000000000){throw "Durable VHD did not grow enough: $((Get-Item $vhd).Length)"}
          $out='C:\LayerSentryLab\evidence\t2-durable-5f3bda7\install-after-10min.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM $name -Out $out
          Write-Host "DURABLE_INSTALL_WAIT=PASS vhd_bytes=$((Get-Item $vhd).Length)"

      - name: Upload install evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-durable-5f3bda7-install
          path: C:\LayerSentryLab\evidence\t2-durable-5f3bda7\*.png
          if-no-files-found: error
          retention-days: 7