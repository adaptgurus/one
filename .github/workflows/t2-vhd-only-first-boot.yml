name: T2 VHD Only First Boot

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-vhd-only-first-boot.yml

permissions:
  contents: read

concurrency:
  group: t2-install-4c4ac81
  cancel-in-progress: true

jobs:
  boot:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Re-bind installed disposable VHD
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $name='ls-appliance-4c4ac81-qual'
          $vhd='C:\LayerSentryLab\qualification\ls-appliance-4c4ac81-qual\os.vhdx'
          $iso='C:\LayerSentryLab\qualification\4c4ac81\LayerSentry-Rocky-9.8-4c4ac81-generic-x86_64.iso'
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "VM not running: $($vm.State)"}
          $disks=@(Get-VMHardDiskDrive -VMName $name)
          if($disks.Count -ne 1 -or $disks[0].Path -ne $vhd){throw 'Installed VHD binding changed'}
          if((Get-Item $vhd).Length -lt 3000000000){throw 'Installed VHD has not grown enough to represent completed install'}
          $dvd=Get-VMDvdDrive -VMName $name
          if($dvd.Path -ne $iso){throw "Unexpected DVD before eject: $($dvd.Path)"}
          Write-Host "PRE_EJECT=PASS vhd_file_bytes=$((Get-Item $vhd).Length) dvd=$($dvd.Path)"

      - name: Eject ISO and pin VHD boot
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $disk=Get-VMHardDiskDrive -VMName $name | Select-Object -First 1
          Set-VMFirmware -VMName $name -FirstBootDevice $disk
          Set-VMDvdDrive -VMName $name -Path $null
          $dvd=Get-VMDvdDrive -VMName $name
          if($dvd.Path){throw "DVD did not eject: $($dvd.Path)"}
          Write-Host 'DVD_EJECT=PASS VHD_FIRST_BOOT=PASS'

      - name: Exit Anaconda
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $vm=Get-WmiObject -Namespace root\virtualization\v2 -Class Msvm_ComputerSystem | Where-Object ElementName -eq $name
          $kb=Get-WmiObject -Namespace root\virtualization\v2 -Query "ASSOCIATORS OF {$($vm.__PATH)} WHERE ResultClass=Msvm_Keyboard"
          if(-not $kb){throw 'Hyper-V keyboard missing'}
          $r=$kb.TypeKey([uint32]0x0D)
          if($r.ReturnValue -ne 0){throw 'Enter key injection failed'}
          Write-Host 'ANACONDA_EXIT_ENTER=PASS'

      - name: Wait for VHD-only boot
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          Start-Sleep -Seconds 120
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "Installed VM is not running after VHD-only boot: $($vm.State)"}
          $dvd=Get-VMDvdDrive -VMName $name
          if($dvd.Path){throw "DVD unexpectedly populated after reboot: $($dvd.Path)"}
          $hb=(Get-VMIntegrationService -VMName $name -Name 'Heartbeat' -ErrorAction SilentlyContinue).PrimaryStatusDescription
          $ips=@((Get-VMNetworkAdapter -VMName $name).IPAddresses | Where-Object {$_ -match '^\d+\.'})
          Write-Host "VHD_ONLY_BOOT state=$($vm.State) uptime=$($vm.Uptime) heartbeat=$hb ips=$($ips -join ',') dvd=<empty>"

      - name: Capture VHD-only first boot
        shell: powershell
        run: |
          $dir='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $out=Join-Path $dir 'vhd-only-first-boot.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not (Test-Path $out)){throw 'VHD-only first-boot screenshot missing'}

      - name: Upload VHD-only boot evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-vhd-only-first-boot
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\vhd-only-first-boot.png
          if-no-files-found: error
          retention-days: 7