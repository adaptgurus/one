name: Manoj OneSwap Verify Nested KVM

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-verify-nested-kvm.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-verify-nested-kvm
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind Manoj and verify Hyper-V setting
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Off'){throw "Source must remain Off: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Unexpected source checkpoint'}
          $ap=Get-VM -Name 'ls-appliance-qual' -ErrorAction Stop
          $cpu=Get-VMProcessor -VMName $ap.Name -ErrorAction Stop
          Write-Host "APPLIANCE_STATE=$($ap.State)"
          Write-Host "APPLIANCE_EXPOSE=$($cpu.ExposeVirtualizationExtensions)"
          Write-Host "APPLIANCE_MEMORY=$($ap.MemoryStartup)"
          if($ap.State -ne 'Running'){throw 'Appliance not Running'}
          if(-not $cpu.ExposeVirtualizationExtensions){throw 'Nested virtualization not enabled'}
          if($ap.MemoryStartup -ne 2GB){throw 'Appliance memory changed unexpectedly'}
          Write-Host 'NESTED_HYPERV_SETTING=PASS'

      - name: Prepare appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-verify-nested-kvm.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Wait for SSH and verify KVM plus state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $ready=$false
          for($i=0;$i -lt 40;$i++){
            $old=$ErrorActionPreference
            $ErrorActionPreference='SilentlyContinue'
            $null=& ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=4 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo ready" 2>$null
            $rc=$LASTEXITCODE
            $ErrorActionPreference=$old
            if($rc -eq 0){$ready=$true;break}
            Write-Host "APPLIANCE_SSH_WAIT attempt=$i rc=$rc"
            Start-Sleep -Seconds 3
          }
          if(-not $ready){throw 'Appliance SSH did not recover'}
          Write-Host 'APPLIANCE_SSH_READY=PASS'

          $script=@'
          set -euo pipefail
          flags=$(grep -m1 -Eo '\b(vmx|svm)\b' /proc/cpuinfo | tr '\n' ',' || true)
          echo "CPU_FLAGS=$flags"
          if echo "$flags" | grep -q svm; then sudo modprobe kvm_amd || true; fi
          if echo "$flags" | grep -q vmx; then sudo modprobe kvm_intel || true; fi
          sudo modprobe kvm || true
          echo "DEV_KVM_PRESENT=$(test -c /dev/kvm && echo true || echo false)"
          lsmod | grep -E '^kvm' || true
          test -c /dev/kvm

          op="manoj-hv-ls-migration-source-test-20260924"
          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"
            safe=op.gsub(/[^A-Za-z0-9_.-]/,"_"); suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$op")
          current=$(sha256sum "$state" | awk '{print $1}')
          echo "POST_RESTART_STATE_SHA=$current"
          [ "$current" = "c5a66de734691e3e63df30610afe431e35524cbe17a3954090c8e9a728918ebf" ]
          python3 - "$state" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          print("POST_RESTART_PHASE="+str(s.get("phase")))
          if s.get("phase")!="MORPHING": raise SystemExit("phase changed")
          if s.get("delta_applied_at") or s.get("import_started_at") or s.get("template_id") or s.get("image_imports"): raise SystemExit("later-phase evidence appeared")
          PY
          free -m
          echo 'NESTED_KVM_GUEST_GATE=PASS'
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'Nested KVM or state-integrity gate failed'}

      - name: Final source invariant
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count
          Write-Host "FINAL_SOURCE_STATE=$($src.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$n"
          if($src.State -ne 'Off'){throw 'Verification changed source state'}
          if($n -ne 0){throw 'Unexpected source checkpoint'}
