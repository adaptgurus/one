name: Manoj HyperV Inventory and Target Authority
# retrigger-20260924

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-hyperv-authority.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-authority
  cancel-in-progress: true

jobs:
  authority:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Bind exact Manoj runner and protect source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source is not Running: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has checkpoints'}
          Write-Host 'SOURCE_PROTECTION_BEFORE=PASS'

      - name: Prepare LocalSystem-only appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $srcKey='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmpKey=Join-Path $env:RUNNER_TEMP 'oneswap_qual_ed25519.system'
          Copy-Item -Force $srcKey $tmpKey
          & icacls.exe $tmpKey /inheritance:r | Out-Null
          & icacls.exe $tmpKey /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmpKey /setowner '*S-1-5-18' | Out-Null
          $derived=(& ssh-keygen.exe -y -f $tmpKey 2>&1 | Where-Object {$_ -match '^ssh-'} | Select-Object -First 1)
          if($LASTEXITCODE -ne 0 -or -not $derived){throw 'temporary SSH key invalid'}
          "ONESWAP_TEMP_KEY=$tmpKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Capture authoritative OneSwap inventory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $appliance='10.250.10.32'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $cmd="sudo /usr/bin/oneswap-hyperv ls-migration-source-test --inventory --hyperv-connection manoj-qual --config-file /etc/layersentry/oneswap/manoj-qual.yaml 2>&1"
          $out=& ssh.exe -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@$appliance" $cmd
          $rc=$LASTEXITCODE
          $out | ForEach-Object {Write-Host ('INVENTORY_OUT=' + $_)}
          if($rc -ne 0){throw "OneSwap inventory failed rc=$rc"}
          $jsonLine=@($out | Where-Object {$_.Trim().StartsWith('{') -and $_ -match 'source_disk_bytes'} | Select-Object -Last 1)
          if($jsonLine.Count -eq 0){throw 'OneSwap inventory returned no structured JSON'}
          $inv=$jsonLine[-1] | ConvertFrom-Json
          Write-Host "INVENTORY_SOURCE_STATE=$($inv.source_vm_state)"
          Write-Host "INVENTORY_DISK_COUNT=$($inv.disk_count)"
          Write-Host "INVENTORY_SOURCE_DISK_BYTES=$($inv.source_disk_bytes)"
          Write-Host "INVENTORY_GENERATION=$($inv.generation)"
          Write-Host "INVENTORY_PROCESSOR_COUNT=$($inv.processor_count)"
          if($inv.source_vm_state -notmatch '(?i)running'){throw "Inventory source state not Running: $($inv.source_vm_state)"}
          if([int64]$inv.source_disk_bytes -le 0 -or [int]$inv.disk_count -le 0){throw 'Inventory capacity invalid'}
          Write-Host 'ONESWAP_STRUCTURED_INVENTORY=PASS'

      - name: Discover target OpenNebula authority through direct OneSwap config
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $appliance='10.250.10.32'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          cfg=/etc/layersentry/oneswap/manoj-qual.yaml
          test -f "$cfg"
          echo "ONESWAP_CONFIG=$cfg"
          echo '=== SAFE CONFIG LINES ==='
          sudo awk 'BEGIN{IGNORECASE=1} /^[[:space:]]*#/ {next} /pass(word)?|secret|token|private.?key/ {next} {print}' "$cfg" | sed -n '1,220p'
          echo '=== CLI AVAILABILITY ==='
          for c in onehost onedatastore onevnet oneimage onevm; do command -v "$c" || true; done
          echo '=== ONE_AUTH PATH CANDIDATES ==='
          sudo find /etc /var/lib /root /home -type f -path '*/.one/one_auth' -o -type f -name 'one_auth' 2>/dev/null | sed -n '1,120p'
          echo '=== ONE_XMLRPC HINTS ==='
          sudo grep -R -nE 'ONE_XMLRPC|2633/RPC2|xmlrpc' /etc/layersentry /etc/one /var/lib/one 2>/dev/null | grep -viE 'password|secret|token' | sed -n '1,120p' || true
          echo TARGET_AUTHORITY_METADATA=PASS
          '@
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@$appliance" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'OneSwap target authority metadata discovery failed'}

      - name: Inspect source seed OS hints without secrets
        shell: powershell
        run: |
          $root='C:\LayerSentryLab\qualification\ls-migration-source-test'
          foreach($n in @('meta-data','network-config')){
            $p=Join-Path $root $n
            if(Test-Path $p){
              Write-Host "=== $n ==="
              Get-Content $p | Where-Object {$_ -match '(?i)instance-id|local-hostname|hostname|version|renderer|ethernets|dhcp|addresses|gateway|nameservers'} | Select-Object -First 80
            }
          }

      - name: Confirm source remains protected
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source changed state: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source checkpoint invariant changed'}
          Write-Host 'SOURCE_PROTECTION_AFTER=PASS'
