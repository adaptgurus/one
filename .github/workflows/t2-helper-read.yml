name: T2 Qualification Helper Read

on:
  push:
    branches:
      - ops/t2-foundation-live-qual-20260921

permissions:
  contents: read

concurrency:
  group: t2-helper-read
  cancel-in-progress: true

jobs:
  read:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Bind runner
        shell: powershell
        run: |
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw 'wrong runner'}
      - name: Print non-secret helper source
        shell: powershell
        run: |
          $root='C:\LayerSentryLab\qualification'
          foreach($name in @('capture_vm_thumbnail.ps1','send_anaconda_command.ps1','vm_type_cmd.ps1','vm_type_diag.ps1')){
            Write-Host "===== $name ====="
            Get-Content (Join-Path $root $name)
          }
          Write-Host '===== ENROLL HELPER STRUCTURE ====='
          foreach($name in @('vm_enroll_testlab.ps1','vm_full_enroll_testlab.ps1')){
            Write-Host "--- $name ---"
            Select-String -Path (Join-Path $root $name) -Pattern '^param|Get-Content|Test-Path|function|Key\(|K\(|Type|qualification|controller|token|password|support|root' -CaseSensitive:$false | Select LineNumber,Line | Format-Table -Wrap -AutoSize
          }