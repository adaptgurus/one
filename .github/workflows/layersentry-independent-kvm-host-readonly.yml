name: LayerSentry Independent KVM Host Read-Only Audit

on:
  push:
    branches:
      - dr-threepoint-ssh-20260924
    paths:
      - ".github/workflows/layersentry-independent-kvm-host-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layersentry-independent-kvm-host-readonly
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Audit ls-kvm1 and ls-kvm2 through independent OpenNebula
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'MANOJ-TEST-INST') { throw "Wrong runner: $env:RUNNER_NAME" }
          $script = @'
          import pathlib
          import xml.etree.ElementTree as ET
          from xmlrpc.client import ServerProxy
          from dissect.target import Target

          target=Target.open(r"C:\LayerSentryLab\Recovery\fe2-lvm\2.img")
          auth=target.fs.path("/var/lib/one/.one/one_auth").open("rb").read().decode().strip()
          one=ServerProxy("http://10.250.10.10:2633/RPC2",allow_none=True)
          version=one.one.system.version(auth)
          if not version[0]:
              raise SystemExit("OpenNebula auth failed")
          print("INDEPENDENT_ONE_VERSION="+str(version[1]))
          hp=one.one.hostpool.info(auth,-2,-1,-1)
          if not hp[0]:
              raise SystemExit("host pool query failed")
          pool=ET.fromstring(hp[1])

          for host_name in ("ls-kvm1","ls-kvm2"):
              matches=[h for h in pool.findall("HOST") if (h.findtext("NAME") or "").strip()==host_name]
              if len(matches)!=1:
                  print(f"HOST_AUDIT name={host_name} count={len(matches)}")
                  continue
              h=matches[0]
              detail={
                  "name":host_name,
                  "id":int(h.findtext("ID") or -1),
                  "state":int(h.findtext("STATE") or -1),
                  "prev_state":int(h.findtext("PREV_STATE") or -1),
                  "last_mon":int(h.findtext("LAST_MON_TIME") or 0),
                  "max_cpu":int(h.findtext("./HOST_SHARE/MAX_CPU") or 0),
                  "free_cpu":int(h.findtext("./HOST_SHARE/FREE_CPU") or 0),
                  "max_mem":int(h.findtext("./HOST_SHARE/MAX_MEM") or 0),
                  "free_mem":int(h.findtext("./HOST_SHARE/FREE_MEM") or 0),
                  "running_counter":int(h.findtext("./HOST_SHARE/RUNNING_VMS") or 0),
                  "pin_policy":(h.findtext("./TEMPLATE/PIN_POLICY") or "").strip(),
                  "vms_thread":(h.findtext("./TEMPLATE/VMS_THREAD") or "").strip(),
                  "error":(h.findtext("./TEMPLATE/ERROR") or h.findtext("ERROR") or "").strip(),
              }
              rows=[]
              ids=[int((n.text or "-1").strip()) for n in h.findall("./VMS/ID") if (n.text or "").strip()]
              for vmid in ids:
                  info=one.one.vm.info(auth,vmid,False)
                  if not info[0]:
                      rows.append({"id":vmid,"error":str(info[1])[:200]})
                      continue
                  vm=ET.fromstring(info[1])
                  histories=vm.findall("./HISTORY_RECORDS/HISTORY")
                  rows.append({
                      "id":vmid,
                      "name":(vm.findtext("NAME") or "").strip(),
                      "state":int(vm.findtext("STATE") or -1),
                      "lcm_state":int(vm.findtext("LCM_STATE") or -1),
                      "host":histories[-1].findtext("HOSTNAME") if histories else "",
                      "deploy_id":(vm.findtext("DEPLOY_ID") or "").strip(),
                  })
              print("HOST_AUDIT="+repr(detail))
              print("HOST_VM_AUDIT="+repr({"host":host_name,"vms":rows}))
          '@
          $path=Join-Path $env:RUNNER_TEMP 'independent_kvm_audit.py'
          Set-Content -Path $path -Value $script -Encoding UTF8
          & 'C:\LayerSentryLab\tools\Python313\python.exe' $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
