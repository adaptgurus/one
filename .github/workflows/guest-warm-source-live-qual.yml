name: Guest Warm Source Live Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: guest-warm-source-live-20260924
  cancel-in-progress: true

jobs:
  qualify:
    if: github.event.pull_request.head.ref == 'qual/hyperv-migration-live-20260924'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Bind exact Windows source host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "wrong runner $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "wrong host $env:COMPUTERNAME"}
          Write-Host "SOURCE_HOST_BOUND=$env:COMPUTERNAME"

      - name: Probe disposable guest over seeded IPv4 or scoped IPv6
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vmName='ls-migration-source-test'
          $root='C:\LayerSentryLab\qualification\ls-migration-source-test'
          $network=Get-Content -Raw -LiteralPath (Join-Path $root 'network-config')
          $userData=Get-Content -Raw -LiteralPath (Join-Path $root 'user-data')
          $ipv4=[regex]::Matches($network,'(?<![0-9])(?:10|172|192)\.[0-9]+\.[0-9]+\.[0-9]+') | ForEach-Object {$_.Value} | Where-Object {$_ -ne '10.250.10.1'} | Select-Object -First 1
          $m=[regex]::Match($userData,'(?m)^\s*-?\s*name:\s*([A-Za-z0-9_.-]+)\s*$')
          if(-not $m.Success){throw 'seeded SSH user missing'}
          $user=$m.Groups[1].Value
          $key=Join-Path $root 'source_ci_ed25519'
          $targets=@()
          if($ipv4){$targets += $ipv4}
          $nic=Get-VMNetworkAdapter -VMName $vmName -ErrorAction Stop
          $link=$nic.IPAddresses | Where-Object {$_ -like 'fe80::*'} | Select-Object -First 1
          if($link){
            $ifc=Get-NetIPInterface -AddressFamily IPv6 -InterfaceAlias 'vEthernet (layersentry vswtich)' -ErrorAction Stop
            $targets += "$link%$($ifc.InterfaceIndex)"
          }
          Write-Host "SOURCE_VM state=$((Get-VM -Name $vmName).State) seeded_ipv4=$ipv4 link_local=$link"
          $connected=$false
          foreach($target in $targets){
            $known=Join-Path $env:RUNNER_TEMP ('known-' + [guid]::NewGuid().ToString('N'))
            ssh-keyscan.exe -T 4 $target 2>$null | Out-File -FilePath $known -Encoding ascii
            if((Test-Path $known) -and (Get-Item $known).Length -gt 0){
              Write-Host "SOURCE_SSH_TARGET=$target"
              ssh.exe -o BatchMode=yes -o ConnectTimeout=6 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $key "$user@$target" "hostname; id -un; uname -a; ip -4 -brief address; ip route; lsblk -b -o NAME,TYPE,SIZE,MOUNTPOINTS"
              if($LASTEXITCODE -eq 0){$connected=$true; break}
            }
          }
          if(-not $connected){throw 'disposable source guest is not SSH reachable over seeded IPv4 or scoped link-local IPv6'}
          Write-Host 'SOURCE_GUEST_SSH=PASS'

      - name: Verify authorized builder and current migration source
        shell: powershell
        env:
          EXPECTED_SHA: 7be181c189c293ab90fa2cb57e6db18ad2c70074
        run: |
          $ErrorActionPreference='Stop'
          $key='C:\LayerSentryLab\qualification\iso-builder-key'
          $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          ssh.exe -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $key builder@10.250.10.40 "hostname; id -un; for p in /home/builder/layersentry-platform /home/builder/*/layersentry-platform /opt/layersentry-platform /srv/layersentry-platform; do if [ -d \"\$p/.git\" ]; then echo BUILDER_REPO=\$p; git -C \"\$p\" rev-parse HEAD; fi; done"
          if($LASTEXITCODE -ne 0){throw 'builder SSH/discovery failed'}
          Write-Host "EXPECTED_MIGRATION_SOURCE=$env:EXPECTED_SHA"
