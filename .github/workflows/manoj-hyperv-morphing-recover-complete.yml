name: Manoj HyperV MORPHING Recover and Complete

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-hyperv-morphing-recover-complete.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-cutover-materialize
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - name: Bind Manoj and protect source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count
          Write-Host "SOURCE_BEFORE_STATE=$($src.State)"
          Write-Host "SOURCE_BEFORE_CHECKPOINTS=$n"
          if($src.State -ne 'Off'){throw "Recovery requires source Off: $($src.State)"}
          if($n -ne 0){throw 'Unexpected source checkpoint'}
          if((Get-VM -Name 'ls-appliance-qual' -ErrorAction Stop).State -ne 'Running'){throw 'OneSwap appliance not Running'}
          if((Get-VM -Name 'ls-fe2' -ErrorAction Stop).State -ne 'Off'){throw 'FE2 authority VM must remain Off'}
          Write-Host 'MORPHING_RECOVERY_SOURCE_GATE=PASS'

      - name: Prepare restricted appliance key and block baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-morphing-recover.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $before=& ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $tmp "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          if($LASTEXITCODE -ne 0){throw 'appliance block baseline failed'}
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($before -join [Environment]::NewLine)))
          "ONESWAP_BLOCKS_BEFORE_B64=$b64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach FE2 read-only authority child
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $fe2=(Get-VMHardDiskDrive -VMName 'ls-fe2' -ErrorAction Stop | Where-Object {$_.Path} | Sort-Object ControllerNumber,ControllerLocation | Select-Object -First 1).Path
          if(-not $fe2){throw 'FE2 disk missing'}
          $audit=Join-Path 'C:\LayerSentryLab\qualification' ("fe2-morph-recover-$env:GITHUB_RUN_ID.vhdx")
          New-VHD -Path $audit -ParentPath $fe2 -Differencing -ErrorAction Stop | Out-Null
          Add-VMHardDiskDrive -VMName 'ls-appliance-qual' -ControllerType SCSI -Path $audit -ErrorAction Stop
          "FE2_AUDIT_VHD=$audit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 3

      - name: Recover proven prelaunch MORPHING exactly once
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $beforeText=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:ONESWAP_BLOCKS_BEFORE_B64))
          $before=@($beforeText -split [Environment]::NewLine | Where-Object {$_})
          $after=& ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          if($LASTEXITCODE -ne 0){throw 'appliance block inventory failed'}
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
            if [ "$exists" = "true" ]; then auth=$(sudo guestfish --ro -a "$dev" -i cat "$p"); break; fi
          done
          [ -n "$auth" ]
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          printf '%s\n' "$auth" > "$tmp"; chmod 600 "$tmp"
          export ONE_AUTH="$tmp"
          export ONE_XMLRPC="http://10.250.10.11:2633/RPC2"
          op="manoj-hv-ls-migration-source-test-20260924"

          sudo -E /usr/bin/oneswap-hyperv ls-migration-source-test \
            --hot --recover-morphing-prelaunch \
            --operation-id "$op" \
            --hyperv-connection manoj-qual \
            --config-file /etc/layersentry/oneswap/manoj-qual.yaml \
            --guest-os linux \
            --expected-guest-macs 00:15:5d:00:1c:07 \
            --uefi-sec-path /usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            --qemu-ga \
            --cpu 0.5 --vcpu 2 --memory-mb 2560 \
            --datastore 1 --network 0

          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"; safe=op.gsub(/[^A-Za-z0-9_.-]/,"_")
            suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$op")
          python3 - "$state" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          print("RECOVERY_PHASE="+str(s.get("phase")))
          print("RECOVERY_DELTA_APPLIED_AT="+str(s.get("delta_applied_at")))
          print("RECOVERY_STARTED_AT="+str(s.get("morph_prelaunch_recovery_started_at")))
          print("RECOVERY_COMPLETED_AT="+str(s.get("morph_prelaunch_recovery_completed_at")))
          if s.get("phase")!="DELTA_APPLIED": raise SystemExit("recovery did not reach DELTA_APPLIED")
          if not s.get("morph_prelaunch_recovery_completed_at"): raise SystemExit("recovery completion evidence missing")
          PY
          echo 'MORPHING_PRELAUNCH_RECOVERY=PASS'
          '@
          $script=$script.Replace('__DEV__',$dev)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'MORPHING prelaunch recovery failed; source remains Off'}

      - name: Resume restart-safe import to IMPORTED
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $beforeText=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:ONESWAP_BLOCKS_BEFORE_B64))
          $before=@($beforeText -split [Environment]::NewLine | Where-Object {$_})
          $after=& ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
            if [ "$exists" = "true" ]; then auth=$(sudo guestfish --ro -a "$dev" -i cat "$p"); break; fi
          done
          [ -n "$auth" ]
          tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
          printf '%s\n' "$auth" > "$tmp"; chmod 600 "$tmp"
          export ONE_AUTH="$tmp"; export ONE_XMLRPC="http://10.250.10.11:2633/RPC2"
          op="manoj-hv-ls-migration-source-test-20260924"

          sudo -E /usr/bin/oneswap-hyperv ls-migration-source-test \
            --hot --commit \
            --operation-id "$op" \
            --hyperv-connection manoj-qual \
            --config-file /etc/layersentry/oneswap/manoj-qual.yaml \
            --guest-os linux \
            --expected-guest-macs 00:15:5d:00:1c:07 \
            --uefi-sec-path /usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            --qemu-ga \
            --cpu 0.5 --vcpu 2 --memory-mb 2560 \
            --img-wait 1800 \
            --datastore 1 --network 0

          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"; safe=op.gsub(/[^A-Za-z0-9_.-]/,"_")
            suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$op")
          python3 - "$state" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          print("IMPORT_PHASE="+str(s.get("phase")))
          print("IMPORT_TEMPLATE_ID="+str(s.get("template_id")))
          print("IMPORT_IMAGE_IMPORTS="+str(s.get("image_imports")))
          if s.get("phase")!="IMPORTED": raise SystemExit("import did not reach IMPORTED")
          if not isinstance(s.get("template_id"),int) or s["template_id"]<0: raise SystemExit("template id missing")
          PY
          echo 'ONESWAP_IMPORT_RECOVERY=PASS'
          '@
          $script=$script.Replace('__DEV__',$dev)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'restart-safe import did not prove IMPORTED'}

      - name: Verify source still Off before target materialization
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          Write-Host "SOURCE_BEFORE_TARGET_STATE=$($src.State)"
          if($src.State -ne 'Off'){throw "No-dual-running gate failed before target: $($src.State)"}
          Write-Host 'SOURCE_OFF_BEFORE_TARGET=PASS'

      - name: Materialize imported target and wait for Running
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $beforeText=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:ONESWAP_BLOCKS_BEFORE_B64))
          $before=@($beforeText -split [Environment]::NewLine | Where-Object {$_})
          $after=& ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
            if [ "$exists" = "true" ]; then auth=$(sudo guestfish --ro -a "$dev" -i cat "$p"); break; fi
          done
          [ -n "$auth" ]
          tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
          printf '%s\n' "$auth" > "$tmp"; chmod 600 "$tmp"
          export ONE_AUTH="$tmp"; export ONE_XMLRPC="http://10.250.10.11:2633/RPC2"
          op="manoj-hv-ls-migration-source-test-20260924"
          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"; safe=op.gsub(/[^A-Za-z0-9_.-]/,"_")
            suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$op")
          template_id=$(python3 - "$state" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))["template_id"])
          PY
          )
          target_name="ls-migration-source-test-migrated"
          existing=$(onevm list --xml | python3 -c "import sys,xml.etree.ElementTree as ET; r=ET.parse(sys.stdin).getroot(); xs=[v.findtext('ID') for v in r.findall('VM') if (v.findtext('NAME') or '')=='$target_name']; print(xs[0] if len(xs)==1 else '')")
          if [ -n "$existing" ]; then
            vm_id="$existing"
            echo "TARGET_VM_ADOPTED id=$vm_id"
          else
            out=$(onetemplate instantiate "$template_id" --name "$target_name")
            printf '%s\n' "$out"
            vm_id=$(printf '%s\n' "$out" | sed -nE 's/.*VM ID: *([0-9]+).*/\1/p' | tail -1)
            [ -n "$vm_id" ]
          fi
          echo "TARGET_VM_ID=$vm_id"
          deadline=$((SECONDS+1200))
          while [ $SECONDS -lt $deadline ]; do
            xml=$(onevm show "$vm_id" --xml)
            st=$(printf '%s' "$xml" | python3 -c "import sys,xml.etree.ElementTree as ET; r=ET.fromstring(sys.stdin.read()); print((r.findtext('STATE') or '')+','+(r.findtext('LCM_STATE') or ''))")
            echo "TARGET_VM_STATE=$st"
            [ "$st" = "3,3" ] && break
            sleep 5
          done
          xml=$(onevm show "$vm_id" --xml)
          st=$(printf '%s' "$xml" | python3 -c "import sys,xml.etree.ElementTree as ET; r=ET.fromstring(sys.stdin.read()); print((r.findtext('STATE') or '')+','+(r.findtext('LCM_STATE') or ''))")
          [ "$st" = "3,3" ] || { onevm show "$vm_id"; exit 43; }
          echo "TARGET_VM_RUNNING=PASS id=$vm_id"
          onevm show "$vm_id"
          '@
          $script=$script.Replace('__DEV__',$dev)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'target materialization/running validation failed; source remains Off'}

      - name: Verify source Off and finalize DONE
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Off'){throw "No-dual-running failed: source state=$($src.State)"}
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $beforeText=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:ONESWAP_BLOCKS_BEFORE_B64))
          $before=@($beforeText -split [Environment]::NewLine | Where-Object {$_})
          $after=& ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
            if [ "$exists" = "true" ]; then auth=$(sudo guestfish --ro -a "$dev" -i cat "$p"); break; fi
          done
          [ -n "$auth" ]
          tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
          printf '%s\n' "$auth" > "$tmp"; chmod 600 "$tmp"
          export ONE_AUTH="$tmp"; export ONE_XMLRPC="http://10.250.10.11:2633/RPC2"
          op="manoj-hv-ls-migration-source-test-20260924"
          common=(ls-migration-source-test --hot --operation-id "$op" --hyperv-connection manoj-qual --config-file /etc/layersentry/oneswap/manoj-qual.yaml --guest-os linux --expected-guest-macs 00:15:5d:00:1c:07 --uefi-sec-path /usr/share/OVMF/OVMF_CODE_4M.secboot.fd --qemu-ga --cpu 0.5 --vcpu 2 --memory-mb 2560 --datastore 1 --network 0)
          sudo -E /usr/bin/oneswap-hyperv "${common[@]}" --verify-source-off
          sudo -E /usr/bin/oneswap-hyperv "${common[@]}" --finalize-success
          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"; safe=op.gsub(/[^A-Za-z0-9_.-]/,"_")
            suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$op")
          python3 - "$state" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          print("FINAL_PHASE="+str(s.get("phase")))
          print("FINAL_TEMPLATE_ID="+str(s.get("template_id")))
          print("FINAL_COMPLETED_AT="+str(s.get("completed_at")))
          if s.get("phase")!="DONE": raise SystemExit("final state is not DONE")
          PY
          echo 'ONESWAP_FINALIZE_SUCCESS=PASS'
          '@
          $script=$script.Replace('__DEV__',$dev)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'source-off/finalize validation failed'}

      - name: Detach and delete FE2 authority child
        if: always()
        shell: powershell
        run: |
          $audit=$env:FE2_AUDIT_VHD
          if($audit){
            Get-VMHardDiskDrive -VMName 'ls-appliance-qual' -ErrorAction SilentlyContinue | Where-Object {$_.Path -eq $audit} | Remove-VMHardDiskDrive -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            if(Test-Path $audit){Remove-Item -Force $audit -ErrorAction Stop}
          }
          Write-Host 'FE2_MORPH_RECOVERY_AUTH_CHILD_CLEANUP=PASS'

      - name: Final source evidence
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $snaps=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue)
          Write-Host "FINAL_SOURCE_STATE=$($src.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$($snaps.Count)"
          if($src.State -ne 'Off'){throw 'Final source state is not Off'}
          if($snaps.Count -ne 0){throw 'Unexpected source checkpoint remains'}
          Write-Host 'FINAL_SOURCE_INVARIANT=PASS'
