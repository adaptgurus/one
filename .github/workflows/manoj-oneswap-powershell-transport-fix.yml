name: Manoj OneSwap PowerShell Transport Fix

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-powershell-transport-fix.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Bind Manoj and protect source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source not Running"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has checkpoints'}
          if((Get-VM -Name 'ls-appliance-qual').State -ne 'Running'){throw 'OneSwap appliance not Running'}
          Write-Host 'SOURCE_PROTECTION_BEFORE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $srcKey='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-powershell-transport.key'
          Copy-Item -Force $srcKey $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage exact CI-green PR18 files locally
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $helperB64=''
          $hotB64=''
          $helperTmp=Join-Path $env:RUNNER_TEMP 'hyperv_helper.rb.pr18'
          $hotTmp=Join-Path $env:RUNNER_TEMP 'hyperv_hot_helper.rb.pr18'
          [IO.File]::WriteAllBytes($helperTmp,[Convert]::FromBase64String($helperB64))
          [IO.File]::WriteAllBytes($hotTmp,[Convert]::FromBase64String($hotB64))
          if((Get-Item $helperTmp).Length -lt 1000){throw 'helper temp file unexpectedly small'}
          if((Get-Item $hotTmp).Length -lt 1000){throw 'hot helper temp file unexpectedly small'}
          "HELPER_TMP=$helperTmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOT_TMP=$hotTmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'LOCAL_PR18_STAGE=PASS'

      - name: Copy exact files to OneSwap appliance
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $common=@('-o','LogLevel=ERROR','-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$known",'-o','ConnectTimeout=8','-i',$env:ONESWAP_TEMP_KEY)
          & scp.exe @common $env:HELPER_TMP 'ci@10.250.10.32:/tmp/hyperv_helper.rb.pr18'
          if($LASTEXITCODE -ne 0){throw "scp hyperv_helper failed rc=$LASTEXITCODE"}
          & scp.exe @common $env:HOT_TMP 'ci@10.250.10.32:/tmp/hyperv_hot_helper.rb.pr18'
          if($LASTEXITCODE -ne 0){throw "scp hyperv_hot_helper failed rc=$LASTEXITCODE"}
          Write-Host 'PR18_SCP=PASS'

      - name: Install exact CI-green files and validate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $remote=@'
          set -euo pipefail
          helper=/usr/lib/one/ruby/cli/one_helper/hyperv_helper.rb
          hot=/usr/lib/one/ruby/cli/one_helper/hyperv_hot_helper.rb
          test -s /tmp/hyperv_helper.rb.pr18
          test -s /tmp/hyperv_hot_helper.rb.pr18
          sudo cp -a "$helper" "$helper.pre-pr18-exact"
          sudo cp -a "$hot" "$hot.pre-pr18-exact"
          sudo install -m 0644 /tmp/hyperv_helper.rb.pr18 "$helper"
          sudo install -m 0644 /tmp/hyperv_hot_helper.rb.pr18 "$hot"
          sudo ruby -c "$helper"
          sudo ruby -c "$hot"
          sudo grep -n 'POWERSHELL_ENCODED_COMMAND_MAX_BYTES = 6_000' "$helper"
          sudo grep -n 'def powershell_invocation' "$helper"
          sudo grep -n 'stdin.write(stdin_data) if stdin_data' "$helper" "$hot"
          sudo grep -n 'argv, stdin_data = send(:powershell_invocation, script)' "$hot"
          sudo rm -f /tmp/hyperv_helper.rb.pr18 /tmp/hyperv_hot_helper.rb.pr18
          echo ONESWAP_PR18_EXACT_DEPLOY=PASS
          '@
          $tmpScript=Join-Path $env:RUNNER_TEMP 'install-pr18.sh'
          [IO.File]::WriteAllText($tmpScript,([regex]::Replace($remote,'\r','')),[Text.UTF8Encoding]::new($false))
          $common=@('-o','LogLevel=ERROR','-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$known",'-o','ConnectTimeout=8','-i',$env:ONESWAP_TEMP_KEY)
          Get-Content -Raw $tmpScript | & ssh.exe @common 'ci@10.250.10.32' 'sudo bash -s'
          if($LASTEXITCODE -ne 0){throw "remote PR18 install failed rc=$LASTEXITCODE"}

      - name: Verify source invariant
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count
          Write-Host "SOURCE_AFTER_STATE=$($src.State)"
          Write-Host "SOURCE_AFTER_CHECKPOINTS=$n"
          if($src.State -ne 'Running' -or $n -ne 0){throw 'Source invariant changed'}
          Write-Host 'SOURCE_PROTECTION_AFTER=PASS'
