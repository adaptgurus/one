name: Manoj OneSwap PowerShell Transport Fix

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-powershell-transport-fix.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Bind Manoj and protect source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source not Running: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has checkpoints'}
          if((Get-VM -Name 'ls-appliance-qual').State -ne 'Running'){throw 'OneSwap appliance not Running'}
          Write-Host 'SOURCE_PROTECTION_BEFORE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $srcKey='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-powershell-transport.key'
          Copy-Item -Force $srcKey $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch installed OneSwap large PowerShell transport
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail

          mapfile -t helpers < <(sudo find /usr /opt -type f -name hyperv_helper.rb 2>/dev/null)
          mapfile -t hothelpers < <(sudo find /usr /opt -type f -name hyperv_hot_helper.rb 2>/dev/null)
          [ "${#helpers[@]}" -eq 1 ] || { echo "HYPERV_HELPER_COUNT=${#helpers[@]}"; printf '%s\n' "${helpers[@]:-}"; exit 61; }
          [ "${#hothelpers[@]}" -eq 1 ] || { echo "HYPERV_HOT_HELPER_COUNT=${#hothelpers[@]}"; printf '%s\n' "${hothelpers[@]:-}"; exit 62; }
          helper="${helpers[0]}"
          hot="${hothelpers[0]}"
          echo "HYPERV_HELPER=$helper"
          echo "HYPERV_HOT_HELPER=$hot"

          sudo cp -a "$helper" "$helper.pre-powershell-stdin-pr18"
          sudo cp -a "$hot" "$hot.pre-powershell-stdin-pr18"

          sudo python3 - "$helper" "$hot" <<'PY'
          import pathlib, sys
          helper=pathlib.Path(sys.argv[1])
          hot=pathlib.Path(sys.argv[2])

          h=helper.read_text()
          replacements=[
          ("""    class SSHTransport
              def initialize(profile)
                  @profile = profile
              end

              def powershell(script, timeout: 120)
                  argv = ssh_argv(script)
                  stdout, stderr, status = run_capture(argv, timeout)
          """,
          """    class SSHTransport
              POWERSHELL_ENCODED_COMMAND_MAX_BYTES = 6_000

              def initialize(profile)
                  @profile = profile
              end

              def powershell(script, timeout: 120)
                  argv, stdin_data = powershell_invocation(script)
                  stdout, stderr, status = run_capture(argv, timeout, stdin_data)
          """),
          ("""              argv = ssh_argv(script)
              FileUtils.mkdir_p(File.dirname(local_path))
              stderr_text = +''
              status = nil
              Timeout.timeout(timeout) do
                  Open3.popen3(*argv) do |stdin, stdout, stderr, wait_thr|
                      stdin.close
          """,
          """              argv, stdin_data = powershell_invocation(script)
              FileUtils.mkdir_p(File.dirname(local_path))
              stderr_text = +''
              status = nil
              Timeout.timeout(timeout) do
                  Open3.popen3(*argv) do |stdin, stdout, stderr, wait_thr|
                      stdin.write(stdin_data) if stdin_data
                      stdin.close
          """),
          ("""          def run_capture(argv, timeout)
              result = nil
              Timeout.timeout(timeout) { result = Open3.capture3(*argv) }
              result
          rescue Timeout::Error
              raise Error, "Hyper-V SSH/PowerShell operation timed out after #{timeout}s"
          end

          def ssh_argv(script)
              [
                  'ssh', '-T',
          """,
          """          def run_capture(argv, timeout, stdin_data = nil)
              result = nil
              Timeout.timeout(timeout) do
                  result = if stdin_data
                               Open3.capture3(*argv, stdin_data: stdin_data)
                           else
                               Open3.capture3(*argv)
                           end
              end
              result
          rescue Timeout::Error
              raise Error, "Hyper-V SSH/PowerShell operation timed out after #{timeout}s"
          end

          def powershell_invocation(script)
              common = [
                  'ssh', '-T',
          """),
          ("""                  @profile.destination,
                  'powershell.exe', '-NoLogo', '-NoProfile', '-NonInteractive',
                  '-ExecutionPolicy', 'Bypass',
                  '-EncodedCommand', Util.powershell_encoded(script)
              ]
          end
          """,
          """                  @profile.destination,
                  'powershell.exe', '-NoLogo', '-NoProfile', '-NonInteractive',
                  '-ExecutionPolicy', 'Bypass'
              ]
              encoded = Util.powershell_encoded(script)
              if encoded.bytesize <= POWERSHELL_ENCODED_COMMAND_MAX_BYTES
                  [common + ['-EncodedCommand', encoded], nil]
              else
                  [common + ['-Command', '-'], script.encode(Encoding::UTF_8)]
              end
          end
          """)
          ]
          for old,new in replacements:
              if old not in h:
                  raise SystemExit("helper expected source pattern missing")
              h=h.replace(old,new,1)
          helper.write_text(h)

          x=hot.read_text()
          old="""        def stream_powershell(script, local_path, timeout: nil)
              argv = send(:ssh_argv, script)
              FileUtils.mkdir_p(File.dirname(local_path))
              stderr_text = +''
              status = nil
              runner = proc do
                  Open3.popen3(*argv) do |stdin, stdout, stderr, wait_thr|
                      stdin.close
          """
          new="""        def stream_powershell(script, local_path, timeout: nil)
              argv, stdin_data = send(:powershell_invocation, script)
              FileUtils.mkdir_p(File.dirname(local_path))
              stderr_text = +''
              status = nil
              runner = proc do
                  Open3.popen3(*argv) do |stdin, stdout, stderr, wait_thr|
                      stdin.write(stdin_data) if stdin_data
                      stdin.close
          """
          if old not in x:
              raise SystemExit("hot helper expected source pattern missing")
          hot.write_text(x.replace(old,new,1))
          PY

          sudo ruby -c "$helper"
          sudo ruby -c "$hot"
          sudo grep -n 'POWERSHELL_ENCODED_COMMAND_MAX_BYTES' "$helper"
          sudo grep -n "stdin.write(stdin_data) if stdin_data" "$helper" "$hot"
          sudo grep -n "powershell_invocation" "$helper" "$hot"
          echo ONESWAP_POWERSHELL_STDIN_PATCH_PR18=PASS
          '@
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw "OneSwap PowerShell transport patch failed rc=$LASTEXITCODE"}

      - name: Verify source invariant
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count
          Write-Host "SOURCE_AFTER_STATE=$($src.State)"
          Write-Host "SOURCE_AFTER_CHECKPOINTS=$n"
          if($src.State -ne 'Running' -or $n -ne 0){throw 'Source invariant changed'}
          Write-Host 'SOURCE_PROTECTION_AFTER=PASS'
