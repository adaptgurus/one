name: TESTSER Backup Plan Datastore Clone Qualification

on:
  push:
    branches:
      - qual/testser-backup-plan-datastore-clone-20260926
    paths:
      - '.github/workflows/testser-backup-plan-datastore-clone.yml'
      - 'src/fireedge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@v6
      - name: Bind exact TESTSER runner
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME slot=${{ matrix.slot }}"
          if [ "$RUNNER_NAME" != "TESTSER-TWOSITE-ONE" ]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            sleep 45
            exit 0
          fi
          echo "execute=true" >> "$GITHUB_OUTPUT"
      - name: Locked install
        if: steps.bind.outputs.execute == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused protection regression
        if: steps.bind.outputs.execute == 'true'
        run: node --test tests/layersentry/protection-integration.test.cjs
      - name: Full LayerSentry regression
        if: steps.bind.outputs.execute == 'true'
        run: node --test tests/layersentry/*.test.cjs
      - name: FireEdge lint
        if: steps.bind.outputs.execute == 'true'
        run: npm run lint
      - name: Full FireEdge production build
        if: steps.bind.outputs.execute == 'true'
        run: npm run build
      - name: Assert datastore and clone UI in build
        if: steps.bind.outputs.execute == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q "Save datastore" dist
          grep -R -q "Clone plan" dist
          grep -R -q "Create clone" dist
          echo TESTSER_BACKUP_PLAN_DATASTORE_CLONE_UI=PASS
