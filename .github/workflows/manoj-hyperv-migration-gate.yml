name: Manoj HyperV Migration Source Gate

on:
  push:
    branches:
      - qual/hyperv-migration-manoj-20260924
    paths:
      - '.github/workflows/manoj-hyperv-migration-gate.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-migration-readonly-gate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Bind exact Manoj runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "runner=$env:RUNNER_NAME computer=$env:COMPUTERNAME user=$env:USERNAME os=$env:RUNNER_OS"
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          Get-Command Get-VM,Get-VHD,Get-VMHardDiskDrive,Get-VMNetworkAdapter,Get-VMSnapshot -ErrorAction Stop | Out-Null
          if(-not (Test-Path 'C:\LayerSentryLab\qualification')){throw 'LayerSentry qualification workspace missing'}
          Write-Host 'MANOJ_RUNNER_BOUND=PASS'

      - name: Qualify and start disposable migration source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-migration-source-test'
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.Generation -notin @(1,2)){throw "unsupported VM generation $($vm.Generation)"}
          $snaps=@(Get-VMSnapshot -VMName $name -ErrorAction SilentlyContinue)
          if($snaps.Count -ne 0){throw "source has $($snaps.Count) checkpoints"}
          $disks=@(Get-VMHardDiskDrive -VMName $name -ErrorAction Stop)
          if($disks.Count -eq 0){throw 'source has no disks'}
          foreach($d in $disks){
            if(-not $d.Path){throw 'disk path missing'}
            $v=Get-VHD -Path $d.Path -ErrorAction Stop
            if($v.VhdFormat -ne 'VHDX'){throw "warm path requires VHDX: $($d.Path)"}
            if($v.VhdType -eq 'Differencing' -or $v.ParentPath){throw "parent/differencing disk blocked: $($d.Path)"}
            Write-Host "SOURCE_DISK path=$($d.Path) type=$($v.VhdType) virtual=$($v.Size) file=$($v.FileSize)"
          }
          Write-Host "SOURCE_BEFORE state=$($vm.State) autoCheckpoints=$($vm.AutomaticCheckpointsEnabled)"
          if($vm.AutomaticCheckpointsEnabled){
            Set-VM -Name $name -AutomaticCheckpointsEnabled $false
            Write-Host 'SOURCE_AUTOMATIC_CHECKPOINTS=DISABLED'
          }
          if($vm.State -eq 'Off'){
            Start-VM -Name $name
            Write-Host 'SOURCE_START_REQUESTED=YES'
          } elseif($vm.State -ne 'Running'){
            throw "source is neither Off nor Running; state=$($vm.State)"
          }
          $deadline=(Get-Date).AddSeconds(120)
          do {
            Start-Sleep -Seconds 2
            $vm=Get-VM -Name $name -ErrorAction Stop
            Write-Host "SOURCE_STATE=$($vm.State)"
            if($vm.State -eq 'Running'){break}
          } while((Get-Date) -lt $deadline)
          if($vm.State -ne 'Running'){throw "source did not reach Running; state=$($vm.State)"}
          foreach($nic in @(Get-VMNetworkAdapter -VMName $name -ErrorAction Stop)){
            Write-Host "SOURCE_NIC switch=$($nic.SwitchName) mac=$($nic.MacAddress) ips=$($nic.IPAddresses -join ',')"
          }
          Write-Host "SOURCE_GATE=PASS name=$name state=$($vm.State) generation=$($vm.Generation) cpu=$($vm.ProcessorCount) disks=$($disks.Count)"

      - name: Verify secure Hyper-V source transport
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sshd=Get-Service sshd -ErrorAction SilentlyContinue
          if(-not $sshd){throw 'OpenSSH Server service is absent; OneSwap pinned-key SSH cannot run'}
          Write-Host "SSHD status=$($sshd.Status) startType=$($sshd.StartType)"
          if($sshd.Status -ne 'Running'){throw 'sshd is not Running; gate will not modify host security'}
          $cfg='C:\ProgramData\ssh\sshd_config'
          if(-not (Test-Path $cfg)){throw 'sshd_config missing'}
          $effective=Get-Content -LiteralPath $cfg | Where-Object {$_ -match '^(?i)(PubkeyAuthentication|PasswordAuthentication|KbdInteractiveAuthentication|ChallengeResponseAuthentication)\s+'}
          $effective | ForEach-Object { Write-Host "SSHD_CONFIG=$($_.Trim())" }
          if($effective -match '(?i)^PasswordAuthentication\s+yes'){throw 'password SSH is enabled; qualification requires public-key-only transport'}
          if($effective -match '(?i)^(KbdInteractiveAuthentication|ChallengeResponseAuthentication)\s+yes'){throw 'interactive SSH auth is enabled'}
          Write-Host 'HYPERV_SSH_GATE=PASS'

      - name: Inventory local qualification appliances
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('ls-appliance-qual','ls-appliance-dbe-qual','ls-iso-builder')){
            $vm=Get-VM -Name $name -ErrorAction SilentlyContinue
            if(-not $vm){Write-Host "APPLIANCE name=$name present=false";continue}
            Write-Host "APPLIANCE name=$name state=$($vm.State) gen=$($vm.Generation) cpu=$($vm.ProcessorCount)"
            foreach($nic in @(Get-VMNetworkAdapter -VMName $name -ErrorAction SilentlyContinue)){
              $ips=@($nic.IPAddresses | Where-Object {$_ -match '^\d+\.\d+\.\d+\.\d+$'})
              Write-Host "APPLIANCE_NIC name=$name switch=$($nic.SwitchName) mac=$($nic.MacAddress) ips=$($ips -join ',')"
              foreach($ip in $ips){
                foreach($port in @(22,9443,9444)){
                  $ok=Test-NetConnection -ComputerName $ip -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue
                  Write-Host "APPLIANCE_ROUTE name=$name ip=$ip port=$port tcp=$ok"
                }
              }
            }
          }

      - name: Read-only OpenNebula target inventory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $py='C:\LayerSentryLab\tools\Python313\python.exe'
          $authImage='C:\LayerSentryLab\Recovery\fe2-lvm\2.img'
          if(-not (Test-Path $py)){throw "qualification Python missing: $py"}
          if(-not (Test-Path $authImage)){throw "OpenNebula auth image missing: $authImage"}
          $script=@'
          import pathlib, xml.etree.ElementTree as ET
          from xmlrpc.client import ServerProxy
          from dissect.target import Target

          endpoint="http://10.250.10.10:2633/RPC2"
          image=pathlib.Path(r"C:\LayerSentryLab\Recovery\fe2-lvm\2.img")
          target=Target.open(str(image))
          auth=target.fs.path("/var/lib/one/.one/one_auth").open("rb").read().decode().strip()
          one=ServerProxy(endpoint, allow_none=True)

          def call(label, method, *args):
              try:
                  result=method(auth,*args)
              except Exception as exc:
                  print(f"ONE_{label}_ERROR={type(exc).__name__}:{exc}")
                  return None
              if not result[0]:
                  print(f"ONE_{label}_ERROR={str(result[1])[:300]}")
                  return None
              return result[1]

          hp=call("HOSTS",one.one.hostpool.info,-2,-1,-1)
          if hp:
              root=ET.fromstring(hp)
              for h in root.findall("HOST"):
                  print("ONE_HOST id=%s name=%s state=%s" % (
                    h.findtext("ID") or "", h.findtext("NAME") or "", h.findtext("STATE") or ""))

          dp=call("DATASTORES",one.one.datastorepool.info,-2,-1,-1)
          if dp:
              root=ET.fromstring(dp)
              for x in root.findall("DATASTORE"):
                  print("ONE_DATASTORE id=%s name=%s type=%s tm=%s ds=%s" % (
                    x.findtext("ID") or "", x.findtext("NAME") or "", x.findtext("TYPE") or "",
                    x.findtext("./TM_MAD") or x.findtext("./TEMPLATE/TM_MAD") or "",
                    x.findtext("./DS_MAD") or x.findtext("./TEMPLATE/DS_MAD") or ""))

          vp=call("VNETS",one.one.vnpool.info,-2,-1,-1)
          if vp:
              root=ET.fromstring(vp)
              for x in root.findall("VNET"):
                  print("ONE_VNET id=%s name=%s bridge=%s" % (
                    x.findtext("ID") or "", x.findtext("NAME") or "",
                    x.findtext("./BRIDGE") or x.findtext("./TEMPLATE/BRIDGE") or ""))

          print("OPENNEBULA_READONLY_INVENTORY=PASS")
          '@
          $p=Join-Path $env:RUNNER_TEMP 'migration-one-readonly.py'
          Set-Content -LiteralPath $p -Value $script -Encoding UTF8
          & $py $p
          if($LASTEXITCODE -ne 0){throw "OpenNebula read-only inventory failed with exit $LASTEXITCODE"}

      - name: Inventory qualification authority metadata only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification'
          Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match '(?i)(known_hosts|oneswap|migration|auth|cert|ca|config|key)'} |
            Select-Object -First 200 FullName,Length,LastWriteTime |
            Format-Table -Wrap -AutoSize
          Write-Host 'QUALIFICATION_AUTHORITY_METADATA=PASS'

      - name: Report source seed network metadata
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification\ls-migration-source-test'
          foreach($f in @('network-config','meta-data')){
            $p=Join-Path $root $f
            if(Test-Path $p){
              Get-Content -LiteralPath $p |
                Where-Object {$_ -match '(?i)address|gateway|dhcp|nameserver|instance-id|local-hostname'} |
                ForEach-Object { Write-Host "SEED_$($f.ToUpper().Replace('-','_'))=$($_.Trim())" }
            }
          }
          Write-Host 'MANOJ_HYPERV_MIGRATION_READONLY_GATE=PASS'
          Write-Host 'No source shutdown, RCT prepare, disk transfer, OpenNebula import, or target VM mutation was executed by this gate.'
