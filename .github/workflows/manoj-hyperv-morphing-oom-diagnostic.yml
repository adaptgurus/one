name: Manoj HyperV MORPHING OOM Diagnostic

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-hyperv-morphing-oom-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-morphing-oom-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Bind Manoj and source invariant
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $snaps=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue)
          Write-Host "SOURCE_STATE=$($src.State)"
          Write-Host "SOURCE_CHECKPOINTS=$($snaps.Count)"
          if($src.State -ne 'Off'){throw "Source must remain Off: $($src.State)"}
          if($snaps.Count -ne 0){throw 'Unexpected source checkpoint'}
          $ap=Get-VM -Name 'ls-appliance-qual' -ErrorAction Stop
          Write-Host "APPLIANCE_STATE=$($ap.State)"
          Write-Host "APPLIANCE_MEMORY_ASSIGNED=$($ap.MemoryAssigned)"
          Write-Host "APPLIANCE_MEMORY_STARTUP=$($ap.MemoryStartup)"
          Write-Host "APPLIANCE_DYNAMIC_MEMORY=$($ap.DynamicMemoryEnabled)"
          if($ap.State -ne 'Running'){throw 'OneSwap appliance not Running'}
          $mem=Get-VMMemory -VMName 'ls-appliance-qual' -ErrorAction Stop
          Write-Host "APPLIANCE_MIN_MEMORY=$($mem.Minimum)"
          Write-Host "APPLIANCE_MAX_MEMORY=$($mem.Maximum)"
          Write-Host 'MORPHING_OOM_SOURCE_GATE=PASS'

      - name: Prepare appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-morphing-oom-diag.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect MORPHING recovery and appliance memory read-only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          op="manoj-hv-ls-migration-source-test-20260924"
          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"
            safe=op.gsub(/[^A-Za-z0-9_.-]/,"_"); suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$op")
          python3 - "$state" <<'PY'
          import datetime,json,os,sys
          p=sys.argv[1]; s=json.load(open(p)); root=os.path.dirname(p)
          print("STATE_PATH="+p)
          for k in ["phase","morph_prelaunch_recovery_started_at","morph_prelaunch_recovery_completed_at","morph_prelaunch_recovery_reason","delta_applied_at","import_started_at","template_id","imported_at"]:
              print("STATE_"+k.upper()+"="+str(s.get(k)))
          print("STATE_DELTA_APPLIED_INDICES="+str(s.get("delta_applied_indices")))
          print("STATE_IMAGE_IMPORTS="+str(len(s.get("image_imports") or [])))
          if s.get("phase")!="MORPHING": raise SystemExit("expected MORPHING")
          started=s.get("morph_prelaunch_recovery_started_at")
          if not started: raise SystemExit("recovery start evidence missing")
          if s.get("morph_prelaunch_recovery_completed_at"): raise SystemExit("unexpected completed recovery")
          if s.get("delta_applied_at") or s.get("import_started_at") or s.get("template_id") or s.get("imported_at"): raise SystemExit("unexpected later-phase evidence")
          if s.get("image_imports"): raise SystemExit("unexpected image import evidence")
          disks=s.get("disks") or []
          applied=sorted(int(x) for x in (s.get("delta_applied_indices") or []))
          if applied!=list(range(len(disks))): raise SystemExit("delta application evidence incomplete")
          start_ts=datetime.datetime.fromisoformat(started.replace("Z","+00:00")).timestamp()
          for i,d in enumerate(disks):
              q=d.get("prepared_raw_path","")
              st=os.stat(q)
              print(f"PREPARED_DISK index={i} path={q} bytes={st.st_size} mtime={st.st_mtime} mtime_ns={st.st_mtime_ns}")
              if st.st_mtime >= start_ts:
                  raise SystemExit(f"prepared disk {i} changed at/after recovery start")
          xml=os.path.join(root,"final-libvirt.xml")
          st=os.stat(xml)
          print(f"FINAL_XML path={xml} bytes={st.st_size} mtime={st.st_mtime} mtime_ns={st.st_mtime_ns}")
          if st.st_size<=0: raise SystemExit("final libvirt XML missing/nonpositive")
          print("FAILED_V2V_NO_PREPARED_DISK_WRITE_EVIDENCE=PASS")
          PY
          echo '===MEMORY==='
          free -m
          grep -E '^(MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
          echo '===LIMITS==='
          ulimit -a
          echo '===LIBGUESTFS_ENV==='
          env | grep '^LIBGUESTFS_' || true
          echo '===DISK==='
          df -h /var/lib/layersentry-oneswap /var/tmp || true
          echo '===RUNTIME_HASHES==='
          sha256sum /usr/bin/oneswap-hyperv /usr/lib/one/ruby/cli/one_helper/hyperv_helper.rb /usr/lib/one/ruby/cli/one_helper/hyperv_hot_helper.rb /usr/lib/one/ruby/cli/one_helper/hyperv_import_recovery.rb
          echo 'MORPHING_OOM_DIAGNOSTIC=PASS'
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'MORPHING OOM diagnostic failed'}

      - name: Final source invariant
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $snaps=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue)
          Write-Host "FINAL_SOURCE_STATE=$($src.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$($snaps.Count)"
          if($src.State -ne 'Off'){throw 'Diagnostic changed source state'}
          if($snaps.Count -ne 0){throw 'Unexpected source checkpoint'}
          Write-Host 'MORPHING_OOM_SOURCE_INVARIANT=PASS'
