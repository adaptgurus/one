name: T2 Mirrored Enrollment Durability Validation

on:
  push:
    branches:
      - qual/t2-durability-mirror-20260922
    paths:
      - 'qualification/t2-durability-mirror/**'
      - '.github/workflows/t2-mirrored-durability-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.7'
          cache: false
      - name: Prove mirror target
        run: |
          echo 'SOURCE=adaptgurus/layersentry-platform@263361e21c9898047781cf8d2351742877441771'
          test -f qualification/t2-durability-mirror/deploy/host-agent/go.mod
          grep -q 'TimeoutStartSec=5min' qualification/t2-durability-mirror/deploy/host-agent/packaging/layersentry-host-agent.service
          grep -q 'CollectEnrollment(ctx)' qualification/t2-durability-mirror/deploy/host-agent/internal/client/client.go
          grep -q 'CommitEnrollment' qualification/t2-durability-mirror/deploy/host-agent/internal/controller/controller.go
      - name: Go format
        working-directory: qualification/t2-durability-mirror/deploy/host-agent
        run: |
          gofmt -d . | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
      - name: Go vet
        working-directory: qualification/t2-durability-mirror/deploy/host-agent
        run: go vet ./...
      - name: Race tests
        working-directory: qualification/t2-durability-mirror/deploy/host-agent
        run: go test -race -count=1 ./...
      - name: Vulnerability scan
        working-directory: qualification/t2-durability-mirror/deploy/host-agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - name: Static Linux builds
        working-directory: qualification/t2-durability-mirror/deploy/host-agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w -X main.Version=t2-durable' -o /tmp/layersentry-host-agent ./cmd/layersentry-host-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w -X main.Version=t2-durable' -o /tmp/layersentry-host-controller ./cmd/layersentry-host-controller
          /tmp/layersentry-host-agent self-test | grep -Fx t2-durable
          /tmp/layersentry-host-controller self-test | grep -Fx t2-durable
          sha256sum /tmp/layersentry-host-agent /tmp/layersentry-host-controller
      - name: Upload exact binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-durable-exact-binaries
          path: |
            /tmp/layersentry-host-agent
            /tmp/layersentry-host-controller
          retention-days: 7
          if-no-files-found: error