name: T2 Controller Runtime Inspect

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-controller-runtime-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Prepare builder key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $src='C:\LayerSentryLab\qualification\iso-builder-key'; $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          foreach($p in @($src,$known)){if(-not(Test-Path $p)){throw "Missing $p"}}
          & icacls.exe $src /grant:r '*S-1-5-18:(R)' | Out-Null; & icacls.exe $known /grant:r '*S-1-5-18:(R)' | Out-Null
          $key=Join-Path $env:RUNNER_TEMP 't2-controller-inspect-key'; Copy-Item $src $key -Force
          & icacls.exe $key /grant:r '*S-1-5-18:(F)' | Out-Null; & icacls.exe $key /setowner '*S-1-5-18' | Out-Null; & icacls.exe $key /inheritance:r | Out-Null; & icacls.exe $key /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe $src /remove:g '*S-1-5-18' | Out-Null
          "T2_CTL_INSPECT_KEY=$key" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect controller runtime safely
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ssh=(Get-Command ssh.exe).Source; $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          $cmd=@'
          set -euo pipefail
          echo '=== PROCESS ==='
          ps -eo pid,ppid,user,lstart,args | grep '[l]ayersentry-host-controller' || true
          echo '=== PORT ==='
          ss -lnt 2>/dev/null | grep ':9443' || true
          echo '=== USER SERVICES ==='
          systemctl --user --no-pager --full status layersentry-host-controller.service 2>&1 || true
          echo '=== SYSTEM SERVICE ==='
          systemctl --no-pager --full status layersentry-host-controller.service 2>&1 || true
          echo '=== QUALIFICATION FILES ==='
          find /home/builder/layersentry-qual -maxdepth 2 -type f -printf '%M %u:%g %s %p\n' 2>/dev/null | sed -E '/(token|key|password|secret)/Id' | sort | head -120
          echo '=== CANDIDATE BINARIES ==='
          find /home/builder -maxdepth 4 -type f -name 'layersentry-host-controller' -printf '%M %u:%g %s %p\n' 2>/dev/null | sort
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($cmd -replace "`r",'')))
          & $ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $env:T2_CTL_INSPECT_KEY builder@10.250.10.40 "printf '%s' '$b64' | base64 -d | bash"
          if($LASTEXITCODE -ne 0){throw 'Controller runtime inspection failed'}

      - name: Remove key
        if: always()
        shell: powershell
        run: |
          if($env:T2_CTL_INSPECT_KEY -and(Test-Path $env:T2_CTL_INSPECT_KEY)){& icacls.exe $env:T2_CTL_INSPECT_KEY /grant:r '*S-1-5-18:(F)'|Out-Null;Remove-Item $env:T2_CTL_INSPECT_KEY -Force}