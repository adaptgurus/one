name: LayerSentry Hyper-V Migration Qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: layersentry-hyperv-migration-qual-20260924
  cancel-in-progress: true

jobs:
  inventory:
    if: github.event.pull_request.head.ref == 'qual/hyperv-migration-live-20260924'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Bind exact Hyper-V host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "QUAL_HOST runner=$env:RUNNER_NAME computer=$env:COMPUTERNAME user=$env:USERNAME"
          if($env:RUNNER_NAME -ne 'Manoj-Test-Inst'){throw "wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "wrong computer: $env:COMPUTERNAME"}
          Get-Command Get-VM,Get-VHD,Get-VMHardDiskDrive,Get-VMNetworkAdapter,Get-VMSwitch -ErrorAction Stop | Out-Null

      - name: Inventory Hyper-V VMs and disks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host '===VMS==='
          Get-VM | Sort-Object Name | ForEach-Object {
            [pscustomobject]@{
              Name=$_.Name; State=$_.State; Gen=$_.Generation; CPU=$_.ProcessorCount;
              MemGB=[math]::Round($_.MemoryAssigned/1GB,1);
              AutoCheckpoints=$_.AutomaticCheckpointsEnabled; Path=$_.Path
            }
          } | Format-Table -AutoSize

          Write-Host '===DISKS==='
          $rows=@()
          foreach($vm in Get-VM){
            foreach($d in Get-VMHardDiskDrive -VM $vm -ErrorAction SilentlyContinue){
              $v=$null; try{$v=Get-VHD -Path $d.Path -ErrorAction Stop}catch{}
              $rows += [pscustomobject]@{
                VM=$vm.Name; Controller=$d.ControllerType; Location=$d.ControllerLocation;
                Path=$d.Path; Format=if($v){$v.VhdFormat}else{'?'}; Type=if($v){$v.VhdType}else{'?'};
                SizeGB=if($v){[math]::Round($v.Size/1GB,1)}else{0};
                FileGB=if($v){[math]::Round($v.FileSize/1GB,1)}else{0};
                Parent=if($v){$v.ParentPath}else{''}
              }
            }
          }
          $rows | Sort-Object VM,Location | Format-Table -AutoSize -Wrap

      - name: Inventory VM networks and switches
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host '===NETWORKS==='
          $netrows=@()
          foreach($vm in (Get-VM | Sort-Object Name)){
            foreach($a in (Get-VMNetworkAdapter -VM $vm -ErrorAction SilentlyContinue)){
              $netrows += [pscustomobject]@{
                VM=$vm.Name; Name=$a.Name; Switch=$a.SwitchName; MAC=$a.MacAddress;
                Status=$a.Status; IPs=($a.IPAddresses -join ',')
              }
            }
          }
          $netrows | Format-Table -AutoSize -Wrap
          Write-Host '===SWITCHES==='
          Get-VMSwitch | Select-Object Name,SwitchType,NetAdapterInterfaceDescription | Format-Table -AutoSize

      - name: Inspect migration qualification assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification'
          if(-not(Test-Path $root)){throw "missing $root"}
          Write-Host '===QUAL_TOP==='
          Get-ChildItem -LiteralPath $root -Force |
            Select-Object Name,Length,LastWriteTime,Attributes |
            Sort-Object Name | Format-Table -AutoSize
          Write-Host '===MIGRATION_CANDIDATES==='
          foreach($name in @('ls-hv-migration-source','ls-hv-migration-source2','ls-hv-migration-source3','ls-hv-migration-source4','ls-migration-source-test')){
            $vm=Get-VM -Name $name -ErrorAction SilentlyContinue
            if(-not $vm){continue}
            Write-Host "CANDIDATE name=$name state=$($vm.State) gen=$($vm.Generation) cpu=$($vm.ProcessorCount) mem_bytes=$($vm.MemoryAssigned) checkpoints=$((Get-VMSnapshot -VMName $name -ErrorAction SilentlyContinue | Measure-Object).Count)"
            foreach($d in (Get-VMHardDiskDrive -VMName $name -ErrorAction SilentlyContinue)){
              if(-not $d.Path){continue}
              $v=Get-VHD -Path $d.Path -ErrorAction SilentlyContinue
              Write-Host "CANDIDATE_DISK vm=$name path=$($d.Path) format=$($v.VhdFormat) type=$($v.VhdType) size=$($v.Size) file=$($v.FileSize) parent=$($v.ParentPath)"
            }
            foreach($a in (Get-VMNetworkAdapter -VMName $name -ErrorAction SilentlyContinue)){
              Write-Host "CANDIDATE_NIC vm=$name switch=$($a.SwitchName) mac=$($a.MacAddress) ips=$($a.IPAddresses -join ',')"
            }
          }
          Write-Host '===MIGRATION_SOURCE_TREE==='
          $ms='C:\LayerSentryLab\migration-source'
          if(Test-Path $ms){
            Get-ChildItem -LiteralPath $ms -Recurse -Force -ErrorAction SilentlyContinue |
              Select-Object -First 200 FullName,Length,LastWriteTime |
              Format-Table -AutoSize -Wrap
          }
          Write-Host '===MIGRATION_ASSETS==='
          Get-ChildItem -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(?i)(oneswap|migration|virtio|hyperv|qcow2)' } |
            Select-Object -First 200 FullName,Length,LastWriteTime |
            Format-Table -AutoSize -Wrap
          Write-Host '===SOURCE_HOST_SSH==='
          Get-Service sshd -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType | Format-Table -AutoSize
          Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object {$_.IPAddress -notmatch '^127\.'} |
            Select-Object InterfaceAlias,IPAddress,PrefixLength |
            Format-Table -AutoSize

      - name: Read-only connectivity matrix
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $ips = New-Object System.Collections.Generic.HashSet[string]
          foreach($vm in (Get-VM)){
            foreach($a in (Get-VMNetworkAdapter -VM $vm -ErrorAction SilentlyContinue)){
              foreach($ip in $a.IPAddresses){
                if($ip -match '^\d+\.\d+\.\d+\.\d+$' -and $ip -notmatch '^169\.254\.'){
                  [void]$ips.Add($ip)
                }
              }
            }
          }
          foreach($ip in @('10.10.10.21','10.10.10.22','10.10.10.23','10.250.10.40')){
            [void]$ips.Add($ip)
          }
          foreach($ip in ($ips | Sort-Object)){
            foreach($port in @(22,2633,2616,9443)){
              $r=Test-NetConnection -ComputerName $ip -Port $port -WarningAction SilentlyContinue
              Write-Host "CONNECT ip=$ip port=$port tcp=$($r.TcpTestSucceeded)"
            }
          }
          Write-Host '===HOST_STORAGE==='
          Get-PSDrive -PSProvider FileSystem | ForEach-Object {
            [pscustomobject]@{
              Name=$_.Name
              FreeGB=[math]::Round($_.Free/1GB,1)
              UsedGB=[math]::Round($_.Used/1GB,1)
            }
          } | Format-Table -AutoSize
