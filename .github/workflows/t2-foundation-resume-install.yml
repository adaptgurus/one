name: T2 Foundation Resume Install

on:
  push:
    branches:
      - ops/t2-foundation-iso-qualification-20260921
    paths:
      - .github/workflows/t2-foundation-resume-install.yml

permissions:
  contents: read

concurrency:
  group: t2-foundation-resume-install
  cancel-in-progress: true

jobs:
  resume:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - name: Bind current disposable VM
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $n='ls-appliance-4c4ac81-qual'
          $vm=Get-VM -Name $n -ErrorAction Stop
          $fw=Get-VMFirmware -VMName $n
          if($fw.SecureBoot -ne 'Off'){throw "Secure Boot must remain Off"}
          if($vm.State -ne 'Running'){Start-VM -Name $n; Start-Sleep -Seconds 10}
          Write-Host "VM_BIND=PASS SECURE_BOOT=OFF"

      - name: Open Installation Destination and capture
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $n='ls-appliance-4c4ac81-qual'
          function Kbd {
            $vm=Get-CimInstance -Namespace root/virtualization/v2 -ClassName Msvm_ComputerSystem | ? ElementName -eq $n | select -First 1
            Get-CimAssociatedInstance -InputObject $vm -Namespace root/virtualization/v2 -ResultClassName Msvm_Keyboard | select -First 1
          }
          function Text([string]$s){$r=Invoke-CimMethod -InputObject (Kbd) -MethodName TypeText -Arguments @{asciiText=$s}; if([int]$r.ReturnValue -ne 0){throw "TypeText rc=$($r.ReturnValue)"}}
          function Key([uint32]$k){$r=Invoke-CimMethod -InputObject (Kbd) -MethodName TypeKey -Arguments @{keyCode=$k}; if([int]$r.ReturnValue -ne 0){throw "TypeKey rc=$($r.ReturnValue)"}}
          Text '5'; Key 13
          Start-Sleep -Seconds 6
          $p='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\resume-destination.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM $n -Out $p
          Write-Host ("SCREENSHOT_resume_destination_B64="+[Convert]::ToBase64String([IO.File]::ReadAllBytes($p)))
