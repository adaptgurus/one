name: LayerSentry Manoj Recovered VM12 Diagnostics

on:
  push:
    branches:
      - dr-threepoint-ssh-20260924
    paths:
      - ".github/workflows/layersentry-manoj-vm12-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect recovered VM 12
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'MANOJ-TEST-INST') { throw "Wrong runner" }
          $script = @'
          import pathlib, xml.etree.ElementTree as ET
          from xmlrpc.client import ServerProxy
          from dissect.target import Target
          t=Target.open(r"C:\LayerSentryLab\Recovery\fe2-lvm\2.img")
          auth=t.fs.path("/var/lib/one/.one/one_auth").open("rb").read().decode().strip()
          one=ServerProxy("http://10.250.10.10:2633/RPC2", allow_none=True)
          for vm_id in (1,4,12):
              res=one.one.vm.info(auth,vm_id,False)
              if not res[0]:
                  print(f"VM{vm_id}_INFO_ERROR="+str(res[1])[:300])
                  continue
              root=ET.fromstring(res[1])
              prefix=f"VM{vm_id}"
              print(prefix+"_NAME="+str(root.findtext("NAME") or ""))
              print(prefix+"_STATE="+str(root.findtext("STATE")))
              print(prefix+"_LCM_STATE="+str(root.findtext("LCM_STATE")))
              print(prefix+"_DEPLOY_ID="+str(root.findtext("DEPLOY_ID") or ""))
              print(prefix+"_STIME="+str(root.findtext("STIME") or ""))
              print(prefix+"_ETIME="+str(root.findtext("ETIME") or ""))
              histories=root.findall("./HISTORY_RECORDS/HISTORY")
              print(prefix+"_HOST="+str(histories[-1].findtext("HOSTNAME") if histories else ""))
              print(prefix+"_PIN_POLICY="+str(root.findtext("./TEMPLATE/TOPOLOGY/PIN_POLICY") or ""))
              print(prefix+"_NUMA_CPUS="+repr([x.text for x in root.findall("./TEMPLATE/NUMA_NODE/CPUS") if x.text]))
              print(prefix+"_CPU="+str(root.findtext("./TEMPLATE/CPU") or ""))
              print(prefix+"_VCPU="+str(root.findtext("./TEMPLATE/VCPU") or ""))
              print(prefix+"_GUEST_AGENT="+str(root.findtext("./TEMPLATE/FEATURES/GUEST_AGENT") or ""))
              print(prefix+"_ERROR="+str(root.findtext("./USER_TEMPLATE/ERROR") or ""))
          hp=one.one.hostpool.info(auth,-2,-1,-1)
          if hp[0]:
              pool=ET.fromstring(hp[1])
              for h in pool.findall("HOST"):
                  if (h.findtext("NAME") or "").strip()=="ls-kvm2":
                      print("KVM2_FREE_CPU="+str(h.findtext("./HOST_SHARE/FREE_CPU") or ""))
                      print("KVM2_USED_CPU="+str(h.findtext("./HOST_SHARE/CPU_USAGE") or ""))
                      print("KVM2_RUNNING_VMS="+str(h.findtext("./HOST_SHARE/RUNNING_VMS") or ""))
          '@
          $p=Join-Path $env:RUNNER_TEMP 'vm12diag.py'
          Set-Content -Path $p -Value $script -Encoding UTF8
          & 'C:\LayerSentryLab\tools\Python313\python.exe' $p
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

