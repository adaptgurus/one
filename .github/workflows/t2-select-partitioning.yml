name: T2 Select Disposable Partitioning

on:
  push:
    branches:
      - ops/t2-live-evidence-4c4ac81
    paths:
      - .github/workflows/t2-select-partitioning.yml

permissions:
  contents: read

concurrency:
  group: t2-select-partitioning
  cancel-in-progress: true

jobs:
  select:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Re-bind exact disposable disk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $name='ls-appliance-4c4ac81-qual'
          $expected='C:\LayerSentryLab\qualification\ls-appliance-4c4ac81-qual\os.vhdx'
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "VM not running: $($vm.State)"}
          $disks=@(Get-VMHardDiskDrive -VMName $name)
          if($disks.Count -ne 1 -or $disks[0].Path -ne $expected){throw 'Disposable disk binding changed'}
          $vhd=Get-VHD -Path $expected
          if($vhd.Size -ne 85899345920){throw "Unexpected VHD size $($vhd.Size)"}
          Write-Host 'PARTITION_DISK_BIND=PASS'

      - name: Select Use All Space
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $vm=Get-WmiObject -Namespace root\virtualization\v2 -Class Msvm_ComputerSystem | Where-Object ElementName -eq $name
          $kb=Get-WmiObject -Namespace root\virtualization\v2 -Query "ASSOCIATORS OF {$($vm.__PATH)} WHERE ResultClass=Msvm_Keyboard"
          if(-not $kb){throw 'Hyper-V keyboard missing'}
          $r=$kb.TypeKey([uint32]0x32)
          if($r.ReturnValue -ne 0){throw 'VK_2 injection failed'}
          Start-Sleep -Seconds 3

      - name: Capture partitioning selection
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\partitioning-use-all-space.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not (Test-Path $out)){throw 'Partitioning framebuffer missing'}

      - name: Upload partitioning selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-partitioning-use-all-space
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\partitioning-use-all-space.png
          if-no-files-found: error
          retention-days: 7