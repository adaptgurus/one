name: Manoj OneSwap PR19 RCT Fix Deploy

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-pr19-rct-fix-deploy.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-pr19-rct-fix-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Bind Manoj and preserve source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "Source must stay Running: $($vm.State)"}
          if(@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has checkpoints'}
          if((Get-VM -Name 'ls-appliance-qual' -ErrorAction Stop).State -ne 'Running'){throw 'OneSwap appliance not Running'}
          Write-Host 'SOURCE_PROTECTION_BEFORE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-pr19-rct-fix.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download exact PR19 helper
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sha='b27531a1630e74267b80aa1efac8480791f94c64'
          $url="https://raw.githubusercontent.com/adaptgurus/one-swap/$sha/hyperv_hot_helper.rb"
          $file=Join-Path $env:RUNNER_TEMP 'hyperv_hot_helper.pr19.rb'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $file
          if(-not (Test-Path $file)){throw 'PR19 helper download failed'}
          $hash=(Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          Write-Host "PR19_LOCAL_SHA256=$hash"
          "PR19_HELPER=$file" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PR19_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Copy and install exact helper on OneSwap appliance
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $remote='/tmp/hyperv_hot_helper.pr19.rb'
          & scp.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY $env:PR19_HELPER "ci@10.250.10.32:$remote"
          if($LASTEXITCODE -ne 0){throw "scp PR19 helper failed rc=$LASTEXITCODE"}
          $cmd=@'
          set -euo pipefail
          src=/tmp/hyperv_hot_helper.pr19.rb
          dst=/usr/lib/one/ruby/cli/one_helper/hyperv_hot_helper.rb
          expected="__EXPECTED__"
          actual=$(sha256sum "$src" | awk '{print $1}')
          [ "$actual" = "$expected" ]
          sudo ruby -c "$src"
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          sudo cp -a "$dst" "$dst.before-pr19-$stamp"
          sudo install -o root -g root -m 0644 "$src" "$dst"
          installed=$(sudo sha256sum "$dst" | awk '{print $1}')
          [ "$installed" = "$expected" ]
          sudo ruby -c "$dst"
          sudo grep -q 'RCT reference point disk/id arrays differ after export' "$dst"
          sudo grep -q 'ExportedDisks on the WMI export job contains virtual-disk instance IDs' "$dst"
          sudo grep -q 'DestroyReferencePoint' "$dst"
          rm -f "$src"
          echo "ONESWAP_PR19_RCT_FIX_DEPLOY=PASS sha256=$installed"
          '@
          $cmd=$cmd.Replace('__EXPECTED__',$env:PR19_SHA256)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($cmd,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw "PR19 install failed rc=$LASTEXITCODE"}

      - name: Verify source invariant
        if: always()
        shell: powershell
        run: |
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          Write-Host "SOURCE_AFTER_STATE=$($vm.State)"
          Write-Host "SOURCE_AFTER_CHECKPOINTS=$n"
          if($vm.State -ne 'Running'){throw 'PR19 deploy changed source state'}
          if($n -ne 0){throw 'PR19 deploy created checkpoint'}
          Write-Host 'SOURCE_PROTECTION_AFTER=PASS'
