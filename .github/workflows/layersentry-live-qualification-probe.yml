name: LayerSentry live qualification probe

on:
  push:
    branches:
      - ops/layersentry-live-qualification-20260919

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Runner and lab connectivity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== RUNNER ==='
          whoami
          hostname
          Get-NetIPConfiguration | Select-Object InterfaceAlias,IPv4Address,IPv4DefaultGateway | Format-List
          Get-NetRoute -AddressFamily IPv4 | Sort-Object DestinationPrefix | Select-Object DestinationPrefix,NextHop,InterfaceAlias,RouteMetric | Format-Table -AutoSize
          Write-Host '=== SSH MATERIAL (filenames only) ==='
          $sshDir = Join-Path $env:USERPROFILE '.ssh'
          if (Test-Path $sshDir) {
            Get-ChildItem $sshDir -File | Select-Object Name,Length | Format-Table -AutoSize
          } else {
            Write-Host 'NO_SSH_DIR'
          }
          Write-Host '=== LAB TCP/HTTP ==='
          $ips = @('10.250.10.10','10.250.10.11','10.250.10.12','10.250.10.13','10.250.10.20','10.250.10.21')
          $ports = @(22,2616,2633)
          foreach ($ip in $ips) {
            $open = @()
            foreach ($p in $ports) {
              $c = New-Object System.Net.Sockets.TcpClient
              try {
                $a = $c.BeginConnect($ip,$p,$null,$null)
                $ok = $a.AsyncWaitHandle.WaitOne(500)
                if ($ok) { $c.EndConnect($a) }
                if ($c.Connected) { $open += $p }
              } catch {} finally { $c.Close() }
            }
            Write-Host "$ip OPEN=$($open -join ',')"
          }
          Write-Host '=== BATCH SSH TRUST ==='
          $ssh = Join-Path $env:WINDIR 'System32\OpenSSH\ssh.exe'
          if (Test-Path $ssh) {
            foreach ($ip in @('10.250.10.11','10.250.10.12','10.250.10.13','10.250.10.20','10.250.10.21')) {
              foreach ($user in @('oneadmin','root','opc')) {
                $out = & $ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=3 "$user@$ip" 'printf "HOST=%s USER=%s\n" "$(hostname)" "$(id -un)"' 2>$null
                if ($LASTEXITCODE -eq 0 -and $out) {
                  Write-Host "$ip $user $out"
                  break
                }
              }
            }
          } else {
            Write-Host 'SSH_NOT_INSTALLED'
          }
