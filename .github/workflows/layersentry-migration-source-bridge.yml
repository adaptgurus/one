name: LayerSentry Migration Source Bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: layersentry-migration-source-bridge
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'qual/hyperv-migration-live-20260924'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    steps:
      - name: Bind exact source-validation runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){ throw "wrong runner: $env:RUNNER_NAME" }
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){ throw "wrong host: $env:COMPUTERNAME" }
          Write-Host "RUNNER_BOUND=$env:RUNNER_NAME"

      - name: Bind disposable guest seed
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification\ls-migration-source-test'
          foreach($p in @('network-config','user-data','source_ci_ed25519')){
            if(-not(Test-Path -LiteralPath (Join-Path $root $p))){ throw "missing source qualification asset: $p" }
          }
          $network=Get-Content -Raw -LiteralPath (Join-Path $root 'network-config')
          $userData=Get-Content -Raw -LiteralPath (Join-Path $root 'user-data')
          $ipv4=[regex]::Matches($network,'(?<![0-9])(?:10|172|192)\.[0-9]+\.[0-9]+\.[0-9]+') |
            ForEach-Object {$_.Value} | Where-Object {$_ -ne '10.250.10.1'} | Select-Object -First 1
          $userMatch=[regex]::Match($userData,'(?m)^\s*-?\s*name:\s*([A-Za-z0-9_.-]+)\s*$')
          if(-not $ipv4){ throw 'no seeded source IPv4 found' }
          if(-not $userMatch.Success){ throw 'no seeded source SSH username found' }
          $user=$userMatch.Groups[1].Value
          "SOURCE_IP=$ipv4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SOURCE_SEED ip=$ipv4 user=$user"

      - name: Verify disposable guest SSH
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification\ls-migration-source-test'
          $key=Join-Path $root 'source_ci_ed25519'
          $known=Join-Path $env:RUNNER_TEMP 'source-known-hosts'
          ssh-keyscan.exe -T 5 $env:SOURCE_IP 2>$null | Out-File -FilePath $known -Encoding ascii
          if((Get-Item $known).Length -eq 0){ throw "source guest SSH host key unavailable at $env:SOURCE_IP" }
          ssh.exe -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $key "$env:SOURCE_USER@$env:SOURCE_IP" "hostname; id -un; uname -a; lsblk -b -o NAME,TYPE,SIZE,MOUNTPOINTS"
          if($LASTEXITCODE -ne 0){ throw "source guest SSH failed: $LASTEXITCODE" }
          Write-Host 'SOURCE_GUEST_SSH=PASS'

      - name: Discover exact LayerSentry source on authorized builder
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $key='C:\LayerSentryLab\qualification\iso-builder-key'
          $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          foreach($p in @($key,$known)){if(-not(Test-Path -LiteralPath $p)){throw "missing builder trust asset: $p"}}
          $cmd=@'
set -euo pipefail
echo "BUILDER_HOST=$(hostname) USER=$(id -un)"
for p in /home/builder/layersentry-platform /home/builder/*/layersentry-platform /opt/layersentry-platform /srv/layersentry-platform; do
  [ -d "$p/.git" ] || continue
  echo "BUILDER_REPO=$p"
  git -C "$p" rev-parse HEAD
  git -C "$p" status --porcelain
done
'@
          ssh.exe -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $key builder@10.250.10.40 $cmd
          if($LASTEXITCODE -ne 0){ throw "builder discovery failed: $LASTEXITCODE" }

      - name: Check exact PR89 source availability on builder
        shell: powershell
        env:
          EXPECTED_SHA: e5a0c7e0101b47dc80e1378cbd69b7614e905ca1
        run: |
          $ErrorActionPreference='Stop'
          $key='C:\LayerSentryLab\qualification\iso-builder-key'
          $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          $cmd=@"
set -euo pipefail
repo=''
for p in /home/builder/layersentry-platform /home/builder/*/layersentry-platform /opt/layersentry-platform /srv/layersentry-platform; do
  if [ -d "\$p/.git" ]; then repo="\$p"; break; fi
done
[ -n "\$repo" ] || { echo BUILDER_REPO_MISSING; exit 20; }
if ! git -C "\$repo" cat-file -e '$env:EXPECTED_SHA^{commit}' 2>/dev/null; then
  git -C "\$repo" fetch --depth=1 origin '$env:EXPECTED_SHA'
fi
git -C "\$repo" cat-file -e '$env:EXPECTED_SHA^{commit}'
echo "EXACT_SOURCE=$env:EXPECTED_SHA"
"@
          ssh.exe -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $key builder@10.250.10.40 $cmd
          if($LASTEXITCODE -ne 0){ throw "exact source unavailable on builder: $LASTEXITCODE" }
