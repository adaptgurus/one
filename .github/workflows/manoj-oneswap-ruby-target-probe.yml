name: Manoj OneSwap Ruby OpenNebula Target Probe

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-ruby-target-probe.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-ruby-target-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind exact Manoj and source invariant
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source not Running: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has checkpoints'}
          if((Get-VM -Name 'ls-fe2').State -ne 'Off'){throw 'FE2 must remain Off'}
          Write-Host 'SOURCE_BEFORE=PASS'

      - name: Prepare restricted appliance key and block baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-ruby-target.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $before=& ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $tmp "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          if($LASTEXITCODE -ne 0){throw 'appliance block baseline failed'}
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($before -join [Environment]::NewLine)))
          "ONESWAP_BLOCKS_BEFORE_B64=$b64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach FE2 read-only authority child
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $fe2=(Get-VMHardDiskDrive -VMName 'ls-fe2' -ErrorAction Stop | Where-Object {$_.Path} | Sort-Object ControllerNumber,ControllerLocation | Select-Object -First 1).Path
          if(-not $fe2){throw 'FE2 disk missing'}
          $audit=Join-Path 'C:\LayerSentryLab\qualification' ("fe2-ruby-target-$env:GITHUB_RUN_ID.vhdx")
          New-VHD -Path $audit -ParentPath $fe2 -Differencing -ErrorAction Stop | Out-Null
          Add-VMHardDiskDrive -VMName 'ls-appliance-qual' -ControllerType SCSI -Path $audit -ErrorAction Stop
          "FE2_AUDIT_VHD=$audit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 3

      - name: Probe exact Ruby target calls with hard timeout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $beforeText=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:ONESWAP_BLOCKS_BEFORE_B64))
          $before=@($beforeText -split [Environment]::NewLine | Where-Object {$_})
          $after=& ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          if($LASTEXITCODE -ne 0){throw 'appliance block inventory failed'}
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
            if [ "$exists" = "true" ]; then auth=$(sudo guestfish --ro -a "$dev" -i cat "$p"); break; fi
          done
          [ -n "$auth" ]
          tmp=$(mktemp)
          trap 'rm -f "$tmp" /tmp/ls-ruby-target-probe.rb' EXIT
          printf '%s\n' "$auth" > "$tmp"
          chmod 600 "$tmp"
          export ONE_AUTH="$tmp"
          export ONE_XMLRPC="http://10.250.10.11:2633/RPC2"
          cat >/tmp/ls-ruby-target-probe.rb <<'RUBY'
          require 'opennebula'
          require 'timeout'
          c=OpenNebula::Client.new
          started=Process.clock_gettime(Process::CLOCK_MONOTONIC)
          Timeout.timeout(15) do
            ds=OpenNebula::Datastore.new(OpenNebula::Datastore.build_xml(1),c)
            rc=ds.info
            raise "datastore info failed: #{rc.message}" if OpenNebula.is_error?(rc)
          end
          puts "RUBY_DATASTORE_INFO_MS=#{((Process.clock_gettime(Process::CLOCK_MONOTONIC)-started)*1000).round}"
          started=Process.clock_gettime(Process::CLOCK_MONOTONIC)
          Timeout.timeout(15) do
            vn=OpenNebula::VirtualNetwork.new(OpenNebula::VirtualNetwork.build_xml(0),c)
            rc=vn.info
            raise "vnet info failed: #{rc.message}" if OpenNebula.is_error?(rc)
          end
          puts "RUBY_VNET_INFO_MS=#{((Process.clock_gettime(Process::CLOCK_MONOTONIC)-started)*1000).round}"
          puts 'RUBY_OPENNEBULA_TARGET_PROBE=PASS'
          RUBY
          timeout --signal=TERM --kill-after=5s 45s ruby /tmp/ls-ruby-target-probe.rb
          '@
          $script=$script.Replace('__DEV__',$dev)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw "Ruby target probe failed rc=$LASTEXITCODE"}

      - name: Cleanup authority child
        if: always()
        shell: powershell
        run: |
          $audit=$env:FE2_AUDIT_VHD
          if($audit){
            Get-VMHardDiskDrive -VMName 'ls-appliance-qual' -ErrorAction SilentlyContinue | Where-Object {$_.Path -eq $audit} | Remove-VMHardDiskDrive -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            if(Test-Path $audit){Remove-Item -Force $audit -ErrorAction Stop}
          }
          Write-Host 'RUBY_TARGET_AUTH_CHILD_CLEANUP=PASS'

      - name: Verify source invariant
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count
          Write-Host "SOURCE_AFTER_STATE=$($src.State)"
          Write-Host "SOURCE_AFTER_CHECKPOINTS=$n"
          if($src.State -ne 'Running'){throw 'Probe changed source state'}
          if($n -ne 0){throw 'Probe found/created checkpoint'}
          if((Get-VM -Name 'ls-fe2').State -ne 'Off'){throw 'FE2 state changed'}
          Write-Host 'SOURCE_AFTER=PASS'
