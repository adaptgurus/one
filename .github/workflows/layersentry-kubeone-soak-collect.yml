name: LayerSentry KubeOne soak evidence collection

on:
  workflow_dispatch:
  push:
    branches:
      - ops/layersentrydr-probe-20260927

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kubeone-soak-collect]')
    runs-on: [self-hosted, Linux, X64, layersentryol7]
    timeout-minutes: 10
    steps:
      - name: Collect and summarize sanitized soak evidence
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = layersentryol7
          test "$(hostname -s)" = layersentryol7
          test "$(id -u)" = 0
          ip -4 -o addr show | grep -Eq '(^|[[:space:]])172\.17\.60\.36/26([[:space:]]|$)'

          out="$RUNNER_TEMP/kubeone-20h-soak-20260927-01"
          rm -rf -- "$out"
          mkdir -m 0700 "$out"
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          scan=$(ssh-keyscan -T 5 -t ed25519 172.17.60.30 2>/dev/null)
          test "$(printf '%s\n' "$scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}')" = 'SHA256:6afuQP+psnYc8jzRX6lgK3zi4vZpPDcqLat0vgxwcDw'
          printf '%s\n' "$scan" >"$work/known_hosts"
          chmod 0600 "$work/known_hosts"
          stage=locate_dc_access
          trap 'echo "KUBEONE_SOAK_COLLECT_FAIL_STAGE=$stage" >&2; rm -rf -- "$work"' ERR EXIT

          dc_key=''
          dc_user=''
          while IFS= read -r candidate; do
            test -f "$candidate" || continue
            test "$(stat -c '%a' "$candidate")" -le 600 || continue
            ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || continue
            test "$(ssh-keygen -lf "$candidate" -E sha256 | awk '{print $2}')" = 'SHA256:5kGypCbn+e25po9b1DRvS6kxaGc+iQuZH4UE1YfDqNA' || continue
            for candidate_user in layersentry-deploy root; do
              if ssh -i "$candidate" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o "UserKnownHostsFile=$work/known_hosts" -o ConnectTimeout=5 "$candidate_user@172.17.60.30" \
                'test "$(hostname -s)" = layersentry1 && { test "$(id -u)" -eq 0 || sudo -n true; }' >/dev/null 2>&1; then
                dc_key="$candidate"
                dc_user="$candidate_user"
                break 2
              fi
            done
          done < <(find /root/.ssh /home /opt -xdev -type f -perm -u+r ! -perm /077 ! -name '*.pub' ! -name '*known_hosts*' 2>/dev/null | sort -u)
          test -n "$dc_key"

          ssh_dc=(ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" "$dc_user@172.17.60.30")
          stage=locate_soak_output
          source_host=''
          soak_available=false
          source_dir=/var/lib/layersentry/evidence/kubeone-20h-soak-20260927-01
          if test -f "$source_dir/samples.csv" && test -f "$source_dir/events.log"; then
            cp -- "$source_dir/samples.csv" "$out/samples.csv"
            cp -- "$source_dir/events.log" "$out/events.log"
            source_host=layersentryol7
            soak_available=true
          elif "${ssh_dc[@]}" 'test "$(hostname -s)" = layersentry1; ip -4 -o addr show dev enp6s18 | grep -Eq "(^|[[:space:]])172\\.17\\.60\\.30/26([[:space:]]|$)"; if test "$(id -u)" -eq 0; then SUDO=""; else SUDO="sudo -n"; fi; test "$($SUDO id -u)" = 0; $SUDO test -f /var/lib/layersentry/evidence/kubeone-20h-soak-20260927-01/samples.csv; $SUDO test -f /var/lib/layersentry/evidence/kubeone-20h-soak-20260927-01/events.log'; then
            "${ssh_dc[@]}" 'if test "$(id -u)" -eq 0; then cat /var/lib/layersentry/evidence/kubeone-20h-soak-20260927-01/samples.csv; else sudo -n cat /var/lib/layersentry/evidence/kubeone-20h-soak-20260927-01/samples.csv; fi' >"$out/samples.csv"
            "${ssh_dc[@]}" 'if test "$(id -u)" -eq 0; then cat /var/lib/layersentry/evidence/kubeone-20h-soak-20260927-01/events.log; else sudo -n cat /var/lib/layersentry/evidence/kubeone-20h-soak-20260927-01/events.log; fi' >"$out/events.log"
            source_host=layersentry1
            soak_available=true
          else
            {
              echo '# KubeOne soak evidence collection'
              echo
              echo 'Result: MISSING_OUTPUT'
              echo
              echo 'The expected samples.csv and events.log were absent from both the authorized runner and DC frontend.'
            } >"$out/SUMMARY.md"
            find /var/lib/layersentry/evidence -maxdepth 3 -type f -printf 'layersentryol7 %p %s bytes\n' 2>/dev/null | sort >"$out/AVAILABLE_FILES.txt" || true
            "${ssh_dc[@]}" 'if test "$(id -u)" -eq 0; then SUDO=""; else SUDO="sudo -n"; fi; $SUDO find /var/lib/layersentry/evidence -maxdepth 3 -type f -printf "layersentry1 %p %s bytes\\n" 2>/dev/null | sort' >>"$out/AVAILABLE_FILES.txt" || true
          fi

          stage=validate_soak_output
          if test "$soak_available" = true; then
          test "$(head -n1 "$out/samples.csv")" = 'timestamp,elapsed_seconds,cluster,ready_nodes,total_nodes,kube_system_nonready,total_restarts,api_ready,result'
          grep -Eq ' SOAK_START duration_seconds=72000 interval_seconds=60$' "$out/events.log"
          complete=$(grep -Ec ' SOAK_COMPLETE samples=[0-9]+ failures=[0-9]+$' "$out/events.log" || true)
          rows=$(awk 'END {print NR-1}' "$out/samples.csv")
          max_elapsed=$(awk -F, 'NR>1 && $2+0>m {m=$2+0} END {print m+0}' "$out/samples.csv")
          failed=$(awk -F, 'NR>1 && $9!="PASS" {n++} END {print n+0}' "$out/samples.csv")
          start=$(awk -F, 'NR==2 {print $1}' "$out/samples.csv")
          end=$(awk -F, 'NR>1 {v=$1} END {print v}' "$out/samples.csv")
          {
            echo '# KubeOne multi-cluster 20-hour soak evidence'
            echo
            echo "- Collected at: $(date -Is)"
            echo "- Source host: $source_host"
            echo "- First sample: $start"
            echo "- Last sample: $end"
            echo "- Maximum elapsed seconds: $max_elapsed"
            echo "- Sample rows: $rows"
            echo "- Failed cluster samples: $failed"
            echo "- Completion marker count: $complete"
            echo
            for cluster in a b c; do
              awk -F, -v c="$cluster" 'NR>1 && $3==c {n++; if($9=="PASS") p++; else f++} END {printf "- Cluster %s: samples=%d pass=%d fail=%d\n",toupper(c),n+0,p+0,f+0}' "$out/samples.csv"
            done
          } >"$out/SUMMARY.md"
          (cd "$out" && sha256sum SUMMARY.md events.log samples.csv >SHA256SUMS)
          echo "KUBEONE_SOAK_COLLECTION rows=$rows failures=$failed complete=$complete max_elapsed=$max_elapsed"
          test "$complete" -eq 1
          test "$max_elapsed" -ge 72000
          test "$failed" -eq 0
          fi

          stage=collect_current_health
          mkdir -m 0700 "$out/current-health"
          echo 'cluster,ready_nodes,total_nodes,kube_system_nonready,total_restarts,api_ready,result' >"$out/current-health/results.csv"
          current_failures=0
          for cluster in a b c; do
            kubeconfig="/var/lib/layersentry/kubeone/tenant-${cluster}/layersentry-k1${cluster}/layersentry-k1${cluster}-kubeconfig"
            "${ssh_dc[@]}" "sudo -n /usr/local/bin/kubectl --kubeconfig '$kubeconfig' get nodes -o wide" >"$out/current-health/cluster-${cluster}-nodes.txt"
            "${ssh_dc[@]}" "sudo -n /usr/local/bin/kubectl --kubeconfig '$kubeconfig' -n kube-system get pods -o wide" >"$out/current-health/cluster-${cluster}-kube-system-pods.txt"
            "${ssh_dc[@]}" "sudo -n /usr/local/bin/kubectl --kubeconfig '$kubeconfig' get --raw=/readyz" >"$out/current-health/cluster-${cluster}-readyz.txt"
            "${ssh_dc[@]}" "sudo -n /usr/local/bin/kubectl --kubeconfig '$kubeconfig' version -o json" >"$out/current-health/cluster-${cluster}-version.json"
            total=$(awk 'NR>1 {n++} END {print n+0}' "$out/current-health/cluster-${cluster}-nodes.txt")
            ready=$(awk 'NR>1 && $2=="Ready" {n++} END {print n+0}' "$out/current-health/cluster-${cluster}-nodes.txt")
            nonready=$(awk 'NR>1 && $3!="Running" && $3!="Completed" {n++} END {print n+0}' "$out/current-health/cluster-${cluster}-kube-system-pods.txt")
            restarts=$(awk 'NR>1 {sum+=$4} END {print sum+0}' "$out/current-health/cluster-${cluster}-kube-system-pods.txt")
            api_ready=0
            test "$(tr -d '\r\n' <"$out/current-health/cluster-${cluster}-readyz.txt")" = ok && api_ready=1
            result=FAIL
            if test "$total" -ge 5 && test "$ready" -eq "$total" && test "$nonready" -eq 0 && test "$api_ready" -eq 1; then result=PASS; else current_failures=$((current_failures + 1)); fi
            echo "$cluster,$ready,$total,$nonready,$restarts,$api_ready,$result" >>"$out/current-health/results.csv"
          done
          {
            echo
            echo '## Current three-cluster health check'
            echo
            echo "- Collected at: $(date -Is)"
            while IFS=, read -r cluster ready total nonready restarts api result; do
              test "$cluster" = cluster && continue
              echo "- Cluster ${cluster^^}: ready=$ready/$total, kube-system nonready=$nonready, restarts=$restarts, API ready=$api, result=$result"
            done <"$out/current-health/results.csv"
          } >>"$out/SUMMARY.md"
          (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS)
          echo "KUBEONE_CURRENT_HEALTH failures=$current_failures"
          test "$current_failures" -eq 0
          trap - ERR EXIT
          rm -rf -- "$work"

      - name: Upload sanitized KubeOne soak logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubeone-20h-soak-20260927-01
          path: ${{ runner.temp }}/kubeone-20h-soak-20260927-01/
          if-no-files-found: error
          retention-days: 30
