name: Two Node Foundation Install

on:
  push:
    branches:
      - lab/seven-node-foundation-20260926
    paths:
      - '.github/workflows/two-node-foundation-install.yml'
      - 'lab/seven-node/two-node-foundation-install.sh'

permissions:
  contents: read

concurrency:
  group: two-node-foundation-install
  cancel-in-progress: false

jobs:
  install:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Execute exact two-node NFS-only Foundation install
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME COMPUTERNAME=$env:COMPUTERNAME SLOT=${{ matrix.slot }}"
          if($env:RUNNER_NAME -ine 'WIN-GK6MO7T7OPC' -or $env:COMPUTERNAME -ine 'WIN-GK6MO7T7OPC'){
            Write-Host 'NON_TARGET_HOLD'
            Start-Sleep -Seconds 120
            exit 0
          }
          $dir='C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $key=Join-Path $dir 'deploy_ed25519'
          $known=Join-Path $dir 'known_hosts'
          $script=Join-Path $env:RUNNER_TEMP 'two-node-foundation-install.sh'
          $url="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/lab/seven-node/two-node-foundation-install.sh"
          & curl.exe -fsSL $url -o $script
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $script)){ throw 'Exact install script fetch failed' }
          & scp.exe -i $key -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" $script layersentry-deploy@172.17.60.30:/tmp/two-node-foundation-install.sh
          if($LASTEXITCODE -ne 0){ throw 'Install script transfer failed' }
          & scp.exe -i $key -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" $key layersentry-deploy@172.17.60.30:/tmp/layersentry-deploy-key
          if($LASTEXITCODE -ne 0){ throw 'Deployment key transfer failed' }
          $prepare="sudo -n install -d -m 700 /root/layersentry-two-node-foundation; sudo -n install -m 600 /tmp/layersentry-deploy-key /root/layersentry-two-node-foundation/deploy_ed25519; rm -f /tmp/layersentry-deploy-key; sudo -n chmod 700 /tmp/two-node-foundation-install.sh; sudo -n /tmp/two-node-foundation-install.sh ${{ github.run_id }}"
          & ssh.exe -T -i $key -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" layersentry-deploy@172.17.60.30 $prepare
          if($LASTEXITCODE -ne 0){ throw "Two-node Foundation install failed rc=$LASTEXITCODE" }
          Write-Host TWO_NODE_FOUNDATION_WORKFLOW=PASS
