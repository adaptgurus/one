name: Manoj OneSwap Runtime Load Path Audit
# rerun-after-hot-helper-repair-20260925

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-runtime-loadpath-audit.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-runtime-loadpath-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind Manoj and preserve source Off
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw 'Wrong runner'}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw 'Wrong host'}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($vm.State -ne 'Off'){throw "Source must stay Off: $($vm.State)"}
          Write-Host 'LOADPATH_SOURCE_GATE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-loadpath.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Audit actual Ruby helper resolution and hashes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          echo '===CANDIDATES==='
          sudo find /usr/lib/one /usr/share/one -type f \( -path '*/one_helper/hyperv_hot_helper.rb' -o -path '*/one_helper/hyperv_helper.rb' \) -print 2>/dev/null | sort | while read f; do
            echo "CANDIDATE=$f SHA=$(sha256sum "$f" | awk '{print $1}')"
          done
          echo '===CLI HASH==='
          sha256sum /usr/bin/oneswap-hyperv
          echo '===RUNTIME RESOLUTION==='
          sudo ruby -e '
            one_location=ENV["ONE_LOCATION"]
            if one_location
              ruby_lib=File.join(one_location,"lib","ruby")
              gems=File.join(one_location,"share","gems")
            else
              ruby_lib="/usr/lib/one/ruby"
              gems="/usr/share/one/gems"
            end
            if File.directory?(gems)
              begin
                require "rubygems"
                Gem.use_paths(File.realpath(gems))
              rescue
              end
            end
            $LOAD_PATH << ruby_lib
            $LOAD_PATH << File.join(ruby_lib,"cli")
            class OneSwapHelper; end
            require "one_helper/hyperv_helper"
            require "one_helper/hyperv_hot_helper"
            hf=$LOADED_FEATURES.grep(/one_helper\/hyperv_helper\.rb$/).last
            hh=$LOADED_FEATURES.grep(/one_helper\/hyperv_hot_helper\.rb$/).last
            require "digest"
            puts "RUNTIME_HYPERV_HELPER=#{hf}"
            puts "RUNTIME_HYPERV_HELPER_SHA=#{Digest::SHA256.file(hf).hexdigest}"
            puts "RUNTIME_HOT_HELPER=#{hh}"
            puts "RUNTIME_HOT_HELPER_SHA=#{Digest::SHA256.file(hh).hexdigest}"
            puts "LOAD_PATH="+$LOAD_PATH.select{|p| p.include?("/one")}.join("|")
          '
          echo 'RUNTIME_LOADPATH_AUDIT=PASS'
          '@
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'Runtime load path audit failed'}

      - name: Re-prove source Off
        if: always()
        shell: powershell
        run: |
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          Write-Host "FINAL_SOURCE_STATE=$($vm.State)"
          if($vm.State -ne 'Off'){throw 'Audit changed source state'}
          Write-Host 'LOADPATH_SOURCE_INVARIANT=PASS'
