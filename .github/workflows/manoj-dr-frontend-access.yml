name: Manoj DR frontend maintenance access

on:
  push:
    branches:
      - qual/manoj-dr-opennebula-20260923
    paths:
      - .github/workflows/manoj-dr-frontend-access.yml
      - .github/scripts/manoj-fe1-authorize.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Bind HA safety and prepare builder key
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ine 'MANOJ-TEST-INST') { throw 'wrong runner' }
          $fe3 = Test-NetConnection -ComputerName '10.250.10.13' -Port 2633 -WarningAction SilentlyContinue
          if (-not $fe3.TcpTestSucceeded) { throw 'FE3 is not healthy; refusing FE1 maintenance' }

          $source='C:\LayerSentryLab\qualification\iso-builder-key'
          $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          foreach ($p in @($source,$known)) {
            if (-not (Test-Path $p)) { throw "Missing $p" }
          }

          & icacls.exe $source /grant:r '*S-1-5-18:(R)' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'grant builder-key read failed' }
          & icacls.exe $known /grant:r '*S-1-5-18:(R)' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'grant known-hosts read failed' }

          $private=Join-Path $env:RUNNER_TEMP 'dr-builder-key'
          Copy-Item -LiteralPath $source -Destination $private -Force
          & icacls.exe $private /inheritance:r | Out-Null
          & icacls.exe $private /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe $source /remove:g '*S-1-5-18' | Out-Null

          "DR_BUILDER_KEY=$private" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DR_BUILDER_KNOWN=$known" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create scoped DR maintenance key
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $key='C:\LayerSentryLab\qualification\dr-maint-key'
          if (-not (Test-Path $key)) {
            $proc = Start-Process -FilePath ssh-keygen.exe -ArgumentList @(
              '-q','-t','ed25519','-N','""',
              '-C','layersentry-dr-qualification-20260923',
              '-f',$key
            ) -NoNewWindow -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw 'failed to create DR maintenance key' }
          }
          & icacls.exe $key /inheritance:r | Out-Null
          & icacls.exe $key /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe "$key.pub" /grant:r '*S-1-5-18:(R)' | Out-Null
          "DR_MAINT_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host 'DR_MAINT_KEY_READY=PASS'

      - name: Inject oneadmin public key offline into FE1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vmName='ls-fe1'
          $builder='ls-iso-builder'
          $used=@(Get-VMHardDiskDrive -VMName $builder | Where-Object { $_.ControllerType -eq 'SCSI' } | ForEach-Object { [int]$_.ControllerLocation })
          $slot=(4..31 | Where-Object { $used -notcontains $_ } | Select-Object -First 1)
          if ($null -eq $slot) { throw 'no free builder SCSI slot is available' }
          Write-Host "DR_TEMP_SCSI_SLOT=$slot"
          $disk=(Get-VMHardDiskDrive -VMName $vmName | Select-Object -First 1).Path
          if (-not $disk) { throw 'FE1 OS disk not found' }

          $attached=$false
          try {
            if ((Get-VM -Name $vmName).State -ne 'Off') {
              Stop-VM -Name $vmName -Force -Confirm:$false
            }

            Add-VMHardDiskDrive -VMName $builder -ControllerType SCSI -ControllerNumber 0 -ControllerLocation $slot -Path $disk
            $attached=$true
            Start-Sleep -Seconds 3

            $pub=(Get-Content "$env:DR_MAINT_KEY.pub" -Raw).Trim()
            $pub64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pub))
            $helper=Join-Path $env:GITHUB_WORKSPACE '.github\scripts\manoj-fe1-authorize.sh'

            & scp.exe -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$env:DR_BUILDER_KNOWN" -i $env:DR_BUILDER_KEY $helper builder@10.250.10.40:/tmp/manoj-fe1-authorize.sh
            if ($LASTEXITCODE -ne 0) { throw 'failed to copy FE1 auth helper to builder' }

            & ssh.exe -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$env:DR_BUILDER_KNOWN" -i $env:DR_BUILDER_KEY builder@10.250.10.40 "bash /tmp/manoj-fe1-authorize.sh $slot '$pub64'"
            if ($LASTEXITCODE -ne 0) { throw 'offline FE1 key injection failed' }
          }
          finally {
            if ($attached) {
              Remove-VMHardDiskDrive -VMName $builder -ControllerType SCSI -ControllerNumber 0 -ControllerLocation $slot -ErrorAction SilentlyContinue
            }
            if ((Get-VM -Name $vmName).State -eq 'Off') {
              Start-VM -Name $vmName
            }
          }

      - name: Verify FE1 oneadmin access and OpenNebula state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ready=$false
          for ($i=0; $i -lt 40; $i++) {
            $tcp=Test-NetConnection -ComputerName '10.250.10.10' -Port 22 -WarningAction SilentlyContinue
            if ($tcp.TcpTestSucceeded) {
              $ready=$true
              break
            }
            Start-Sleep -Seconds 3
          }
          if (-not $ready) { throw 'FE1 SSH did not return' }

          & ssh.exe -i $env:DR_MAINT_KEY -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL oneadmin@10.250.10.10 'hostname; id; onehost list; onedatastore list; onevm list'
          if ($LASTEXITCODE -ne 0) { throw 'FE1 oneadmin maintenance access failed' }
          Write-Host 'MANOJ_FE1_ONEADMIN_ACCESS=PASS'

      - name: Verify FE HA services recovered
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bad=@()
          foreach ($ip in @('10.250.10.10','10.250.10.13')) {
            $ok=$false
            for ($i=0; $i -lt 30; $i++) {
              $tcp=Test-NetConnection -ComputerName $ip -Port 2633 -WarningAction SilentlyContinue
              if ($tcp.TcpTestSucceeded) { $ok=$true; break }
              Start-Sleep -Seconds 2
            }
            Write-Host "FE_HEALTH IP=$ip ONED_2633=$ok"
            if (-not $ok) { $bad += $ip }
          }
          if ($bad.Count -gt 0) { throw "OpenNebula FE health not restored: $($bad -join ',')" }
