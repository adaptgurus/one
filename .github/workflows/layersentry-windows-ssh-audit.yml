name: LayerSentry Windows SSH audit

on:
  workflow_dispatch:
  push:
    branches: [ops/layersentrydr-probe-20260927]
    paths: [.github/workflows/layersentry-windows-ssh-audit.yml]

permissions:
  contents: read

concurrency:
  group: layersentry-windows-ssh-audit
  cancel-in-progress: false

jobs:
  audit:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind to the authorized Windows access computer
        id: target
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -eq 'WIN-GK6MO7T7OPC' -and $env:COMPUTERNAME -eq 'WIN-GK6MO7T7OPC') {
            "eligible=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Output "TARGET_WINDOWS_OK runner=$env:RUNNER_NAME computer=$env:COMPUTERNAME"
          } else {
            "eligible=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Output "SKIP_UNRELATED_WINDOWS_RUNNER runner=$env:RUNNER_NAME computer=$env:COMPUTERNAME"
          }

      - name: Inspect bootstrap key permissions and trusted host files
        if: steps.target.outputs.eligible == 'true'
        id: sshmeta
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $key = Join-Path $base 'deploy_ed25519'
          if (-not (Test-Path -LiteralPath $key -PathType Leaf)) {
            throw 'Existing deploy_ed25519 key is absent'
          }
          $item = Get-Item -LiteralPath $key
          Write-Output "key_path=$($item.FullName) size=$($item.Length)"
          $acl = Get-Acl -LiteralPath $key
          Write-Output "key_owner=$($acl.Owner)"
          foreach ($entry in $acl.Access) {
            Write-Output "key_acl=$($entry.IdentityReference):$($entry.FileSystemRights):$($entry.AccessControlType):inherited=$($entry.IsInherited)"
          }
          $trusted = @()
          foreach ($name in @('alma-known-hosts', 'known_hosts', 'readonly-known-hosts')) {
            $path = Join-Path $base $name
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              & ssh-keygen.exe -F '172.17.60.40' -f $path *> $null
              if ($LASTEXITCODE -eq 0) {
                $trusted += $path
                Write-Output "trusted_dr_entry=$name"
              }
              & ssh-keygen.exe -F '172.17.60.30' -f $path *> $null
              if ($LASTEXITCODE -eq 0) {
                Write-Output "trusted_dc_entry=$name"
              }
            }
          }
          Write-Output "trusted_dr_entry_count=$($trusted.Count)"

      - name: Pin the independently verified DR host key
        if: steps.target.outputs.eligible == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $known = Join-Path $base 'readonly-known-hosts'
          $expected = 'SHA256:qOEu7khxLLpUIwS4RYyc7p5Vg/27MmZKr3YNtLWVTpI'
          $savedPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $scanRaw = @(& ssh-keyscan.exe -T 5 -t ed25519 172.17.60.40 2>$null)
          $scanExit = $LASTEXITCODE
          $ErrorActionPreference = $savedPreference
          $scan = @($scanRaw | Where-Object { $_ -match '^172\.17\.60\.40 ssh-ed25519 ' })
          if ($scanExit -ne 0 -or $scan.Count -ne 1) { throw 'Expected exactly one live ED25519 DR host key' }
          $fingerprint = ($scan | & ssh-keygen.exe -lf - -E sha256) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $fingerprint -notmatch [regex]::Escape($expected)) {
            throw 'Live DR host key does not match the independently verified fingerprint'
          }
          & ssh-keygen.exe -F '172.17.60.40' -f $known *> $null
          if ($LASTEXITCODE -ne 0) {
            Add-Content -LiteralPath $known -Value $scan[0] -Encoding Ascii
            Write-Output 'DR_HOST_KEY_PINNED=YES'
          } else {
            Write-Output 'DR_HOST_KEY_PINNED=ALREADY_PRESENT'
          }
          & ssh-keygen.exe -F '172.17.60.40' -f $known *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Pinned DR host key readback failed' }

      - name: Report the existing bootstrap public key
        if: steps.target.outputs.eligible == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $publicKey = 'C:\ProgramData\LayerSentryLab\seven-node-bootstrap\deploy_ed25519.pub'
          if (-not (Test-Path -LiteralPath $publicKey -PathType Leaf)) { throw 'Bootstrap public key is absent' }
          $line = (Get-Content -LiteralPath $publicKey -Raw).Trim()
          if ($line -notmatch '^ssh-ed25519 [A-Za-z0-9+/=]+(?: .*)?$') { throw 'Bootstrap public key format is invalid' }
          & ssh-keygen.exe -lf $publicKey -E sha256
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap public key fingerprint failed' }
          Write-Output "DR_BOOTSTRAP_PUBLIC_KEY=$line"

      - name: Test the retained key against exact DR identity
        if: steps.target.outputs.eligible == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $key = Join-Path $base 'deploy_ed25519'
          $known = $null
          foreach ($name in @('alma-known-hosts', 'known_hosts', 'readonly-known-hosts')) {
            $path = Join-Path $base $name
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              & ssh-keygen.exe -F '172.17.60.40' -f $path *> $null
              if ($LASTEXITCODE -eq 0) { $known = $path; break }
            }
          }
          if (-not $known) { throw 'No retained trusted DR host-key entry' }
          $result = & ssh.exe -i $key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" root@172.17.60.40 'hostname -s; id -u; ip -4 -o addr show dev enp6s18' 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Output 'DR_KEY_AUTH=FAILED'
            $result | Select-Object -Last 3
            exit 42
          }
          $text = $result -join "`n"
          if ($text -notmatch '(?m)^layersentrydr\s*$' -or $text -notmatch '(?m)^0\s*$' -or $text -notmatch '172\.17\.60\.40/26') {
            throw 'SSH authenticated but exact DR hostname, root UID, or address did not match'
          }
          Write-Output 'DR_KEY_AUTH=PASS exact_target=layersentrydr/172.17.60.40 uid=0'

      - name: Test retained key for read-only DC inventory
        if: steps.target.outputs.eligible == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $key = Join-Path $base 'deploy_ed25519'
          $savedPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $dcScanRaw = @(& ssh-keyscan.exe -T 5 -t ed25519 172.17.60.30 2>$null)
          $dcScanExit = $LASTEXITCODE
          $ErrorActionPreference = $savedPreference
          $dcScan = @($dcScanRaw | Where-Object { $_ -match '^172\.17\.60\.30 ssh-ed25519 ' })
          if ($dcScanExit -ne 0 -or $dcScan.Count -ne 1) {
            Write-Output 'DC_KEY_AUTH=NOT_TESTED reason=live_host_key_unavailable'
            exit 0
          }
          $liveFingerprintText = ($dcScan | & ssh-keygen.exe -lf - -E sha256) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fingerprint live DC host key' }
          $liveFingerprint = ([regex]::Match($liveFingerprintText, 'SHA256:[A-Za-z0-9+/]+')).Value
          if (-not $liveFingerprint) { throw 'Live DC host-key digest is absent' }
          Write-Output "DC_LIVE_HOST_KEY=$liveFingerprint"
          $known = $null
          foreach ($name in @('alma-known-hosts', 'known_hosts', 'readonly-known-hosts')) {
            $path = Join-Path $base $name
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $stored = @(& ssh-keygen.exe -F '172.17.60.30' -f $path 2>$null)
              if ($LASTEXITCODE -eq 0) {
                $storedFingerprintText = ($stored | & ssh-keygen.exe -lf - -E sha256) -join "`n"
                $storedFingerprint = ([regex]::Match($storedFingerprintText, 'SHA256:[A-Za-z0-9+/]+')).Value
                Write-Output "DC_STORED_HOST_KEY file=$name fingerprint=$storedFingerprint"
                if ($LASTEXITCODE -eq 0 -and $storedFingerprint -eq $liveFingerprint) { $known = $path; break }
              }
            }
          }
          if (-not $known) {
            Write-Output 'DC_KEY_AUTH=NOT_TESTED reason=no_matching_retained_trusted_host_entry'
            exit 0
          }
          $ErrorActionPreference = 'Continue'
          $identity = & ssh.exe -i $key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" root@172.17.60.30 'hostname -s; id -u; ip -4 -o addr show' 2>&1
          $identityExit = $LASTEXITCODE
          $ErrorActionPreference = $savedPreference
          if ($identityExit -ne 0) {
            Write-Output 'DC_KEY_AUTH=FAILED'
            $identity | Select-Object -Last 3
            exit 0
          }
          $identityText = $identity -join "`n"
          if ($identityText -notmatch '(?m)^0\s*$' -or $identityText -notmatch '172\.17\.60\.30/26') {
            throw 'SSH authenticated but exact DC root UID or address did not match'
          }
          Write-Output 'DC_KEY_AUTH=PASS exact_address=172.17.60.30 uid=0'
          & ssh.exe -i $key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" root@172.17.60.30 'echo OPENNEBULA_VERSION; oneversion || true; echo HOSTS; onehost list || true; echo VMS; onevm list || true; echo LAYERSENTRY_UNITS; systemctl list-unit-files --no-pager | grep -Ei "layersentry|replication" || true; echo DR_ENDPOINTS; for u in http://127.0.0.1:2616/v1/dr/capabilities http://127.0.0.1:2616/fireedge/api/v1/dr/capabilities; do c=$(curl -sS --max-time 5 -o /dev/null -w "%{http_code}" "$u" || true); echo "$c $u"; done'
          if ($LASTEXITCODE -ne 0) { throw 'Read-only DC inventory command failed' }
