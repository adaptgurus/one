name: T2 Cancel Stale Root Diagnostic

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-cancel-stale-root-diag.yml
      - qualification/t2-cancel-stale-root-diag.request

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale local-fix fetch probe run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cancel.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/35687463960/cancel")
          cat /tmp/cancel.out || true
          case "$code" in 202|409) ;; *) echo "cancel HTTP $code" >&2; exit 1 ;; esac
          echo "STALE_FIX_PROBE_CANCEL_REQUEST=PASS http=$code"