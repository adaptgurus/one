name: LayerSentry Portal Browser Qualification

on:
  push:
    branches:
      - qa/layersentry-ui-browser-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Locked FireEdge install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install ephemeral Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build actual LayerSentry PortalShell browser harness
        run: ./node_modules/.bin/webpack --config tests/layersentry/portal-browser-qualification/webpack.config.cjs
      - name: Chromium desktop and mobile acceptance
        env:
          QUALIFIED_HEAD: 8097fef2256985f79437dbefba8515d791d50057
        run: |
          python3 -m http.server 4174 --directory tests/layersentry/portal-browser-qualification/dist >/tmp/layersentry-browser-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ >/dev/null
          node tests/layersentry/portal-browser-qualification/smoke.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layersentry-portal-browser-evidence
          path: src/fireedge/tests/layersentry/portal-browser-qualification/evidence
          if-no-files-found: warn
