name: Manoj independent OpenNebula DR qualification

on:
  push:
    branches:
      - qual/manoj-dr-opennebula-20260923
    paths:
      - .github/workflows/manoj-independent-dr-qual.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Probe independent OpenNebula FE and KVM access
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            @{ Role='FE'; IP='10.250.10.10' },
            @{ Role='KVM'; IP='10.250.10.20' }
          )
          $users = @('root','opc','oneadmin')
          $results = @()

          foreach ($target in $targets) {
            $success = $false
            foreach ($user in $users) {
              $remote = "$user@$($target.IP)"
              $command = if ($target.Role -eq 'FE') {
                'hostname; id; command -v onehost || true; onehost list 2>/dev/null || true; oned --version 2>/dev/null || true; systemctl is-active opennebula 2>/dev/null || true'
              } else {
                'hostname; id; virsh list --all 2>/dev/null || sudo -n virsh list --all 2>/dev/null || true; systemctl is-active libvirtd 2>/dev/null || systemctl is-active virtqemud 2>/dev/null || true'
              }

              $output = & ssh.exe -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=6 $remote $command 2>&1
              $code = $LASTEXITCODE
              Write-Host "SSH_PROBE ROLE=$($target.Role) IP=$($target.IP) USER=$user EXIT=$code"
              if ($output) { $output | ForEach-Object { Write-Host $_ } }
              if ($code -eq 0) {
                $results += [pscustomobject]@{ Role=$target.Role; IP=$target.IP; User=$user; Success=$true }
                $success = $true
                break
              }
            }
            if (-not $success) {
              $results += [pscustomobject]@{ Role=$target.Role; IP=$target.IP; User=''; Success=$false }
            }
          }

          $results | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\manoj-opennebula-access.json"
          $failed = @($results | Where-Object { -not $_.Success })
          if ($failed.Count -gt 0) {
            throw "Independent OpenNebula SSH access is incomplete: $($failed.Role -join ',')"
          }

      - name: Verify persisted Tester checkpoint is present
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $checkpoint = 'C:\LayerSentryLab\dr-checkpoints\layersentry-dr-two-site-20260923-0104'
          $manifest = Join-Path $checkpoint 'checkpoint-manifest.json'
          $archive = Join-Path $checkpoint 'checkpoint-vm220-restic.tar.gz'
          $receipt = Join-Path $checkpoint 'manoj-verification.json'
          foreach ($file in @($manifest,$archive,$receipt)) {
            if (-not (Test-Path $file)) { throw "Missing persisted DR evidence: $file" }
          }
          $m = Get-Content $manifest -Raw | ConvertFrom-Json
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $m.archive_sha256) { throw 'Persisted checkpoint checksum mismatch' }
          Write-Host "PERSISTED_CHECKPOINT_ID=$($m.checkpoint_id)"
          Write-Host "PERSISTED_CHECKPOINT_SHA256=$hash"
          Write-Host "PERSISTED_CHECKPOINT_BYTES=$((Get-Item $archive).Length)"

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: manoj-independent-opennebula-probe
          path: ${{ runner.temp }}\manoj-opennebula-access.json
          retention-days: 3
          if-no-files-found: error
