name: LayerSentry self-service UI preservation
on:
  pull_request:
    paths:
      - 'src/fireedge/src/client/apps/sunstone/**'
      - 'src/fireedge/src/modules/components/primitives/Sidebar/**'
      - 'src/fireedge/tests/layersentry/**'
      - '.github/workflows/layersentry-self-service-ui.yml'
permissions:
  contents: read
concurrency:
  group: layersentry-self-service-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Install the unchanged dependency lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Presentation and native source-contract tests
        run: node --test tests/layersentry/*.test.cjs
      - name: Build changed client bundle
        run: NODE_ENV=production npm run build-client
      - name: Build changed shared component bundle
        run: NODE_ENV=production npm run build:cpm
      - name: Build server-side rendering bundle
        run: NODE_ENV=production npm run build-server
