name: Manoj OneSwap Reflink Fix

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-reflink-fix.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-reflink-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind Manoj and protect migration path
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source must be Running: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has checkpoints'}
          if((Get-VM -Name 'ls-appliance-qual').State -ne 'Running'){throw 'OneSwap appliance not Running'}
          Write-Host 'PROTECTED_PATH_BEFORE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $srcKey='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-reflink-fix.key'
          Copy-Item -Force $srcKey $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          $pub=(& ssh-keygen.exe -y -f $tmp 2>$null | Select-Object -First 1)
          if($LASTEXITCODE -ne 0 -or -not $pub){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch exact installed OneSwap reflink hardening
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          expected_head="0178dea061b13bf37d766ae8bb46456aaaf5d985"
          mapfile -t files < <(sudo grep -RIl --include='hyperv_import_recovery_hardening.rb' -- '--reflink=always' /usr /opt 2>/dev/null || true)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "REFLINK_PATCH_FILE_COUNT=${#files[@]}"
            printf 'CANDIDATE=%s\n' "${files[@]:-}"
            exit 41
          fi
          file="${files[0]}"
          echo "REFLINK_PATCH_FILE=$file"
          old=$(sudo grep -o -- '--sparse=always' "$file" | wc -l)
          auto=$(sudo grep -o -- '--sparse=auto' "$file" | wc -l)
          echo "REFLINK_BEFORE sparse_always=$old sparse_auto=$auto"
          if [ "$old" -eq 0 ] && [ "$auto" -ge 2 ]; then
            echo "REFLINK_PATCH_ALREADY_APPLIED=PASS"
          else
            if [ "$old" -ne 2 ]; then
              echo "Unexpected --sparse=always count: $old"
              exit 42
            fi
            backup="${file}.pre-${expected_head}"
            sudo cp -a "$file" "$backup"
            sudo sed -i 's/--sparse=always/--sparse=auto/g' "$file"
            echo "REFLINK_BACKUP=$backup"
          fi
          old2=$(sudo grep -o -- '--sparse=always' "$file" | wc -l)
          auto2=$(sudo grep -o -- '--sparse=auto' "$file" | wc -l)
          echo "REFLINK_AFTER sparse_always=$old2 sparse_auto=$auto2"
          test "$old2" -eq 0
          test "$auto2" -ge 2
          sudo ruby -c "$file"
          echo "ONESWAP_REFLINK_FIX_HEAD=$expected_head"
          echo "ONESWAP_REFLINK_FIX=PASS"
          '@
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw "OneSwap reflink appliance patch failed rc=$LASTEXITCODE"}

      - name: Confirm protected source unchanged
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count
          Write-Host "SOURCE_AFTER_STATE=$($src.State)"
          Write-Host "SOURCE_AFTER_CHECKPOINTS=$n"
          if($src.State -ne 'Running' -or $n -ne 0){throw 'Source invariant changed'}
          if((Get-VM -Name 'ls-appliance-qual').State -ne 'Running'){throw 'OneSwap appliance state changed'}
          Write-Host 'PROTECTED_PATH_AFTER=PASS'
