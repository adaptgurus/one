name: Manoj HyperV Authenticated OneSwap Preflight
# rerun-with-bounded-hot-preflight

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-hyperv-auth-preflight.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-auth-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Bind Manoj and protect migration path
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source must be Running: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has checkpoints'}
          if((Get-VM -Name 'ls-appliance-qual').State -ne 'Running'){throw 'OneSwap appliance is not Running'}
          if((Get-VM -Name 'ls-fe2').State -ne 'Off'){throw 'FE2 authority VM must stay Off'}
          Write-Host 'PROTECTED_PATH_BEFORE=PASS'

      - name: Prepare restricted appliance key and block baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $srcKey='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-auth-preflight.key'
          Copy-Item -Force $srcKey $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          $pub=(& ssh-keygen.exe -y -f $tmp 2>$null | Select-Object -First 1)
          if($LASTEXITCODE -ne 0 -or -not $pub){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $before=& ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $tmp "ci@10.250.10.32" "lsblk -dnro NAME | sort" 2>$null
          if($LASTEXITCODE -ne 0){throw 'Unable to capture OneSwap block baseline'}
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($before -join [Environment]::NewLine)))
          "ONESWAP_BLOCKS_BEFORE_B64=$encoded" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach FE2 read-only authority child
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $fe2Disk=(Get-VMHardDiskDrive -VMName 'ls-fe2' -ErrorAction Stop | Where-Object {$_.Path} | Sort-Object ControllerNumber,ControllerLocation | Select-Object -First 1).Path
          if(-not $fe2Disk){throw 'FE2 OS disk not found'}
          $audit=Join-Path 'C:\LayerSentryLab\qualification' ("fe2-preflight-auth-$env:GITHUB_RUN_ID.vhdx")
          New-VHD -Path $audit -ParentPath $fe2Disk -Differencing -ErrorAction Stop | Out-Null
          Add-VMHardDiskDrive -VMName 'ls-appliance-qual' -ControllerType SCSI -Path $audit -ErrorAction Stop
          "FE2_AUDIT_VHD=$audit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 3

      - name: Run authenticated OneSwap hot preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $beforeText=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:ONESWAP_BLOCKS_BEFORE_B64))
          $before=@($beforeText -split [Environment]::NewLine | Where-Object {$_})
          $after=& ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort" 2>$null
          if($LASTEXITCODE -ne 0){throw 'Unable to capture OneSwap block inventory'}
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected exactly one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
            if [ "$exists" = "true" ]; then
              auth=$(sudo guestfish --ro -a "$dev" -i cat "$p")
              echo "TARGET_AUTHORITY_PATH=$p"
              break
            fi
          done
          [ -n "$auth" ]
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          printf '%s\n' "$auth" > "$tmp"
          chmod 600 "$tmp"
          export ONE_AUTH="$tmp"
          export ONE_XMLRPC="http://10.250.10.11:2633/RPC2"
          operation="manoj-hv-ls-migration-source-test-20260924"
          echo "TARGET_NETWORK_POLICY=explicit-test-map source=10.250.10.31/24 target_vnet=0 target_name=dev_web_network preserve_source_l2=false"
          echo "EXPECTED_GUEST_MACS=00:15:5d:00:1c:07"
          echo "QUALIFIED_SECURE_UEFI=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd source_template=MicrosoftUEFICertificateAuthority"
          set +e
          out=$(timeout --signal=TERM --kill-after=10s 300s sudo -E /usr/bin/oneswap-hyperv ls-migration-source-test --hot --preflight --operation-id "$operation" --hyperv-connection manoj-qual --config-file /etc/layersentry/oneswap/manoj-qual.yaml --guest-os linux --expected-guest-macs 00:15:5d:00:1c:07 --uefi-sec-path /usr/share/OVMF/OVMF_CODE_4M.secboot.fd --qemu-ga --datastore 1 --network 0 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out" | sed -E 's/(password|secret|token|authorization|one_auth)[^ ]*/\1=<redacted>/Ig'
          if [ "$rc" -ne 0 ]; then
            echo "ONESWAP_HOT_PREFLIGHT=FAIL rc=$rc"
            exit "$rc"
          fi
          echo "ONESWAP_HOT_PREFLIGHT=PASS operation_id=$operation datastore=1 network=0"
          '@
          $script=$script.Replace('__DEV__',$dev)
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw "Authenticated OneSwap hot preflight failed rc=$LASTEXITCODE"}

      - name: Detach and delete FE2 authority child
        if: always()
        shell: powershell
        run: |
          $audit=$env:FE2_AUDIT_VHD
          if($audit){
            Get-VMHardDiskDrive -VMName 'ls-appliance-qual' -ErrorAction SilentlyContinue |
              Where-Object {$_.Path -eq $audit} |
              Remove-VMHardDiskDrive -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            if(Test-Path $audit){Remove-Item -Force $audit -ErrorAction Stop}
          }
          Write-Host 'FE2_PREFLIGHT_AUTH_CHILD_CLEANUP=PASS'

      - name: Verify source invariant after preflight
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count
          Write-Host "SOURCE_AFTER_STATE=$($src.State)"
          Write-Host "SOURCE_AFTER_CHECKPOINTS=$n"
          if($src.State -ne 'Running'){throw "Preflight changed source state: $($src.State)"}
          if($n -ne 0){throw 'Preflight created a source checkpoint'}
          if((Get-VM -Name 'ls-appliance-qual').State -ne 'Running'){throw 'OneSwap appliance changed state'}
          if((Get-VM -Name 'ls-fe2').State -ne 'Off'){throw 'FE2 authority VM changed state'}
          Write-Host 'PROTECTED_PATH_AFTER=PASS'
