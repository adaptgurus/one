name: T2 Exact-Head Firstboot Enrollment

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-firstboot-enroll.yml

permissions:
  contents: read

concurrency:
  group: t2-install-4c4ac81
  cancel-in-progress: true

jobs:
  enroll:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Bind exact Manoj runner and live VM
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $vm=Get-VM -Name 'ls-appliance-4c4ac81-qual' -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "Qualification VM not running: $($vm.State)"}
          Write-Host "FIRSTBOOT_VM=PASS state=$($vm.State) uptime=$($vm.Uptime)"

      - name: Prepare runner-private builder SSH key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='C:\LayerSentryLab\qualification\iso-builder-key'
          $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          foreach($p in @($source,$known)){if(-not(Test-Path $p)){throw "Missing $p"}}
          & icacls.exe $source /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe $known /grant:r '*S-1-5-18:(R)' | Out-Null
          $private=Join-Path $env:RUNNER_TEMP 't2-enroll-builder-key'
          Copy-Item -LiteralPath $source -Destination $private -Force
          & icacls.exe $private /grant:r '*S-1-5-18:(F)' | Out-Null
          & icacls.exe $private /setowner '*S-1-5-18' | Out-Null
          & icacls.exe $private /inheritance:r | Out-Null
          & icacls.exe $private /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe $source /remove:g '*S-1-5-18' | Out-Null
          "T2_ENROLL_BUILDER_KEY=$private" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'RUNNER_PRIVATE_ENROLL_KEY=PASS'

      - name: Generate fresh one-hour enrollment token on controller
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ssh=(Get-Command ssh.exe).Source
          $scp=(Get-Command scp.exe).Source
          $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          $remote=@'
          import json, os, ssl, urllib.request
          from pathlib import Path
          q=Path('/home/builder/layersentry-qual')
          admin=q.joinpath('admin.token').read_text(encoding='ascii').strip()
          ctx=ssl.create_default_context(cafile=str(q/'agent-ca.crt'))
          def call(method,path,payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request('https://10.250.10.40:9443'+path,data=body,method=method)
              req.add_header('Authorization','Bearer '+admin)
              if body is not None:req.add_header('Content-Type','application/json')
              with urllib.request.urlopen(req,context=ctx,timeout=10) as r:return json.loads(r.read().decode())
          st=call('GET','/v1/admin/enrollment-self-test')
          keys=('wrong_site_rejected','wrong_host_rejected','wrong_management_ip_rejected','correct_token_consumed','token_replay_rejected','expired_token_rejected')
          if not all(st.get(k) is True for k in keys): raise SystemExit('controller enrollment self-test failed')
          d=call('POST','/v1/admin/bootstrap',{'site':'qualification','host':'lsappliancequal','management_ip':'10.250.10.41','ttl_seconds':3600})
          p=q/'appliance-bootstrap-4c4ac81.token'
          p.write_text(d['token'],encoding='ascii'); os.chmod(p,0o600)
          print('BOOTSTRAP_READY',d.get('schema'),d.get('site'),d.get('host'),d.get('management_ip'),d.get('expires_at'))
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($remote -replace "`r",'')))
          & $ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $env:T2_ENROLL_BUILDER_KEY builder@10.250.10.40 "printf '%s' '$b64' | base64 -d | python3"
          if($LASTEXITCODE -ne 0){throw 'Fresh enrollment-token generation failed'}
          $local=Join-Path $env:RUNNER_TEMP "qual-enrollment-4c4ac81-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.token"
          & $scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $env:T2_ENROLL_BUILDER_KEY 'builder@10.250.10.40:/home/builder/layersentry-qual/appliance-bootstrap-4c4ac81.token' $local
          if($LASTEXITCODE -ne 0){throw 'Enrollment-token transfer failed'}
          & icacls.exe $local /inheritance:r | Out-Null
          & icacls.exe $local /grant:r '*S-1-5-18:(R)' | Out-Null
          $len=(Get-Content -Raw $local).Trim().Length
          if($len -lt 32){throw 'Enrollment token length invalid'}
          "T2_ENROLL_TOKEN_FILE=$local" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "FRESH_ENROLLMENT_TOKEN=PASS length=$len value=REDACTED file=$([IO.Path]::GetFileName($local))"

      - name: Generate fresh qualification-only local passwords
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function New-HexSecret([string]$Path){
            $bytes=New-Object byte[] 16
            $rng=[Security.Cryptography.RandomNumberGenerator]::Create(); try{$rng.GetBytes($bytes)} finally{$rng.Dispose()}
            $value=([BitConverter]::ToString($bytes)).Replace('-','').ToLowerInvariant()
            [IO.File]::WriteAllText($Path,$value,[Text.Encoding]::ASCII)
            & icacls.exe $Path /inheritance:r | Out-Null
            & icacls.exe $Path /grant:r '*S-1-5-18:(R)' | Out-Null
            if($value.Length -ne 32){throw 'Generated password length invalid'}
          }
          $supportPath=Join-Path $env:RUNNER_TEMP "qual-support-4c4ac81-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.password"
          $rootPath=Join-Path $env:RUNNER_TEMP "qual-root-4c4ac81-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.password"
          New-HexSecret $supportPath
          New-HexSecret $rootPath
          "T2_SUPPORT_PASSWORD_FILE=$supportPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "T2_ROOT_PASSWORD_FILE=$rootPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "QUALIFICATION_PASSWORDS=PASS values=REDACTED support_file=$([IO.Path]::GetFileName($supportPath)) root_file=$([IO.Path]::GetFileName($rootPath))"

      - name: Enter complete firstboot sequence without exposing credentials
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $q='C:\LayerSentryLab\qualification'
          $token=(Get-Content -Raw $env:T2_ENROLL_TOKEN_FILE).Trim()
          $support=(Get-Content -Raw $env:T2_SUPPORT_PASSWORD_FILE).Trim()
          $root=(Get-Content -Raw $env:T2_ROOT_PASSWORD_FILE).Trim()
          $kp=((Get-Content -Raw "$q\qual-support-ac7e14e-ed25519.pub").Trim() -split '\s+')
          $pub=$kp[0]+' '+$kp[1]
          if($token -notmatch '^[0-9A-Za-z]{32,128}$'){throw 'token charset rejected'}
          if($support -notmatch '^[0-9a-f]{32}$' -or $root -notmatch '^[0-9a-f]{32}$'){throw 'password charset rejected'}
          if($pub -notmatch '^ssh-ed25519 [A-Za-z0-9+/=]+$'){throw 'public-key charset rejected'}
          $ns='root\virtualization\v2'
          $vm=Get-CimInstance -Namespace $ns -ClassName Msvm_ComputerSystem | Where-Object ElementName -eq 'ls-appliance-4c4ac81-qual'
          $kbd=Get-CimAssociatedInstance -InputObject $vm -Namespace $ns -Association Msvm_SystemDevice -ResultClassName Msvm_Keyboard | Select-Object -First 1
          if(-not $kbd){throw 'VM keyboard not found'}
          function K([uint32]$k){Invoke-CimMethod -InputObject $kbd -MethodName TypeKey -Arguments @{KeyCode=$k}|Out-Null;Start-Sleep -Milliseconds 35}
          function SK([uint32]$k){Invoke-CimMethod -InputObject $kbd -MethodName PressKey -Arguments @{KeyCode=[uint32]0x10}|Out-Null;K $k;Invoke-CimMethod -InputObject $kbd -MethodName ReleaseKey -Arguments @{KeyCode=[uint32]0x10}|Out-Null}
          function T([string]$s){foreach($c in $s.ToCharArray()){
            if($c -ge 'a'-and$c -le 'z'){K ([uint32][char]([string]$c).ToUpperInvariant())}
            elseif($c -ge 'A'-and$c -le 'Z'){SK ([uint32][char]$c)}
            elseif($c -ge '0'-and$c -le '9'){K ([uint32][char]$c)}
            elseif($c -eq ' '){K 0x20}elseif($c -eq '.'){K 0xBE}elseif($c -eq '-'){K 0xBD}elseif($c -eq '/'){K 0xBF}elseif($c -eq ':'){SK 0xBA}elseif($c -eq '_'){SK 0xBD}elseif($c -eq '='){K 0xBB}elseif($c -eq '+'){SK 0xBB}
            else{throw ('unsupported character '+[int][char]$c)}};K 0x0D;Start-Sleep -Milliseconds 900}
          Write-Host 'Entering non-secret firstboot fields...'
          T '1'
          T 'lsappliancequal'
          T 'qualification'
          T '10.250.10.40:9443'
          T '10.250.10.41/24'
          T '10.250.10.1'
          T '1.1.1.1'
          Write-Host 'Entering protected qualification fields; values suppressed...'
          T $token
          T $support
          T $support
          T $root
          T $root
          T $pub
          Write-Host 'FIRSTBOOT_SEQUENCE_SENT=PASS secrets=REDACTED'

      - name: Wait for enrollment and capture console
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 75
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\post-enrollment-console.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not(Test-Path $out)){throw 'Post-enrollment console capture missing'}
          Write-Host "POST_ENROLLMENT_CAPTURE=PASS bytes=$((Get-Item $out).Length)"

      - name: Verify controller recorded exact host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ssh=(Get-Command ssh.exe).Source
          $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          $cmd="python3 /home/builder/layersentry-qual/inspect_controller_state_safe.py"
          & $ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $env:T2_ENROLL_BUILDER_KEY builder@10.250.10.40 $cmd
          if($LASTEXITCODE -ne 0){throw 'Controller state inspection failed'}

      - name: Upload post-enrollment console
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-post-enrollment-console
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\post-enrollment-console.png
          if-no-files-found: warn
          retention-days: 7

      - name: Remove runner-private builder key
        if: always()
        shell: powershell
        run: |
          if($env:T2_ENROLL_BUILDER_KEY -and(Test-Path $env:T2_ENROLL_BUILDER_KEY)){
            & icacls.exe $env:T2_ENROLL_BUILDER_KEY /grant:r '*S-1-5-18:(F)' | Out-Null
            Remove-Item -LiteralPath $env:T2_ENROLL_BUILDER_KEY -Force
          }