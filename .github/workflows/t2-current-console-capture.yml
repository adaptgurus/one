name: T2 Current Console Capture

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-current-console-capture.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Bind exact disposable VM
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $vm=Get-VM -Name 'ls-appliance-4c4ac81-qual' -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "VM not running: $($vm.State)"}
          Write-Host "VM_STATE=$($vm.State) UPTIME=$($vm.Uptime)"
      - name: Capture framebuffer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\current-console.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not(Test-Path $out)){throw 'Console capture missing'}
      - name: Upload framebuffer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-current-console
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\current-console.png
          if-no-files-found: error
          retention-days: 7