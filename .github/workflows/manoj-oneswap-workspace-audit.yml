name: Manoj OneSwap Workspace Audit

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-workspace-audit.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-workspace-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind Manoj and source invariant
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source not Running: $($src.State)"}
          if(@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Source has checkpoints'}
          Write-Host 'SOURCE_BEFORE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $srcKey='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-workspace-audit.key'
          Copy-Item -Force $srcKey $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Audit filesystems capacity and reflink support
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          echo '=== LSBLK ==='
          lsblk -o NAME,SIZE,FSTYPE,TYPE,MOUNTPOINTS
          echo '=== DF ==='
          df -hT
          echo '=== FINDMNT ==='
          findmnt -o TARGET,SOURCE,FSTYPE,OPTIONS
          echo '=== XFS INFO ==='
          for p in / /var /var/tmp /var/cache /var/cache/layersentry-oneswap /srv /mnt; do
            [ -e "$p" ] || continue
            echo "PATH=$p"
            df -PT "$p" | tail -1
            sudo xfs_info "$p" 2>&1 | grep -E 'meta-data|reflink=' || true
          done
          echo '=== CONFIG WORK DIR ==='
          sudo grep -nE '^[[:space:]]*:?(work_dir|format|http_transfer|http_host|http_port):' /etc/layersentry/oneswap/manoj-qual.yaml || true
          echo '=== REFLINK PROBES ==='
          for p in /var/tmp /var/cache/layersentry-oneswap /srv /mnt; do
            [ -d "$p" ] || continue
            src="$p/.ls-reflink-src-$$"
            dst="$p/.ls-reflink-dst-$$"
            set +e
            printf 'layersentry-reflink-probe' | sudo tee "$src" >/dev/null
            sudo cp --reflink=always --sparse=auto -- "$src" "$dst" >/tmp/reflink.out 2>/tmp/reflink.err
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "REFLINK_PROBE path=$p result=PASS"
            else
              echo "REFLINK_PROBE path=$p result=FAIL rc=$rc error=$(tr '\n' ' ' </tmp/reflink.err)"
            fi
            sudo rm -f "$src" "$dst" /tmp/reflink.out /tmp/reflink.err
          done
          echo WORKSPACE_AUDIT=PASS
          '@
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw "Workspace audit failed rc=$LASTEXITCODE"}

      - name: Source invariant after audit
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count
          if($src.State -ne 'Running' -or $n -ne 0){throw 'Source invariant changed'}
          Write-Host 'SOURCE_AFTER=PASS'
