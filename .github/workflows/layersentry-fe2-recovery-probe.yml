name: LayerSentry FE2 recovery access probe

on:
  push:
    branches:
      - fix/layersentry-vm-network-backup-20260921
    paths:
      - .github/workflows/layersentry-fe2-recovery-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Power on existing FE2 and verify bootstrap-key access
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vm = Get-VM -Name 'ls-fe2'
          if ($vm.State -eq 'Off' -or $vm.State -eq 'Saved') {
            Start-VM -Name 'ls-fe2'
          }
          $deadline = (Get-Date).AddMinutes(3)
          do {
            Start-Sleep -Seconds 3
            $probe = Test-NetConnection -ComputerName '10.250.10.12' -Port 22 -WarningAction SilentlyContinue
          } until ($probe.TcpTestSucceeded -or (Get-Date) -ge $deadline)
          if (-not $probe.TcpTestSucceeded) { throw 'ls-fe2 SSH did not become reachable' }

          $key = 'C:\LayerSentryLab\Recovery\ls-fe2-root-bootstrap'
          if (-not (Test-Path $key)) { throw 'existing FE2 bootstrap key is missing' }

          $remote = @'
          hostname
          id
          cat /etc/redhat-release
          systemctl is-active opennebula || true
          grep -E '^\s*SERVER_ID' /etc/one/oned.conf || true
          ip -br -4 addr
          ls -ld /var/lib/one/.one 2>/dev/null || true
          sudo -u oneadmin ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no ls-kvm1 'hostname; test -e /dev/kvm && echo KVM_DEVICE=PRESENT; systemctl is-active libvirtd || systemctl is-active virtqemud || true' || true
          '@

          & ssh -i $key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL root@10.250.10.12 $remote
          if ($LASTEXITCODE -ne 0) { throw "FE2 bootstrap-key SSH failed rc=$LASTEXITCODE" }
