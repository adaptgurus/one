name: T2 Confirm Empty Disk Partitioning

on:
  push:
    branches:
      - ops/t2-foundation-live-qual-20260921
    paths:
      - .github/workflows/t2-confirm-partitioning.yml

permissions:
  contents: read

concurrency:
  group: t2-exact-live-vm
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Bind exact disposable disk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw 'wrong runner'}
          $d=Get-VMHardDiskDrive -VMName 'ls-appliance-dbe-qual' -ControllerType SCSI -ControllerNumber 0 -ControllerLocation 0
          if($d.Path -ne 'C:\LayerSentryLab\qualification\ls-appliance-dbe-qual\os-4c4ac81-live.vhdx'){throw 'fresh disk mismatch'}
      - name: Accept preselected Use All Space
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ns='root\virtualization\v2'
          $vm=Get-CimInstance -Namespace $ns -ClassName Msvm_ComputerSystem|Where-Object ElementName -eq 'ls-appliance-dbe-qual'
          $kbd=Get-CimAssociatedInstance -InputObject $vm -Namespace $ns -Association Msvm_SystemDevice -ResultClassName Msvm_Keyboard|Select-Object -First 1
          if(-not $kbd){throw 'VM keyboard missing'}
          Invoke-CimMethod -InputObject $kbd -MethodName TypeKey -Arguments @{KeyCode=[uint32][char]'C'}|Out-Null
          Invoke-CimMethod -InputObject $kbd -MethodName TypeKey -Arguments @{KeyCode=[uint32]0x0D}|Out-Null
          Start-Sleep -Seconds 8
      - name: Capture resulting summary
        shell: powershell
        run: |
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\live\summary-partitioning-confirmed.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-dbe-qual' -Out $out
          if(-not(Test-Path $out) -or (Get-Item $out).Length -lt 1000){throw 'summary screenshot missing'}
      - name: Upload resulting summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-summary-partitioning-confirmed
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\live\summary-partitioning-confirmed.png
          if-no-files-found: error
          retention-days: 7