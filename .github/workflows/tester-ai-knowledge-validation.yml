name: Tester AI knowledge candidate validation
on:
  push:
    branches: [ops/tester-raft-galera-20260929]
    paths: [.github/workflows/tester-ai-knowledge-validation.yml]
permissions:
  contents: read
concurrency:
  group: tester-raft-galera-lab
  cancel-in-progress: false
jobs:
  knowledge-candidate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 7
    steps:
      - name: Bind exact tester identity and staged private source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = tester
          test "$(hostname -s)" = tester
          test "$(id -un)" = opc
          test "$(git -C /home/opc/layersentry-platform rev-parse HEAD)" = 9fa5b48105e3146b47dc65a10976b096d5099e6d
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('/home/opc/layersentry-ai-qualification-20260929')
          expected={'build_tester_cluster_candidate.py':'a7b06a0d31813c4837b532695ea7ad9562059b48','test_tester_cluster_candidate.py':'acbc1dbe357d307dbbc8067fefd9bf15e55a673f'}
          for name,blob in expected.items():
              raw=(root/name).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert actual==blob,(name,actual)
              print(name,'EXACT_PRIVATE_SOURCE_BLOB_OK',actual)
          print('KNOWLEDGE_SOURCE_COMMIT=135c1a332cf6a17c8603e3db545382129fc8ee81')
          PY
      - name: Execute candidate tests without promoting runtime knowledge
        shell: bash
        run: |
          set -euo pipefail
          cd /home/opc/layersentry-ai-qualification-20260929
          mkdir -p "validation-$GITHUB_RUN_ID"
          python3 -m unittest -v test_tester_cluster_candidate 2>&1 | tee "validation-$GITHUB_RUN_ID/unit-tests.log"
          python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          import build_tester_cluster_candidate as b
          root=Path.cwd();out=root/('validation-'+os.environ['GITHUB_RUN_ID'])
          audit=b.validate(root/'candidate-v1')
          (out/'static-audit.json').write_text(json.dumps(audit,indent=2)+'\n')
          assert audit['failed']==0
          report={'source':'135c1a332cf6a17c8603e3db545382129fc8ee81','scenario_count':20,'static_checks_passed':audit['passed'],'static_checks_failed':audit['failed'],'unit_tests_passed':8,'agent_installed':False,'runtime_pack_imported':False,'model_weights_updated':False,'autonomous_actions_enabled':False,'runtime_scenario_replay':'NOT_EXECUTED'}
          (out/'result.json').write_text(json.dumps(report,indent=2)+'\n')
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.is_file()))
          print(json.dumps(report,indent=2))
          print('CANDIDATE_TESTS_PASS_NOT_AGENT_DEPLOYMENT')
          PY
      - name: Independently audit infrastructure without claiming AI-driven operation
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/home/opc/layersentry-foundation-qual-20260929/venv/bin:$PATH
          python /home/opc/layersentry-platform/tools/lab/tester_cluster_health_audit.py
      - name: Upload sanitized test results only, never private source or runtime secrets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tester-ai-candidate-results-${{ github.run_id }}
          path: |
            /home/opc/layersentry-ai-qualification-20260929/validation-${{ github.run_id }}/
            /home/opc/layersentry-foundation-qual-20260929/evidence/independent-health-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: error
