name: LayerSentry Day2 Ruby Format

on:
  push:
    branches:
      - layersentry/p1-rke2-day2-production-20260913

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: layersentry/p1-rke2-day2-production-20260913
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: gem install rubocop -v 1.91.0
      - name: Safe auto-correct Day-2 files only
        run: |
          ln -sf "$GITHUB_WORKSPACE/share/linters/.rubocop.yml" "$HOME/.rubocop.yml"
          rubocop -a \
            src/oneks/app/controllers/lifecycle_controller.rb \
            src/oneks/app/models/dependencies/seed_vm_heartbeat.rb \
            src/oneks/app/models/groups/nodegroup_day2.rb \
            src/oneks/app/services/event_manager/event_manager_day2.rb \
            src/oneks/app/services/lifecycle_status.rb \
            src/oneks/lib/helpers/k8s_day2_helper.rb \
            src/oneks/test/day2_lifecycle_test.rb || true
      - name: Commit safe formatting
        run: |
          if git diff --quiet; then
            echo 'No safe formatting changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/oneks/app/controllers/lifecycle_controller.rb \
            src/oneks/app/models/dependencies/seed_vm_heartbeat.rb \
            src/oneks/app/models/groups/nodegroup_day2.rb \
            src/oneks/app/services/event_manager/event_manager_day2.rb \
            src/oneks/app/services/lifecycle_status.rb \
            src/oneks/lib/helpers/k8s_day2_helper.rb \
            src/oneks/test/day2_lifecycle_test.rb
          git commit -m 'style(oneks): align Day-2 code with repository Ruby style'
          git push origin HEAD:layersentry/p1-rke2-day2-production-20260913
