name: LayerSentry DR Base Repair and Qualification
on:
  push:
    branches: [ops/layersentrydr-probe-20260927]
    paths: [.github/workflows/layersentrydr-base-install.yml]
permissions:
  contents: read
concurrency:
  group: layersentrydr-base-install
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - name: Bind exact DR runner
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_NAME:-}" != "layersentrydr" ]; then
            echo "target=false" >> "$GITHUB_OUTPUT"
            echo 'NOT_EXECUTED: wrong runner, not deployment evidence.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(id -u)" -eq 0
          ip -4 addr show | grep -qE '(^|[[:space:]])172\.17\.60\.40/'
          echo "target=true" >> "$GITHUB_OUTPUT"
      - name: Repair and individually verify installed base services
        if: steps.bind.outputs.target == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          exec 9>/var/lock/layersentry-dr-base-install.lock
          flock -n 9 || { echo 'BLOCKED_CONCURRENT_INSTALL'; exit 48; }
          mkdir -p /var/log/layersentrydr /var/lib/layersentry
          rpm -q opennebula opennebula-node-kvm opennebula-fireedge
          failed=0
          for unit in opennebula opennebula-scheduler opennebula-fireedge opennebula-flow opennebula-gate; do
            echo "SERVICE=$unit"
            systemctl show "$unit" -p LoadState -p ActiveState -p SubState -p Result
            if ! systemctl is-active --quiet "$unit"; then
              systemctl start "$unit" || failed=1
            fi
            # is-active on multiple units succeeds when ANY unit is active; test each separately.
            if systemctl is-active --quiet "$unit"; then
              echo "$unit=ACTIVE"
            else
              echo "$unit=FAILED"
              failed=1
            fi
            journalctl -u "$unit" -n 40 --no-pager > "/var/log/layersentrydr/${unit}-startup.log"
          done
          python3 - <<'PY'
          import pathlib,re
          values=[]
          for p in pathlib.Path('/root/.layersentry-secrets').glob('*.pw'):
              v=p.read_text(errors='replace').strip()
              if len(v)>4: values.append(v)
          for p in pathlib.Path('/var/log/layersentrydr').glob('*-startup.log'):
              text=p.read_text(errors='replace')
              for v in values: text=text.replace(v,'[REDACTED]')
              text=re.sub(r'(?i)(password|token|secret|one_pass)([\s\"\x27:=]+)[^\s,}\"\x27]+',r'\1\2[REDACTED]',text)
              print('LOG='+p.name)
              print('\n'.join(text.splitlines()[-18:]))
          PY
          test "$failed" -eq 0 || { echo 'BASE_HEALTH=FAILED'; exit 52; }
          # Verify again after all starts; avoid one service masking another failure.
          for unit in opennebula opennebula-scheduler opennebula-fireedge opennebula-flow opennebula-gate; do
            systemctl is-active --quiet "$unit" || exit 53
          done
          su - oneadmin -s /bin/bash -c 'onehost list; onevm list; oneimage list; onevnet list'
          curl --fail --silent --show-error --max-time 15 -o /dev/null http://127.0.0.1:2616/fireedge/
          test "$(getenforce)" = Enforcing
          touch /var/lib/layersentry/.dr-base-services-verified
          echo 'DR_BASE_SERVICES=LIVE_VERIFIED'
      - name: Discover existing installer and image inputs without reading credentials
        if: always() && steps.bind.outputs.target == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ip -4 -br addr
          ip -4 route
          virsh -r -c qemu:///system list --all
          find /opt /srv /root -maxdepth 4 -type d \( -name layersentry-platform -o -name codexagentlogic -o -name one-deploy \) -print 2>/dev/null || true
          find /opt /var/lib/one /root -maxdepth 4 -type f \( -name '*.qcow2' -o -name '*cloud*.img' -o -name '*installer*.tar.gz' \) -printf '%p %s bytes\n' 2>/dev/null | head -40 || true
          echo 'SIX_VM_TOPOLOGY=NOT_CREATED_BY_THIS_WORKFLOW'
