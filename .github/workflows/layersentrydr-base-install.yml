name: LayerSentry DR Listener Diagnosis
on:
  push:
    branches: [ops/layersentrydr-probe-20260927]
    paths: [.github/workflows/layersentrydr-base-install.yml]
permissions:
  contents: read
concurrency:
  group: layersentrydr-base-install
  cancel-in-progress: false
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Identify target-owned listener without mutation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_NAME:-}" != layersentrydr ]; then echo 'NOT_EXECUTED_WRONG_RUNNER'; exit 0; fi
          test "$(id -u)" -eq 0
          ip -4 addr show | grep -qE '(^|[[:space:]])172\.17\.60\.40/'
          python3 - <<'PY'
          import subprocess,re,pathlib,os
          result=subprocess.run(['ss','-lntp','( sport = :2616 )'],capture_output=True,text=True,check=True)
          print(result.stdout)
          for pid in sorted(set(re.findall(r'pid=(\d+)',result.stdout))):
              p=pathlib.Path('/proc')/pid
              if not p.exists(): continue
              print('LISTENER_PID='+pid)
              print('EXE='+os.readlink(p/'exe'))
              print('CGROUP='+p.joinpath('cgroup').read_text())
              subprocess.run(['ps','-p',pid,'-o','user,pid,ppid,comm'],check=False)
          config=pathlib.Path('/etc/one/fireedge-server.conf')
          if config.exists():
              print('FIREEDGE_CONFIG_ENDPOINT_FIELDS')
              for line in config.read_text().splitlines():
                  if re.match(r'^\s*:?(host|port|bind|listen|guacd_port|guacd_host)\s*:',line): print(line)
          for base in ('/etc/nginx','/etc/httpd'):
              p=pathlib.Path(base)
              if not p.exists(): continue
              for f in p.rglob('*.conf'):
                  try:
                      text=f.read_text()
                  except (OSError,UnicodeError): continue
                  lines=[l for l in text.splitlines() if re.search(r'\b(listen|proxy_pass|ProxyPass|Listen)\b',l) and not l.lstrip().startswith('#')]
                  if any('2616' in l for l in lines):
                      print('PROXY_CONFIG='+str(f))
                      for line in lines: print(re.sub(r'(https?://)[^/@\s]+:[^/@\s]+@',r'\1[REDACTED]@',line))
          PY
          echo 'FIREEDGE_UNIT'
          systemctl show opennebula-fireedge -p FragmentPath -p DropInPaths -p Type -p ExecStart -p User -p Group -p ActiveState -p Result
          echo 'HTTP_READBACK'
          curl --silent --show-error --max-time 8 -D - -o /dev/null http://127.0.0.1:2616/fireedge/ || true
          echo 'INSTALLED_SERVICE_NAMES'
          systemctl list-unit-files 'opennebula*' --no-pager
          echo 'READ_ONLY_DIAGNOSIS_COMPLETE'
