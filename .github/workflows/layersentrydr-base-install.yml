name: LayerSentry DR FRR-Safe Base Qualification
on:
  push:
    branches: [ops/layersentrydr-probe-20260927]
    paths: [.github/workflows/layersentrydr-base-install.yml]
permissions:
  contents: read
concurrency:
  group: layersentrydr-base-install
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Bind exact DR target
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_NAME:-}" != layersentrydr ]; then
            echo 'target=false' >> "$GITHUB_OUTPUT"
            echo 'NOT_EXECUTED_WRONG_RUNNER'
            exit 0
          fi
          test "$(id -u)" -eq 0
          ip -4 addr show | grep -qE '(^|[[:space:]])172\.17\.60\.40/'
          echo 'target=true' >> "$GITHUB_OUTPUT"
      - name: Separate native administration from FRR without touching routing
        if: steps.bind.outputs.target == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          exec 9>/var/lock/layersentry-dr-base-install.lock
          flock -n 9 || { echo 'BLOCKED_CONCURRENT_INSTALL'; exit 48; }
          test "$(rpm -q --qf '%{VERSION}' opennebula)" = '7.4.1'
          systemctl is-active --quiet frr
          python3 - <<'PY'
          import pathlib,re,os,shutil,socket,tempfile
          p=pathlib.Path('/etc/one/fireedge-server.conf')
          original=p.read_text()
          hm=re.search(r'^host:\s*[\x27\"]?([^\x27\"\s]+)',original,re.M)
          pm=re.search(r'^port:\s*(\d+)\s*$',original,re.M)
          if not hm or not pm: raise SystemExit('BLOCKED_UNEXPECTED_FIREEDGE_CONFIG')
          if hm.group(1)=='127.0.0.1' and pm.group(1)=='2617':
              print('FIREEDGE_ENDPOINT_ALREADY_CONFIGURED')
          else:
              if hm.group(1)!='0.0.0.0' or pm.group(1)!='2616': raise SystemExit('BLOCKED_FOREIGN_ENDPOINT_CHANGE')
              with socket.socket() as s: s.bind(('127.0.0.1',2617))
              backup=p.with_name(p.name+'.before-layersentry-dr-port-fix')
              if not backup.exists(): shutil.copy2(p,backup)
              text,n1=re.subn(r'^host:.*$',"host: '127.0.0.1'",original,count=1,flags=re.M)
              text,n2=re.subn(r'^port:.*$','port: 2617',text,count=1,flags=re.M)
              if n1!=1 or n2!=1: raise SystemExit('BLOCKED_CONFIG_REPLACEMENT_COUNT')
              st=p.stat()
              fd,tmp=tempfile.mkstemp(prefix='.fireedge-dr-',dir=str(p.parent))
              try:
                  os.fchmod(fd,st.st_mode & 0o777); os.fchown(fd,st.st_uid,st.st_gid)
                  with os.fdopen(fd,'w') as f: f.write(text); f.flush(); os.fsync(f.fileno())
                  os.replace(tmp,p)
              finally:
                  if os.path.exists(tmp): os.unlink(tmp)
              print('FIREEDGE_ENDPOINT=127.0.0.1:2617')
          PY
          restorecon /etc/one/fireedge-server.conf
          systemctl enable opennebula-fireedge
          if ! systemctl is-active --quiet opennebula-fireedge; then systemctl start opennebula-fireedge; fi
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if systemctl is-active --quiet opennebula-fireedge && curl --silent --fail --max-time 5 -o /dev/null http://127.0.0.1:2617/fireedge/; then ready=1; break; fi
            sleep 5
          done
          test "$ready" -eq 1 || { echo 'FIREEDGE_HEALTH_FAILED'; exit 52; }
          sleep 2
          for unit in opennebula opennebula-fireedge opennebula-flow opennebula-gate frr; do
            systemctl is-active --quiet "$unit" || exit 53
            echo "$unit=ACTIVE"
          done
          curl --silent --fail --show-error --max-time 10 -o /dev/null -w 'FIREEDGE_HTTP_STATUS=%{http_code}\n' http://127.0.0.1:2617/fireedge/
          su - oneadmin -s /bin/bash -c 'set -e; onehost list; onevm list; oneimage list; onevnet list'
          test "$(getenforce)" = Enforcing
          ss -lntp '( sport = :2616 or sport = :2617 )'
          vtysh -c 'show bgp l2vpn evpn summary'
          touch /var/lib/layersentry/.dr-base-services-verified
          echo 'DR_NATIVE_BASE=LIVE_VERIFIED'
          echo 'Six management VMs and LayerSentry customer UI remain pending; native administration stays loopback-only.' >> "$GITHUB_STEP_SUMMARY"
