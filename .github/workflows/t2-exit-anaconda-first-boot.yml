name: T2 Exit Anaconda First Installed Boot

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-exit-anaconda-first-boot.yml

permissions:
  contents: read

concurrency:
  group: t2-install-4c4ac81
  cancel-in-progress: true

jobs:
  boot:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Re-bind completed installation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $name='ls-appliance-4c4ac81-qual'
          $vhd='C:\LayerSentryLab\qualification\ls-appliance-4c4ac81-qual\os.vhdx'
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "VM not running: $($vm.State)"}
          $disks=@(Get-VMHardDiskDrive -VMName $name)
          if($disks.Count -ne 1 -or $disks[0].Path -ne $vhd){throw 'Installed VHD binding changed'}
          if((Get-Item $vhd).Length -lt 3500000000){throw 'Installed VHD is unexpectedly small'}
          Set-VMFirmware -VMName $name -FirstBootDevice $disks[0]
          Write-Host "COMPLETED_INSTALL_BIND=PASS vhd_file_bytes=$((Get-Item $vhd).Length)"

      - name: Exit completed Anaconda installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $vm=Get-WmiObject -Namespace root\virtualization\v2 -Class Msvm_ComputerSystem | Where-Object ElementName -eq $name
          $kb=Get-WmiObject -Namespace root\virtualization\v2 -Query "ASSOCIATORS OF {$($vm.__PATH)} WHERE ResultClass=Msvm_Keyboard"
          if(-not $kb){throw 'Hyper-V keyboard missing'}
          $r=$kb.TypeKey([uint32]0x0D)
          if($r.ReturnValue -ne 0){throw 'Enter key injection failed'}
          Write-Host 'ANACONDA_EXIT=PASS'

      - name: Wait for installed VHD boot
        shell: powershell
        run: |
          Start-Sleep -Seconds 120
          $name='ls-appliance-4c4ac81-qual'
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "VM not running after installed boot: $($vm.State)"}
          $hb=(Get-VMIntegrationService -VMName $name -Name 'Heartbeat' -ErrorAction SilentlyContinue).PrimaryStatusDescription
          $ips=@((Get-VMNetworkAdapter -VMName $name).IPAddresses | Where-Object {$_ -match '^\d+\.'})
          $dvd=Get-VMDvdDrive -VMName $name -ErrorAction SilentlyContinue
          Write-Host "INSTALLED_BOOT state=$($vm.State) uptime=$($vm.Uptime) heartbeat=$hb ips=$($ips -join ',') dvd=$($dvd.Path)"

      - name: Capture installed first boot
        shell: powershell
        run: |
          $dir='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $out=Join-Path $dir 'installed-first-boot.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not (Test-Path $out)){throw 'Installed first-boot screenshot missing'}

      - name: Upload installed first boot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-installed-first-boot
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\installed-first-boot.png
          if-no-files-found: error
          retention-days: 7