name: Manoj Replication v2 Two-Site Qualification

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-replication-v2-two-site.yml'

permissions:
  contents: read

concurrency:
  group: manoj-replication-v2-two-site
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Bind exact Manoj runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "runner=$env:RUNNER_NAME computer=$env:COMPUTERNAME user=$env:USERNAME"
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          Write-Host 'MANOJ_RUNNER_BIND=PASS'

      - name: Resolve exact private Replication v2 source without exposing credentials
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:GIT_TERMINAL_PROMPT='0'
          $env:GCM_INTERACTIVE='Never'
          $wanted='f8daf9230189b31f301498700d191ac25fea679d'
          $branch='feat/replication-v2-site-pair-env-dr-20260924'
          $roots=@(
            'C:\LayerSentryLab\qualification',
            'C:\LayerSentryLab',
            (Join-Path $env:USERPROFILE 'actions-runner\_work'),
            (Join-Path $env:USERPROFILE 'actions-runner-one\_work')
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          function Test-GitObject([string]$repo,[string]$object) {
            $psi=New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName='git.exe'
            $psi.Arguments="-C `"$repo`" cat-file -e $object"
            $psi.UseShellExecute=$false
            $psi.CreateNoWindow=$true
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $p=[System.Diagnostics.Process]::Start($psi)
            $p.WaitForExit()
            return $p.ExitCode -eq 0
          }

          $repos=@()
          foreach($root in $roots){
            Get-ChildItem -LiteralPath $root -Directory -Recurse -Depth 5 -ErrorAction SilentlyContinue |
              ForEach-Object {
                if(Test-Path (Join-Path $_.FullName '.git')){
                  $old=$ErrorActionPreference;$ErrorActionPreference='SilentlyContinue'
                  $remote=(& git -C $_.FullName remote get-url origin 2>$null)
                  $rc=$LASTEXITCODE
                  $ErrorActionPreference=$old
                  if($rc -eq 0 -and ($remote -join '') -match 'adaptgurus/layersentry-platform'){
                    $repos += $_.FullName
                  }
                }
              }
          }
          $repos=@($repos | Sort-Object -Unique)
          if($repos.Count -lt 1){throw 'No local adaptgurus/layersentry-platform checkout found on Manoj runner.'}

          $sourceRepo=$null
          foreach($repo in $repos){
            if(Test-GitObject $repo "$wanted^{commit}"){
              $sourceRepo=$repo
              Write-Host "EXACT_OBJECT_CACHE=PASS repo=$repo"
              break
            }
          }

          if(-not $sourceRepo){
            $target='C:\LayerSentryLab\qualification\replication-v2-private-source'
            if(Test-Path $target){Remove-Item $target -Recurse -Force}
            $gh=Get-Command gh -ErrorAction SilentlyContinue
            if($gh){
              $old=$ErrorActionPreference;$ErrorActionPreference='SilentlyContinue'
              & gh repo view adaptgurus/layersentry-platform --json nameWithOwner *> $null
              $ghRC=$LASTEXITCODE
              $ErrorActionPreference=$old
              if($ghRC -eq 0){
                Write-Host 'PRIVATE_REPO_AUTH=GH'
                & gh repo clone adaptgurus/layersentry-platform $target -- --no-checkout
                if($LASTEXITCODE -eq 0){$sourceRepo=$target}
              }
            }
          }

          if(-not $sourceRepo){
            $target='C:\LayerSentryLab\qualification\replication-v2-private-source'
            if(Test-Path $target){Remove-Item $target -Recurse -Force}
            $env:GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8'
            $old=$ErrorActionPreference;$ErrorActionPreference='SilentlyContinue'
            & git ls-remote git@github.com:adaptgurus/layersentry-platform.git ('refs/heads/' + $branch) *> $null
            $sshRC=$LASTEXITCODE
            $ErrorActionPreference=$old
            if($sshRC -eq 0){
              Write-Host 'PRIVATE_REPO_AUTH=SSH'
              & git clone --no-checkout git@github.com:adaptgurus/layersentry-platform.git $target
              if($LASTEXITCODE -eq 0){$sourceRepo=$target}
            }
          }

          if(-not $sourceRepo){
            $target='C:\LayerSentryLab\qualification\replication-v2-private-source'
            if(Test-Path $target){Remove-Item $target -Recurse -Force}
            $old=$ErrorActionPreference;$ErrorActionPreference='SilentlyContinue'
            & git ls-remote https://github.com/adaptgurus/layersentry-platform.git ('refs/heads/' + $branch) *> $null
            $httpsRC=$LASTEXITCODE
            $ErrorActionPreference=$old
            if($httpsRC -eq 0){
              Write-Host 'PRIVATE_REPO_AUTH=GCM'
              & git clone --no-checkout https://github.com/adaptgurus/layersentry-platform.git $target
              if($LASTEXITCODE -eq 0){$sourceRepo=$target}
            }
          }

          if(-not $sourceRepo){throw 'No noninteractive authorized path can read private layersentry-platform from Manoj runner.'}

          if(-not (Test-GitObject $sourceRepo "$wanted^{commit}")){
            $refspec='+refs/heads/' + $branch + ':refs/remotes/origin/' + $branch
            $old=$ErrorActionPreference;$ErrorActionPreference='SilentlyContinue'
            & git -C $sourceRepo fetch --no-tags origin $refspec *> $null
            $fetchRC=$LASTEXITCODE
            $ErrorActionPreference=$old
            if($fetchRC -ne 0){throw 'Authorized source exists but exact PR103 branch fetch failed.'}
          }
          if(-not (Test-GitObject $sourceRepo "$wanted^{commit}")){throw 'Exact PR103 head remains unavailable after authorized fetch.'}

          $wt='C:\LayerSentryLab\qualification\replication-v2-pr103-live'
          if(Test-Path $wt){
            $old=$ErrorActionPreference;$ErrorActionPreference='SilentlyContinue'
            & git -C $sourceRepo worktree remove --force $wt *> $null
            $ErrorActionPreference=$old
            if(Test-Path $wt){Remove-Item $wt -Recurse -Force}
          }
          & git -C $sourceRepo worktree prune
          & git -C $sourceRepo worktree add --detach $wt $wanted
          if($LASTEXITCODE -ne 0){throw 'Unable to create exact-head worktree.'}
          $head=(& git -C $wt rev-parse HEAD).Trim()
          if($head -ne $wanted){throw "Wrong exact head: $head"}
          "RV2_WORKTREE=$wt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "EXACT_HEAD=$head"
          Write-Host 'EXACT_HEAD_BIND=PASS'
      - name: Validate exact source and qualification script
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:RV2_WORKTREE
          try {
            $go=Get-Command go -ErrorAction Stop
            go test -count=1 ./...
            if($LASTEXITCODE -ne 0){throw 'go test ./... failed'}
            go vet ./pkg/replicationv2 ./internal/replicationv2 ./internal/adapters/opennebula ./internal/adapters/replication/opennebulaproduct ./cmd/layersentry-replication-v2
            if($LASTEXITCODE -ne 0){throw 'go vet failed'}
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path 'scripts/replication-v2-manoj-two-site.ps1'),
              [ref]$tokens,[ref]$errors
            ) | Out-Null
            if($errors.Count -gt 0){$errors | ForEach-Object {Write-Error $_.Message};throw 'Qualification script parse failed'}
            Write-Host 'EXACT_SOURCE_VALIDATION=PASS'
          } finally { Pop-Location }

      - name: Execute two-site pairing and DR qualification
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:RV2_WORKTREE
          try {
            & .\scripts\replication-v2-manoj-two-site.ps1 -QualificationRoot 'C:\LayerSentryLab\qualification'
            if($LASTEXITCODE -ne 0){throw "Two-site qualification failed rc=$LASTEXITCODE"}
          } finally { Pop-Location }

      - name: Show sanitized evidence
        if: always()
        shell: powershell
        run: |
          $path='C:\LayerSentryLab\qualification\replication-v2-two-site-live-evidence.json'
          if(Test-Path $path){
            Write-Host '=== SANITIZED LIVE EVIDENCE ==='
            Get-Content -LiteralPath $path -Raw
          } else {
            Write-Host 'No final evidence file was produced.'
          }