name: T2 Apply Fixed Agent

on:
  push:
    branches:
      - ops/t2-foundation-iso-qualification-20260921
    paths:
      - .github/workflows/t2-apply-fixed-agent.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - name: Bind qualification VM
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $vm=Get-VM -Name 'ls-appliance-4c4ac81-qual' -ErrorAction Stop
          $fw=Get-VMFirmware -VMName $vm.Name
          $dvd=Get-VMDvdDrive -VMName $vm.Name -ErrorAction SilentlyContinue
          if($vm.State -ne 'Running'){throw "VM not running"}
          if($fw.SecureBoot -ne 'Off'){throw "Secure Boot changed"}
          if($dvd -and $dvd.Path){throw "ISO unexpectedly mounted"}
          foreach($p in @(
            'C:\LayerSentryLab\qualification\layersentry-host-agent-2307f95-qual',
            'C:\LayerSentryLab\qualification\layersentry-host-agent-2307f95.service'
          )){if(-not (Test-Path $p)){throw "Fixed payload missing: $p"}}
          Write-Host 'APPLY_TARGET_BIND=PASS'

      - name: Mint and stage fresh one-time bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $q='C:\LayerSentryLab\qualification'
          $src=Join-Path $q 'iso-builder-key'
          $known=Join-Path $q 'known_hosts_builder'
          $helper=Join-Path $q 'prepare_fresh_enrollment_safe.py'
          & icacls.exe $src /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe $known /grant:r '*S-1-5-18:(R)' | Out-Null
          $key=Join-Path $env:RUNNER_TEMP 't2-apply-builder-key'
          Copy-Item $src $key -Force
          & icacls.exe $key /setowner '*S-1-5-18' | Out-Null
          & icacls.exe $key /inheritance:r | Out-Null
          & icacls.exe $key /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe $src /remove:g '*S-1-5-18' | Out-Null
          $base=@('-o','BatchMode=yes','-o','ConnectTimeout=10','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$known",'-i',$key)
          scp.exe @base $helper 'builder@10.250.10.40:/home/builder/t2-apply-bootstrap.py'
          if($LASTEXITCODE -ne 0){throw 'bootstrap helper stage failed'}
          $safe=ssh.exe @base 'builder@10.250.10.40' 'python3 /home/builder/t2-apply-bootstrap.py'
          if($LASTEXITCODE -ne 0 -or (($safe -join [Environment]::NewLine) -notmatch 'BOOTSTRAP_READY')){throw 'bootstrap mint failed'}
          $token=Join-Path $env:RUNNER_TEMP 't2-apply-bootstrap.token'
          scp.exe @base 'builder@10.250.10.40:/home/builder/layersentry-qual/appliance-bootstrap.token' $token
          if($LASTEXITCODE -ne 0){throw 'bootstrap retrieval failed'}

          $supportSrc=Join-Path $q 'qual-support-ac7e14e-ed25519'
          & icacls.exe $supportSrc /grant:r '*S-1-5-18:(R)' | Out-Null
          $supportKey=Join-Path $env:RUNNER_TEMP 't2-apply-support-key'
          Copy-Item $supportSrc $supportKey -Force
          & icacls.exe $supportKey /setowner '*S-1-5-18' | Out-Null
          & icacls.exe $supportKey /inheritance:r | Out-Null
          & icacls.exe $supportKey /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe $supportSrc /remove:g '*S-1-5-18' | Out-Null
          $guestKnown=Join-Path $env:RUNNER_TEMP 't2-apply-guest-known'
          (cmd.exe /d /c "ssh-keyscan -T 10 10.250.10.41 2>NUL") | Set-Content $guestKnown -Encoding ascii
          $guest=@('-o','BatchMode=yes','-o','ConnectTimeout=10','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$guestKnown",'-i',$supportKey)
          scp.exe @guest $token 'layersentry@10.250.10.41:/home/layersentry/bootstrap-token-2307f95'
          if($LASTEXITCODE -ne 0){throw 'bootstrap guest stage failed'}
          "T2_APPLY_BUILDER_KEY=$key" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "T2_APPLY_SUPPORT_KEY=$supportKey" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "T2_APPLY_GUEST_KNOWN=$guestKnown" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "T2_APPLY_TOKEN=$token" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'FRESH_BOOTSTRAP_GUEST_STAGE=PASS'

      - name: Apply fixed agent with approved console helpers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $q='C:\LayerSentryLab\qualification'
          $root=(Get-Content -Raw (Join-Path $q 'vm_tty2_root.ps1'))
          $root=$root.Replace('ls-appliance-qual','ls-appliance-4c4ac81-qual')
          $root=$root.Replace('qual-root-ac7e14e.password','durable-root-current.password')
          $rootTmp=Join-Path $env:RUNNER_TEMP 't2-apply-root.ps1'
          Set-Content $rootTmp $root -Encoding UTF8
          $cmd=(Get-Content -Raw (Join-Path $q 'vm_type_cmd.ps1')).Replace('ls-appliance-qual','ls-appliance-4c4ac81-qual')
          $cmdTmp=Join-Path $env:RUNNER_TEMP 't2-apply-cmd.ps1'
          Set-Content $cmdTmp $cmd -Encoding UTF8
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $rootTmp
          if($LASTEXITCODE -ne 0){throw 'root console helper failed'}
          Start-Sleep -Seconds 2
          $commands=@(
            'systemctl stop layersentry-host-agent.service',
            'install -d -m 0755 /opt/layersentry/agent/releases/2307f95-qual',
            'install -m 0755 /home/layersentry/layersentry-host-agent-2307f95-qual /opt/layersentry/agent/releases/2307f95-qual/layersentry-host-agent',
            'ln -sfn /opt/layersentry/agent/releases/2307f95-qual /opt/layersentry/agent/current',
            'install -m 0644 /home/layersentry/layersentry-host-agent-2307f95.service /etc/systemd/system/layersentry-host-agent.service',
            'install -m 0640 /home/layersentry/bootstrap-token-2307f95 /etc/layersentry/bootstrap-token',
            'chown root:layersentry-agent /etc/layersentry/bootstrap-token',
            'rm -f /var/lib/layersentry/agent/pki/client.key',
            'rm -f /var/lib/layersentry/agent/pki/client.crt',
            'systemctl daemon-reload',
            'systemctl reset-failed layersentry-host-agent.service',
            'systemctl restart layersentry-host-agent.service'
          )
          foreach($line in $commands){
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $cmdTmp -Text $line
            if($LASTEXITCODE -ne 0){throw 'console command helper failed'}
            Start-Sleep -Milliseconds 900
          }
          Remove-Item $rootTmp,$cmdTmp -Force
          Write-Host 'FIXED_AGENT_APPLY_SENT=PASS'

      - name: Verify durable guest enrollment
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base=@('-o','BatchMode=yes','-o','ConnectTimeout=10','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$env:T2_APPLY_GUEST_KNOWN",'-i',$env:T2_APPLY_SUPPORT_KEY)
          $pass=$false
          for($i=0;$i -lt 60;$i++){
            $out=ssh.exe @base 'layersentry@10.250.10.41' 'systemctl show layersentry-host-agent.service -p ActiveState -p SubState -p NRestarts --no-pager; test -s /var/lib/layersentry/agent/pki/client.crt && echo CERT_PRESENT=YES || echo CERT_PRESENT=NO; test -s /var/lib/layersentry/agent/pki/client.key && echo KEY_PRESENT=YES || echo KEY_PRESENT=NO; test -e /etc/layersentry/bootstrap-token && echo BOOTSTRAP_TOKEN_PRESENT=YES || echo BOOTSTRAP_TOKEN_PRESENT=NO'
            $s=$out -join [Environment]::NewLine
            if($s -match 'ActiveState=active' -and $s -match 'CERT_PRESENT=YES' -and $s -match 'KEY_PRESENT=YES' -and $s -match 'BOOTSTRAP_TOKEN_PRESENT=NO'){
              $out | Write-Host
              $pass=$true
              break
            }
            Start-Sleep -Seconds 3
          }
          if(-not $pass){throw 'durable fixed enrollment not observed'}
          Write-Host 'DURABLE_GUEST_ENROLLMENT=PASS AGENT_ACTIVE=PASS'

      - name: Cleanup temporary bootstrap material
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          if($env:T2_APPLY_BUILDER_KEY){
            $known='C:\LayerSentryLab\qualification\known_hosts_builder'
            ssh.exe -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $env:T2_APPLY_BUILDER_KEY builder@10.250.10.40 'rm -f /home/builder/layersentry-qual/appliance-bootstrap.token /home/builder/t2-apply-bootstrap.py' 2>$null
          }
          foreach($p in @($env:T2_APPLY_BUILDER_KEY,$env:T2_APPLY_SUPPORT_KEY,$env:T2_APPLY_GUEST_KNOWN,$env:T2_APPLY_TOKEN)){
            if($p -and (Test-Path $p)){& icacls.exe $p /grant:r '*S-1-5-18:(F)' | Out-Null;Remove-Item $p -Force}
          }
          Write-Host 'APPLY_TEMP_CLEANUP=PASS'
