name: LayerSentry Physical Runner Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  demolayersentry1:
    name: probe-demolayersentry1
    runs-on: demolayersentry1
    timeout-minutes: 6
    steps:
      - name: Identify physical runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "hostname=$(hostname -f 2>/dev/null || hostname)"
          echo "os=$RUNNER_OS arch=$RUNNER_ARCH"
          id
          hostnamectl 2>/dev/null || true
          echo "=== addresses ==="
          ip -br addr || true
          ip route || true
          echo "=== block ==="
          lsblk -e7 -o NAME,KNAME,SIZE,TYPE,FSTYPE,FSVER,MOUNTPOINTS,MODEL,SERIAL,WWN || true
          findmnt -R / || true
          echo "=== resources ==="
          free -h || true
          lscpu || true
          echo "=== virtualization ==="
          systemd-detect-virt || true
          ls -l /dev/kvm 2>/dev/null || true
          lsmod | grep -E '(^kvm|vfio|bridge|8021q)' || true
          echo "=== privilege ==="
          printf 'sudo_noninteractive='
          if sudo -n true 2>/dev/null; then echo yes; else echo no; fi
          echo "=== services ==="
          systemctl --no-pager --type=service --state=running | head -n 120 || true

  demolayersentry2:
    name: probe-demolayersentry2
    runs-on: demolayersentry2
    timeout-minutes: 6
    steps:
      - name: Identify physical runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "hostname=$(hostname -f 2>/dev/null || hostname)"
          echo "os=$RUNNER_OS arch=$RUNNER_ARCH"
          id
          hostnamectl 2>/dev/null || true
          echo "=== addresses ==="
          ip -br addr || true
          ip route || true
          echo "=== block ==="
          lsblk -e7 -o NAME,KNAME,SIZE,TYPE,FSTYPE,FSVER,MOUNTPOINTS,MODEL,SERIAL,WWN || true
          findmnt -R / || true
          echo "=== resources ==="
          free -h || true
          lscpu || true
          echo "=== virtualization ==="
          systemd-detect-virt || true
          ls -l /dev/kvm 2>/dev/null || true
          lsmod | grep -E '(^kvm|vfio|bridge|8021q)' || true
          echo "=== privilege ==="
          printf 'sudo_noninteractive='
          if sudo -n true 2>/dev/null; then echo yes; else echo no; fi
          echo "=== services ==="
          systemctl --no-pager --type=service --state=running | head -n 120 || true
