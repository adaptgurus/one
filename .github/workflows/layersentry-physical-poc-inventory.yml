name: LayerSentry Physical POC Stage 2B Host1 Recovery

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recovery:
    name: bridge-recovery-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Ensure host1 pre-bridge state is restored
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          if [ "$RUNNER_NAME" != "demolayersentry1" ]; then
            echo "GUARD_SKIP_NON_TARGET_RUNNER"
            exit 0
          fi
          LOG=/var/log/layersentry-poc/activity.log
          exec > >(tee -a "$LOG") 2>&1
          echo "=== STAGE2B_RECOVERY_BEGIN $(date -u +%FT%TZ) ==="

          nmstatectl rollback /org/freedesktop/NetworkManager/Checkpoint/1 || true
          sleep 2

          echo "--- restored network ---"
          ip -br addr
          ip -4 route
          nmcli -t -f NAME,TYPE,DEVICE,STATE con show
          ip -4 -o addr show dev eno1 | grep -F '192.168.1.121/24'
          ip -4 route show default | grep -F 'via 192.168.1.1 dev eno1'
          ping -c 2 -W 2 192.168.1.1
          ping -c 2 -W 2 192.168.1.122
          curl -fsS --connect-timeout 5 --max-time 15 https://api.github.com/ >/dev/null
          echo "=== STAGE2B_RECOVERY_PASS $(date -u +%FT%TZ) ==="
