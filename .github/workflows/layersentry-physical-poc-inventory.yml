name: LayerSentry Physical POC Stage 3A Package Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  packages:
    name: packages-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    steps:
      - name: Enable signed OpenNebula 7.4 repository and list versions
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          case "$RUNNER_NAME" in
            demolayersentry1|demolayersentry2) ;;
            *) echo "GUARD_SKIP_NON_PHYSICAL_RUNNER"; exit 0 ;;
          esac
          LOG=/var/log/layersentry-poc/activity.log
          exec > >(tee -a "$LOG") 2>&1
          echo "=== STAGE3A_PACKAGE_PREFLIGHT_BEGIN $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="

          test "$(id -u)" -eq 0
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb

          cat >/etc/yum.repos.d/opennebula.repo <<'EOF'
          [opennebula]
          name=OpenNebula Community Edition 7.4
          baseurl=https://downloads.opennebula.io/repo/7.4/RedHat/$releasever/$basearch
          enabled=1
          gpgkey=https://downloads.opennebula.io/repo/repo2.key
          gpgcheck=1
          repo_gpgcheck=1
          sslverify=1
          EOF
          chmod 0644 /etc/yum.repos.d/opennebula.repo

          dnf -y makecache
          echo "--- available packages ---"
          dnf --showduplicates list opennebula opennebula-fireedge opennebula-gate opennebula-flow opennebula-node-kvm || true
          echo "--- repo identity ---"
          dnf repoinfo opennebula
          echo "=== STAGE3A_PACKAGE_PREFLIGHT_PASS $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="
