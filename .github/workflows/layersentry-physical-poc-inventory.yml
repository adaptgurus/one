name: LayerSentry Physical POC Stage 2A Network Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: network-preflight-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 12
    steps:
      - name: Install nmstate and capture rollback baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          case "$RUNNER_NAME" in
            demolayersentry1|demolayersentry2) ;;
            *) echo "GUARD_SKIP_NON_PHYSICAL_RUNNER"; exit 0 ;;
          esac

          install -d -m 0750 /var/log/layersentry-poc /etc/layersentry-poc/network
          LOG=/var/log/layersentry-poc/activity.log
          exec > >(tee -a "$LOG") 2>&1
          echo "=== STAGE2A_NETWORK_PREFLIGHT_BEGIN $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="

          echo "--- current network ---"
          ip -br addr
          ip -4 route
          nmcli -t -f NAME,UUID,TYPE,DEVICE,STATE con show
          ping -c 2 -W 2 192.168.1.1
          curl -fsS --connect-timeout 5 --max-time 10 https://api.github.com/ >/dev/null

          echo "--- install nmstate ---"
          if ! command -v nmstatectl >/dev/null 2>&1; then
            dnf -y install nmstate
          fi
          nmstatectl --version || nmstatectl version || true

          echo "--- persist pre-change state ---"
          nmstatectl show > /etc/layersentry-poc/network/pre-bridge-state.yaml
          chmod 0600 /etc/layersentry-poc/network/pre-bridge-state.yaml
          sha256sum /etc/layersentry-poc/network/pre-bridge-state.yaml

          echo "--- verify package/network after install ---"
          rpm -q nmstate
          nmstatectl show eno1
          ping -c 2 -W 2 192.168.1.1
          curl -fsS --connect-timeout 5 --max-time 10 https://api.github.com/ >/dev/null
          echo "=== STAGE2A_NETWORK_PREFLIGHT_PASS $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="
