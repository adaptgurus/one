name: LayerSentry Physical Runner Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  demolayersentry1:
    name: probe-demolayersentry1
    runs-on: demolayersentry1
    timeout-minutes: 7
    steps:
      - name: Identify runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "hostname=$(hostname -f 2>/dev/null || hostname)"
          echo "os=$RUNNER_OS arch=$RUNNER_ARCH"
          id
          hostnamectl 2>/dev/null || true
          uname -a
          cat /etc/os-release 2>/dev/null || true
          echo "=== cpu/memory ==="
          lscpu | sed -n '1,40p' || true
          free -h || true
          echo "=== network ==="
          ip -br link || true
          ip -br addr || true
          ip route || true
          bridge link 2>/dev/null || true
          bridge vlan show 2>/dev/null || true
          nmcli -t -f NAME,TYPE,DEVICE,STATE connection show 2>/dev/null || true
          echo "=== block ==="
          lsblk -e7 -o NAME,KNAME,TYPE,SIZE,FSTYPE,FSVER,LABEL,UUID,MOUNTPOINTS,MODEL,SERIAL,WWN,ROTA,TRAN || true
          findmnt -R / || true
          df -hT || true
          sudo -n pvs 2>/dev/null || true
          sudo -n vgs 2>/dev/null || true
          sudo -n lvs -a -o+devices 2>/dev/null || true
          echo "=== virtualization ==="
          systemd-detect-virt || true
          ls -l /dev/kvm 2>/dev/null || true
          lsmod | grep -E '(^kvm|vfio|bridge|8021q)' || true
          echo "=== services ==="
          systemctl --no-pager --type=service --state=running | head -n 120 || true
          echo "=== sudo ==="
          if sudo -n true 2>/dev/null; then echo "sudo_noninteractive=yes"; else echo "sudo_noninteractive=no"; fi
          echo "=== listeners ==="
          sudo -n ss -lntup 2>/dev/null || ss -lnt 2>/dev/null || true

  demolayersentry2:
    name: probe-demolayersentry2
    runs-on: demolayersentry2
    timeout-minutes: 7
    steps:
      - name: Identify runner
        shell: bash
