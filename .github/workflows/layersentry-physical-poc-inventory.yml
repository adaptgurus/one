name: LayerSentry Physical Runner Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  layersentry_1:
    name: probe-layersentry-1
    runs-on: layersentry-1
    timeout-minutes: 5
    steps:
      - name: Identify runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "hostname=$(hostname -f 2>/dev/null || hostname)"
          echo "os=$RUNNER_OS arch=$RUNNER_ARCH"
          id
          hostnamectl 2>/dev/null || true
          ip -br addr || true
          lsblk -e7 -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS,MODEL,SERIAL || true
          free -h || true
          lscpu | sed -n '1,25p' || true
          printf 'sudo_noninteractive='
          if sudo -n true 2>/dev/null; then echo yes; else echo no; fi

  layersentry_2:
    name: probe-layersentry-2
    runs-on: layersentry-2
    timeout-minutes: 5
    steps:
      - name: Identify runner
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "hostname=$(hostname -f 2>/dev/null || hostname)"
          echo "os=$RUNNER_OS arch=$RUNNER_ARCH"
          id
          hostnamectl 2>/dev/null || true
          ip -br addr || true
          lsblk -e7 -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS,MODEL,SERIAL || true
          free -h || true
          lscpu | sed -n '1,25p' || true
          printf 'sudo_noninteractive='
          if sudo -n true 2>/dev/null; then echo yes; else echo no; fi
