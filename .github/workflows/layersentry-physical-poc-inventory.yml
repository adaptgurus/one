name: LayerSentry Physical POC Stage 4D Forced Controller Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-stage4d-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: forced-controller-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 55
    steps:
      - name: Route and deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME slot=${{ matrix.slot }}"
          if [ "$RUNNER_NAME" != "demolayersentry1" ]; then
            echo "executed=false" >> "$GITHUB_OUTPUT"
            echo "HOLD: reserving non-controller runner slot so another job can reach demolayersentry1"
            sleep 120
            exit 0
          fi
          echo "executed=true" >> "$GITHUB_OUTPUT"

          exec sudo -n bash <<'ROOT'
          set -euo pipefail
          umask 077
          export PATH=/opt/layersentry-one-deploy-venv/bin:$PATH
          export ANSIBLE_DISPLAY_ARGS_TO_STDOUT=false
          export ANSIBLE_NOCOLOR=1
          export PYTHONUNBUFFERED=1

          DEPLOY_ROOT=/root/layersentry-poc
          REPO="$DEPLOY_ROOT/one-deploy"
          INV="$DEPLOY_ROOT/poc-inventory.yml"
          LOGDIR="$DEPLOY_ROOT/logs"
          mkdir -p "$LOGDIR"
          LOG="$LOGDIR/stage4d-deploy-$(date -u +%Y%m%dT%H%M%SZ).log"
          touch "$LOG"; chmod 0600 "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          echo "=== STAGE4D_BEGIN $(date -u +%FT%TZ) ==="

          python3 - "$INV" <<'PY'
          import sys, yaml
          path=sys.argv[1]
          with open(path, 'r', encoding='utf-8') as f:
              data=yaml.safe_load(f)
          allv=data.setdefault('all', {}).setdefault('vars', {})
          allv.setdefault('opennebula_repo_url', {})['RedHat']='https://downloads.opennebula.io/repo/7.4/RedHat'
          with open(path, 'w', encoding='utf-8') as f:
              yaml.safe_dump(data, f, sort_keys=False)
          PY
          chmod 0600 "$INV"

          echo "repo_override=https://downloads.opennebula.io/repo/7.4/RedHat"

          ansible -i "$INV" all -b -m shell -a "cat > /etc/yum.repos.d/opennebula.repo <<'EOF'
          [opennebula]
          name=OpenNebula Community Edition 7.4
          baseurl=https://downloads.opennebula.io/repo/7.4/RedHat/\$releasever/\$basearch
          enabled=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-opennebula2
          repo_gpgcheck=1
          gpgcheck=1
          EOF
          dnf -q clean metadata
          dnf -q makecache --disablerepo='*' --enablerepo=opennebula
          dnf -q --showduplicates list opennebula | tail -n 5"

          cd "$REPO"
          echo "--- pre ---"
          make V= I="$INV" pre
          echo "--- site ---"
          make V= I="$INV" site

          echo "--- services ---"
          systemctl is-active opennebula
          systemctl is-active opennebula-fireedge
          systemctl is-active opennebula-gate
          systemctl is-active opennebula-flow

          echo "--- CLI ---"
          sudo -u oneadmin bash -lc 'onezone list'
          sudo -u oneadmin bash -lc 'onehost list'
          sudo -u oneadmin bash -lc 'onedatastore list'
          sudo -u oneadmin bash -lc 'onevnet list'

          echo "--- URL ---"
          for u in http://127.0.0.1:2616 http://192.168.1.121:2616; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 "$u" || true)
            echo "$u => $code"
          done

          echo "--- peer ---"
          ssh -i /root/.ssh/layersentry_poc_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=5 layersentry-deploy@192.168.1.122             'hostname; ip -4 -br addr show br0; sudo -n systemctl is-active libvirtd || sudo -n systemctl is-active virtqemud || true; sudo -n virsh nodeinfo | sed -n "1,12p"'

          echo "deployment_log=$LOG"
          echo "=== STAGE4D_PASS $(date -u +%FT%TZ) ==="
          ROOT

      - name: Upload deployment journal
        if: always() && steps.deploy.outputs.executed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: layersentry-stage4d-${{ matrix.slot }}
          path: /root/layersentry-poc/logs/stage4d-deploy-*.log
          if-no-files-found: warn
          retention-days: 14
