name: LayerSentry Physical POC Inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inventory:
    name: inventory-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - name: Inventory bound host
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          case "$RUNNER_NAME" in
            demolayersentry1|demolayersentry2) ;;
            *) echo "GUARD_SKIP_NON_PHYSICAL_RUNNER"; exit 0 ;;
          esac

          echo "=== identity ==="
          echo "utc=$(date -u +%FT%TZ)"
          echo "hostname=$(hostname -f 2>/dev/null || hostname)"
          id
          hostnamectl 2>/dev/null || true
          uname -a
          cat /etc/os-release || true
          printf 'sudo_noninteractive='
          if sudo -n true 2>/dev/null; then echo yes; else echo no; fi

          echo "=== cpu-memory-numa ==="
          lscpu || true
          free -h || true
          numactl --hardware 2>/dev/null || true

          echo "=== storage ==="
          lsblk -e7 -o NAME,KNAME,MAJ:MIN,SIZE,TYPE,FSTYPE,FSVER,LABEL,UUID,MOUNTPOINTS,MODEL,SERIAL,WWN,ROTA,TRAN || true
          blkid 2>/dev/null || true
          findmnt -R / || true
          df -hT || true
          sudo -n pvs -o+pv_used 2>/dev/null || true
          sudo -n vgs -o+vg_free 2>/dev/null || true
          sudo -n lvs -a -o+devices 2>/dev/null || true
          sudo -n mdadm --detail --scan 2>/dev/null || true
          sudo -n zpool status 2>/dev/null || true

          echo "=== network ==="
          ip -br link || true
          ip -br addr || true
          ip -4 route show table all || true
          ip rule || true
          bridge link 2>/dev/null || true
          bridge vlan show 2>/dev/null || true
          nmcli -t -f NAME,UUID,TYPE,DEVICE,STATE connection show 2>/dev/null || true
          nmcli -f GENERAL,IP4,IP6 device show 2>/dev/null || true
          for n in /sys/class/net/*; do
            d=$(basename "$n")
            printf '%s mac=' "$d"
            cat "$n/address" 2>/dev/null || true
          done

          echo "=== virtualization ==="
          systemd-detect-virt || true
          ls -l /dev/kvm 2>/dev/null || true
          lsmod | grep -E '(^kvm|vfio|bridge|8021q)' || true
          sudo -n virt-host-validate 2>/dev/null || true

          echo "=== services-packages-ports ==="
          systemctl --no-pager --type=service --state=running | head -n 160 || true
          rpm -qa 2>/dev/null | grep -Ei 'opennebula|libvirt|qemu|mariadb|mysql|postgres|keepalived|haproxy|nginx|podman|docker' | sort || true
          dpkg-query -W 2>/dev/null | grep -Ei 'opennebula|libvirt|qemu|mariadb|mysql|postgres|keepalived|haproxy|nginx|podman|docker' | sort || true
          sudo -n ss -lntup 2>/dev/null || ss -lnt 2>/dev/null || true

          echo "=== runner-filesystem ==="
          pwd
          git rev-parse --show-toplevel 2>/dev/null || true
          git remote -v 2>/dev/null | sed -E 's#(https://)[^/@]+@#\\1[REDACTED]@#g' || true
          echo "PHYSICAL_INVENTORY_COMPLETE"
