name: LayerSentry Physical POC Stage 3C Controller Trust

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trust:
    name: controller-trust-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - name: Authorize deployment controller key
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          case "$RUNNER_NAME" in
            demolayersentry1|demolayersentry2) ;;
            *) echo "GUARD_SKIP_NON_PHYSICAL_RUNNER"; exit 0 ;;
          esac
          LOG=/var/log/layersentry-poc/activity.log
          exec > >(tee -a "$LOG") 2>&1
          echo "=== STAGE3C_CONTROLLER_TRUST_BEGIN $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="

          install -d -m 0700 /root/.ssh
          touch /root/.ssh/authorized_keys
          chmod 0600 /root/.ssh/authorized_keys
          PUBKEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOSbO6o9GBtG2axbE4BKe05BbRcyxPHTsnX5uvOS/qIJ layersentry-poc-controller@demolayersentry1'
          grep -qxF "$PUBKEY" /root/.ssh/authorized_keys || printf '%s\n' "$PUBKEY" >> /root/.ssh/authorized_keys

          if [ "$RUNNER_NAME" = "demolayersentry1" ]; then
            ssh -i /root/.ssh/layersentry_poc_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 root@192.168.1.121 'hostname; id -u'
            ssh -i /root/.ssh/layersentry_poc_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 root@192.168.1.122 'hostname; id -u; ip -br addr show br0'
          fi

          echo "=== STAGE3C_CONTROLLER_TRUST_PASS $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="
