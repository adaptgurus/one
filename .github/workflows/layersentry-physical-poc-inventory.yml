name: LayerSentry Physical POC Stage 3B Controller Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: controller-bootstrap-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - name: Prepare host identities and deployment controller key
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          case "$RUNNER_NAME" in
            demolayersentry1|demolayersentry2) ;;
            *) echo "GUARD_SKIP_NON_PHYSICAL_RUNNER"; exit 0 ;;
          esac

          LOG=/var/log/layersentry-poc/activity.log
          exec > >(tee -a "$LOG") 2>&1
          echo "=== STAGE3B_CONTROLLER_BOOTSTRAP_BEGIN $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="

          grep -q '^192\.168\.1\.121[[:space:]]' /etc/hosts || echo '192.168.1.121 demolayersentry1 layersentry-fe1' >> /etc/hosts
          grep -q '^192\.168\.1\.122[[:space:]]' /etc/hosts || echo '192.168.1.122 demolayersentry2 layersentry-kvm2' >> /etc/hosts

          getent hosts demolayersentry1
          getent hosts demolayersentry2
          ping -c 2 -W 2 192.168.1.121
          ping -c 2 -W 2 192.168.1.122

          if [ "$RUNNER_NAME" = "demolayersentry1" ]; then
            install -d -m 0700 /root/.ssh
            if [ ! -s /root/.ssh/layersentry_poc_ed25519 ]; then
              ssh-keygen -q -t ed25519 -N '' -C 'layersentry-poc-controller@demolayersentry1' -f /root/.ssh/layersentry_poc_ed25519
            fi
            chmod 0600 /root/.ssh/layersentry_poc_ed25519
            chmod 0644 /root/.ssh/layersentry_poc_ed25519.pub
            echo "LAYERSENTRY_CONTROLLER_PUBLIC_KEY_BEGIN"
            cat /root/.ssh/layersentry_poc_ed25519.pub
            echo "LAYERSENTRY_CONTROLLER_PUBLIC_KEY_END"
          fi

          echo "=== STAGE3B_CONTROLLER_BOOTSTRAP_PASS $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="
