name: LayerSentry Physical POC Stage 1 Storage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  storage:
    name: storage-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - name: Prepare LayerSentry storage backing
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          case "$RUNNER_NAME" in
            demolayersentry1|demolayersentry2) ;;
            *) echo "GUARD_SKIP_NON_PHYSICAL_RUNNER"; exit 0 ;;
          esac

          install -d -m 0750 /var/log/layersentry-poc
          LOG=/var/log/layersentry-poc/activity.log
          exec > >(tee -a "$LOG") 2>&1
          echo "=== STAGE1_STORAGE_BEGIN $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="

          echo "--- preflight ---"
          test "$(id -u)" -eq 0
          findmnt /home
          df -hT /home
          ls -ld /home /home/layersentry 2>/dev/null || true

          echo "--- create dedicated backing tree ---"
          install -d -m 0750 /home/layersentry
          install -d -m 0750 /home/layersentry/datastores
          install -d -m 0750 /home/layersentry/images
          install -d -m 0750 /home/layersentry/backups
          install -d -m 0750 /home/layersentry/tmp
          install -d -m 0750 /etc/layersentry-poc

          cat >/etc/layersentry-poc/storage.env <<EOF
          LAYERSENTRY_STORAGE_BACKING=/home/layersentry
          LAYERSENTRY_DATASTORES_BACKING=/home/layersentry/datastores
          LAYERSENTRY_IMAGE_BACKING=/home/layersentry/images
          LAYERSENTRY_BACKUP_BACKING=/home/layersentry/backups
          EOF
          chmod 0644 /etc/layersentry-poc/storage.env

          echo "--- integrity/write test ---"
          TESTFILE="/home/layersentry/tmp/.write-test-$$"
          printf 'layersentry-storage-ok %s %s\n' "$RUNNER_NAME" "$(date -u +%FT%TZ)" > "$TESTFILE"
          sync "$TESTFILE"
          test -s "$TESTFILE"
          sha256sum "$TESTFILE"
          rm -f "$TESTFILE"

          echo "--- postflight ---"
          findmnt /home
          df -hT /home
          du -sh /home/layersentry
          find /home/layersentry -maxdepth 1 -mindepth 1 -printf '%M %u:%g %p\n' | sort
          echo "=== STAGE1_STORAGE_PASS $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="
