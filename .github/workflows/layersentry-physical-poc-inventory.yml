name: LayerSentry Physical POC Stage 3D Deploy Account

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/layersentry-physical-poc-inventory.yml'

permissions:
  contents: read

concurrency:
  group: layersentry-physical-poc-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy_account:
    name: deploy-account-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 8
    steps:
      - name: Create dedicated Ansible deployment account
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=$RUNNER_NAME"
          case "$RUNNER_NAME" in
            demolayersentry1|demolayersentry2) ;;
            *) echo "GUARD_SKIP_NON_PHYSICAL_RUNNER"; exit 0 ;;
          esac
          LOG=/var/log/layersentry-poc/activity.log
          exec > >(tee -a "$LOG") 2>&1
          echo "=== STAGE3D_DEPLOY_ACCOUNT_BEGIN $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="

          echo "--- preserve root SSH policy ---"
          sshd -T | grep -Ei '^(permitrootlogin|pubkeyauthentication|passwordauthentication) ' || true

          id layersentry-deploy >/dev/null 2>&1 || useradd -m -s /bin/bash layersentry-deploy
          install -d -o layersentry-deploy -g layersentry-deploy -m 0700 /home/layersentry-deploy/.ssh
          touch /home/layersentry-deploy/.ssh/authorized_keys
          chown layersentry-deploy:layersentry-deploy /home/layersentry-deploy/.ssh/authorized_keys
          chmod 0600 /home/layersentry-deploy/.ssh/authorized_keys
          PUBKEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOSbO6o9GBtG2axbE4BKe05BbRcyxPHTsnX5uvOS/qIJ layersentry-poc-controller@demolayersentry1'
          grep -qxF "$PUBKEY" /home/layersentry-deploy/.ssh/authorized_keys || printf '%s\n' "$PUBKEY" >> /home/layersentry-deploy/.ssh/authorized_keys
          chown layersentry-deploy:layersentry-deploy /home/layersentry-deploy/.ssh/authorized_keys
          restorecon -RF /home/layersentry-deploy/.ssh || true

          cat >/etc/sudoers.d/layersentry-deploy <<'EOF'
          layersentry-deploy ALL=(root) NOPASSWD: ALL
          EOF
          chmod 0440 /etc/sudoers.d/layersentry-deploy
          visudo -cf /etc/sudoers.d/layersentry-deploy

          if [ "$RUNNER_NAME" = "demolayersentry1" ]; then
            ssh -i /root/.ssh/layersentry_poc_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 layersentry-deploy@192.168.1.121 'hostname; id; sudo -n id -u'
            ssh -i /root/.ssh/layersentry_poc_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 layersentry-deploy@192.168.1.122 'hostname; id; sudo -n id -u; ip -br addr show br0'
          fi

          echo "=== STAGE3D_DEPLOY_ACCOUNT_PASS $(date -u +%FT%TZ) runner=$RUNNER_NAME ==="
