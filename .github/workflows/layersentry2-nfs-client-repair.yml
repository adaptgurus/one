name: LayerSentry2 NFS Client Repair

on:
  push:
    branches:
      - lab/seven-node-foundation-20260926
    paths:
      - '.github/workflows/layersentry2-nfs-client-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Install and verify the required NFS client
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME COMPUTERNAME=$env:COMPUTERNAME SLOT=${{ matrix.slot }}"
          if($env:RUNNER_NAME -ine 'WIN-GK6MO7T7OPC' -or $env:COMPUTERNAME -ine 'WIN-GK6MO7T7OPC'){
            Write-Host 'NON_TARGET_HOLD'
            Start-Sleep -Seconds 90
            exit 0
          }
          $dir='C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $key=Join-Path $dir 'deploy_ed25519'
          $known=Join-Path $dir 'known_hosts'
          $script=@'
          set -euo pipefail
          if ! rpm -q nfs-utils >/dev/null 2>&1; then
            dnf -y install nfs-utils
            echo NFS_UTILS_ACTION=INSTALLED
          else
            echo NFS_UTILS_ACTION=ALREADY_PRESENT
          fi
          command -v showmount
          command -v rpcinfo
          exports=$(timeout 8 showmount -e 172.17.60.210)
          printf '%s\n' "$exports"
          printf '%s\n' "$exports" | awk '$1 == "/Pool_NVME1/Backup_NVME_DATA/NFS_shared_Mountpoint" {found=1} END {exit !found}'
          echo NFS_CLIENT_REPAIR=PASS
          '@
          $script=$script -replace "`r`n","`n"
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          $remote="printf '%s' '$b64' | base64 -d | sudo -n bash"
          & ssh.exe -T -i $key -o BatchMode=yes -o PreferredAuthentications=publickey -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" layersentry-deploy@172.17.60.31 $remote
          if($LASTEXITCODE -ne 0){ throw 'LayerSentry2 NFS client repair failed' }
          Write-Host 'LAYERSENTRY2_NFS_CLIENT_REPAIR=PASS'
