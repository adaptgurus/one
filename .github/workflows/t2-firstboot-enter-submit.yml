name: T2 Firstboot Enter Submit

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-firstboot-enter-submit.yml

permissions:
  contents: read

jobs:
  submit:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Submit current prompt with explicit Enter press release
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $ns='root\virtualization\v2'
          $vm=Get-CimInstance -Namespace $ns -ClassName Msvm_ComputerSystem | Where-Object ElementName -eq 'ls-appliance-4c4ac81-qual'
          $kbd=Get-CimAssociatedInstance -InputObject $vm -Namespace $ns -Association Msvm_SystemDevice -ResultClassName Msvm_Keyboard | Select-Object -First 1
          if(-not $kbd){throw 'VM keyboard missing'}
          $p=Invoke-CimMethod -InputObject $kbd -MethodName PressKey -Arguments @{KeyCode=[uint32]0x0D}
          Start-Sleep -Milliseconds 150
          $r=Invoke-CimMethod -InputObject $kbd -MethodName ReleaseKey -Arguments @{KeyCode=[uint32]0x0D}
          if([uint32]$p.ReturnValue -ne 0 -or [uint32]$r.ReturnValue -ne 0){throw 'Explicit Enter failed'}
          Start-Sleep -Seconds 3

      - name: Capture prompt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\after-explicit-enter.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not(Test-Path $out)){throw 'Framebuffer missing'}

      - name: Upload prompt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-after-explicit-enter
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\after-explicit-enter.png
          if-no-files-found: error
          retention-days: 7