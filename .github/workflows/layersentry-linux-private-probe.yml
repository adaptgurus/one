name: LayerSentry Linux Private Repo Probe
on:
  push:
    branches:
      - lab/seven-node-foundation-20260926
    paths:
      - '.github/workflows/layersentry-linux-private-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Probe layersentry1 private repo access
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME COMPUTERNAME=$env:COMPUTERNAME SLOT=${{ matrix.slot }}"
          if($env:RUNNER_NAME -ine 'WIN-GK6MO7T7OPC' -or $env:COMPUTERNAME -ine 'WIN-GK6MO7T7OPC'){ Start-Sleep -Seconds 90; exit 0 }
          $dir='C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $key=Join-Path $dir 'deploy_ed25519'
          $known=Join-Path $dir 'known_hosts'
          if(-not(Test-Path $key)){ throw 'deployment SSH key missing' }
          if(-not(Test-Path $known)){ throw 'known_hosts missing' }
          $cmd="printf 'HOST='; hostname; if sudo -n true >/dev/null 2>&1; then echo SUDO=PASS; else echo SUDO=FAIL; fi; command -v git >/dev/null && git --version || echo GIT=ABSENT; command -v python3 >/dev/null && python3 --version || echo PYTHON3=ABSENT; command -v go >/dev/null && go version || echo GO=ABSENT; command -v node >/dev/null && node --version || echo NODE=ABSENT; exit 0"
          & ssh.exe -T -i $key -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" layersentry-deploy@172.17.60.30 $cmd
          if($LASTEXITCODE -ne 0){ throw "layersentry1 probe failed rc=$LASTEXITCODE" }
          & ssh.exe -T -i $key -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" root@172.17.60.30 "id -u"
          if($LASTEXITCODE -eq 0){ Write-Host 'ROOT_KEY_AUTH=PASS' } else { Write-Host 'ROOT_KEY_AUTH=FAIL'; $global:LASTEXITCODE=0 }
