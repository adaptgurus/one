name: LayerSentry Production Service Wizard

on:
  push:
    paths:
      - 'src/fireedge/src/client/apps/layersentry/serviceBlueprints.js'
      - 'src/fireedge/src/client/apps/layersentry/pages/ProductionServiceWizard.js'
      - 'src/fireedge/src/client/apps/layersentry/pages/ApplicationsWorkspace.js'
      - 'src/fireedge/src/client/apps/layersentry/Portal.js'
      - 'src/fireedge/src/server/routes/api/index.js'
      - 'src/fireedge/src/server/routes/api/serviceblueprints/**'
      - 'src/fireedge/tests/layersentry/production-service-blueprints.test.cjs'
      - '.github/workflows/layersentry-production-service.yml'
  pull_request:
    paths:
      - 'src/fireedge/src/client/apps/layersentry/serviceBlueprints.js'
      - 'src/fireedge/src/client/apps/layersentry/pages/ProductionServiceWizard.js'
      - 'src/fireedge/src/client/apps/layersentry/pages/ApplicationsWorkspace.js'
      - 'src/fireedge/src/client/apps/layersentry/Portal.js'
      - 'src/fireedge/src/server/routes/api/index.js'
      - 'src/fireedge/src/server/routes/api/serviceblueprints/**'
      - 'src/fireedge/tests/layersentry/production-service-blueprints.test.cjs'
      - '.github/workflows/layersentry-production-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json

      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Production service regression matrix
        run: node --test tests/layersentry/production-service-blueprints.test.cjs

      - name: Lint production service source
        run: |
          npx eslint \
            src/client/apps/layersentry/serviceBlueprints.js \
            src/client/apps/layersentry/pages/ProductionServiceWizard.js \
            src/client/apps/layersentry/pages/ApplicationsWorkspace.js \
            src/client/apps/layersentry/Portal.js \
            src/server/routes/api/index.js \
            src/server/routes/api/serviceblueprints/catalog.js \
            src/server/routes/api/serviceblueprints/routes.js \
            src/server/routes/api/serviceblueprints/functions.js \
            src/server/routes/api/serviceblueprints/validation.js \
            src/server/routes/api/serviceblueprints/index.js

      - name: Full FireEdge production build
        run: npm run build
