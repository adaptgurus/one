name: Manoj OneSwap Libguestfs Memory Probe

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-libguestfs-memory-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind Manoj and inspect appliance VM memory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw 'Wrong runner'}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw 'Wrong host'}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Off'){throw 'Source must remain Off'}
          $vm=Get-VM -Name 'ls-appliance-qual' -ErrorAction Stop
          $mem=Get-VMMemory -VM $vm -ErrorAction Stop
          Write-Host "APPLIANCE_STATE=$($vm.State)"
          Write-Host "APPLIANCE_MEMORY_ASSIGNED_MB=$([math]::Round($vm.MemoryAssigned/1MB))"
          Write-Host "APPLIANCE_MEMORY_STARTUP_MB=$([math]::Round($mem.Startup/1MB))"
          Write-Host "APPLIANCE_DYNAMIC_MEMORY=$($mem.DynamicMemoryEnabled)"
          Write-Host "APPLIANCE_MEMORY_MIN_MB=$([math]::Round($mem.Minimum/1MB))"
          Write-Host "APPLIANCE_MEMORY_MAX_MB=$([math]::Round($mem.Maximum/1MB))"

      - name: Prepare appliance key and inspect guest memory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-libguestfs-mem.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $cmd="set -e; echo GUEST_FREE; free -m; echo MEMINFO; grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo; echo ENV_MEMSIZE=${LIBGUESTFS_MEMSIZE:-unset}; echo GUESTFISH_MEMSIZE; guestfish get-memsize"
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $tmp "ci@10.250.10.32" $cmd
          if($LASTEXITCODE -ne 0){throw 'appliance memory probe failed'}

      - name: Source invariant
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count
          Write-Host "FINAL_SOURCE_STATE=$($src.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$n"
          if($src.State -ne 'Off' -or $n -ne 0){throw 'Source invariant failed'}
