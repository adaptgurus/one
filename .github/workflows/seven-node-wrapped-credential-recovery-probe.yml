name: Seven Node Wrapped Credential Recovery Probe

on:
  push:
    branches:
      - lab/seven-node-foundation-20260926
    paths:
      - '.github/workflows/seven-node-wrapped-credential-recovery-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - name: Probe wrapping-key metadata on exact helper
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME SLOT=${{ matrix.slot }}"
          if($env:RUNNER_NAME -ine 'WIN-GK6MO7T7OPC'){
            Write-Host 'NON_TARGET_RUNNER_HOLD'
            Start-Sleep -Seconds 90
            exit 0
          }
          $dir='C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          if(-not (Test-Path $dir)){ throw 'Bootstrap directory unavailable' }
          Get-ChildItem $dir -Force -Recurse -File |
            Select-Object FullName,Length,LastWriteTimeUtc |
            Format-Table -AutoSize

          $sourceUrl="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/workflows/seven-node-ssh-bootstrap.yml"
          $source=(Invoke-WebRequest -UseBasicParsing -Uri $sourceUrl).Content
          $match=[regex]::Match($source,"\$cipher='([^']+)'")
          if(-not $match.Success){ throw 'Wrapped payload unavailable' }
          $cipher=[Convert]::FromBase64String($match.Groups[1].Value)

          $candidates=Get-ChildItem $dir -Force -Recurse -File -Filter '*.xml'
          $passed=@()
          foreach($candidate in $candidates){
            try {
              $rsa=New-Object System.Security.Cryptography.RSACryptoServiceProvider 3072
              $rsa.FromXmlString((Get-Content $candidate.FullName -Raw))
              $plain=[Text.Encoding]::UTF8.GetString($rsa.Decrypt($cipher,$true))
              if([string]::IsNullOrWhiteSpace($plain)){ throw 'empty plaintext' }
              $passed += $candidate.FullName
              Write-Host "WRAP_KEY_DECRYPT=$($candidate.FullName):PASS"
              $plain=$null
            } catch {
              Write-Host "WRAP_KEY_DECRYPT=$($candidate.FullName):FAIL"
            }
          }
          if($passed.Count -eq 0){
            Write-Host 'WRAPPED_CREDENTIAL_RECOVERY=NOT_FOUND'
            exit 2
          }
          Write-Host "WRAPPED_CREDENTIAL_RECOVERY=PASS count=$($passed.Count)"
          Write-Host 'PLAINTEXT_CREDENTIAL_LOGGED=false'
