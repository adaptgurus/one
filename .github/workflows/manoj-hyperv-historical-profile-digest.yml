name: Manoj HyperV Historical Profile Digest Match

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-hyperv-historical-profile-digest.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-historical-profile-digest
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Bind Manoj and require source Off
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host"}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($vm.State -ne 'Off'){throw "Source must remain Off"}
          Write-Host 'HISTORICAL_DIGEST_SOURCE_GATE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-historical-digest.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Match stored digest against historical profiles
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          target="00c7f4f66be6ddbf9e32e79b83444d3095856782bd627d5187e1580e96daf169"
          ruby -ryaml -rjson -rdigest -e '
            target=ARGV.shift
            files=(Dir["/etc/layersentry/oneswap/manoj-qual.yaml*"] + Dir["/etc/layersentry/oneswap/*manoj*qual*"] + Dir["/var/tmp/**/*manoj-qual.yaml*", File::FNM_DOTMATCH]).uniq.select{|p| File.file?(p)}
            canon=lambda do |v|
              case v
              when Hash
                "{" + v.keys.map(&:to_s).sort.map{|k| JSON.generate(k)+":"+canon.call(v[k]||v[k.to_sym])}.join(",") + "}"
              when Array
                "["+v.map{|x| canon.call(x)}.join(",")+"]"
              else JSON.generate(v)
              end
            end
            matches=[]
            files.sort.each do |p|
              begin
                raw=YAML.load_file(p)||{}
                normalized={}
                raw.each{|k,v| normalized[k.to_s.sub(/^:/,"").to_sym]=v}
                # Exact a81 CLI overrides used by the successful PREPARED run.
                o=normalized.merge(
                  config_file:"/etc/layersentry/oneswap/manoj-qual.yaml",
                  hot:true, prepare:true,
                  operation_id:"manoj-hv-ls-migration-source-test-20260924",
                  hyperv_connection:"manoj-qual",
                  guest_os:"linux",
                  expected_guest_macs:"00:15:5d:00:1c:07",
                  uefi_sec_path:"/usr/share/OVMF/OVMF_CODE_4M.secboot.fd",
                  qemu_ga_linux:true,
                  cpu:0.5, vcpu:2, memory_mb:2560,
                  datastore:"1", network:"0"
                )
                o[:http_port] ||= 29869
                d={
                  "datastore"=>o[:datastore].to_s,
                  "network"=>o[:network].to_s,
                  "cluster"=>o[:one_cluster],
                  "host"=>o[:one_host],
                  "sys_ds"=>o[:one_datastore],
                  "ds_cluster"=>o[:one_datastore_cluster],
                  "cpu"=>o[:cpu],
                  "vcpu"=>o[:vcpu],
                  "memory_mb"=>o[:memory_mb],
                  "uefi"=>o[:uefi_path],
                  "uefi_secure"=>o[:uefi_sec_path]
                }
                h=Digest::SHA256.hexdigest(canon.call(d))
                st=File.stat(p)
                puts "PROFILE path=#{p} mtime=#{st.mtime.utc.iso8601 rescue st.mtime.utc} digest=#{h}"
                puts "PROFILE_TARGET_FIELDS cluster=#{o[:one_cluster].inspect} host=#{o[:one_host].inspect} sys_ds=#{o[:one_datastore].inspect} ds_cluster=#{o[:one_datastore_cluster].inspect} uefi=#{o[:uefi_path].inspect}"
                matches << p if h==target
              rescue => e
                puts "PROFILE_SKIP path=#{p} error=#{e.class}"
              end
            end
            puts "MATCH_COUNT=#{matches.length}"
            matches.each{|p| puts "MATCH_PATH=#{p}"}
            exit(matches.length==1 ? 0 : 7)
          ' "$target"
          '@
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'No unique historical profile matched stored digest'}

      - name: Re-prove source Off
        if: always()
        shell: powershell
        run: |
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          Write-Host "FINAL_SOURCE_STATE=$($vm.State)"
          if($vm.State -ne 'Off'){throw 'Inspection changed source state'}
          Write-Host 'HISTORICAL_DIGEST_SOURCE_INVARIANT=PASS'
