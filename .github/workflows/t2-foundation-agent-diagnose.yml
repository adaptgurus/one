name: T2 Foundation Agent Diagnose

on:
  push:
    branches:
      - ops/t2-foundation-iso-qualification-20260921
    paths:
      - .github/workflows/t2-foundation-agent-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    steps:
      - name: Diagnose enrolled agent through non-privileged support SSH
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $q='C:\LayerSentryLab\qualification'
          $source=Join-Path $q 'qual-support-ac7e14e-ed25519'
          if(-not (Test-Path $source)){throw 'Qualification support key missing'}
          & icacls.exe $source /grant:r '*S-1-5-18:(R)' | Out-Null
          $key=Join-Path $env:RUNNER_TEMP 't2-support-key'
          Copy-Item -LiteralPath $source -Destination $key -Force
          & icacls.exe $key /setowner '*S-1-5-18' | Out-Null
          & icacls.exe $key /inheritance:r | Out-Null
          & icacls.exe $key /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe $source /remove:g '*S-1-5-18' | Out-Null
          $known=Join-Path $env:RUNNER_TEMP 't2-appliance-known-hosts'
          $scan=cmd.exe /d /c "ssh-keyscan -T 10 10.250.10.41 2>NUL"
          $scan | Set-Content -LiteralPath $known -Encoding ascii
          if(-not (Test-Path $known) -or (Get-Item $known).Length -eq 0){throw 'Could not obtain guest SSH host key'}
          $cmd='id; hostname; systemctl is-active layersentry-host-agent.service || true; systemctl is-enabled layersentry-host-agent.service || true; systemctl show layersentry-host-agent.service -p ActiveState -p SubState -p Result -p NRestarts -p ExecMainCode -p ExecMainStatus -p WatchdogTimestamp --no-pager; test -s /var/lib/layersentry/agent/pki/client.crt && echo CERT_PRESENT=YES || echo CERT_PRESENT=NO; test -s /var/lib/layersentry/agent/pki/client.key && echo KEY_PRESENT=YES || echo KEY_PRESENT=NO; test -e /etc/layersentry/bootstrap-token && echo BOOTSTRAP_TOKEN_PRESENT=YES || echo BOOTSTRAP_TOKEN_PRESENT=NO; pgrep -af layersentry-host-agent || true; pgrep -af layersentry-agent-wrapper || true'
          ssh.exe -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $key layersentry@10.250.10.41 $cmd
          $rc=$LASTEXITCODE
          & icacls.exe $key /grant:r '*S-1-5-18:(F)' | Out-Null
          Remove-Item -LiteralPath $key -Force
          if($rc -ne 0){throw "Support SSH diagnostic failed rc=$rc"}
          Write-Host 'AGENT_DIAGNOSE=PASS SUPPORT_NO_SUDO_PATH=true'
