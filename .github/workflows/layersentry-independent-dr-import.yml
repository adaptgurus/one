name: LayerSentry independent DR import and boot

on:
  push:
    branches:
      - fix/layersentry-vm-network-backup-20260921
    paths:
      - .github/workflows/layersentry-independent-dr-import.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import_boot:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Import recovery-only qcow2 and boot on independent OpenNebula
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import functools
          import http.server
          import os
          import pathlib
          import socketserver
          import threading
          import time
          import xml.etree.ElementTree as ET
          from xmlrpc.client import ServerProxy
          from dissect.target import Target

          ENDPOINT = "http://10.250.10.10:2633/RPC2"
          HOST_HTTP_IP = "10.250.10.1"
          HTTP_PORT = 18080
          DATASTORE_ID = 1
          RECOVERY_DIR = pathlib.Path(r"C:\LayerSentryLab\dr-recovery\tester-vm220-20260923")
          DISK = RECOVERY_DIR / "vm220-dr-recovered.qcow2"
          AUTH_IMAGE = r"C:\LayerSentryLab\Recovery\fe2-lvm\2.img"

          if not DISK.is_file():
              raise SystemExit("staged recovery disk missing")

          target = Target.open(AUTH_IMAGE)
          auth = target.fs.path("/var/lib/one/.one/one_auth").open("rb").read().decode().strip()
          if ":" not in auth or len(auth) > 1024:
              raise SystemExit("invalid recovered OpenNebula auth shape")

          proxy = ServerProxy(ENDPOINT, allow_none=True)
          version = proxy.one.system.version(auth)
          if not version[0]:
              raise SystemExit("independent OpenNebula authentication failed")
          print("INDEPENDENT_ONE_VERSION=" + str(version[1]))

          class QuietHandler(http.server.SimpleHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  pass

          handler = functools.partial(QuietHandler, directory=str(RECOVERY_DIR))
          server = http.server.ThreadingHTTPServer(("0.0.0.0", HTTP_PORT), handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          print("RECOVERY_HTTP_SOURCE=READY")

          image_name = "ls-dr-vm220-recovery-" + os.environ.get("GITHUB_RUN_ID", "manual")
          image_template = f'''NAME="{image_name}"
          PATH="http://{HOST_HTTP_IP}:{HTTP_PORT}/{DISK.name}"
          TYPE="OS"
          PERSISTENT="NO"
          DESCRIPTION="LayerSentry independent DR test image from recovery repository only"
          '''
          alloc = proxy.one.image.allocate(auth, image_template, DATASTORE_ID)
          if not alloc[0]:
              message = str(alloc[1]).replace("\r", " ").replace("\n", " ")[:800]
              raise SystemExit("image allocate failed code=" + str(alloc[2]) + " message=" + message)
          image_id = int(alloc[1])
          print("DR_IMAGE_ID=" + str(image_id))

          image_state = None
          for _ in range(120):
              info = proxy.one.image.info(auth, image_id, False)
              if not info[0]:
                  raise SystemExit("image info failed code=" + str(info[2]))
              root = ET.fromstring(info[1])
              image_state = int(root.findtext("STATE"))
              if image_state == 1:
                  break
              if image_state in (5, 7):
                  err = root.findtext("./TEMPLATE/ERROR") or root.findtext("ERROR") or "provider error"
                  raise SystemExit("image entered terminal state " + str(image_state) + ": " + err[:300])
              time.sleep(2)
          if image_state != 1:
              raise SystemExit("image did not become READY")
          print("DR_IMAGE_READY=PASS")

          vm_name = "ls-dr-vm220-independent-boot"
          vm_template = f'''NAME="{vm_name}"
          CPU="1"
          VCPU="1"
          MEMORY="256"
          DISK=[IMAGE_ID="{image_id}"]
          SCHED_REQUIREMENTS="NAME = \\"ls-kvm1\\""
          '''
          vm_alloc = proxy.one.vm.allocate(auth, vm_template, False)
          if not vm_alloc[0]:
              raise SystemExit("VM allocate failed code=" + str(vm_alloc[2]))
          vm_id = int(vm_alloc[1])
          print("DR_VM_ID=" + str(vm_id))

          state = lcm = None
          host = ""
          deploy_id = ""
          for _ in range(120):
              info = proxy.one.vm.info(auth, vm_id, False)
              if not info[0]:
                  raise SystemExit("VM info failed code=" + str(info[2]))
              root = ET.fromstring(info[1])
              state = int(root.findtext("STATE"))
              lcm = int(root.findtext("LCM_STATE"))
              deploy_id = root.findtext("DEPLOY_ID") or ""
              histories = root.findall("./HISTORY_RECORDS/HISTORY")
              if histories:
                  host = histories[-1].findtext("HOSTNAME") or ""
              if state == 3 and lcm == 3 and host == "ls-kvm1":
                  break
              if state == 6 or lcm in (14, 15, 36, 44, 48, 49, 50, 56, 57, 58, 59, 60):
                  raise SystemExit(f"VM entered failure/terminal state state={state} lcm={lcm}")
              time.sleep(2)

          if not (state == 3 and lcm == 3 and host == "ls-kvm1"):
              raise SystemExit(f"VM did not reach ACTIVE/RUNNING on ls-kvm1: state={state} lcm={lcm} host={host}")

          print("INDEPENDENT_DR_VM_RUNNING=PASS")
          print("DR_VM_HOST=" + host)
          print("DR_DEPLOY_ID_PRESENT=" + str(bool(deploy_id)))
          print("DR_IMAGE_ID_FINAL=" + str(image_id))
          print("DR_VM_ID_FINAL=" + str(vm_id))
          server.shutdown()
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP 'independent_dr_import.py'
          Set-Content -Path $scriptPath -Value $script -Encoding UTF8
          $ruleName = "LayerSentry-DR-Import-$env:GITHUB_RUN_ID"
          try {
            New-NetFirewallRule -DisplayName $ruleName -Direction Inbound -Action Allow -Protocol TCP -LocalPort 18080 -RemoteAddress 10.250.10.0/24 -Profile Any | Out-Null
            & 'C:\LayerSentryLab\tools\Python313\python.exe' $scriptPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-NetFirewallRule -DisplayName $ruleName -ErrorAction SilentlyContinue
          }
