name: LayerSentry Candidate Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - feat/private-cloud-ux-completion-20260927
    paths:
      - '.github/workflows/layersentry-candidate-deploy.yml'
      - 'src/fireedge/**'

permissions:
  contents: read

concurrency:
  group: layersentry-candidate-deploy
  cancel-in-progress: false

jobs:
  build-deploy-verify:
    runs-on: [self-hosted, Linux, X64, layersentryol7]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Test and build the exact candidate
        working-directory: src/fireedge
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = layersentryol7
          npm ci --ignore-scripts
          node --test tests/layersentry/*.test.cjs
          npm run build
          sha256sum dist/client/bundle.layersentry.js dist/index.js | tee "$RUNNER_TEMP/candidate-hashes.txt"

      - name: Stage candidate on the LayerSentry runtime
        shell: bash
        run: |
          set -euo pipefail
          key=/root/.ssh/layersentry_lab_ed25519
          known="$RUNNER_TEMP/layersentry-known-hosts"
          ssh-keyscan -T 8 -t ed25519,ecdsa,rsa 172.17.60.30 >"$known" 2>/dev/null
          chmod 600 "$known"
          stage="/var/tmp/layersentry-deploy-$GITHUB_SHA"
          ssh -T -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" \
            layersentry-deploy@172.17.60.30 "sudo -n install -d -m 700 '$stage'"
          tar -C src/fireedge -cf - \
            dist \
            etc/sunstone/sunstone-server.conf \
            etc/sunstone/tab-manifest.yaml \
            etc/sunstone/tabs \
            etc/sunstone/views | \
            ssh -T -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" \
              layersentry-deploy@172.17.60.30 "sudo -n tar -C '$stage' -xf -"

      - name: Deploy atomically with rollback
        shell: bash
        run: |
          set -euo pipefail
          key=/root/.ssh/layersentry_lab_ed25519
          known="$RUNNER_TEMP/layersentry-known-hosts"
          bundle_hash=$(sha256sum src/fireedge/dist/client/bundle.layersentry.js | awk '{print $1}')
          server_hash=$(sha256sum src/fireedge/dist/index.js | awk '{print $1}')
          remote="$RUNNER_TEMP/layersentry-deploy.sh"
          cat >"$remote" <<'REMOTE'
          set -euo pipefail
          candidate_sha=$1
          expected_bundle=$2
          expected_server=$3
          stage="/var/tmp/layersentry-deploy-$candidate_sha"
          target=/usr/lib/one/fireedge
          config_root=/etc/one/fireedge/sunstone
          config="$config_root/sunstone-server.conf"
          backup="/var/backups/layersentry-fireedge/$candidate_sha"
          test "$candidate_sha" = "${candidate_sha#*[!0-9a-f]}"
          test ${#candidate_sha} -eq 40
          test -d "$stage/dist/client"
          test "$(sha256sum "$stage/dist/client/bundle.layersentry.js" | awk '{print $1}')" = "$expected_bundle"
          test "$(sha256sum "$stage/dist/index.js" | awk '{print $1}')" = "$expected_server"
          test ! -e "$backup"
          install -d -m 700 "$backup"
          cp -a "$target/dist" "$backup/dist"
          cp -a "$config" "$backup/sunstone-server.conf"
          cp -a "$config_root/tab-manifest.yaml" "$backup/tab-manifest.yaml"
          cp -a "$config_root/tabs" "$backup/tabs"
          cp -a "$config_root/views" "$backup/views"

          rollback() {
            trap - ERR
            systemctl stop opennebula-fireedge.service || true
            rm -rf "$target/dist"
            cp -a "$backup/dist" "$target/dist"
            install -o root -g oneadmin -m 640 "$backup/sunstone-server.conf" "$config"
            install -o root -g oneadmin -m 640 "$backup/tab-manifest.yaml" "$config_root/tab-manifest.yaml"
            rm -rf "$config_root/tabs" "$config_root/views"
            cp -a "$backup/tabs" "$config_root/tabs"
            cp -a "$backup/views" "$config_root/views"
            systemctl start opennebula-fireedge.service || true
          }
          trap rollback ERR

          ruby -ryaml -e '
            source = YAML.safe_load_file(ARGV[0], aliases: true)
            target = YAML.safe_load_file(ARGV[1], aliases: true)
            profile = source.fetch("layersentry_capabilities")
            target["layersentry_capabilities"] = profile
            File.write(ARGV[2], YAML.dump(target))
          ' "$stage/etc/sunstone/sunstone-server.conf" "$config" "$stage/sunstone-server.conf"

          systemctl stop opennebula-fireedge.service
          rm -rf "$target/dist"
          cp -a "$stage/dist" "$target/dist"
          chown -R root:root "$target/dist"
          install -o root -g oneadmin -m 640 "$stage/sunstone-server.conf" "$config"
          install -o root -g oneadmin -m 640 "$stage/etc/sunstone/tab-manifest.yaml" "$config_root/tab-manifest.yaml"
          rm -rf "$config_root/tabs" "$config_root/views"
          cp -a "$stage/etc/sunstone/tabs" "$config_root/tabs"
          cp -a "$stage/etc/sunstone/views" "$config_root/views"
          chown -R root:oneadmin "$config_root/tabs" "$config_root/views"
          printf '%s\n' "$candidate_sha" >"$target/dist/LAYERSENTRY_SOURCE_COMMIT"
          systemctl start opennebula-fireedge.service
          systemctl is-active --quiet opennebula-fireedge.service
          test "$(sha256sum "$target/dist/client/bundle.layersentry.js" | awk '{print $1}')" = "$expected_bundle"
          test "$(sha256sum "$target/dist/index.js" | awk '{print $1}')" = "$expected_server"
          test "$(cat "$target/dist/LAYERSENTRY_SOURCE_COMMIT")" = "$candidate_sha"
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:2616/fireedge/layersentry; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          curl -fsS http://127.0.0.1:2616/fireedge/layersentry | grep -q 'layersentry_capabilities'
          ruby -ryaml -e '
            config = YAML.safe_load_file(ARGV[0], aliases: true)
            abort "missing LayerSentry capability profile" unless config.dig("layersentry_capabilities", "COMPUTE", "enabled") == true
          ' "$config"
          for route in /fireedge /fireedge/layersentry /fireedge/layersentry/compute /fireedge/layersentry/infrastructure/hosts /fireedge/undefined/; do
            code=$(curl -sS -o /dev/null --max-time 15 -w '%{http_code}' "http://127.0.0.1:2616$route")
            case "$route:$code" in
              /fireedge:302|/fireedge/undefined/:302|*:200) ;;
              *) echo "unexpected route status $route $code" >&2; exit 1 ;;
            esac
          done
          trap - ERR
          echo "DEPLOYED_SOURCE_COMMIT=$candidate_sha"
          echo "DEPLOYED_LAYER_SENTRY_BUNDLE_SHA256=$expected_bundle"
          echo "DEPLOYED_SERVER_SHA256=$expected_server"
          REMOTE
          chmod 700 "$remote"
          ssh -T -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" \
            layersentry-deploy@172.17.60.30 \
            "sudo -n bash -s -- '$GITHUB_SHA' '$bundle_hash' '$server_hash'" <"$remote"

      - name: Real-browser anonymous routing and branding smoke
        working-directory: src/fireedge
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install chromium
          node tests/layersentry/live-browser-smoke.cjs http://172.17.60.30:2616/fireedge

      - name: Create short-lived browser qualification identity
        shell: bash
        run: |
          set -euo pipefail
          key=/root/.ssh/layersentry_lab_ed25519
          known="$RUNNER_TEMP/layersentry-known-hosts"
          username="ls-ci-${GITHUB_SHA:0:10}"
          password=$(openssl rand -hex 24)
          admin_username="ls-ci-admin-${GITHUB_SHA:0:10}"
          admin_password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "::add-mask::$admin_password"
          user_output=$(ssh -T -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" \
            layersentry-deploy@172.17.60.30 \
            "sudo -n -u oneadmin oneuser create '$username' '$password' --driver core")
          user_id=${user_output##*: }
          [[ "$user_id" =~ ^[0-9]+$ ]]
          auth_file="$RUNNER_TEMP/layersentry-auth.env"
          {
            printf 'LAYERSENTRY_TEST_USERNAME=%q\n' "$username"
            printf 'LAYERSENTRY_TEST_PASSWORD=%q\n' "$password"
            printf 'LAYERSENTRY_TEST_USER_ID=%q\n' "$user_id"
          } >"$auth_file"
          chmod 600 "$auth_file"
          admin_output=$(ssh -T -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" \
            layersentry-deploy@172.17.60.30 \
            "sudo -n -u oneadmin oneuser create '$admin_username' '$admin_password' --driver core")
          admin_id=${admin_output##*: }
          [[ "$admin_id" =~ ^[0-9]+$ ]]
          {
            printf 'LAYERSENTRY_ADMIN_USERNAME=%q\n' "$admin_username"
            printf 'LAYERSENTRY_ADMIN_PASSWORD=%q\n' "$admin_password"
            printf 'LAYERSENTRY_ADMIN_USER_ID=%q\n' "$admin_id"
          } >>"$auth_file"
          ssh -T -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" \
            layersentry-deploy@172.17.60.30 \
            "sudo -n -u oneadmin oneuser chgrp '$admin_id' 0"
          host_id=$(ssh -T -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" \
            layersentry-deploy@172.17.60.30 \
            "sudo -n -u oneadmin onehost list --json | ruby -rjson -e 'v=JSON.parse(STDIN.read).dig(\"HOST_POOL\",\"HOST\"); a=v.is_a?(Array) ? v : [v]; puts a.compact.first.fetch(\"ID\")'")
          [[ "$host_id" =~ ^[0-9]+$ ]]
          printf 'LAYERSENTRY_TEST_HOST_ID=%q\n' "$host_id" >>"$auth_file"

      - name: Authenticated browser, deep-link, expiry and IDOR smoke
        working-directory: src/fireedge
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/layersentry-auth.env"
          node tests/layersentry/live-auth-browser-smoke.cjs \
            http://172.17.60.30:2616/fireedge \
            "$LAYERSENTRY_TEST_USERNAME" "$LAYERSENTRY_TEST_PASSWORD" customer
          node tests/layersentry/live-auth-browser-smoke.cjs \
            http://172.17.60.30:2616/fireedge \
            "$LAYERSENTRY_ADMIN_USERNAME" "$LAYERSENTRY_ADMIN_PASSWORD" admin \
            "$LAYERSENTRY_TEST_HOST_ID"

      - name: Restart persistence and exact deployment recheck
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/layersentry-auth.env"
          key=/root/.ssh/layersentry_lab_ed25519
          known="$RUNNER_TEMP/layersentry-known-hosts"
          bundle_hash=$(sha256sum src/fireedge/dist/client/bundle.layersentry.js | awk '{print $1}')
          server_hash=$(sha256sum src/fireedge/dist/index.js | awk '{print $1}')
          ssh -T -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" \
            layersentry-deploy@172.17.60.30 \
            "sudo -n systemctl restart opennebula-fireedge.service && \
             sudo -n systemctl is-active --quiet opennebula-fireedge.service && \
             sudo -n grep -qx '$GITHUB_SHA' /usr/lib/one/fireedge/dist/LAYERSENTRY_SOURCE_COMMIT && \
             sudo -n sha256sum /usr/lib/one/fireedge/dist/client/bundle.layersentry.js | grep -q '^$bundle_hash  ' && \
             sudo -n sha256sum /usr/lib/one/fireedge/dist/index.js | grep -q '^$server_hash  '"
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://172.17.60.30:2616/fireedge/layersentry | grep -q 'layersentry_capabilities'; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          node src/fireedge/tests/layersentry/live-auth-browser-smoke.cjs \
            http://172.17.60.30:2616/fireedge \
            "$LAYERSENTRY_TEST_USERNAME" "$LAYERSENTRY_TEST_PASSWORD" customer

      - name: Remove short-lived browser qualification identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          auth_file="$RUNNER_TEMP/layersentry-auth.env"
          test -f "$auth_file" || exit 0
          source "$auth_file"
          key=/root/.ssh/layersentry_lab_ed25519
          known="$RUNNER_TEMP/layersentry-known-hosts"
          if [[ "${LAYERSENTRY_TEST_USER_ID:-}" =~ ^[0-9]+$ ]]; then
            ssh -T -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" \
              layersentry-deploy@172.17.60.30 \
              "sudo -n -u oneadmin oneuser delete '$LAYERSENTRY_TEST_USER_ID'"
          fi
          if [[ "${LAYERSENTRY_ADMIN_USER_ID:-}" =~ ^[0-9]+$ ]]; then
            ssh -T -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" \
              layersentry-deploy@172.17.60.30 \
              "sudo -n -u oneadmin oneuser delete '$LAYERSENTRY_ADMIN_USER_ID'"
          fi
