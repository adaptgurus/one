name: T2 Installation Destination Inspect

on:
  push:
    branches:
      - ops/t2-live-evidence-4c4ac81
    paths:
      - .github/workflows/t2-install-destination-inspect.yml
      - qualification/t2-disk-menu.request

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Bind exact disposable VM and disk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $name='ls-appliance-4c4ac81-qual'
          $expected='C:\LayerSentryLab\qualification\ls-appliance-4c4ac81-qual\os.vhdx'
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "VM not running: $($vm.State)"}
          $disks=@(Get-VMHardDiskDrive -VMName $name)
          if($disks.Count -ne 1){throw "Expected exactly one VHD, found $($disks.Count)"}
          if($disks[0].Path -ne $expected){throw "Unexpected disk path: $($disks[0].Path)"}
          $vhd=Get-VHD -Path $expected
          if($vhd.Size -ne 85899345920){throw "Disposable VHD virtual size is not 80 GiB: $($vhd.Size)"}
          if($disks[0].DiskNumber -ne $null){throw 'Pass-through disk unexpectedly attached'}
          Write-Host "DISK_SAFETY=PASS path=$expected size=$($vhd.Size)"

      - name: Open Installation Destination menu
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $vm=Get-WmiObject -Namespace root\virtualization\v2 -Class Msvm_ComputerSystem | Where-Object ElementName -eq $name
          if(-not $vm){throw 'VM WMI object missing'}
          $kb=Get-WmiObject -Namespace root\virtualization\v2 -Query "ASSOCIATORS OF {$($vm.__PATH)} WHERE ResultClass=Msvm_Keyboard"
          if(-not $kb){throw 'Hyper-V keyboard object missing'}
          $null=$kb.TypeText('5')
          Start-Sleep -Milliseconds 300
          $null=$kb.PressKey(13); $null=$kb.ReleaseKey(13)
          Start-Sleep -Seconds 4

      - name: Capture destination menu
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\installation-destination-menu.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not (Test-Path $out)){throw 'Destination menu framebuffer missing'}
          Write-Host "DESTINATION_MENU_SCREENSHOT=$out bytes=$((Get-Item $out).Length)"

      - name: Upload destination menu
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-installation-destination-menu
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\installation-destination-menu.png
          if-no-files-found: error
          retention-days: 7