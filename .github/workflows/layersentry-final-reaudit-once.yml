name: LayerSentry final production re-audit once

on:
  push:
    branches:
      - feat/self-service-v5-ui-20260911
    paths:
      - '.github/workflows/layersentry-final-reaudit-once.yml'

permissions:
  contents: read

jobs:
  node22-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/self-service-v5-ui-20260911
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify hardened dependency contract
        run: |
          node - <<'NODE'
          const p=require('./package-lock.json')
          const expected={
            'http-proxy-middleware':'3.0.7',
            'node-zendesk':'6.0.1',
            'webpack':'5.110.3',
            'd3-color':'3.1.0'
          }
          for (const [name, wanted] of Object.entries(expected)) {
            const actual=p.packages[`node_modules/${name}`]?.version
            console.log(`${name}=${actual}`)
            if (actual !== wanted) process.exitCode=2
          }
          if (require('./package.json').engines?.node !== '>=18') process.exitCode=2
          NODE
      - name: LayerSentry integration and regression tests
        run: node --test tests/layersentry/*.test.cjs
      - name: FireEdge lint
        run: npm run lint
      - name: Full FireEdge production build
        run: npm run build
      - name: Runtime dependency audit gate
        run: |
          npm audit --omit=dev --json > /tmp/layersentry-final-audit.json || true
          node - <<'NODE'
          const fs=require('fs')
          const report=JSON.parse(fs.readFileSync('/tmp/layersentry-final-audit.json','utf8'))
          const counts=report?.metadata?.vulnerabilities ?? {}
          console.log('RUNTIME_AUDIT_COUNTS='+JSON.stringify(counts))
          if ((counts.critical ?? 0) !== 0) process.exitCode=2
          NODE
      - name: Install browser runner without changing lock
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build Chromium acceptance harness
        run: npx webpack --config tests/layersentry/browser/webpack.config.cjs
      - name: Run real Chromium acceptance
        run: |
          python3 -m http.server 4173 --directory tests/layersentry/browser/dist >/tmp/layersentry-browser.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ >/dev/null
          node tests/layersentry/browser/smoke.cjs

  node18-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/self-service-v5-ui-20260911
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Install exact locked dependencies on Node 18
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: LayerSentry tests on Node 18
        run: node --test tests/layersentry/*.test.cjs
      - name: FireEdge server build on Node 18
        run: NODE_ENV=production npm run build-server
