name: T2 Foundation Livequal Helper Audit

on:
  push:
    branches:
      - ops/t2-foundation-livequal-20260921
    paths:
      - .github/workflows/t2-foundation-livequal-helper-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Bind exact Manoj runner and artifact
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $iso='C:\LayerSentryLab\qualification\4c4ac81\LayerSentry-Rocky-9.8-4c4ac81-generic-x86_64.iso'
          if(-not (Test-Path $iso)){throw 'Exact ISO missing'}
          $sha=(Get-FileHash -Algorithm SHA256 $iso).Hash.ToLowerInvariant()
          if($sha -ne '11c1726e02fba6ffe5609ff15f17f3c5d4dd6aaaf0ad0b14bb20beb88475f2b0'){throw "ISO digest mismatch: $sha"}
          Write-Host "EXACT_ISO=PASS SHA256=$sha SIZE=$((Get-Item $iso).Length)"

      - name: Inspect disposable Hyper-V qualification topology
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $os=Get-CimInstance Win32_OperatingSystem
          Write-Host "FREE_RAM_GB=$([math]::Round($os.FreePhysicalMemory/1MB,2))"
          Get-PSDrive -PSProvider FileSystem | Select Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize
          foreach($n in @('ls-appliance-dbe-qual','ls-appliance-qual','ls-iso-builder')){
            Write-Host "=== VM $n ==="
            $v=Get-VM -Name $n -ErrorAction SilentlyContinue
            if(-not $v){Write-Host MISSING;continue}
            $v | Select Name,State,Generation,ProcessorCount,MemoryAssigned,AutomaticCheckpointsEnabled | Format-List
            Get-VMHardDiskDrive -VMName $n | Select ControllerType,ControllerNumber,ControllerLocation,Path | Format-Table -AutoSize
            Get-VMDvdDrive -VMName $n -ErrorAction SilentlyContinue | Select ControllerNumber,ControllerLocation,Path | Format-Table -AutoSize
            Get-VMNetworkAdapter -VMName $n | Select Name,SwitchName,MacAddress,Status | Format-Table -AutoSize
          }

      - name: Read existing non-secret qualification helpers
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $root='C:\LayerSentryLab\qualification'
          $names=@(
            'capture_vm_thumbnail.ps1',
            'send_anaconda_command.ps1',
            'vm_type_cmd.ps1',
            'vm_type_nonsecret.ps1',
            'vm_tty2_root.ps1',
            'add_qual_dvd_wmi.ps1',
            'add_qual_dvd_wmi2.ps1',
            'vm_enroll_testlab.ps1',
            'vm_full_enroll_testlab.ps1'
          )
          foreach($name in $names){
            $p=Join-Path $root $name
            Write-Host "=== HELPER $name ==="
            if(Test-Path $p){Get-Content -LiteralPath $p}else{Write-Host MISSING}
          }