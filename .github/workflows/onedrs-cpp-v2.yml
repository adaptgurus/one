name: OneDRS C++ Corrective Verification

on:
  pull_request:
    paths:
      - "src/schedm/SchedulerManagerDriver.cc"
      - "src/cluster/Cluster.cc"
      - ".github/workflows/onedrs-cpp-v2.yml"

permissions:
  contents: read

jobs:
  cpp-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install repository C++ linters
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck astyle
      - name: Targeted CppCheck
        run: |
          cppcheck \
            src/schedm/SchedulerManagerDriver.cc \
            src/cluster/Cluster.cc \
            -I include -I src/monitor/include \
            -DSQLITE_DB -DMYSQL_DB -DSYSTEMD \
            --enable=performance,information,warning,portability,style,missingInclude \
            --inline-suppr \
            --suppress-xml=share/smoke_tests/config/cppcheck-suppressions.xml \
            --suppress=unmatchedSuppression \
            --std=c++17 --error-exitcode=2 -q
      - name: Repository AStyle check
        run: |
          astyle --options=share/linters/.astylerc --formatted --verbose \
            src/schedm/SchedulerManagerDriver.cc src/cluster/Cluster.cc
          git --no-pager diff --exit-code
