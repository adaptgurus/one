name: LayerSentry two-site checkpoint qualification

on:
  push:
    branches:
      - feat/layersentry-protection-domain-20260923
    paths:
      - .github/workflows/layersentry-two-site-checkpoint.yml

permissions:
  contents: read

jobs:
  tester_source_preflight:
    runs-on: [self-hosted, Linux, X64, testser-two-site]
    timeout-minutes: 10
    env:
      CHECKPOINT_DIR: /home/opc/layersentry-live-qual-20260913/two-site-checkpoint-20260923
    steps:
      - name: Identify Tester source site
        shell: bash
        run: |
          set -euo pipefail
          echo "HOSTNAME=$(hostname)"
          echo "USER=$(id -un)"
          uname -a
          df -h /
          free -h || true

      - name: Verify Tester checkpoint source and OpenNebula control plane
        shell: bash
        run: |
          set -euo pipefail
          manifest="$CHECKPOINT_DIR/checkpoint-manifest.json"
          archive="$CHECKPOINT_DIR/checkpoint-vm220-restic.tar.gz"
          test -f "$manifest"
          test -f "$archive"
          python3 - "$manifest" "$archive" <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          archive = pathlib.Path(sys.argv[2])
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert manifest["source_site"] == "tester"
          assert manifest["remote_site"] == "manoj"
          assert digest == manifest["archive_sha256"]
          assert archive.stat().st_size == manifest["archive_size_bytes"]
          print("TESTER_CHECKPOINT_VERIFIED=" + digest)
          print("CHECKPOINT_ID=" + manifest["checkpoint_id"])
          PY
          ssh -o BatchMode=yes -o ConnectTimeout=10 rocky-01 'oneversion; onehost list; onedatastore list'

  manoj_remote_checkpoint:
    needs: tester_source_preflight
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      CHECKPOINT_TAG: layersentry-dr-two-site-20260923-0104
    steps:
      - name: Identify Manoj site and DR-host capability
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "HOSTNAME=$env:COMPUTERNAME"
          $system = Get-CimInstance Win32_ComputerSystem
          Write-Host "LOGICAL_PROCESSORS=$($system.NumberOfLogicalProcessors)"
          Write-Host "MEMORY_BYTES=$($system.TotalPhysicalMemory)"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

          $vmms = Get-Service vmms -ErrorAction SilentlyContinue
          if ($null -eq $vmms) {
            Write-Host 'HYPERV_VMMS=ABSENT'
          } else {
            Write-Host "HYPERV_VMMS=$($vmms.Status)"
          }

          if (Get-Command Get-VM -ErrorAction SilentlyContinue) {
            Write-Host 'HYPERV_CMDLETS=PRESENT'
            Get-VM | Select-Object Name, State, Generation, ProcessorCount, MemoryAssigned, Uptime | Format-Table -AutoSize
            Get-VMSwitch | Select-Object Name, SwitchType | Format-Table -AutoSize
            Get-VM | ForEach-Object {
              $processor = Get-VMProcessor -VMName $_.Name
              Write-Host "VM=$($_.Name) EXPOSE_VIRT_EXTENSIONS=$($processor.ExposeVirtualizationExtensions)"
            }
          } else {
            Write-Host 'HYPERV_CMDLETS=ABSENT'
          }

          if (Get-Command wsl.exe -ErrorAction SilentlyContinue) {
            Write-Host 'WSL=PRESENT'
            wsl.exe -l -v
          } else {
            Write-Host 'WSL=ABSENT'
          }

      - name: Download Tester checkpoint
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP "layersentry-dr-$env:CHECKPOINT_TAG"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $apiHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:CHECKPOINT_TAG"
          $release = Invoke-RestMethod -Headers $apiHeaders -Uri $releaseUri
          foreach ($asset in $release.assets) {
            $assetHeaders = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/octet-stream'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $outFile = Join-Path $dir $asset.name
            Invoke-WebRequest -Headers $assetHeaders -Uri $asset.url -OutFile $outFile
          }
          Get-ChildItem $dir | Format-Table Name,Length -AutoSize
          "CHECKPOINT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify and persist checkpoint on Manoj
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = Join-Path $env:CHECKPOINT_DIR 'checkpoint-manifest.json'
          $archivePath = Join-Path $env:CHECKPOINT_DIR 'checkpoint-vm220-restic.tar.gz'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.source_site -ne 'tester') { throw 'unexpected source site' }
          if ($manifest.remote_site -ne 'manoj') { throw 'unexpected remote site' }
          $actual = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.archive_sha256) { throw "checkpoint SHA mismatch: $actual" }
          if ((Get-Item $archivePath).Length -ne $manifest.archive_size_bytes) { throw 'checkpoint size mismatch' }
          $persistent = Join-Path 'C:\LayerSentryLab\dr-checkpoints' $env:CHECKPOINT_TAG
          New-Item -ItemType Directory -Force -Path $persistent | Out-Null
          Copy-Item (Join-Path $env:CHECKPOINT_DIR '*') $persistent -Force
          $verification = [ordered]@{
            checkpoint_id = $manifest.checkpoint_id
            source_site = $manifest.source_site
            remote_site = $manifest.remote_site
            manoj_host = $env:COMPUTERNAME
            sha256 = $actual
            archive_size_bytes = (Get-Item $archivePath).Length
            stored_path = $persistent
            verified_at_utc = [DateTime]::UtcNow.ToString('o')
          }
          $verification | ConvertTo-Json | Set-Content (Join-Path $persistent 'manoj-verification.json')
          Write-Host "MANOJ_CHECKPOINT_VERIFIED=$actual"
          "MANOJ_PERSISTENT=$persistent" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload checkpoint acknowledgement from Manoj site
        uses: actions/upload-artifact@v4
        with:
          name: manoj-remote-checkpoint
          path: ${{ env.MANOJ_PERSISTENT }}
          if-no-files-found: error
          retention-days: 1

  tester_ack_roundtrip:
    needs: manoj_remote_checkpoint
    runs-on: [self-hosted, Linux, X64, testser-two-site]
    timeout-minutes: 10
    env:
      SOURCE_CHECKPOINT_DIR: /home/opc/layersentry-live-qual-20260913/two-site-checkpoint-20260923
    steps:
      - name: Download Manoj checkpoint acknowledgement
        uses: actions/download-artifact@v4
        with:
          name: manoj-remote-checkpoint
          path: ${{ runner.temp }}/manoj-remote-checkpoint

      - name: Verify acknowledgement against Tester source
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/manoj-remote-checkpoint"
          manifest="$(find "$root" -name checkpoint-manifest.json -print -quit)"
          receipt="$(find "$root" -name manoj-verification.json -print -quit)"
          archive="$(find "$root" -name checkpoint-vm220-restic.tar.gz -print -quit)"
          test -n "$manifest"
          test -n "$receipt"
          test -n "$archive"
          python3 - "$SOURCE_CHECKPOINT_DIR/checkpoint-manifest.json" "$manifest" "$receipt" "$archive" <<'PY'
          import hashlib, json, pathlib, sys
          source = json.loads(pathlib.Path(sys.argv[1]).read_text())
          remote_manifest = json.loads(pathlib.Path(sys.argv[2]).read_text())
          receipt = json.loads(pathlib.Path(sys.argv[3]).read_text())
          archive = pathlib.Path(sys.argv[4])
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert remote_manifest == source
          assert receipt["checkpoint_id"] == source["checkpoint_id"]
          assert receipt["source_site"] == "tester"
          assert receipt["remote_site"] == "manoj"
          assert receipt["sha256"] == source["archive_sha256"] == digest
          assert receipt["archive_size_bytes"] == source["archive_size_bytes"] == archive.stat().st_size
          print("TWO_SITE_ACK_ROUNDTRIP=PASS")
          print("CHECKPOINT_ID=" + source["checkpoint_id"])
          print("SHA256=" + digest)
          PY
