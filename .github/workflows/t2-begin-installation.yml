name: T2 Begin Exact Installation

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-begin-installation.yml

permissions:
  contents: read

concurrency:
  group: t2-install-4c4ac81
  cancel-in-progress: true

jobs:
  install:
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - name: Re-bind exact disposable VM, VHD and ISO
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $name='ls-appliance-4c4ac81-qual'
          $expected='C:\LayerSentryLab\qualification\ls-appliance-4c4ac81-qual\os.vhdx'
          $iso='C:\LayerSentryLab\qualification\4c4ac81\LayerSentry-Rocky-9.8-4c4ac81-generic-x86_64.iso'
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "VM not running: $($vm.State)"}
          $disks=@(Get-VMHardDiskDrive -VMName $name)
          if($disks.Count -ne 1 -or $disks[0].Path -ne $expected){throw 'Disposable disk binding changed'}
          $vhd=Get-VHD -Path $expected
          if($vhd.Size -ne 85899345920){throw "Unexpected VHD size $($vhd.Size)"}
          $dvd=Get-VMDvdDrive -VMName $name
          if($dvd.Path -ne $iso){throw "Unexpected DVD path: $($dvd.Path)"}
          Write-Host "INSTALL_BIND=PASS vhd=$expected dvd=$iso"

      - name: Set next boot to installed VHD
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $disk=Get-VMHardDiskDrive -VMName $name | Where-Object ControllerLocation -eq 0
          Set-VMFirmware -VMName $name -FirstBootDevice $disk
          $fw=Get-VMFirmware -VMName $name
          Write-Host "NEXT_BOOT=$($fw.BootOrder[0].BootType)"

      - name: Begin installation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $vm=Get-WmiObject -Namespace root\virtualization\v2 -Class Msvm_ComputerSystem | Where-Object ElementName -eq $name
          $kb=Get-WmiObject -Namespace root\virtualization\v2 -Query "ASSOCIATORS OF {$($vm.__PATH)} WHERE ResultClass=Msvm_Keyboard"
          if(-not $kb){throw 'Hyper-V keyboard missing'}
          $r1=$kb.TypeKey([uint32]0x42)
          Start-Sleep -Milliseconds 250
          $r2=$kb.TypeKey([uint32]0x0D)
          if($r1.ReturnValue -ne 0 -or $r2.ReturnValue -ne 0){throw 'Begin-install key injection failed'}
          Start-Sleep -Seconds 15

      - name: Capture installation started
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\installation-started.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not (Test-Path $out)){throw 'Installation-start framebuffer missing'}

      - name: Wait for installation and automatic reboot
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-4c4ac81-qual'
          $vhd='C:\LayerSentryLab\qualification\ls-appliance-4c4ac81-qual\os.vhdx'
          $start=(Get-Date)
          $lastSize=(Get-Item $vhd).Length
          for($i=0;$i -lt 60;$i++){
            Start-Sleep -Seconds 20
            $vm=Get-VM -Name $name -ErrorAction Stop
            $size=(Get-Item $vhd).Length
            $hb=(Get-VMIntegrationService -VMName $name -Name 'Heartbeat' -ErrorAction SilentlyContinue).PrimaryStatusDescription
            Write-Host "POLL=$i state=$($vm.State) heartbeat=$hb vhd_file_bytes=$size elapsed=$([int]((Get-Date)-$start).TotalSeconds)"
            $lastSize=$size
            if($hb -eq 'OK'){
              $ips=@((Get-VMNetworkAdapter -VMName $name).IPAddresses | Where-Object {$_ -match '^\d+\.'})
              if($ips.Count -gt 0){Write-Host "GUEST_IPS=$($ips -join ',')"; break}
            }
          }

      - name: Capture post-install boot screen
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\post-install-boot.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-4c4ac81-qual' -Out $out
          if(-not (Test-Path $out)){throw 'Post-install framebuffer missing'}
          $vm=Get-VM -Name 'ls-appliance-4c4ac81-qual'
          $hb=(Get-VMIntegrationService -VMName $vm.Name -Name 'Heartbeat' -ErrorAction SilentlyContinue).PrimaryStatusDescription
          $ips=@((Get-VMNetworkAdapter -VMName $vm.Name).IPAddresses | Where-Object {$_ -match '^\d+\.'})
          Write-Host "POST_INSTALL state=$($vm.State) heartbeat=$hb ips=$($ips -join ',')"

      - name: Upload installation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-installation-evidence
          path: |
            C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\installation-started.png
            C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\post-install-boot.png
          if-no-files-found: error
          retention-days: 7