name: T2 Bootstrap-Fix Begin Validated Install

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-bootstrapfix-begin-install-validated.yml

permissions:
  contents: read

concurrency:
  group: t2-bootstrapfix-final-install
  cancel-in-progress: true

jobs:
  begin:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Re-bind final VM and require Secure Boot off
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $name='ls-appliance-bootstrapfix-qual'
          $vhd='C:\LayerSentryLab\qualification\ls-appliance-bootstrapfix-qual\os.vhdx'
          $iso='C:\LayerSentryLab\qualification\bootstrapfix-db8ef17\LayerSentry-Rocky-9.8-bootstrapfix-db8ef17-generic-x86_64.iso'
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "VM not running: $($vm.State)"}
          $fw=Get-VMFirmware -VMName $name
          if($fw.SecureBoot -ne 'Off'){throw "Secure Boot must remain off, got $($fw.SecureBoot)"}
          $disks=@(Get-VMHardDiskDrive -VMName $name)
          if($disks.Count -ne 1 -or $disks[0].Path -ne $vhd){throw 'Final VHD binding changed'}
          if((Get-VHD -Path $vhd).Size -ne 85899345920){throw 'Final VHD virtual size changed'}
          $dvd=Get-VMDvdDrive -VMName $name -ErrorAction Stop
          if($dvd.Path -ne $iso){throw "Final ISO binding changed: $($dvd.Path)"}
          Set-VMFirmware -VMName $name -FirstBootDevice $disks[0]
          Write-Host "FINAL_INSTALL_BIND=PASS secureboot=$($fw.SecureBoot) initial_vhd_file_bytes=$((Get-Item $vhd).Length)"

      - name: Begin installation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='ls-appliance-bootstrapfix-qual'
          $vm=Get-WmiObject -Namespace root\virtualization\v2 -Class Msvm_ComputerSystem | Where-Object ElementName -eq $name
          $kb=Get-WmiObject -Namespace root\virtualization\v2 -Query "ASSOCIATORS OF {$($vm.__PATH)} WHERE ResultClass=Msvm_Keyboard"
          if(-not $kb){throw 'Hyper-V keyboard missing'}
          $a=$kb.TypeKey([uint32]0x42);Start-Sleep -Milliseconds 250
          $b=$kb.TypeKey([uint32]0x0D)
          if($a.ReturnValue -ne 0 -or $b.ReturnValue -ne 0){throw 'Begin-install key injection failed'}
          Start-Sleep -Seconds 20
          Write-Host 'FINAL_INSTALL_BEGIN_KEYS=PASS'

      - name: Prove installer is writing VHD
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vhd='C:\LayerSentryLab\qualification\ls-appliance-bootstrapfix-qual\os.vhdx'
          $grew=$false
          for($i=0;$i -lt 18;$i++){
            $len=(Get-Item $vhd).Length
            Write-Host "FINAL_VHD_FILE_BYTES=$len"
            if($len -gt 100000000){$grew=$true;break}
            Start-Sleep -Seconds 10
          }
          if(-not $grew){throw 'Final installer did not begin writing the VHD'}
          $out='C:\LayerSentryLab\evidence\t2-bootstrapfix-db8ef17\install-start-secureboot-off.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-bootstrapfix-qual' -Out $out
          if(-not(Test-Path $out)){throw 'Install-start screenshot missing'}
          Write-Host "FINAL_INSTALL_WRITING=PASS vhd_bytes=$((Get-Item $vhd).Length)"

      - name: Upload install-start evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-bootstrapfix-db8ef17-install-start-secureboot-off
          path: C:\LayerSentryLab\evidence\t2-bootstrapfix-db8ef17\install-start-secureboot-off.png
          if-no-files-found: error
          retention-days: 7