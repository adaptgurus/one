name: Manoj HyperV Target Digest State Migration

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-hyperv-target-digest-state-migration.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-target-digest-state-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Bind Manoj and require source Off
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          if($vm.State -ne 'Off'){throw "Digest migration requires source Off; state=$($vm.State)"}
          if($n -ne 0){throw "Unexpected source checkpoints: $n"}
          Write-Host 'DIGEST_MIGRATION_SOURCE_GATE=PASS'

      - name: Verify exact RCT reference still exists
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $refs=@(Get-WmiObject -Namespace root/virtualization/v2 -Class Msvm_VirtualSystemReferencePoint -Filter "VirtualSystemIdentifier='$($vm.VMId.Guid)'" -ErrorAction Stop)
          if($refs.Count -ne 1){throw "Expected one RCT reference; found $($refs.Count)"}
          $ref=$refs[0]
          $vd=@($ref.VirtualDiskIdentifiers)
          $ri=@($ref.ResilientChangeTrackingIdentifiers)
          $usable=@($ri | Where-Object {-not [string]::IsNullOrWhiteSpace([string]$_)})
          Write-Host "REFERENCE_ID=$($ref.InstanceID)"
          Write-Host "REFERENCE_TYPE=$($ref.ReferencePointType) CONSISTENCY=$($ref.ConsistencyLevel) VD=$($vd.Count) RCT=$($ri.Count)"
          if([int]$ref.ReferencePointType -ne 2){throw 'Reference is not RCT type 2'}
          if([bool]$ref.HasAssociatedData){throw 'RCT reference unexpectedly has associated data'}
          if($vd.Count -ne 2 -or $ri.Count -ne 2 -or $usable.Count -ne 2){throw 'RCT reference does not cover both disks'}
          Write-Host 'DIGEST_MIGRATION_REFERENCE_GATE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-digest-migrate.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Atomically migrate only legacy target digest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          operation="manoj-hv-ls-migration-source-test-20260924"
          sudo ruby -rdigest -ryaml -rjson -rfileutils -rtime -e '
            op=ARGV[0]
            cfg=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=(cfg["work_dir"]||cfg[:work_dir]||"/var/tmp").to_s
            safe=op.gsub(/[^A-Za-z0-9_.-]/,"_")
            suffix=Digest::SHA256.hexdigest(op)[0,16]
            dir=File.expand_path(File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}"))
            root=File.expand_path(File.join(work,"oneswap-hyperv-hot"))
            abort("state path escaped root") unless dir.start_with?(root+File::SEPARATOR)
            path=File.join(dir,"state.json")
            abort("durable state missing") unless File.file?(path)
            s=JSON.parse(File.read(path))
            puts "STATE_PATH=#{path}"
            puts "STATE_PHASE=#{s["phase"]}"
            puts "STATE_OLD_DIGEST=#{s["target_digest"]}"
            puts "STATE_TEMPLATE_ID=#{s["template_id"]}"
            puts "STATE_IMAGE_IMPORTS=#{Array(s["image_imports"]).length}"
            abort("source id mismatch") unless s["source_vm_id"].to_s.downcase=="52baa8a1-675f-4225-8f37-66a60933b30c"
            abort("state is not CUTOVER_STARTED") unless s["phase"]=="CUTOVER_STARTED"
            abort("source_off_at already recorded") if s["source_off_at"]
            abort("delta already recorded") if s["delta_applied_at"]
            abort("template already allocated") if s["template_id"]
            abort("image imports already recorded") unless Array(s["image_imports"]).empty?
            disks=Array(s["disks"])
            abort("prepared disk count mismatch") unless disks.length==2
            disks.each_with_index do |d,i|
              p=d["prepared_raw_path"].to_s
              abort("prepared disk #{i} missing") unless File.file?(p)
              abort("prepared disk #{i} size mismatch") unless File.size(p)==Integer(d["virtual_size"])
              abort("prepared disk #{i} RCT id missing") if d["rct_id"].to_s.strip.empty?
            end
            canon=lambda do |v|
              case v
              when Hash
                "{" + v.keys.map(&:to_s).sort.map{|k| JSON.generate(k)+":"+canon.call(v[k]||v[k.to_sym])}.join(",") + "}"
              when Array
                "["+v.map{|x| canon.call(x)}.join(",")+"]"
              else
                JSON.generate(v)
              end
            end
            legacy={
              "datastore"=>"1","network"=>"0","cluster"=>nil,"host"=>nil,"sys_ds"=>nil,"ds_cluster"=>nil,
              "cpu"=>0.5,"vcpu"=>2,"memory_mb"=>2560,
              "uefi"=>nil,"uefi_secure"=>"/usr/share/OVMF/OVMF_CODE_4M.secboot.fd"
            }
            current=legacy.merge("qemu_ga_linux"=>true,"qemu_ga_win"=>"")
            legacy_digest=Digest::SHA256.hexdigest(canon.call(legacy))
            current_digest=Digest::SHA256.hexdigest(canon.call(current))
            puts "LEGACY_DIGEST=#{legacy_digest}"
            puts "CURRENT_DIGEST=#{current_digest}"
            abort("stored digest does not match exact legacy schema") unless s["target_digest"]==legacy_digest
            backup=path+".before-target-digest-schema-v2"
            FileUtils.cp(path,backup) unless File.exist?(backup)
            s["legacy_target_digest"]=s["target_digest"]
            s["target_digest"]=current_digest
            s["target_digest_schema"]=2
            s["target_digest_migrated_at"]=Time.now.utc.iso8601
            tmp=path+".tmp.#{$$}"
            File.open(tmp,"w",0600){|f| f.write(JSON.pretty_generate(s)); f.write("\n"); f.flush; f.fsync}
            File.rename(tmp,path)
            File.chmod(0600,path)
            verify=JSON.parse(File.read(path))
            abort("digest migration verification failed") unless verify["target_digest"]==current_digest && verify["phase"]=="CUTOVER_STARTED"
            puts "TARGET_DIGEST_STATE_MIGRATION=PASS"
          ' "$operation"
          '@
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'Target digest state migration failed'}

      - name: Re-prove source remains Off
        shell: powershell
        run: |
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          Write-Host "FINAL_SOURCE_STATE=$($vm.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$n"
          if($vm.State -ne 'Off'){throw 'Digest migration changed source state'}
          if($n -ne 0){throw 'Unexpected source checkpoint'}
          Write-Host 'TARGET_DIGEST_MIGRATION_SOURCE_INVARIANT=PASS'
