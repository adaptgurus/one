name: Manoj HyperV Exact Legacy Digest Reproducer

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-hyperv-exact-legacy-digest.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-exact-legacy-digest
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Bind Manoj and require post-shutdown reconciliation state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($vm.State -ne 'Off'){throw "Legacy digest reproduction requires source Off; state=$($vm.State)"}
          if(@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count -ne 0){throw 'Unexpected source checkpoint'}
          Write-Host 'LEGACY_DIGEST_SOURCE_GATE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-legacy-digest.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage exact PREPARED-time helper sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $head='a81aac6a8912f2d6d144b9ab981dba04ee4626a5'
          foreach($name in @('hyperv_helper.rb','hyperv_hot_helper.rb')){
            $local=Join-Path $env:RUNNER_TEMP ("legacy-" + $name)
            $url="https://raw.githubusercontent.com/adaptgurus/one-swap/$head/$name"
            & curl.exe -L --fail --silent --show-error --connect-timeout 8 --max-time 45 -o $local $url
            if($LASTEXITCODE -ne 0){throw "download failed for $name"}
            $key=($name -replace '[^A-Za-z0-9]','_').ToUpper()
            ("LEGACY_"+$key+"_PATH="+$local) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Write-Host "LEGACY_CODE_HEAD=$head"

      - name: Copy exact old helpers to appliance temp directory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $common=@('-o','LogLevel=ERROR','-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$known",'-o','ConnectTimeout=8','-i',$env:ONESWAP_TEMP_KEY)
          & ssh.exe @common "ci@10.250.10.32" "rm -rf /tmp/ls-legacy-digest && mkdir -m 700 /tmp/ls-legacy-digest"
          if($LASTEXITCODE -ne 0){throw 'legacy temp dir creation failed'}
          & scp.exe @common $env:LEGACY_HYPERV_HELPER_RB_PATH "ci@10.250.10.32:/tmp/ls-legacy-digest/hyperv_helper.rb"
          if($LASTEXITCODE -ne 0){throw 'copy hyperv_helper failed'}
          & scp.exe @common $env:LEGACY_HYPERV_HOT_HELPER_RB_PATH "ci@10.250.10.32:/tmp/ls-legacy-digest/hyperv_hot_helper.rb"
          if($LASTEXITCODE -ne 0){throw 'copy hyperv_hot_helper failed'}

      - name: Reproduce exact old target digest without migration actions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          cat >/tmp/ls-legacy-digest/reproduce.rb <<'RUBY'
          require 'yaml'
          require 'json'
          $LOAD_PATH << '/usr/lib/one/ruby'
          $LOAD_PATH << '/usr/lib/one/ruby/cli'
          require 'opennebula'
          require '/tmp/ls-legacy-digest/hyperv_helper.rb'
          require '/tmp/ls-legacy-digest/hyperv_hot_helper.rb'

          loaded=YAML.load_file('/etc/layersentry/oneswap/manoj-qual.yaml') || {}
          normalized={}
          loaded.each{|k,v| normalized[k.to_s.sub(/^:/,'').to_sym]=v}
          cli={
            config_file:'/etc/layersentry/oneswap/manoj-qual.yaml',
            hot:true, commit:true,
            operation_id:'manoj-hv-ls-migration-source-test-20260924',
            hyperv_connection:'manoj-qual',
            guest_os:'linux',
            expected_guest_macs:'00:15:5d:00:1c:07',
            uefi_sec_path:'/usr/share/OVMF/OVMF_CODE_4M.secboot.fd',
            qemu_ga_linux:true,
            cpu:0.5,
            vcpu:2,
            memory_mb:2560,
            datastore:'1',
            network:'0'
          }
          options=normalized.merge(cli)
          options[:http_port] ||= 29869
          helper=Object.new
          coord=OneSwapHyperV::HotCoordinator.new(helper,options.merge(name:'ls-migration-source-test',format:'raw'))
          digest=coord.send(:target_digest)
          puts "EXACT_LEGACY_DIGEST=#{digest}"
          %i[datastore network one_cluster one_host one_datastore one_datastore_cluster cpu vcpu memory_mb uefi_path uefi_sec_path].each do |k|
            v=options[k]
            puts "EXACT_OPTION key=#{k} class=#{v.class} value=#{v.inspect}"
          end
          state_dir=OneSwapHyperV::HotUtil.state_dir(options,'manoj-hv-ls-migration-source-test-20260924')
          state=JSON.parse(File.read(File.join(state_dir,'state.json')))
          puts "STORED_TARGET_DIGEST=#{state['target_digest']}"
          abort('exact old helper digest does not match stored durable digest') unless digest==state['target_digest']
          puts 'EXACT_LEGACY_DIGEST_REPRODUCTION=PASS'
          RUBY
          timeout --signal=TERM --kill-after=5s 60s ruby /tmp/ls-legacy-digest/reproduce.rb
          rm -rf /tmp/ls-legacy-digest
          '@
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'Exact legacy digest reproduction failed'}

      - name: Re-prove source remains Off
        if: always()
        shell: powershell
        run: |
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          Write-Host "FINAL_SOURCE_STATE=$($vm.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$n"
          if($vm.State -ne 'Off'){throw 'Digest reproduction changed source state'}
          if($n -ne 0){throw 'Unexpected source checkpoint'}
          Write-Host 'LEGACY_DIGEST_SOURCE_INVARIANT=PASS'
