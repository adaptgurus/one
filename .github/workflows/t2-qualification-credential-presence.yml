name: T2 Qualification Credential Presence

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-qualification-credential-presence.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Check latest qualification secret files without reading values
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $root='C:\actions-runner\_work\_temp\qual-root-4c4ac81-35718201591-1.password'
          $support='C:\actions-runner\_work\_temp\qual-support-4c4ac81-35718201591-1.password'
          Write-Host "ROOT_FILE_PRESENT=$(Test-Path $root)"
          Write-Host "SUPPORT_FILE_PRESENT=$(Test-Path $support)"
          if(Test-Path $root){$i=Get-Item $root;Write-Host "ROOT_FILE_BYTES=$($i.Length)"}
          if(Test-Path $support){$i=Get-Item $support;Write-Host "SUPPORT_FILE_BYTES=$($i.Length)"}