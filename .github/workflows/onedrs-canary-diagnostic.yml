name: OneDRS Canary Migration Diagnostic

on:
  push:
    branches:
      - qual/onedrs-dc1-dc4-20261006
    paths:
      - ".github/workflows/onedrs-canary-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bind dc1
        id: bind
        shell: bash
        run: |
          if [ "$RUNNER_NAME" = dc1 ] && [ "$(hostname)" = dc1 ]; then
            echo "dc1=true" >> "$GITHUB_OUTPUT"
          else
            echo "dc1=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Diagnose canary 20 placement
        if: steps.bind.outputs.dc1 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ONE_AUTH=/var/lib/one/.one/one_auth
          echo "== VM20 =="
          onevm show 20
          echo "== VM20 XML relevant =="
          onevm show 20 -x | grep -E '<(ID|STATE|LCM_STATE|RESCHED|SCHED_MESSAGE|SCHED_REQUIREMENTS|AUTOMATIC_REQUIREMENTS|HID|SEQ|DS_ID|ONEDRS_BLOCKED)>'
          echo "== hosts =="
          onehost list
          echo "== datastores =="
          onedatastore list
          echo "== recent scheduler messages =="
          grep -Ei '(^|[^0-9])20([^0-9]|$)|one_drs|placement|resched|cannot allocate|not enough|resilience admission' /var/log/one/oned.log | tail -250 || true
          grep -Ei '20|one_drs|placement|resched|cannot allocate|not enough|resilience admission' /var/log/one/sched.log 2>/dev/null | tail -250 || true
          if onevm show 20 | grep -q 'RESCHED.*: Yes'; then
            onevm unresched 20
            echo "CANARY20_RESCHED_CLEANUP=PASS"
          fi
