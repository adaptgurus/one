name: OneDRS Resilience V2 Verification

on:
  pull_request:
    paths:
      - "src/schedm/SchedulerManagerDriver.cc"
      - "src/schedm_mad/remotes/one_drs/**"
      - ".github/workflows/onedrs-resilience-v2.yml"

permissions:
  contents: read

jobs:
  resilience-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact OneDRS Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            PyYAML "pulp==3.3.2" "xsdata==26.2" "typing-extensions==4.15.0"
      - name: Syntax check
        run: |
          python -m py_compile \
            src/schedm_mad/remotes/one_drs/lib/resilience.py \
            src/schedm_mad/remotes/one_drs/lib/mapper/model.py \
            src/schedm_mad/remotes/one_drs/lib/mapper/ilp_optimizer.py \
            src/schedm_mad/remotes/one_drs/lib/optimizer_parser.py \
            src/schedm_mad/remotes/one_drs/tests/test_resilience.py \
            src/schedm_mad/remotes/one_drs/tests/test_vm_groups.py
      - name: Resilience and VM Group tests
        run: |
          python -m unittest -v \
            src/schedm_mad/remotes/one_drs/tests/test_resilience.py \
            src/schedm_mad/remotes/one_drs/tests/test_vm_groups.py
