name: Seven Node SSH Bootstrap

on:
  push:
    branches:
      - lab/seven-node-foundation-20260926
    paths:
      - '.github/workflows/seven-node-ssh-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - name: Bind target runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME COMPUTERNAME=$env:COMPUTERNAME SLOT=${{ matrix.slot }}"
          if($env:RUNNER_NAME -ine 'WIN-GK6MO7T7OPC' -or $env:COMPUTERNAME -ine 'WIN-GK6MO7T7OPC'){
            Write-Host 'NON_TARGET_RUNNER_HOLD'
            Start-Sleep -Seconds 120
            "LS_TARGET_RUNNER=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          "LS_TARGET_RUNNER=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Establish deployment key trust
        if: env.LS_TARGET_RUNNER == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $wrap=Join-Path $dir 'wrap-rsa.xml'
          if(-not (Test-Path $wrap)){ throw 'Target-runner wrapping key missing' }
          $rsa=New-Object System.Security.Cryptography.RSACryptoServiceProvider 3072
          $rsa.FromXmlString((Get-Content $wrap -Raw))
          $cipher=''
          $password=[Text.Encoding]::UTF8.GetString($rsa.Decrypt([Convert]::FromBase64String($cipher),$true))
          if([string]::IsNullOrWhiteSpace($password)){ throw 'Bootstrap credential decrypt failed' }
          $env:LS_ROOT_PASSWORD=$password

          $askpass=Join-Path $env:RUNNER_TEMP 'layersentry-askpass.exe'
          $src=@'
          using System;
          public class AskPass {
              public static void Main() {
                  Console.Write(Environment.GetEnvironmentVariable("LS_ROOT_PASSWORD"));
              }
          }
          '@
          Add-Type -TypeDefinition $src -Language CSharp -OutputAssembly $askpass -OutputType ConsoleApplication
          $env:SSH_ASKPASS=$askpass
          $env:SSH_ASKPASS_REQUIRE='force'
          $env:DISPLAY='LayerSentry'

          $key=Join-Path $dir 'deploy_ed25519'
          if(-not (Test-Path $key)){
            & ssh-keygen.exe --% -q -t ed25519 -N "" -f C:\ProgramData\LayerSentryLab\seven-node-bootstrap\deploy_ed25519
            if($LASTEXITCODE -ne 0){ throw 'ssh-keygen failed' }
          }
          & icacls.exe $key /inheritance:r | Out-Null
          & icacls.exe $key /grant:r 'Administrators:(F)' 'SYSTEM:(F)' | Out-Null
          $pub=(Get-Content "$key.pub" -Raw).Trim()
          $known=Join-Path $dir 'known_hosts'
          New-Item -ItemType File -Force -Path $known | Out-Null

          $hosts=@('172.17.60.30','172.17.60.31','172.17.60.32','172.17.60.33','172.17.60.34','172.17.60.35','172.17.60.36')
          $ok=@()
          foreach($ip in $hosts){
            Write-Host "::group::bootstrap $ip"
            $remote=@"
          set -euo pipefail
          if ! id -u layersentry-deploy >/dev/null 2>&1; then useradd -m -s /bin/bash layersentry-deploy; fi
          install -d -m 700 -o layersentry-deploy -g layersentry-deploy /home/layersentry-deploy/.ssh
          cat > /home/layersentry-deploy/.ssh/authorized_keys <<'LSKEY'
          $pub
          LSKEY
          chown layersentry-deploy:layersentry-deploy /home/layersentry-deploy/.ssh/authorized_keys
          chmod 600 /home/layersentry-deploy/.ssh/authorized_keys
          printf '%s\n' 'layersentry-deploy ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-layersentry-deploy
          chmod 440 /etc/sudoers.d/90-layersentry-deploy
          visudo -cf /etc/sudoers.d/90-layersentry-deploy
          echo LAYERSENTRY_DEPLOY_BOOTSTRAP=PASS
          "@
            $remote | & ssh.exe -T -o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$known" "root@$ip" "bash -s"
            $rc=$LASTEXITCODE
            if($rc -ne 0){ throw "Password bootstrap failed for $ip rc=$rc" }
            $verify=& ssh.exe -T -i $key -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" "layersentry-deploy@$ip" "sudo -n true && printf 'KEY_SUDO=PASS HOST=' && hostname" 2>&1
            if($LASTEXITCODE -ne 0){ throw "Key verification failed for $ip" }
            Write-Host ($verify | Out-String)
            $ok += $ip
            Write-Host "::endgroup::"
          }
          if($ok.Count -ne 7){ throw "Bootstrap coverage incomplete: $($ok.Count)/7" }
          Remove-Item Env:LS_ROOT_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item $askpass -Force -ErrorAction SilentlyContinue
          Remove-Item $wrap -Force -ErrorAction Stop
          Write-Host 'SEVEN_NODE_KEY_BOOTSTRAP=PASS'
          Write-Host 'PLAINTEXT_CREDENTIAL_PERSISTED=false'

      - name: Read-only host and NFS baseline
        if: env.LS_TARGET_RUNNER == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $key=Join-Path $dir 'deploy_ed25519'
          $known=Join-Path $dir 'known_hosts'
          $hosts=[ordered]@{
            layersentry1='172.17.60.30'
            layersentry2='172.17.60.31'
            layersentry3='172.17.60.32'
            layersentry4='172.17.60.33'
            layersentry5='172.17.60.34'
            layersentry6='172.17.60.35'
            layersentryol7='172.17.60.36'
          }
          foreach($e in $hosts.GetEnumerator()){
            Write-Host "::group::$($e.Key) $($e.Value)"
            $cmd="set -o pipefail; printf 'HOST='; hostname; printf 'OS='; . /etc/os-release; printf '%s %s\n' \"\$NAME\" \"\$VERSION_ID\"; printf 'KERNEL='; uname -r; printf 'CPU='; nproc; printf 'MEM_KB='; awk '/MemTotal/ {print \$2}' /proc/meminfo; printf 'VIRT='; systemd-detect-virt 2>/dev/null || true; printf 'SELINUX='; getenforce 2>/dev/null || true; echo '---IP---'; ip -br addr; echo '---ROUTE---'; ip route; echo '---BLOCK---'; lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS; echo '---DF---'; df -hT; echo '---KVM---'; test -e /dev/kvm && ls -l /dev/kvm || true"
            & ssh.exe -T -i $key -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" "layersentry-deploy@$($e.Value)" $cmd
            if($LASTEXITCODE -ne 0){ throw "Baseline failed for $($e.Key)" }
            Write-Host "::endgroup::"
          }
          Write-Host '--- NFS DISCOVERY FROM LAYERSENTRY1 ---'
          $nfsCmd="set -e; if command -v showmount >/dev/null 2>&1; then showmount -e 172.17.60.210; else echo SHOWMOUNT_UNAVAILABLE; fi; if command -v rpcinfo >/dev/null 2>&1; then rpcinfo -p 172.17.60.210 | head -40; else echo RPCINFO_UNAVAILABLE; fi"
          & ssh.exe -T -i $key -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" "layersentry-deploy@172.17.60.30" $nfsCmd
          if($LASTEXITCODE -ne 0){ throw 'NFS discovery command failed' }
