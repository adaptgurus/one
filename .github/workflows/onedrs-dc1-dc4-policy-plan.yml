name: OneDRS dc4 Policy and Plan Qualification

on:
  push:
    branches:
      - qual/onedrs-dc1-dc4-20261006

permissions:
  contents: read

concurrency:
  group: onedrs-dc4-policy-plan
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact dc1 runner and installed build
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "dc1"
          test "$(hostname)" = "dc1"
          export ONE_AUTH=/var/lib/one/.one/one_auth
          for h in dc1 dc2 dc3; do
            echo "=== $h ==="
            if [ "$h" = dc1 ]; then
              rpm -q opennebula
              grep -n 'ARGUMENTS.*one_drs' /etc/one/oned.conf
            else
              ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@$h "rpm -q opennebula; grep -n 'ARGUMENTS.*one_drs' /etc/one/oned.conf"
            fi
          done
          test "$(rpm -q opennebula)" = "opennebula-7.4.1-3.ls.onedrs.42021b2.el9.x86_64"
          grep -q -- '-p one_drs -o one_drs' /etc/one/oned.conf
          onezone show 0

      - name: Apply and semantically verify production OneDRS policy
        shell: bash
        run: |
          set -euo pipefail
          export ONE_AUTH=/var/lib/one/.one/one_auth
          mkdir -p /var/backups/layersentry-onedrs-pre-42021b2
          onecluster show 0 -x > /var/backups/layersentry-onedrs-pre-42021b2/cluster.pre-policy.xml

          printf '%s\n' 'LAYERSENTRY_DRS_READY="NO"' 'LAYERSENTRY_FAILURE_DOMAIN="dc-control-protected"' >/var/tmp/h0.onedrs
          printf '%s\n' 'LAYERSENTRY_DRS_READY="YES"' 'LAYERSENTRY_FAILURE_DOMAIN="dc-rack-a"' >/var/tmp/h1.onedrs
          printf '%s\n' 'LAYERSENTRY_DRS_READY="YES"' 'LAYERSENTRY_FAILURE_DOMAIN="dc-rack-b"' >/var/tmp/h2.onedrs
          printf '%s\n' 'LAYERSENTRY_DRS_READY="YES"' 'LAYERSENTRY_FAILURE_DOMAIN="dc-rack-c"' >/var/tmp/h3.onedrs
          for id in 0 1 2 3; do onehost update "$id" "/var/tmp/h$id.onedrs" --append; done

          if onevm show 5 2>/dev/null | grep -q 'STATE.*: PENDING'; then
            onevm hold 5
          fi

          cat >/var/tmp/cluster-onedrs-production.tmpl <<'EOF'
          RESERVED_CPU=""
          RESERVED_MEM=""
          ONE_DRS=[
            AUTOMATION="manual",
            POLICY="balance",
            PREDICTIVE="0",
            MIGRATION_THRESHOLD="1",
            HOST_MIGRATION_THRESHOLD="1",
            DS_MIGRATION_THRESHOLD="0",
            CPU_USAGE_WEIGHT="0",
            CPU_WEIGHT="0.5",
            MEMORY_WEIGHT="0.5",
            MIGRATION_COOLDOWN_SECONDS="600",
            ENABLED="YES",
            HOST_FAILURE_TOLERANCE="1",
            FAILURE_DOMAIN_TOLERANCE="1",
            CPU_RESERVE_PERCENT="10",
            MEMORY_RESERVE_PERCENT="10",
            MIN_HEALTHY_HOSTS="3",
            FAILURE_DOMAIN_SPREAD="YES",
            REQUIRE_FAILURE_DOMAIN_LABELS="YES",
            COMBINED_FAILURE_MODES="NO",
            MAX_GROUP_MIGRATIONS="1",
            MAX_FAILURE_SCENARIOS="1024"
          ]
          EOF
          onecluster update 0 /var/tmp/cluster-onedrs-production.tmpl
          onecluster show 0 -x > /var/tmp/cluster.after.xml

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("/var/tmp/cluster.after.xml").getroot()
          vectors=root.findall("./TEMPLATE/ONE_DRS")
          if len(vectors) != 1:
              raise SystemExit(f"expected exactly one ONE_DRS vector, got {len(vectors)}")
          actual={c.tag:(c.text or "").strip() for c in vectors[0]}
          expected={
              "AUTOMATION":"manual","POLICY":"balance","PREDICTIVE":"0",
              "MIGRATION_THRESHOLD":"1","HOST_MIGRATION_THRESHOLD":"1","DS_MIGRATION_THRESHOLD":"0",
              "CPU_USAGE_WEIGHT":"0","CPU_WEIGHT":"0.5","MEMORY_WEIGHT":"0.5",
              "MIGRATION_COOLDOWN_SECONDS":"600","ENABLED":"yes",
              "HOST_FAILURE_TOLERANCE":"1","FAILURE_DOMAIN_TOLERANCE":"1",
              "CPU_RESERVE_PERCENT":"10","MEMORY_RESERVE_PERCENT":"10",
              "MIN_HEALTHY_HOSTS":"3","FAILURE_DOMAIN_SPREAD":"yes",
              "REQUIRE_FAILURE_DOMAIN_LABELS":"yes","COMBINED_FAILURE_MODES":"no",
              "MAX_GROUP_MIGRATIONS":"1","MAX_FAILURE_SCENARIOS":"1024",
          }
          for k,v in expected.items():
              got=actual.get(k)
              if got is None or got.lower()!=v.lower():
                  raise SystemExit(f"{k}: got {got!r}, expected {v!r}")
          print("semantic ONE_DRS readback PASS")
          PY

          python3 - <<'PY'
          import subprocess,re
          expected={
            0:("NO","dc-control-protected"),
            1:("YES","dc-rack-a"),
            2:("YES","dc-rack-b"),
            3:("YES","dc-rack-c"),
          }
          for hid,(ready,domain) in expected.items():
              s=subprocess.check_output(["onehost","show",str(hid)],text=True)
              mr=re.search(r'LAYERSENTRY_DRS_READY="([^"]+)"',s)
              md=re.search(r'LAYERSENTRY_FAILURE_DOMAIN="([^"]+)"',s)
              if not mr or mr.group(1).upper()!=ready or not md or md.group(1)!=domain:
                  raise SystemExit(f"host {hid} metadata mismatch")
          print("host DRS metadata PASS")
          PY

          cat >/var/tmp/duplicate-onedrs.tmpl <<'EOF'
          ONE_DRS=[ POLICY="balance" ]
          EOF
          if onecluster update 0 /var/tmp/duplicate-onedrs.tmpl --append >/var/tmp/duplicate.out 2>&1; then
            echo "duplicate ONE_DRS unexpectedly accepted" >&2
            onecluster update 0 /var/tmp/cluster-onedrs-production.tmpl
            exit 1
          fi
          cat /var/tmp/duplicate.out
          grep -q 'exactly one ONE_DRS vector' /var/tmp/duplicate.out
          onecluster show 0 -x >/var/tmp/cluster.post-negative.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse("/var/tmp/cluster.post-negative.xml").getroot()
          v=r.findall("./TEMPLATE/ONE_DRS")
          if len(v)!=1: raise SystemExit("negative update changed ONE_DRS cardinality")
          d={c.tag:(c.text or "").strip().lower() for c in v[0]}
          if d.get("enabled")!="yes": raise SystemExit("negative update changed enabled state")
          print("duplicate-vector fail-closed PASS")
          PY
          echo "POLICY_ATOMIC_READBACK=PASS"

      - name: Protect production workloads and generate OneDRS plan
        shell: bash
        run: |
          set -euo pipefail
          export ONE_AUTH=/var/lib/one/.one/one_auth
          for id in 0 1 5 6 7 8 9 10 11; do
            onevm show "$id" >/dev/null 2>&1 || continue
            printf '%s\n' 'ONEDRS_BLOCKED="YES"' 'LAYERSENTRY_ONEDRS_BLOCK_REASON="PRODUCTION_QUALIFICATION_GUARD"' >/var/tmp/vm-onedrs-block.tmpl
            onevm update "$id" /var/tmp/vm-onedrs-block.tmpl --append
          done
          for id in 19 20 21 22 23; do
            onevm show "$id" >/dev/null 2>&1 || continue
            echo 'ONEDRS_BLOCKED="NO"' >/var/tmp/vm-onedrs-allow.tmpl
            onevm update "$id" /var/tmp/vm-onedrs-allow.tmpl --append
          done

          onecluster plandelete 0 >/dev/null 2>&1 || true
          onecluster optimize 0
          sleep 5
          onecluster show 0 -x > /var/tmp/onedrs-plan-42021.xml
          sed -n '/<PLAN>/,/<\/PLAN>/p' /var/tmp/onedrs-plan-42021.xml

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("/var/tmp/onedrs-plan-42021.xml").getroot()
          plan=root.find("./PLAN")
          actions=[] if plan is None else plan.findall("./ACTION")
          allowed={19,20,21,22,23}
          parsed=[]
          for a in actions:
              vm=int(a.findtext("VM_ID"))
              host=int(a.findtext("HOST_ID"))
              op=(a.findtext("OPERATION") or "").strip().lower()
              if vm not in allowed:
                  raise SystemExit(f"unsafe plan references non-canary VM {vm}")
              if host not in {1,2,3}:
                  raise SystemExit(f"unsafe plan targets protected/unknown host {host}")
              if op not in {"migrate","deploy"}:
                  raise SystemExit(f"unexpected plan operation {op!r}")
              parsed.append((vm,host,op,int(a.findtext("DS_ID") or -1)))
          print("safe_actions",parsed)
          print("action_count",len(parsed))
          PY
          echo "PLAN_SAFE=PASS"

      - name: Capture policy-plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: onedrs-policy-plan-${{ github.run_id }}
          path: |
            /var/tmp/cluster.after.xml
            /var/tmp/cluster.post-negative.xml
            /var/tmp/duplicate.out
            /var/tmp/onedrs-plan-42021.xml
          if-no-files-found: error
          retention-days: 90
