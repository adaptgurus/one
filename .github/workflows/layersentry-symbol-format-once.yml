name: LayerSentry symbol format once

on:
  push:
    branches:
      - feat/self-service-v5-ui-20260911
    paths:
      - '.github/workflows/layersentry-symbol-format-once.yml'

permissions:
  contents: write

jobs:
  format-symbol:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/self-service-v5-ui-20260911
          persist-credentials: true
      - name: Apply exact Prettier line break
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/fireedge/src/client/apps/sunstone/components/LayerSentry/symbol.js')
          text = path.read_text()
          old = "export const symbolPath = '"
          new = "export const symbolPath =\n  '"
          if old not in text:
              raise SystemExit('Expected symbol assignment was not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit formatter correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fireedge/src/client/apps/sunstone/components/LayerSentry/symbol.js
          git diff --cached --check
          git commit -m 'style(fireedge): finish LayerSentry symbol formatting'
          git push origin HEAD:feat/self-service-v5-ui-20260911
