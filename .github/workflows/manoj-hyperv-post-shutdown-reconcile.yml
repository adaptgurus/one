name: Manoj HyperV Post-Shutdown Reconcile
# rerun-current-20260925

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-hyperv-post-shutdown-reconcile.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-post-shutdown-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Bind exact Manoj and require source Off
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          Write-Host "SOURCE_STATE=$($vm.State)"
          Write-Host "SOURCE_CHECKPOINTS=$n"
          if($vm.State -ne 'Off'){throw "Reconcile requires source Off; state=$($vm.State)"}
          if($n -ne 0){throw 'Unexpected user-visible checkpoint'}
          $refs=@(Get-WmiObject -Namespace root/virtualization/v2 -Class Msvm_VirtualSystemReferencePoint -Filter "VirtualSystemIdentifier='$($vm.VMId.Guid)'" -ErrorAction Stop)
          Write-Host "REFERENCE_COUNT=$($refs.Count)"
          foreach($ref in $refs){
            $vd=@($ref.VirtualDiskIdentifiers); $ri=@($ref.ResilientChangeTrackingIdentifiers)
            Write-Host "REFERENCE id=$($ref.InstanceID) type=$($ref.ReferencePointType) consistency=$($ref.ConsistencyLevel) associated=$($ref.HasAssociatedData) vd=$($vd.Count) rct=$($ri.Count)"
          }
          Write-Host 'SOURCE_OFF_RECONCILE_GATE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-post-shutdown-reconcile.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect durable OneSwap state and digest schemas
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          operation="manoj-hv-ls-migration-source-test-20260924"
          ruby -rdigest -ryaml -rjson -e '
            op=ARGV[0]
            cfg=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=(cfg["work_dir"]||cfg[:work_dir]||"/var/tmp").to_s
            safe=op.gsub(/[^A-Za-z0-9_.-]/,"_")
            suffix=Digest::SHA256.hexdigest(op)[0,16]
            dir=File.expand_path(File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}"))
            state=File.join(dir,"state.json")
            abort("state missing: #{state}") unless File.file?(state)
            s=JSON.parse(File.read(state))
            puts "STATE_PATH=#{state}"
            puts "STATE_PHASE=#{s["phase"]}"
            puts "STATE_TARGET_DIGEST=#{s["target_digest"]}"
            puts "STATE_METADATA_DIGEST=#{s["metadata_digest"]}"
            puts "STATE_REFERENCE=#{s["reference_point_id"]}"
            puts "STATE_TEMPLATE_ID=#{s["template_id"]}"
            puts "STATE_CUTOVER_STARTED_AT=#{s["cutover_started_at"]}"
            puts "STATE_SOURCE_OFF_AT=#{s["source_off_at"]}"
            puts "STATE_DELTA_APPLIED_AT=#{s["delta_applied_at"]}"
            puts "STATE_IMPORTED_AT=#{s["imported_at"]}"
            puts "STATE_IMAGE_IMPORTS=#{Array(s["image_imports"]).length}"
            Array(s["disks"]).each_with_index do |d,i|
              p=d["prepared_raw_path"].to_s
              puts "STATE_DISK_#{i}_PATH=#{p}"
              puts "STATE_DISK_#{i}_EXISTS=#{File.file?(p)}"
              puts "STATE_DISK_#{i}_SIZE=#{File.file?(p) ? File.size(p) : -1}"
              puts "STATE_DISK_#{i}_EXPECTED=#{d["virtual_size"]}"
              puts "STATE_DISK_#{i}_RCT=#{d["rct_id"]}"
            end
            canon=lambda do |v|
              case v
              when Hash
                "{" + v.keys.map(&:to_s).sort.map{|k| JSON.generate(k)+":"+canon.call(v[k]||v[k.to_sym])}.join(",") + "}"
              when Array
                "["+v.map{|x| canon.call(x)}.join(",")+"]"
              else
                JSON.generate(v)
              end
            end
            legacy={
              "datastore"=>"1","network"=>"0","cluster"=>nil,"host"=>nil,"sys_ds"=>nil,"ds_cluster"=>nil,
              "cpu"=>0.5,"vcpu"=>2,"memory_mb"=>2560,
              "uefi"=>nil,"uefi_secure"=>"/usr/share/OVMF/OVMF_CODE_4M.secboot.fd"
            }
            current=legacy.merge("qemu_ga_linux"=>true,"qemu_ga_win"=>"")
            puts "LEGACY_DIGEST="+Digest::SHA256.hexdigest(canon.call(legacy))
            puts "CURRENT_DIGEST="+Digest::SHA256.hexdigest(canon.call(current))
          ' "$operation"
          echo "RUNTIME_HASHES:"
          sha256sum /usr/bin/oneswap-hyperv /usr/lib/one/ruby/cli/one_helper/hyperv_helper.rb /usr/lib/one/ruby/cli/one_helper/hyperv_hot_helper.rb
          echo 'POST_SHUTDOWN_STATE_INSPECT=PASS'
          '@
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'Durable state inspection failed'}

      - name: Inspect timed-out final-delta workspaces read-only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\\LayerSentryLab\\qualification\\oneswap-seed\\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          state=$(find /var/lib/layersentry-oneswap/reflink-work/oneswap-hyperv-hot -maxdepth 2 -type f -name state.json -path '*manoj-hv-ls-migration-source-test-20260924*' -print)
          [ "$(printf '%s\n' "$state" | sed '/^$/d' | wc -l)" -eq 1 ]
          python3 - "$state" <<'PY'
          import json,os,sys
          p=sys.argv[1]; s=json.load(open(p)); root=os.path.dirname(p)
          print("REMOTE_EXPORT_DIR="+str(s.get("remote_export_dir") or ""))
          print("APPLIANCE_STATE_DIR="+root)
          d=os.path.join(root,"deltas")
          print("APPLIANCE_DELTA_DIR="+d)
          if os.path.isdir(d):
              for name in sorted(os.listdir(d)):
                  q=os.path.join(d,name)
                  if os.path.isfile(q):
                      st=os.stat(q)
                      print(f"APPLIANCE_DELTA_FILE name={name} bytes={st.st_size} mtime_ns={st.st_mtime_ns}")
          else:
              print("APPLIANCE_DELTA_DIR_PRESENT=false")
          PY
          '@
          $script=[regex]::Replace($script,'\r','')
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          $out=& ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'OneSwap timeout-workspace inspection failed'}
          $out | ForEach-Object {Write-Host $_}
          $line=@($out | Where-Object {$_ -like 'REMOTE_EXPORT_DIR=*'} | Select-Object -Last 1)
          if(-not $line){throw 'remote export directory missing from durable state'}
          $remote=$line.Substring('REMOTE_EXPORT_DIR='.Length).Trim()
          if([string]::IsNullOrWhiteSpace($remote)){throw 'remote export directory is empty'}
          $remoteNorm=($remote -replace '\\\\{2,}','\\')
          $expected='C:\\LayerSentryMigration\\layersentry-hot-manoj-hv-ls-migration-source-test-20260924'
          if($remoteNorm -ne $expected){throw "Refusing unexpected remote export path: $remote"}
          Write-Host "HYPERV_REMOTE_EXPORT_DIR=$remoteNorm"
          if(-not (Test-Path -LiteralPath $remoteNorm)){throw "Hyper-V remote export directory missing: $remoteNorm"}
          $files=@(Get-ChildItem -LiteralPath $remoteNorm -Recurse -File -ErrorAction Stop | Sort-Object FullName)
          Write-Host "HYPERV_REMOTE_FILE_COUNT=$($files.Count)"
          foreach($item in $files){
            Write-Host ("HYPERV_REMOTE_FILE path={0} bytes={1} modified={2}" -f $item.FullName,$item.Length,$item.LastWriteTimeUtc.ToString('o'))
          }
          $deltas=@($files | Where-Object {$_.Name -like 'delta-*.lshv'})
          Write-Host "HYPERV_REMOTE_DELTA_COUNT=$($deltas.Count)"
          Write-Host "HYPERV_REMOTE_DELTA_BYTES=$(($deltas | Measure-Object -Property Length -Sum).Sum)"
          Write-Host 'DELTA_TIMEOUT_WORKSPACE_DIAGNOSTIC=PASS'

      - name: Inspect OpenNebula target artifacts read-only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if((Get-VM -Name 'ls-fe2' -ErrorAction Stop).State -ne 'Off'){throw 'FE2 must remain Off'}
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $before=& ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          if($LASTEXITCODE -ne 0){throw 'appliance block baseline failed'}
          $fe2=(Get-VMHardDiskDrive -VMName 'ls-fe2' -ErrorAction Stop | Where-Object {$_.Path} | Sort-Object ControllerNumber,ControllerLocation | Select-Object -First 1).Path
          $audit=Join-Path 'C:\LayerSentryLab\qualification' ("fe2-post-shutdown-$env:GITHUB_RUN_ID.vhdx")
          New-VHD -Path $audit -ParentPath $fe2 -Differencing -ErrorAction Stop | Out-Null
          Add-VMHardDiskDrive -VMName 'ls-appliance-qual' -ControllerType SCSI -Path $audit -ErrorAction Stop
          "FE2_AUDIT_VHD=$audit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 3
          $after=& ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
            if [ "$exists" = "true" ]; then auth=$(sudo guestfish --ro -a "$dev" -i cat "$p"); break; fi
          done
          [ -n "$auth" ]
          tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
          printf '%s\n' "$auth" > "$tmp"; chmod 600 "$tmp"
          export ONE_AUTH="$tmp"; export ONE_XMLRPC="http://10.250.10.11:2633/RPC2"
          echo '===MIGRATION_IMAGES==='
          oneimage list | grep -Ei 'ls-migration-source-test|hyperv|oneswap' || true
          echo '===MIGRATION_TEMPLATES==='
          onetemplate list | grep -Ei 'ls-migration-source-test|hyperv|oneswap' || true
          echo '===MIGRATION_VMS==='
          onevm list | grep -Ei 'ls-migration-source-test|hyperv|oneswap' || true
          echo 'OPENNEBULA_RECONCILE_INVENTORY=PASS'
          '@
          $script=$script.Replace('__DEV__',$dev)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'OpenNebula artifact inventory failed'}

      - name: Cleanup authority child and re-prove source Off
        if: always()
        shell: powershell
        run: |
          $audit=$env:FE2_AUDIT_VHD
          if($audit){
            Get-VMHardDiskDrive -VMName 'ls-appliance-qual' -ErrorAction SilentlyContinue | Where-Object {$_.Path -eq $audit} | Remove-VMHardDiskDrive -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            if(Test-Path $audit){Remove-Item -Force $audit -ErrorAction Stop}
          }
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          Write-Host "FINAL_SOURCE_STATE=$($vm.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$n"
          if($vm.State -ne 'Off'){throw 'Reconcile changed source state'}
          if($n -ne 0){throw 'Unexpected source checkpoint'}
          Write-Host 'POST_SHUTDOWN_RECONCILE_SOURCE_INVARIANT=PASS'
