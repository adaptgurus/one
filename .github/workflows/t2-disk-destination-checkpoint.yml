name: T2 Disk Destination Checkpoint

on:
  push:
    branches:
      - ops/t2-foundation-live-qual-20260921
    paths:
      - .github/workflows/t2-disk-destination-checkpoint.yml

permissions:
  contents: read

concurrency:
  group: t2-exact-live-vm
  cancel-in-progress: false

jobs:
  destination:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Bind exact disposable VM and disk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw 'wrong runner'}
          $vm=Get-VM -Name 'ls-appliance-dbe-qual' -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "VM not running: $($vm.State)"}
          $d=Get-VMHardDiskDrive -VMName 'ls-appliance-dbe-qual' -ControllerType SCSI -ControllerNumber 0 -ControllerLocation 0
          if($d.Path -ne 'C:\LayerSentryLab\qualification\ls-appliance-dbe-qual\os-4c4ac81-live.vhdx'){throw 'fresh disk identity mismatch'}
      - name: Open Installation Destination only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ns='root\virtualization\v2'
          $vm=Get-CimInstance -Namespace $ns -ClassName Msvm_ComputerSystem|Where-Object ElementName -eq 'ls-appliance-dbe-qual'
          $kbd=Get-CimAssociatedInstance -InputObject $vm -Namespace $ns -Association Msvm_SystemDevice -ResultClassName Msvm_Keyboard|Select-Object -First 1
          if(-not $kbd){throw 'VM keyboard missing'}
          Invoke-CimMethod -InputObject $kbd -MethodName TypeKey -Arguments @{KeyCode=[uint32][char]'5'}|Out-Null
          Invoke-CimMethod -InputObject $kbd -MethodName TypeKey -Arguments @{KeyCode=[uint32]0x0D}|Out-Null
          Start-Sleep -Seconds 5
      - name: Capture destination screen
        shell: powershell
        run: |
          $out='C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\live\installation-destination.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM 'ls-appliance-dbe-qual' -Out $out
          if(-not(Test-Path $out) -or (Get-Item $out).Length -lt 1000){throw 'destination screenshot missing'}
          Write-Host "DESTINATION_CHECKPOINT=PASS $out"
      - name: Upload destination screen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-4c4ac81-installation-destination
          path: C:\LayerSentryLab\evidence\t2-foundation-4c4ac81\live\installation-destination.png
          if-no-files-found: error
          retention-days: 7