name: Seven Node Root Baseline

on:
  push:
    branches:
      - lab/seven-node-foundation-20260926
    paths:
      - '.github/workflows/seven-node-root-baseline.yml'

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Bind target runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME COMPUTERNAME=$env:COMPUTERNAME SLOT=${{ matrix.slot }}"
          if($env:RUNNER_NAME -ine 'WIN-GK6MO7T7OPC' -or $env:COMPUTERNAME -ine 'WIN-GK6MO7T7OPC'){
            Write-Host 'NON_TARGET_RUNNER_HOLD'
            Start-Sleep -Seconds 90
            "LS_TARGET_RUNNER=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          "LS_TARGET_RUNNER=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Decrypt credential in memory
        if: env.LS_TARGET_RUNNER == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $wrap=Join-Path $dir 'wrap-rsa.xml'
          if(-not (Test-Path $wrap)){ throw 'Target-runner wrapping key missing' }
          $rsa=New-Object System.Security.Cryptography.RSACryptoServiceProvider 3072
          $rsa.FromXmlString((Get-Content $wrap -Raw))
          $cipher=''
          $password=[Text.Encoding]::UTF8.GetString($rsa.Decrypt([Convert]::FromBase64String($cipher),$true))
          if([string]::IsNullOrWhiteSpace($password)){ throw 'Credential decrypt failed' }
          $env:LS_ROOT_PASSWORD=$password
          $askpass=Join-Path $env:RUNNER_TEMP 'layersentry-baseline-askpass.exe'
          $src=@'
          using System;
          public class AskPass {
              public static void Main() {
                  Console.Write(Environment.GetEnvironmentVariable("LS_ROOT_PASSWORD"));
              }
          }
          '@
          Add-Type -TypeDefinition $src -Language CSharp -OutputAssembly $askpass -OutputType ConsoleApplication
          "LS_ASKPASS=$askpass" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item Env:LS_ROOT_PASSWORD
          Write-Host 'CREDENTIAL_UNWRAP_AND_ASKPASS=PASS'

      - name: Recover prior incomplete sudoers fragment
        if: env.LS_TARGET_RUNNER == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $wrap=Join-Path $dir 'wrap-rsa.xml'
          if(-not (Test-Path $wrap)){ throw 'Target-runner wrapping key missing' }
          $rsa=New-Object System.Security.Cryptography.RSACryptoServiceProvider 3072
          $rsa.FromXmlString((Get-Content $wrap -Raw))
          $cipher=''
          $env:LS_ROOT_PASSWORD=[Text.Encoding]::UTF8.GetString($rsa.Decrypt([Convert]::FromBase64String($cipher),$true))
          if([string]::IsNullOrWhiteSpace($env:LS_ROOT_PASSWORD)){ throw 'Credential decrypt failed' }
          $env:SSH_ASKPASS=$env:LS_ASKPASS
          $env:SSH_ASKPASS_REQUIRE='force'
          $env:DISPLAY='LayerSentry'
          $known='C:\ProgramData\LayerSentryLab\seven-node-bootstrap\known_hosts'
          $script="set -e; if test -f /etc/sudoers.d/90-layersentry-deploy; then mv /etc/sudoers.d/90-layersentry-deploy /root/90-layersentry-deploy.invalid-bootstrap; fi; visudo -c >/dev/null; echo SUDOERS_RECOVERY=PASS"
          & ssh.exe -T -o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$known" root@172.17.60.30 $script
          if($LASTEXITCODE -ne 0){ throw 'sudoers recovery failed on layersentry1' }
          Remove-Item Env:LS_ROOT_PASSWORD

      - name: Collect seven-host inventory
        if: env.LS_TARGET_RUNNER == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $wrap=Join-Path $dir 'wrap-rsa.xml'
          if(-not (Test-Path $wrap)){ throw 'Target-runner wrapping key missing' }
          $rsa=New-Object System.Security.Cryptography.RSACryptoServiceProvider 3072
          $rsa.FromXmlString((Get-Content $wrap -Raw))
          $cipher=''
          $env:LS_ROOT_PASSWORD=[Text.Encoding]::UTF8.GetString($rsa.Decrypt([Convert]::FromBase64String($cipher),$true))
          if([string]::IsNullOrWhiteSpace($env:LS_ROOT_PASSWORD)){ throw 'Credential decrypt failed' }
          $env:SSH_ASKPASS=$env:LS_ASKPASS
          $env:SSH_ASKPASS_REQUIRE='force'
          $env:DISPLAY='LayerSentry'
          $known='C:\ProgramData\LayerSentryLab\seven-node-bootstrap\known_hosts'
          $hosts=[ordered]@{
            layersentry1='172.17.60.30'
            layersentry2='172.17.60.31'
            layersentry3='172.17.60.32'
            layersentry4='172.17.60.33'
            layersentry5='172.17.60.34'
            layersentry6='172.17.60.35'
            layersentryol7='172.17.60.36'
          }
          $script=@'
          set -e
          printf 'HOST='; hostname
          . /etc/os-release
          printf 'OS=%s %s\n' "$NAME" "$VERSION_ID"
          printf 'KERNEL='; uname -r
          printf 'ARCH='; uname -m
          printf 'CPU_LOGICAL='; nproc
          printf 'MEM_KB='; awk '/MemTotal/ {print $2}' /proc/meminfo
          printf 'VIRT='; systemd-detect-virt 2>/dev/null || true
          printf 'SELINUX='; getenforce 2>/dev/null || true
          printf 'FIREWALLD='; systemctl is-enabled firewalld 2>/dev/null || true
          echo '---IP---'; ip -br addr
          echo '---ROUTE---'; ip route
          echo '---BLOCK---'; lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS
          echo '---DF---'; df -hT
          echo '---KVM---'; test -e /dev/kvm && ls -l /dev/kvm || echo KVM_DEVICE_ABSENT
          echo '---PACKAGES---'; rpm -qa 2>/dev/null | grep -Ei 'opennebula|qemu|libvirt|nfs-utils' | sort || true
          '@
          $script=$script -replace "`r`n","`n"
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          foreach($e in $hosts.GetEnumerator()){
            Write-Host "::group::$($e.Key) $($e.Value)"
            $remote="printf '%s' '$b64' | base64 -d | bash"
            & ssh.exe -T -o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$known" "root@$($e.Value)" $remote
            if($LASTEXITCODE -ne 0){ throw "Inventory failed for $($e.Key)" }
            Write-Host "::endgroup::"
          }
          Remove-Item Env:LS_ROOT_PASSWORD

      - name: Discover NFS exports
        if: env.LS_TARGET_RUNNER == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $wrap=Join-Path $dir 'wrap-rsa.xml'
          if(-not (Test-Path $wrap)){ throw 'Target-runner wrapping key missing' }
          $rsa=New-Object System.Security.Cryptography.RSACryptoServiceProvider 3072
          $rsa.FromXmlString((Get-Content $wrap -Raw))
          $cipher=''
          $env:LS_ROOT_PASSWORD=[Text.Encoding]::UTF8.GetString($rsa.Decrypt([Convert]::FromBase64String($cipher),$true))
          if([string]::IsNullOrWhiteSpace($env:LS_ROOT_PASSWORD)){ throw 'Credential decrypt failed' }
          $env:SSH_ASKPASS=$env:LS_ASKPASS
          $env:SSH_ASKPASS_REQUIRE='force'
          $env:DISPLAY='LayerSentry'
          $known='C:\ProgramData\LayerSentryLab\seven-node-bootstrap\known_hosts'
          $script=@'
          set -e
          echo NFS_SERVER=172.17.60.210
          if ! command -v showmount >/dev/null 2>&1; then
            echo INSTALLING_NFS_UTILS=1
            dnf -y install nfs-utils >/tmp/layersentry-nfs-utils-install.log
          fi
          echo '--- EXPORTS ---'
          showmount -e 172.17.60.210
          echo '--- RPC ---'
          rpcinfo -p 172.17.60.210 | head -40 || true
          timeout 4 bash -c '</dev/tcp/172.17.60.210/2049' && echo NFS_TCP_2049=PASS || echo NFS_TCP_2049=FAIL
          echo '--- READONLY CAPACITY PROBE ---'
          mapfile -t exports < <(showmount -e 172.17.60.210 | awk 'NR>1 && $1 ~ /^\// {print $1}')
          probe=/mnt/layersentry-nfs-capacity-probe
          mkdir -p "$probe"
          for export in "${exports[@]}"; do
            name=$(printf '%s' "$export" | sed 's#[^A-Za-z0-9_.-]#_#g')
            mountpoint="$probe/$name"
            mkdir -p "$mountpoint"
            mounted=0
            for vers in 4.2 4.1 3; do
              if timeout 15 mount -t nfs -o "ro,nosuid,nodev,noexec,vers=$vers" "172.17.60.210:$export" "$mountpoint" 2>/tmp/layersentry-nfs-mount.err; then
                echo "NFS_EXPORT=$export VERSION=$vers"
                df -B1 --output=source,fstype,size,used,avail,pcent,target "$mountpoint" | tail -n 1
                findmnt -n -o SOURCE,FSTYPE,OPTIONS,TARGET "$mountpoint"
                mounted=1
                umount "$mountpoint"
                break
              fi
            done
            if [ "$mounted" -ne 1 ]; then
              echo "NFS_EXPORT=$export MOUNT=FAILED"
              tail -n 2 /tmp/layersentry-nfs-mount.err || true
            fi
            rmdir "$mountpoint" 2>/dev/null || true
          done
          rmdir "$probe" 2>/dev/null || true
          '@
          $script=$script -replace "`r`n","`n"
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          $remote="printf '%s' '$b64' | base64 -d | bash"
          & ssh.exe -T -o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=8 -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$known" root@172.17.60.30 $remote
          if($LASTEXITCODE -ne 0){ throw 'NFS discovery failed' }
          Remove-Item Env:LS_ROOT_PASSWORD
          Remove-Item $env:LS_ASKPASS -Force -ErrorAction SilentlyContinue
          Write-Host 'PLAINTEXT_CREDENTIAL_PERSISTED=false'
