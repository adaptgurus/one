          test "$($SUDO id -u)" = 0
          mapfile -t source < <(sudo -n -u oneadmin onevm show 29 --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); print(r.findtext("NAME") or "",r.findtext("STATE") or "",sep="\n")')
