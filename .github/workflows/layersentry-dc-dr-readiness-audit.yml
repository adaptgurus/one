            -o "ProxyCommand=$proxy" "root@$vm_ip" 'set -euo pipefail; test "$(id -u)" = 0; test "$(findmnt -n -o SOURCE /srv/layersentry-data)" = /dev/vdb; sha256sum -c /srv/layersentry-data/generations/20260927T234524Z.sha256; sha256sum -c /srv/layersentry-data/generations/20260928T000000Z-dr-failback.sha256; test "$(sha256sum /srv/layersentry-data/generations/20260927T234524Z.records | awk '\''{print $1}'\'')" = 9b3372cc6e663cae91df68d687d71a0470b10badbfb7ce60fb67cc6d230b4f0d; test "$(sha256sum /srv/layersentry-data/generations/20260927T234524Z.payload | awk '\''{print $1}'\'')" = ea57d829b452e3ea965d14b8942e00080a7692d462629a951507f1f4a0bda980; test "$(sha256sum /srv/layersentry-data/generations/20260928T000000Z-dr-failback.records | awk '\''{print $1}'\'')" = a0c957a52e9d46da1476def6bffdf8d086dca73e8d75d84513a5e675d976eff7; test "$(sha256sum /srv/layersentry-data/generations/20260928T000000Z-dr-failback.payload | awk '\''{print $1}'\'')" = 2ca76f41f6968d91cc8d65693c1a0e8bd94843b50ad1434518879f8cb59c4d10; echo REPLICATION_V2_FAILBACK_GUEST_DATA=PASS'
          ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
            "$dc_user@172.17.60.30" 'bash -s --' "$vmid" <<'DC_FINAL'
          set -euo pipefail
          test "$(hostname -s)" = layersentry1
