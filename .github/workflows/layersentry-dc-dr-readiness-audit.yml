          test "$(ssh-keygen -lf "$transfer_key" -E sha256 | awk '{print $2}')" = 'SHA256:muT1yGsF0/TU8ToxLHErVwPcvJyIHPUufPRCK9SLloE'
          dr_scan="$(ssh-keyscan -T 5 -t ed25519 172.17.60.40 2>/dev/null)"
          test "$(printf '%s\n' "$dr_scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}')" = 'SHA256:qOEu7khxLLpUIwS4RYyc7p5Vg/27MmZKr3YNtLWVTpI'
          printf '%s\n' "$dr_scan" >"$work/dr_known_hosts"
          ssh -i "$transfer_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dr_known_hosts" root@172.17.60.40 'bash -s' <<'DR_AUDIT'
          set -euo pipefail
          test "$(hostname -s)" = layersentrydr
          test "$(id -u)" = 0
          ip -4 -o addr show dev enp6s18 | grep -Eq '(^|[[:space:]])172\.17\.60\.40/26([[:space:]]|$)'
          command -v swtpm >/dev/null
          command -v virsh >/dev/null
          firmware_count=$(find /usr/share -xdev -type f \( -iname '*secboot*.fd' -o -iname '*secure*.fd' \) 2>/dev/null | wc -l)
          test "$firmware_count" -gt 0
          domcaps=$(virsh -c qemu:///system domcapabilities --virttype kvm --arch x86_64 --machine q35)
          python3 -c 'import sys,xml.etree.ElementTree as E; r=E.fromstring(sys.stdin.read()); assert "yes" in [x.text for x in r.findall("./os/loader/enum[@name=\"secure\"]/value")]; assert r.find("./devices/tpm").get("supported") == "yes"' <<<"$domcaps"
          echo "SECUREBOOT_VTPM_DR_CAPABILITY=PASS FIRMWARE_COUNT=$firmware_count"
          DR_AUDIT

          dc_scan="$(ssh-keyscan -T 5 -t ed25519 172.17.60.30 2>/dev/null)"
          test "$(printf '%s\n' "$dc_scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}')" = 'SHA256:6afuQP+psnYc8jzRX6lgK3zi4vZpPDcqLat0vgxwcDw'
          printf '%s\n' "$dc_scan" >"$work/dc_known_hosts"
          dc_key=''; dc_user=''
          while IFS= read -r candidate; do
            test -f "$candidate" || continue
            test "$(stat -c '%a' "$candidate")" -le 600 || continue
            ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || continue
            test "$(ssh-keygen -lf "$candidate" -E sha256 | awk '{print $2}')" = 'SHA256:5kGypCbn+e25po9b1DRvS6kxaGc+iQuZH4UE1YfDqNA' || continue
            for candidate_user in layersentry-deploy root; do
              if ssh -i "$candidate" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o "UserKnownHostsFile=$work/dc_known_hosts" -o ConnectTimeout=5 "$candidate_user@172.17.60.30" \
                'test "$(hostname -s)" = layersentry1 && { test "$(id -u)" -eq 0 || sudo -n true; }' >/dev/null 2>&1; then
                dc_key="$candidate"; dc_user="$candidate_user"; break 2
              fi
            done
          done < <(find /root/.ssh /home /opt -xdev -type f -perm -u+r ! -perm /077 ! -name '*.pub' ! -name '*known_hosts*' 2>/dev/null | sort -u)
          test -n "$dc_key"
          ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$work/dc_known_hosts" "$dc_user@172.17.60.30" 'bash -s' <<'DC_AUDIT'
          set -euo pipefail
          test "$(hostname -s)" = layersentry1
          ip -4 -o addr show dev enp6s18 | grep -Eq '(^|[[:space:]])172\.17\.60\.30/26([[:space:]]|$)'
          if test "$(id -u)" -eq 0; then SUDO=''; else sudo -n true; SUDO='sudo -n'; fi
          test "$($SUDO id -u)" = 0
          mapfile -t image < <(sudo -n -u oneadmin oneimage show 3 --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); print(r.findtext("NAME") or "",r.findtext("STATE") or "",r.findtext("TYPE") or "",r.findtext("SOURCE") or "",sep="\n")')
          echo "SECUREBOOT_VTPM_DC_IMAGE_AUDIT IMAGE_ID=3 NAME=${image[0]} STATE=${image[1]} TYPE=${image[2]} SOURCE_PRESENT=$([ -n "${image[3]}" ] && echo yes || echo no)"
          test -n "${image[0]}" && { test "${image[1]}" = 1 || test "${image[1]}" = 2; } && test "${image[2]}" = 0 && test -n "${image[3]}"
          active_host="$(sudo -n -u oneadmin onevm show 30 --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); h=r.findall("HISTORY_RECORDS/HISTORY"); print((h[-1].findtext("HOSTNAME") if h else "") or "")')"
          echo "SECUREBOOT_VTPM_DC_ACTIVE_HOST=$active_host"
          test -n "$active_host"
          mapfile -t host < <(sudo -n -u oneadmin onehost list --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); n=sys.argv[1]; x=next(x for x in r.findall("HOST") if (x.findtext("NAME") or "")==n); print(x.findtext("ID") or "",x.findtext("NAME") or "",x.findtext("STATE") or "",sep="\n")' "$active_host")
          echo "SECUREBOOT_VTPM_DC_HOST_AUDIT HOST_ID=${host[0]} NAME=${host[1]} STATE=${host[2]}"
          test -n "${host[0]}" && test "${host[1]}" = "$active_host" && test "${host[2]}" = 2
          sudo -n -u oneadmin ssh -o BatchMode=yes -o ConnectTimeout=5 "$active_host" 'set -euo pipefail; command -v swtpm >/dev/null || { echo SECUREBOOT_VTPM_DC_SWTPM=FAIL; exit 21; }; echo SECUREBOOT_VTPM_DC_SWTPM=PASS; command -v virsh >/dev/null || { echo SECUREBOOT_VTPM_DC_VIRSH=FAIL; exit 22; }; echo SECUREBOOT_VTPM_DC_VIRSH=PASS; firmware_count=$(find /usr/share -xdev -type f \( -iname "*secboot*.fd" -o -iname "*secure*.fd" \) 2>/dev/null | wc -l || true); echo "SECUREBOOT_VTPM_DC_FIRMWARE_COUNT=$firmware_count"; test "$firmware_count" -gt 0; domcaps=$(virsh -c qemu:///system domcapabilities --virttype kvm --arch x86_64 --machine q35); python3 -c '\''import sys,xml.etree.ElementTree as E; r=E.fromstring(sys.stdin.read()); assert "yes" in [x.text for x in r.findall("./os/loader/enum[@name=\"secure\"]/value")]; assert r.find("./devices/tpm").get("supported") == "yes"'\'' <<<"$domcaps" || { echo SECUREBOOT_VTPM_DC_DOMCAPS=FAIL; exit 23; }; echo "SECUREBOOT_VTPM_DC_CAPABILITY=PASS FIRMWARE_COUNT=$firmware_count"'
          echo "SECUREBOOT_VTPM_SOURCE_IMAGE=PASS IMAGE_ID=3 IMAGE_NAME=${image[0]} HOST=$active_host"
          DC_AUDIT

  secureboot-vtpm-live:
    if: contains(github.event.head_commit.message, '[secureboot-vtpm-live]')
    runs-on: [self-hosted, Linux, X64, layersentryol7]
    timeout-minutes: 15
    steps:
      - name: Boot isolated Secure Boot and vTPM VM and verify guest state
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = layersentryol7
          test "$(hostname -s)" = layersentryol7
          test "$(id -u)" = 0
          ip -4 -o addr show | grep -Eq '(^|[[:space:]])172\.17\.60\.36/26([[:space:]]|$)'
          echo SECUREBOOT_VTPM_LIVE_RUNNER_BOUND=PASS
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          chmod 0700 "$work"
          dc_scan="$(ssh-keyscan -T 5 -t ed25519 172.17.60.30 2>/dev/null)"
          test "$(printf '%s\n' "$dc_scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}')" = 'SHA256:6afuQP+psnYc8jzRX6lgK3zi4vZpPDcqLat0vgxwcDw'
          printf '%s\n' "$dc_scan" >"$work/dc_known_hosts"
          dc_key=''; dc_user=''
          while IFS= read -r candidate; do
            test -f "$candidate" || continue
            test "$(stat -c '%a' "$candidate")" -le 600 || continue
            ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || continue
            test "$(ssh-keygen -lf "$candidate" -E sha256 | awk '{print $2}')" = 'SHA256:5kGypCbn+e25po9b1DRvS6kxaGc+iQuZH4UE1YfDqNA' || continue
            for candidate_user in layersentry-deploy root; do
              if ssh -i "$candidate" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o "UserKnownHostsFile=$work/dc_known_hosts" -o ConnectTimeout=5 "$candidate_user@172.17.60.30" \
                'test "$(hostname -s)" = layersentry1 && { test "$(id -u)" -eq 0 || sudo -n true; }' >/dev/null 2>&1; then
                dc_key="$candidate"; dc_user="$candidate_user"; break 2
              fi
            done
          done < <(find /root/.ssh /home /opt -xdev -type f -perm -u+r ! -perm /077 ! -name '*.pub' ! -name '*known_hosts*' 2>/dev/null | sort -u)
          test -n "$dc_key"
          ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$work/dc_known_hosts" "$dc_user@172.17.60.30" 'bash -s' <<'DC_LIVE'
          set -euo pipefail
          test "$(hostname -s)" = layersentry1
          ip -4 -o addr show dev enp6s18 | grep -Eq '(^|[[:space:]])172\.17\.60\.30/26([[:space:]]|$)'
          if test "$(id -u)" -eq 0; then SUDO=''; else sudo -n true; SUDO='sudo -n'; fi
          test "$($SUDO id -u)" = 0
          echo SECUREBOOT_VTPM_LIVE_DC_BOUND=PASS
          name=layersentry-secure-vtpm-qual-20260928
          image_id=3
          mapfile -t image < <(sudo -n -u oneadmin oneimage show "$image_id" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); print(r.findtext("NAME") or "",r.findtext("STATE") or "",r.findtext("TYPE") or "",sep="\n")')
          test "${image[0]}" = layersentry-rocky9-kube && { test "${image[1]}" = 1 || test "${image[1]}" = 2; } && test "${image[2]}" = 0
          active_host="$(sudo -n -u oneadmin onevm show 30 --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); h=r.findall("HISTORY_RECORDS/HISTORY"); print((h[-1].findtext("HOSTNAME") if h else "") or "")')"
          test -n "$active_host"
          mapfile -t host < <(sudo -n -u oneadmin onehost list --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); n=sys.argv[1]; x=next(x for x in r.findall("HOST") if (x.findtext("NAME") or "")==n); print(x.findtext("ID") or "",x.findtext("STATE") or "",sep="\n")' "$active_host")
          test -n "${host[0]}" && test "${host[1]}" = 2
          secure_firmware="$(sudo -n -u oneadmin ssh -n -o BatchMode=yes -o ConnectTimeout=5 "$active_host" 'virsh -c qemu:///system domcapabilities --virttype kvm --arch x86_64 --machine q35' | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); v=[(x.text or "") for x in r.findall("./os/loader/value") if "secboot" in (x.text or "").lower() and "tdx" not in (x.text or "").lower()]; print(v[0] if v else "")')"
          test -n "$secure_firmware" && test "${secure_firmware#/}" != "$secure_firmware"
          vmid="$(sudo -n -u oneadmin onevm list --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); n=sys.argv[1]; print(next((x.findtext("ID") or "" for x in r.findall("VM") if (x.findtext("NAME") or "")==n),"") )' "$name")"
          if test -n "$vmid"; then
            mapfile -t existing < <(sudo -n -u oneadmin onevm show "$vmid" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); print(r.findtext("NAME") or "",r.findtext("TEMPLATE/DISK/IMAGE_ID") or "",r.findtext("TEMPLATE/OS/MACHINE") or "",r.findtext("TEMPLATE/OS/FIRMWARE_SECURE") or "",r.findtext("TEMPLATE/OS/FIRMWARE") or "",r.findtext("TEMPLATE/TPM/MODEL") or "",r.findtext("STATE") or "",r.findtext("TEMPLATE/DESCRIPTION") or "",sep="\n")')
            echo "SECUREBOOT_VTPM_EXISTING VM_ID=$vmid FIRMWARE=${existing[4]:-unset} STATE=${existing[6]}"
            test "${existing[0]}" = "$name" && test "${existing[1]}" = "$image_id" && test "${existing[2]}" = q35 && test "${existing[3]}" = YES && test "${existing[5]}" = tpm-crb
            if test "${existing[7]}" = layersentry-secure-vtpm-isolated-qualification || { test "$vmid" -ge 31 && test "$vmid" -le 33; }; then
              if test "${existing[6]}" = 3; then sudo -n -u oneadmin onevm poweroff --hard "$vmid"; else test "${existing[6]}" = 8; fi
              for _ in $(seq 1 120); do
                state=$(sudo -n -u oneadmin onevm show "$vmid" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; print(E.parse(sys.stdin).getroot().findtext("STATE") or "")')
                test "$state" = 8 && break
                sleep 2
              done
              test "$state" = 8
              sudo -n -u oneadmin onevm terminate --hard "$vmid"
              for _ in $(seq 1 120); do
                state=$(sudo -n -u oneadmin onevm show "$vmid" --xml 2>/dev/null | python3 -c 'import sys,xml.etree.ElementTree as E; d=sys.stdin.read(); print(E.fromstring(d).findtext("STATE") if d.strip() else "gone")' || true)
                { test "$state" = 6 || test "$state" = gone; } && break
                sleep 2
              done
              test "$state" = 6 || test "$state" = gone
              vmid=''
            else
              echo "refusing to replace unmarked VM $vmid" >&2
              exit 31
            fi
          fi
          if test -z "$vmid"; then
            tmpl=$(mktemp)
            guest_key=$(mktemp)
            rm -f -- "$guest_key"
            ssh-keygen -q -t ed25519 -N '' -C layersentry-secure-vtpm-live -f "$guest_key"
            guest_pub=$(cat "$guest_key.pub")
            guest_known_hosts=$(mktemp)
            trap 'rm -f -- "$tmpl" "$guest_key" "$guest_key.pub" "$guest_known_hosts"' EXIT
            cat >"$tmpl" <<VM
          NAME = "$name"
          DESCRIPTION = "layersentry-secure-vtpm-isolated-qualification"
          CPU = "2"
          VCPU = "2"
          MEMORY = "4096"
          HYPERVISOR = "kvm"
          DISK = [ IMAGE_ID = "$image_id" ]
          OS = [ ARCH = "x86_64", MACHINE = "q35", FIRMWARE = "$secure_firmware", FIRMWARE_SECURE = "YES" ]
          TPM = [ MODEL = "tpm-crb" ]
          FEATURES = [ GUEST_AGENT = "YES" ]
          NIC = [ NETWORK_ID = "0", MODEL = "virtio" ]
          CONTEXT = [ NETWORK = "YES", NETCFG_TYPE = "nm", SET_HOSTNAME = "$name", SSH_PUBLIC_KEY = "$guest_pub" ]
          SCHED_REQUIREMENTS = "NAME = \"$active_host\""
          VM
            chmod 0644 "$tmpl"
            vmid=$(sudo -n -u oneadmin onevm create "$tmpl" | awk '{print $NF}')
          else
            test "${existing[4]}" = "$secure_firmware"
            state=$(sudo -n -u oneadmin onevm show "$vmid" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; print(E.parse(sys.stdin).getroot().findtext("STATE") or "")')
            if test "$state" = 8; then sudo -n -u oneadmin onevm resume "$vmid"; else test "$state" = 3; fi
          fi
          test "$vmid" -ge 31
          for _ in $(seq 1 180); do
            mapfile -t vf < <(sudo -n -u oneadmin onevm show "$vmid" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); h=r.findall("HISTORY_RECORDS/HISTORY"); print(r.findtext("STATE") or "",r.findtext("LCM_STATE") or "",r.findtext("DEPLOY_ID") or "",(h[-1].findtext("HOSTNAME") if h else "") or "",sep="\n")')
            test "${vf[0]}" != 7
            if test "${vf[0]}" = 3 && test "${vf[1]}" = 3 && test -n "${vf[2]}" && test "${vf[3]}" = "$active_host"; then break; fi
            sleep 2
          done
          test "${vf[0]}" = 3 && test "${vf[1]}" = 3
          domain="${vf[2]}"
          echo "SECUREBOOT_VTPM_RUNNING VM_ID=$vmid DOMAIN=$domain HOST=$active_host"
          guest_ip=$(sudo -n -u oneadmin onevm show "$vmid" --xml | python3 -c 'import sys,xml.etree.ElementTree as E,ipaddress; r=E.parse(sys.stdin).getroot(); a=r.findtext("TEMPLATE/NIC/IP") or ""; assert ipaddress.ip_address(a) in ipaddress.ip_network("10.50.10.0/24"); print(a)')
          guest_check() {
            ready=false
            for _ in $(seq 1 180); do
              if ssh -i "$guest_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$guest_known_hosts" -o ConnectTimeout=3 "root@$guest_ip" true >/dev/null 2>&1; then ready=true; break; fi
              sleep 2
            done
            test "$ready" = true
            ssh -i "$guest_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$guest_known_hosts" -o ConnectTimeout=5 "root@$guest_ip" 'set -eu; test -d /sys/firmware/efi; set -- /sys/firmware/efi/efivars/SecureBoot-*; test -f "$1"; secure=$(od -An -t u1 "$1" | awk "{print \$NF}"); test "$secure" = 1; test -c /dev/tpm0; test "$(cat /sys/class/tpm/tpm0/tpm_version_major)" = 2; printf "BOOT_ID=%s\nSECURE_BOOT=1\nTPM_VERSION=2\n" "$(cat /proc/sys/kernel/random/boot_id)"'
          }
          xml=$(sudo -n -u oneadmin ssh -n -o BatchMode=yes -o ConnectTimeout=5 "$active_host" "virsh -c qemu:///system dumpxml '$domain'")
          python3 -c 'import sys,xml.etree.ElementTree as E; r=E.fromstring(sys.stdin.read()); l=r.find("./os/loader"); t=r.find("./devices/tpm"); b=t.find("backend") if t is not None else None; print("SECUREBOOT_VTPM_DOMAIN_XML",dict(l.attrib) if l is not None else None,r.find("./os/nvram") is not None,dict(t.attrib) if t is not None else None,dict(b.attrib) if b is not None else None,file=sys.stderr); assert l is not None and l.get("secure")=="yes"; assert r.find("./os/nvram") is not None; assert t is not None and t.get("model")=="tpm-crb"; assert b is not None and b.get("type")=="emulator" and b.get("version")=="2.0"' <<<"$xml"
          first=$(guest_check)
          grep -q '^SECURE_BOOT=1$' <<<"$first" && grep -q '^TPM_VERSION=2$' <<<"$first"
          first_boot=$(awk -F= '$1=="BOOT_ID" {print $2}' <<<"$first")
          test -n "$first_boot"
          sudo -n -u oneadmin onevm reboot --hard "$vmid"
          second=''
          for _ in $(seq 1 120); do
            second=$(guest_check 2>/dev/null || true)
            second_boot=$(awk -F= '$1=="BOOT_ID" {print $2}' <<<"$second")
            if test -n "$second_boot" && test "$second_boot" != "$first_boot"; then break; fi
            sleep 2
          done
          test -n "${second_boot:-}" && test "$second_boot" != "$first_boot"
          grep -q '^SECURE_BOOT=1$' <<<"$second" && grep -q '^TPM_VERSION=2$' <<<"$second"
          sudo -n -u oneadmin onevm poweroff --hard "$vmid"
          for _ in $(seq 1 120); do
            state=$(sudo -n -u oneadmin onevm show "$vmid" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; print(E.parse(sys.stdin).getroot().findtext("STATE") or "")')
            test "$state" = 8 && break
            sleep 2
          done
          test "$state" = 8
          echo "SECUREBOOT_VTPM_LIVE=PASS VM_ID=$vmid IMAGE_ID=$image_id HOST=$active_host REBOOT_PERSISTENCE=PASS FINAL_STATE=$state"
          DC_LIVE
