          sudo -n -u oneadmin ssh -o BatchMode=yes -o ConnectTimeout=5 "$hypervisor" 'bash -s --' "$domain" "$ip" "$prefix" "$mask" "${gateway:-__NONE__}" "$pub64" <<'QGA'
