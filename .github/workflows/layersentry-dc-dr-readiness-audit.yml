          ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
            "$dc_user@172.17.60.30" 'bash -s' <<'DC_PREFLIGHT'
          set -euo pipefail
          test "$(hostname -s)" = layersentry1
          ip -4 -o addr show dev enp6s18 | grep -Eq '(^|[[:space:]])172\.17\.60\.30/26([[:space:]]|$)'
          if test "$(id -u)" -eq 0; then SUDO=''; else sudo -n true; SUDO='sudo -n'; fi
          test "$($SUDO id -u)" = 0
          $SUDO install -d -o "$(id -un)" -g "$(id -gn)" -m 0700 /var/tmp/layersentry-rv2-failback-ingress
          DC_PREFLIGHT

          scp -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
            "$work/layersentry-replication-v2-qualifier" "$work/ca.crt" \
            "$work/dc-server.crt" "$work/dc-server.key" "$work/dr.crt" "$work/dr.key" \
            "$dc_user@172.17.60.30:/var/tmp/layersentry-rv2-failback-ingress/"

          ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
            "$dc_user@172.17.60.30" 'bash -s' <<'DC_INSTALL'
          set -euo pipefail
          test "$(hostname -s)" = layersentry1
          ip -4 -o addr show dev enp6s18 | grep -Eq '(^|[[:space:]])172\.17\.60\.30/26([[:space:]]|$)'
          if test "$(id -u)" -eq 0; then SUDO=''; else sudo -n true; SUDO='sudo -n'; fi
          test "$($SUDO id -u)" = 0
          trap '$SUDO systemctl status --no-pager layersentry-replication-v2-failback-qualifier.service 2>/dev/null || true; $SUDO journalctl -u layersentry-replication-v2-failback-qualifier.service --no-pager -n 80 2>/dev/null || true' ERR
          ingress=/var/tmp/layersentry-rv2-failback-ingress
          test "$(sha256sum "$ingress/layersentry-replication-v2-qualifier" | awk '{print $1}')" = f87978040089303eca265a23bd7d119c62b617dfe747f1d1f4d961e019c3a182
          $SUDO modprobe nbd max_part=8 nbds_max=16
          test -b /dev/nbd6 && test -b /dev/nbd7
          for dev in nbd6 nbd7; do test "$(cat "/sys/block/$dev/pid" 2>/dev/null || true)" = ''; done
          $SUDO install -d -m 0750 /var/lib/layersentry/replication-v2-failback/pki /var/lib/layersentry/replication-v2-failback/filecow
          $SUDO install -m 0755 "$ingress/layersentry-replication-v2-qualifier" /usr/local/libexec/layersentry-replication-v2-failback-qualifier
          $SUDO install -m 0644 "$ingress/ca.crt" /var/lib/layersentry/replication-v2-failback/pki/ca.crt
          $SUDO install -m 0644 "$ingress/dc-server.crt" /var/lib/layersentry/replication-v2-failback/pki/dc-server.crt
          $SUDO install -m 0600 "$ingress/dc-server.key" /var/lib/layersentry/replication-v2-failback/pki/dc-server.key
          $SUDO install -m 0644 "$ingress/dr.crt" /var/lib/layersentry/replication-v2-failback/pki/dr.crt
          $SUDO install -m 0600 "$ingress/dr.key" /var/lib/layersentry/replication-v2-failback/pki/dr.key
          unit=$(mktemp)
          trap 'rm -f -- "$unit"' EXIT
          cat >"$unit" <<'UNIT'
          [Unit]
          Description=LayerSentry Replication v2 bounded DR-to-DC failback receiver
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/libexec/layersentry-replication-v2-failback-qualifier receiver --listen 172.17.60.30:9446 --root /var/lib/layersentry/replication-v2-failback/filecow --nbd /dev/nbd6,/dev/nbd7 --ca /var/lib/layersentry/replication-v2-failback/pki/ca.crt --cert /var/lib/layersentry/replication-v2-failback/pki/dc-server.crt --key /var/lib/layersentry/replication-v2-failback/pki/dc-server.key --local-site dc-qualification --remote-site dr-qualification --peer-identity layersentry-dr-replication-v2
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ReadWritePaths=/var/lib/layersentry/replication-v2-failback /run/lock
          ProtectHome=true

          [Install]
          WantedBy=multi-user.target
          UNIT
          $SUDO install -m 0644 "$unit" /etc/systemd/system/layersentry-replication-v2-failback-qualifier.service
          if $SUDO systemctl is-active --quiet firewalld; then
            $SUDO firewall-cmd --permanent --add-rich-rule='rule family=ipv4 source address=172.17.60.40/32 port port=9446 protocol=tcp accept'
            $SUDO firewall-cmd --reload
          fi
          $SUDO systemctl daemon-reload
          $SUDO systemctl enable layersentry-replication-v2-failback-qualifier.service
          $SUDO systemctl restart layersentry-replication-v2-failback-qualifier.service
          state=''
          for _ in $(seq 1 30); do
            state="$($SUDO systemctl is-active layersentry-replication-v2-failback-qualifier.service 2>/dev/null || true)"
            test "$state" = active && break
            sleep 1
          done
          test "$state" = active
          listening=FAIL
          for _ in $(seq 1 30); do
            if $SUDO ss -ltn | grep -Fq '172.17.60.30:9446'; then listening=PASS; break; fi
            sleep 1
          done
          test "$listening" = PASS
          echo REPLICATION_V2_FAILBACK_RECEIVER=READY
          DC_INSTALL

          ssh -i "$transfer_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dr_known_hosts" \
            root@172.17.60.40 'bash -s' <<'DR_NEGATIVES'
          set -euo pipefail
          test "$(hostname -s)" = layersentrydr
          test "$(id -u)" = 0
          ip -4 -o addr show dev enp6s18 | grep -Eq '(^|[[:space:]])172\.17\.60\.40/26([[:space:]]|$)'
          d=/var/lib/layersentry/replication-v2-qualification/transfer
          if curl --noproxy '*' --silent --show-error --fail --connect-timeout 5 --max-time 10 \
            --cacert "$d/ca.crt" --resolve layersentry-dc-replication-v2-receiver:9446:172.17.60.30 \
            https://layersentry-dc-replication-v2-receiver:9446/ >/dev/null 2>&1; then
            echo REPLICATION_V2_FAILBACK_NO_CLIENT_NEGATIVE=FAIL >&2
            exit 91
          fi
          status="$(curl --noproxy '*' --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 10 --cacert "$d/ca.crt" --cert "$d/dr.crt" --key "$d/dr.key" \
            --resolve layersentry-dc-replication-v2-receiver:9446:172.17.60.30 \
            -H 'X-LayerSentry-Source-Site: unauthorized-site' \
            -H 'X-LayerSentry-Target-Site: dc-qualification' \
            https://layersentry-dc-replication-v2-receiver:9446/internal/v1/replication/receiver/backend-health?session_id=denied)"
          test "$status" = 403
          echo REPLICATION_V2_FAILBACK_MTLS_NEGATIVES=PASS
          DR_NEGATIVES

  replication-failback-receiver-expand:
    if: contains(github.event.head_commit.message, '[replication-failback-receiver-expand]')
    runs-on: [self-hosted, Linux, X64, layersentryol7]
    timeout-minutes: 10
    steps:
      - name: Expand exact DC bounded failback receiver NBD pool
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = layersentryol7
          test "$(hostname -s)" = layersentryol7
          test "$(id -u)" = 0
          ip -4 -o addr show | grep -Eq '(^|[[:space:]])172\.17\.60\.36/26([[:space:]]|$)'

          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          chmod 0700 "$work"
          scan="$(ssh-keyscan -T 5 -t ed25519 172.17.60.30 2>/dev/null)"
          test "$(printf '%s\n' "$scan" | grep -c '^172\.17\.60\.30 ssh-ed25519 ')" -eq 1
          test "$(printf '%s\n' "$scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}')" = 'SHA256:6afuQP+psnYc8jzRX6lgK3zi4vZpPDcqLat0vgxwcDw'
          printf '%s\n' "$scan" >"$work/known_hosts"
          chmod 0600 "$work/known_hosts"

          key=''
          while IFS= read -r candidate; do
            test -f "$candidate" || continue
            test "$(stat -c '%a' "$candidate")" -le 600 || continue
            ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || continue
            if test "$(ssh-keygen -lf "$candidate" -E sha256 | awk '{print $2}')" = 'SHA256:5kGypCbn+e25po9b1DRvS6kxaGc+iQuZH4UE1YfDqNA'; then
              key="$candidate"
              break
            fi
          done < <(find /root/.ssh /home /opt -xdev -type f -perm -u+r ! -perm /077 \
            ! -name '*.pub' ! -name '*known_hosts*' 2>/dev/null | sort -u)
          test -n "$key"

          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" \
            -o ConnectTimeout=8 layersentry-deploy@172.17.60.30 'bash -s' <<'DC_EXPAND'
          set -euo pipefail
          test "$(hostname -s)" = layersentry1
          ip -4 -o addr show dev enp6s18 | grep -Eq '(^|[[:space:]])172\.17\.60\.30/26([[:space:]]|$)'
          sudo -n true
          test "$(sudo -n id -u)" = 0
          unit=/etc/systemd/system/layersentry-replication-v2-failback-qualifier.service
          sudo -n test -f "$unit"
          sudo -n grep -Fq -- '--listen 172.17.60.30:9446' "$unit"
          sudo -n grep -Fq -- '--root /var/lib/layersentry/replication-v2-failback/filecow' "$unit"
          sudo -n grep -Eq -- '--nbd /dev/nbd[0-9,/]+' "$unit"
          sudo -n modprobe nbd max_part=8 nbds_max=16
          free=0
          for n in $(seq 6 15); do
            test -b "/dev/nbd$n"
            pid="$(cat "/sys/block/nbd$n/pid" 2>/dev/null || true)"
            printf 'NBD_STATE device=/dev/nbd%s pid=%s\n' "$n" "${pid:-free}"
            test -z "$pid" && free=$((free + 1))
          done
          test "$free" -ge 2
          backup="$unit.before-secure-vtpm-20260928"
          sudo -n test -e "$backup" || sudo -n cp -a "$unit" "$backup"
          sudo -n sed -E -i 's#--nbd [^ ]+#--nbd /dev/nbd6,/dev/nbd7,/dev/nbd8,/dev/nbd9,/dev/nbd10,/dev/nbd11,/dev/nbd12,/dev/nbd13,/dev/nbd14,/dev/nbd15#' "$unit"
          test "$(sudo -n grep -c -- '--nbd /dev/nbd6,/dev/nbd7,/dev/nbd8,/dev/nbd9,/dev/nbd10,/dev/nbd11,/dev/nbd12,/dev/nbd13,/dev/nbd14,/dev/nbd15' "$unit")" = 1
          sudo -n systemctl daemon-reload
          sudo -n systemctl restart layersentry-replication-v2-failback-qualifier.service
          test "$(sudo -n systemctl is-active layersentry-replication-v2-failback-qualifier.service)" = active
          sockets="$(sudo -n ss -lntp)"
          grep -Fq '172.17.60.30:9446' <<<"$sockets"
          printf 'REPLICATION_V2_FAILBACK_RECEIVER_EXPANDED=PASS HOST=%s FREE_BEFORE=%s NBD_POOL=%s\n' "$(hostname -s)" "$free" '/dev/nbd6..15'
          DC_EXPAND

  replication-failback-boot:
    if: contains(github.event.head_commit.message, '[replication-failback-boot]')
    runs-on: [self-hosted, Linux, X64, layersentryol7]
    timeout-minutes: 45
    steps:
      - name: Materialize and boot exact failback VM on DC
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = layersentryol7
          test "$(hostname -s)" = layersentryol7
          test "$(id -u)" = 0
          ip -4 -o addr show | grep -Eq '(^|[[:space:]])172\.17\.60\.36/26([[:space:]]|$)'
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          chmod 0700 "$work"

          transfer_key=/root/.ssh/layersentry-replication-v2-transfer
          test -f "$transfer_key"
          test "$(ssh-keygen -lf "$transfer_key" -E sha256 | awk '{print $2}')" = 'SHA256:muT1yGsF0/TU8ToxLHErVwPcvJyIHPUufPRCK9SLloE'
          dr_scan="$(ssh-keyscan -T 5 -t ed25519 172.17.60.40 2>/dev/null)"
          test "$(printf '%s\n' "$dr_scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}')" = 'SHA256:qOEu7khxLLpUIwS4RYyc7p5Vg/27MmZKr3YNtLWVTpI'
          printf '%s\n' "$dr_scan" >"$work/dr_known_hosts"
          chmod 0600 "$work/dr_known_hosts"
          ssh -i "$transfer_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dr_known_hosts" \
            root@172.17.60.40 'bash -s' <<'DR_FENCE'
          set -euo pipefail
          test "$(hostname -s)" = layersentrydr
          test "$(id -u)" = 0
          ip -4 -o addr show dev enp6s18 | grep -Eq '(^|[[:space:]])172\.17\.60\.40/26([[:space:]]|$)'
          mapfile -t f < <(sudo -n -u oneadmin onevm show 6 --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); print(*[(r.findtext(p) or "").strip() for p in ("NAME","STATE","TEMPLATE/NIC/IP")],sep="\n")')
          test "${f[0]}" = layersentry-rv2-dr-vm29-g1
          test "${f[1]}" = 8
          test "${f[2]}" = 10.100.50.126
          echo REPLICATION_V2_FAILBACK_DR_FENCED=PASS
          DR_FENCE

          dc_scan="$(ssh-keyscan -T 5 -t ed25519 172.17.60.30 2>/dev/null)"
          test "$(printf '%s\n' "$dc_scan" | grep -c '^172\.17\.60\.30 ssh-ed25519 ')" -eq 1
          test "$(printf '%s\n' "$dc_scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}')" = 'SHA256:6afuQP+psnYc8jzRX6lgK3zi4vZpPDcqLat0vgxwcDw'
          printf '%s\n' "$dc_scan" >"$work/dc_known_hosts"
          chmod 0600 "$work/dc_known_hosts"
          dc_key=''
          dc_user=''
          while IFS= read -r candidate; do
            test -f "$candidate" || continue
            test "$(stat -c '%a' "$candidate")" -le 600 || continue
            ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || continue
            test "$(ssh-keygen -lf "$candidate" -E sha256 | awk '{print $2}')" = 'SHA256:5kGypCbn+e25po9b1DRvS6kxaGc+iQuZH4UE1YfDqNA' || continue
            for candidate_user in layersentry-deploy root; do
              if ssh -i "$candidate" -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
                -o ConnectTimeout=5 "$candidate_user@172.17.60.30" \
                'test "$(hostname -s)" = layersentry1 && { test "$(id -u)" -eq 0 || sudo -n true; }' \
                >/dev/null 2>&1; then dc_key="$candidate"; dc_user="$candidate_user"; break 2; fi
            done
          done < <(find /root/.ssh /home /opt -xdev -type f -perm -u+r ! -perm /077 \
            ! -name '*.pub' ! -name '*known_hosts*' 2>/dev/null | sort -u)
          test -n "$dc_key"
          guest_key=/root/.ssh/layersentry-replication-v2-failback-20260928
          if test ! -f "$guest_key"; then
            ssh-keygen -q -t ed25519 -N '' -C layersentry-rv2-dc-failback-20260928 -f "$guest_key"
          fi
          chmod 0600 "$guest_key"
          guest_pub_b64="$(base64 -w0 "$guest_key.pub")"

          ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
            "$dc_user@172.17.60.30" 'bash -s --' "$guest_pub_b64" >"$work/result" <<'DC_BOOT'
          set -euo pipefail
          test "$(hostname -s)" = layersentry1
          ip -4 -o addr show dev enp6s18 | grep -Eq '(^|[[:space:]])172\.17\.60\.30/26([[:space:]]|$)'
          if test "$(id -u)" -eq 0; then SUDO=''; else sudo -n true; SUDO='sudo -n'; fi
          test "$($SUDO id -u)" = 0
          pub64="$1"
          source_vm=29
          mapfile -t sf < <(sudo -n -u oneadmin onevm show "$source_vm" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); print(*[(r.findtext(p) or "").strip() for p in ("NAME","STATE","TEMPLATE/NIC/IP")],sep="\n")')
          test "${sf[0]}" = ls-dr-v2-qual-alpine-20260928
          test "${sf[1]}" = 8
          test "${sf[2]}" = 10.50.10.126
          recovery=/var/lib/layersentry/replication-v2-failback/filecow/recovery/ls-rv2-dc-vm29-g2
          $SUDO test -f "$recovery/disk-os.qcow2"
          $SUDO test -f "$recovery/disk-data.qcow2"
          $SUDO qemu-img check -q "$recovery/disk-os.qcow2"
          $SUDO qemu-img check -q "$recovery/disk-data.qcow2"
          osid="$(sudo -n -u oneadmin oneimage list --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); n="layersentry-rv2-dc-vm29-g2-os"; print(next((x.findtext("ID") or "" for x in r.findall("IMAGE") if (x.findtext("NAME") or "")==n),""))')"
          dataid="$(sudo -n -u oneadmin oneimage list --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); n="layersentry-rv2-dc-vm29-g2-data"; print(next((x.findtext("ID") or "" for x in r.findall("IMAGE") if (x.findtext("NAME") or "")==n),""))')"
          if test -n "$osid" && test -n "$dataid"; then
            mapfile -t oi < <(sudo -n -u oneadmin oneimage show "$osid" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); print(*[(r.findtext(p) or "").strip() for p in ("NAME","STATE","TYPE","SOURCE")],sep="\n")')
            mapfile -t di < <(sudo -n -u oneadmin oneimage show "$dataid" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); print(*[(r.findtext(p) or "").strip() for p in ("NAME","STATE","TYPE","SOURCE")],sep="\n")')
            test "${oi[0]}" = layersentry-rv2-dc-vm29-g2-os && { test "${oi[1]}" = 1 || test "${oi[1]}" = 2; } && test "${oi[2]}" = 0 && test -n "${oi[3]}" && $SUDO test -f "${oi[3]}"
            test "${di[0]}" = layersentry-rv2-dc-vm29-g2-data && { test "${di[1]}" = 1 || test "${di[1]}" = 2; } && test "${di[2]}" = 2 && test -n "${di[3]}" && $SUDO test -f "${di[3]}"
            sudo -n -u oneadmin qemu-img check -q "${oi[3]}"
            sudo -n -u oneadmin qemu-img check -q "${di[3]}"
            tvm=$(mktemp)
            trap 'rm -f -- "$tvm"' EXIT
            echo "REPLICATION_V2_FAILBACK_IMAGES_REUSED OS_IMAGE_ID=$osid DATA_IMAGE_ID=$dataid" >&2
          else
          test -z "$osid" && test -z "$dataid"
          stage=/var/lib/one/datastores/1/.layersentry-rv2-import
          $SUDO install -d -o oneadmin -g oneadmin -m 0750 "$stage"
          local_stage=/var/tmp/layersentry-rv2-dc-vm29-g2-retry6
          os_raw="${local_stage}-os.raw"
          data_raw="${local_stage}-data.raw"
          os_qcow_local="${local_stage}-os.qcow2"
          data_qcow_local="${local_stage}-data.qcow2"
          os_qcow="$stage/layersentry-rv2-dc-vm29-g2-retry6-os.qcow2"
          data_qcow="$stage/layersentry-rv2-dc-vm29-g2-retry6-data.qcow2"
          test ! -e "$os_raw" && test ! -e "$data_raw" && test ! -e "$os_qcow_local" && test ! -e "$data_qcow_local"
          $SUDO test ! -e "$os_qcow" && $SUDO test ! -e "$data_qcow"
          $SUDO qemu-img convert -f qcow2 -O raw "$recovery/disk-os.qcow2" "$os_raw"
          $SUDO qemu-img convert -f qcow2 -O raw "$recovery/disk-data.qcow2" "$data_raw"
          os_sha="$($SUDO sha256sum "$os_raw" | awk '{print $1}')"
          data_sha="$($SUDO sha256sum "$data_raw" | awk '{print $1}')"
          test "$os_sha" = a6032ea4093b54e91eda29439c4bad8344187f193fb4beb8e48890dfa38146f5
          test "$data_sha" = cb838ca25e9458f70594df25780103660ba2963eb308b8066cc6ef213e8dd608
          old_records="$($SUDO debugfs -R 'cat /generations/20260927T234524Z.records' "$data_raw" 2>/dev/null | sha256sum | awk '{print $1}')"
          old_payload="$($SUDO debugfs -R 'cat /generations/20260927T234524Z.payload' "$data_raw" 2>/dev/null | sha256sum | awk '{print $1}')"
          new_records="$($SUDO debugfs -R 'cat /generations/20260928T000000Z-dr-failback.records' "$data_raw" 2>/dev/null | sha256sum | awk '{print $1}')"
          new_payload="$($SUDO debugfs -R 'cat /generations/20260928T000000Z-dr-failback.payload' "$data_raw" 2>/dev/null | sha256sum | awk '{print $1}')"
          test "$old_records" = 9b3372cc6e663cae91df68d687d71a0470b10badbfb7ce60fb67cc6d230b4f0d
          test "$old_payload" = ea57d829b452e3ea965d14b8942e00080a7692d462629a951507f1f4a0bda980
          test "$new_records" = a0c957a52e9d46da1476def6bffdf8d086dca73e8d75d84513a5e675d976eff7
          test "$new_payload" = 2ca76f41f6968d91cc8d65693c1a0e8bd94843b50ad1434518879f8cb59c4d10
          echo "REPLICATION_V2_FAILBACK_RECOVERY_READBACK OS_SHA256=$os_sha DATA_SHA256=$data_sha OLD_RECORDS_SHA256=$old_records OLD_PAYLOAD_SHA256=$old_payload NEW_RECORDS_SHA256=$new_records NEW_PAYLOAD_SHA256=$new_payload" >&2
          $SUDO qemu-img convert -f raw -O qcow2 -o compat=1.1,lazy_refcounts=off "$os_raw" "$os_qcow_local"
          $SUDO qemu-img convert -f raw -O qcow2 -o compat=1.1,lazy_refcounts=off "$data_raw" "$data_qcow_local"
          $SUDO chown oneadmin:oneadmin "$os_qcow_local" "$data_qcow_local"
          $SUDO chmod 0640 "$os_qcow_local" "$data_qcow_local"
          sudo -n -u oneadmin cp --sparse=always "$os_qcow_local" "$os_qcow"
          sudo -n -u oneadmin cp --sparse=always "$data_qcow_local" "$data_qcow"
          sudo -n -u oneadmin chmod 0640 "$os_qcow" "$data_qcow"
          sudo -n -u oneadmin test -r "$os_qcow"
          sudo -n -u oneadmin test -r "$data_qcow"
          sudo -n -u oneadmin qemu-img info "$os_qcow" >/dev/null
          sudo -n -u oneadmin qemu-img info "$data_qcow" >/dev/null
