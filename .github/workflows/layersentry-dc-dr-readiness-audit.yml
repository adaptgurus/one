          command="set -eu; ip link set eth0 up; ip addr flush dev eth0 scope global || true; ip addr add $ip/$prefix dev eth0; $route mkdir -p /etc/network /root/.ssh; printf 'auto lo\\niface lo inet loopback\\n\\nauto eth0\\niface eth0 inet static\\n  address $ip\\n  netmask $mask\\n$gateway_line' > /etc/network/interfaces; printf '%s' '$pub64' | base64 -d > /root/.ssh/authorized_keys; chmod 0700 /root/.ssh; chmod 0600 /root/.ssh/authorized_keys; command -v rc-service >/dev/null 2>&1 && rc-service sshd restart || true; sync"
          request=$(python3 -c 'import json,sys; print(json.dumps({"execute":"guest-exec","arguments":{"path":"/bin/sh","arg":["-c",sys.argv[1]],"capture-output":True}}))' "$command")
          response=$(virsh -c qemu:///system qemu-agent-command "$domain" "$request")
