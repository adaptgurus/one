name: LayerSentry DC-DR readiness audit

on:
  workflow_dispatch:
  push:
    branches: [ops/layersentrydr-probe-20260927]
    paths: [.github/workflows/layersentry-dc-dr-readiness-audit.yml]

permissions:
  contents: read

concurrency:
  group: layersentry-dc-dr-readiness-audit
  cancel-in-progress: false

jobs:
  dc-readonly:
    runs-on: [self-hosted, Linux, X64, layersentryol7]
    timeout-minutes: 10
    steps:
      - name: Inventory exact DC through the authorized bastion
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = layersentryol7
          test "$(hostname -s)" = layersentryol7
          test "$(id -u)" = 0
          ip -4 -o addr show | grep -Eq '(^|[[:space:]])172\.17\.60\.36/26([[:space:]]|$)'

          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          chmod 0700 "$work"
          scan="$(ssh-keyscan -T 5 -t ed25519 172.17.60.30 2>/dev/null)"
          test "$(printf '%s\n' "$scan" | grep -c '^172\.17\.60\.30 ssh-ed25519 ')" -eq 1
          fingerprint="$(printf '%s\n' "$scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:6afuQP+psnYc8jzRX6lgK3zi4vZpPDcqLat0vgxwcDw'
          printf '%s\n' "$scan" >"$work/known_hosts"
          chmod 0600 "$work/known_hosts"

          key=''
          user=''
          while IFS= read -r candidate; do
            test -f "$candidate" || continue
            test "$(stat -c '%a' "$candidate")" -le 600 || continue
            ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || continue
            test "$(ssh-keygen -lf "$candidate" -E sha256 | awk '{print $2}')" = 'SHA256:5kGypCbn+e25po9b1DRvS6kxaGc+iQuZH4UE1YfDqNA' || continue
            for candidate_user in layersentry-deploy root; do
              if ssh -i "$candidate" -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" \
                -o ConnectTimeout=5 "$candidate_user@172.17.60.30" \
                'test "$(hostname -s)" = layersentry1 && { test "$(id -u)" -eq 0 || sudo -n true; }' \
                >/dev/null 2>&1; then
                key="$candidate"
                user="$candidate_user"
                break 2
              fi
            done
          done < <(find /root/.ssh /home /opt -xdev -type f -perm -u+r ! -perm /077 \
            ! -name '*.pub' ! -name '*known_hosts*' 2>/dev/null | sort -u)

          test -n "$key"
          echo "DC_KEY_AUTH=PASS user=$user key_fingerprint=$(ssh-keygen -lf "$key" -E sha256 | awk '{print $2}')"
          ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" \
            "$user@172.17.60.30" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(hostname -s)" = layersentry1
          if test "$(id -u)" -eq 0; then SUDO=''; else sudo -n true; SUDO='sudo -n'; fi
          echo "TARGET_DC_OK host=$(hostname -s) uid=$($SUDO id -u)"
          echo DATABASE_PACKAGES
          $SUDO rpm -qa | grep -Ei '^(mariadb|mysql)' | sort || true
          echo DATABASE_SERVICE
          $SUDO systemctl is-active mariadb || true
          $SUDO systemctl is-active mysql || true
          echo DATABASE_RUNTIME
          $SUDO mariadb --version 2>/dev/null || $SUDO mysql --version 2>/dev/null || true
          $SUDO mariadb --batch --skip-column-names -e \
            "SELECT CONCAT('engine_version=',@@version), CONCAT('version_comment=',@@version_comment), CONCAT('port=',@@port); SHOW GLOBAL STATUS WHERE Variable_name IN ('wsrep_cluster_size','wsrep_cluster_status','wsrep_local_state_comment','wsrep_ready');" \
            2>/dev/null || true
          echo DATABASE_LISTENERS
          $SUDO ss -lntp | grep -E ':(3306|3307|3310)([[:space:]]|$)' || true
          echo OPENNEBULA
          sudo -n -u oneadmin oneversion || true
          sudo -n -u oneadmin onehost list
          sudo -n -u oneadmin onevm list
          sudo -n -u oneadmin onevnet list
          sudo -n -u oneadmin onedatastore list
          echo IMAGE_INVENTORY
          sudo -n -u oneadmin oneimage list -l ID,NAME,USER,TYPE,REGTIME,STAT,RVMS
          echo BACKUP_DATASTORE_100
          sudo -n -u oneadmin onedatastore show 100 --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); paths=("ID","NAME","TYPE","DS_MAD","TM_MAD","TEMPLATE/RESTIC_COMPRESSION","TEMPLATE/RSYNC_HOST","TEMPLATE/BRIDGE_LIST"); print(" ".join(f"{p.replace(chr(47),chr(95))}={((r.findtext(p) or str(chr(45))).strip())!r}" for p in paths))'
          echo IMAGE_DETAILS
          for image_id in $(sudo -n -u oneadmin oneimage list --no-header -l ID 2>/dev/null || true); do
            sudo -n -u oneadmin oneimage show "$image_id" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); paths=("ID","NAME","STATE","TYPE","REGTIME","TEMPLATE/FORMAT","TEMPLATE/SIZE","TEMPLATE/MD5","TEMPLATE/SHA1"); print(" ".join(f"{p.replace(chr(47),chr(95))}={((r.findtext(p) or str(chr(45))).strip())!r}" for p in paths))'
          done
          echo NETWORK
          $SUDO ip -4 -o addr show
          $SUDO ip -d link show type bridge
          $SUDO ip -4 route show
          echo STORAGE
          $SUDO findmnt -rn -o TARGET,SOURCE,FSTYPE,OPTIONS /var/lib/one /var/lib/one/datastores 2>/dev/null || true
          $SUDO df -hT /var/lib/one/datastores
          echo LAYERSENTRY_ENDPOINTS
          $SUDO ss -lntp | grep -E ':(2616|2617|2633|9444)([[:space:]]|$)' || true
          REMOTE

      - name: Reassert read-only completion
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = layersentryol7
          test "$(hostname -s)" = layersentryol7
          ip -4 -o addr show | grep -Eq '(^|[[:space:]])172\.17\.60\.36/26([[:space:]]|$)'
          echo READ_ONLY_AUDIT_COMPLETE

  replication-prepare:
    if: contains(github.event.head_commit.message, '[replication-prepare]')
    runs-on: [self-hosted, Linux, X64, layersentryol7]
    timeout-minutes: 30
    steps:
      - name: Create isolated two-disk qualification VM and payload
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = layersentryol7
          test "$(hostname -s)" = layersentryol7
          test "$(id -u)" = 0
          ip -4 -o addr show | grep -Eq '(^|[[:space:]])172\.17\.60\.36/26([[:space:]]|$)'

          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          chmod 0700 "$work"
          scan="$(ssh-keyscan -T 5 -t ed25519 172.17.60.30 2>/dev/null)"
          test "$(printf '%s\n' "$scan" | grep -c '^172\.17\.60\.30 ssh-ed25519 ')" -eq 1
          test "$(printf '%s\n' "$scan" | ssh-keygen -lf - -E sha256 | awk '{print $2}')" = 'SHA256:6afuQP+psnYc8jzRX6lgK3zi4vZpPDcqLat0vgxwcDw'
          printf '%s\n' "$scan" >"$work/dc_known_hosts"
          chmod 0600 "$work/dc_known_hosts"

          dc_key=''
          dc_user=''
          while IFS= read -r candidate; do
            test -f "$candidate" || continue
            test "$(stat -c '%a' "$candidate")" -le 600 || continue
            ssh-keygen -y -f "$candidate" >/dev/null 2>&1 || continue
            test "$(ssh-keygen -lf "$candidate" -E sha256 | awk '{print $2}')" = 'SHA256:5kGypCbn+e25po9b1DRvS6kxaGc+iQuZH4UE1YfDqNA' || continue
            for candidate_user in layersentry-deploy root; do
              if ssh -i "$candidate" -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
                -o ConnectTimeout=5 "$candidate_user@172.17.60.30" \
                'test "$(hostname -s)" = layersentry1 && { test "$(id -u)" -eq 0 || sudo -n true; }' \
                >/dev/null 2>&1; then
                dc_key="$candidate"
                dc_user="$candidate_user"
                break 2
              fi
            done
          done < <(find /root/.ssh /home /opt -xdev -type f -perm -u+r ! -perm /077 \
            ! -name '*.pub' ! -name '*known_hosts*' 2>/dev/null | sort -u)
          test -n "$dc_key"

          guest_key=/root/.ssh/layersentry-replication-v2-qual-20260928
          if test ! -f "$guest_key"; then
            ssh-keygen -q -t ed25519 -N '' -C layersentry-replication-v2-qual-20260928 -f "$guest_key"
            chmod 0600 "$guest_key"
          fi
          guest_pub_b64="$(base64 -w0 "$guest_key.pub")"

          result="$work/result"
          ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
            "$dc_user@172.17.60.30" 'bash -s --' "$guest_pub_b64" >"$result" <<'REMOTE'
          set -euo pipefail
          test "$(hostname -s)" = layersentry1
          ip -4 -o addr show dev enp6s18 | grep -Eq '(^|[[:space:]])172\.17\.60\.30/26([[:space:]]|$)'
          if test "$(id -u)" -eq 0; then SUDO=''; else sudo -n true; SUDO='sudo -n'; fi
          test "$($SUDO id -u)" = 0
          guest_pub="$(printf '%s' "$1" | base64 -d)"
          image_template=''
          vm_template=''
          trap 'test -z "$image_template" || rm -f -- "$image_template"; test -z "$vm_template" || rm -f -- "$vm_template"' EXIT
          data_name=ls-dr-v2-qual-alpine-20260928-data
          vm_name=ls-dr-v2-qual-alpine-20260928
          base_image_id=0
          sudo -n -u oneadmin oneimage show "$base_image_id" --xml >/dev/null
          data_id="$(sudo -n -u oneadmin oneimage list --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); n=sys.argv[1]; print(next((x.findtext("ID") or "" for x in r.findall("IMAGE") if (x.findtext("NAME") or "")==n),""))' "$data_name")"
          if test -z "$data_id"; then
            image_template="$(mktemp)"
            cat >"$image_template" <<IMAGE
          NAME = "$data_name"
          TYPE = "DATABLOCK"
          SIZE = "2048"
          FORMAT = "qcow2"
          DEV_PREFIX = "vd"
          DESCRIPTION = "Disposable LayerSentry Replication v2 qualification data disk"
          IMAGE
            chmod 0644 "$image_template"
            data_id="$(sudo -n -u oneadmin oneimage create -d 1 "$image_template" | awk '{print $NF}')"
          fi
          for _ in $(seq 1 120); do
            state="$(sudo -n -u oneadmin oneimage show "$data_id" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; print(E.parse(sys.stdin).getroot().findtext("STATE") or "")')"
            { test "$state" = 1 || test "$state" = 2; } && break
            test "$state" = 5 && { echo DATA_IMAGE_ERROR >&2; exit 51; }
            sleep 2
          done
          test "$state" = 1 || test "$state" = 2
          vm_id="$(sudo -n -u oneadmin onevm list --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); n=sys.argv[1]; print(next((x.findtext("ID") or "" for x in r.findall("VM") if (x.findtext("NAME") or "")==n),""))' "$vm_name")"
          if test -z "$vm_id"; then
            vm_template="$(mktemp)"
            cat >"$vm_template" <<VM
          NAME = "$vm_name"
          CPU = "2"
          VCPU = "2"
          MEMORY = "4096"
          HYPERVISOR = "kvm"
          DISK = [ IMAGE_ID = "$base_image_id" ]
          DISK = [ IMAGE_ID = "$data_id" ]
          NIC = [ NETWORK_ID = "0", MODEL = "virtio" ]
          OS = [ ARCH = "x86_64", MACHINE = "q35" ]
          CONTEXT = [ NETWORK = "YES", NETCFG_TYPE = "nm", SET_HOSTNAME = "$vm_name", GROW_FS = "/", SSH_PUBLIC_KEY = "$guest_pub" ]
          VM
            chmod 0644 "$vm_template"
            vm_id="$(sudo -n -u oneadmin onevm create "$vm_template" | awk '{print $NF}')"
          fi
          for _ in $(seq 1 180); do
            read -r state lcm ip < <(sudo -n -u oneadmin onevm show "$vm_id" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); print(r.findtext("STATE") or "",r.findtext("LCM_STATE") or "",r.findtext("TEMPLATE/NIC/IP") or "")')
            test "$state" = 3 && test "$lcm" = 3 && test -n "$ip" && break
            test "$state" = 7 && { echo VM_ERROR >&2; exit 52; }
            sleep 2
          done
          test "$state" = 3
          test "$lcm" = 3
          test -n "$ip"
          printf 'VM_ID=%s\nDATA_IMAGE_ID=%s\nIP=%s\n' "$vm_id" "$data_id" "$ip"
          REMOTE

          vm_id="$(awk -F= '$1=="VM_ID" {print $2}' "$result")"
          data_id="$(awk -F= '$1=="DATA_IMAGE_ID" {print $2}' "$result")"
          vm_ip="$(awk -F= '$1=="IP" {print $2}' "$result")"
          test "$vm_id" -ge 24
          test "$data_id" -ge 4
          test -n "$vm_ip"
          proxy="ssh -i $dc_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$work/dc_known_hosts -W %h:%p $dc_user@172.17.60.30"
          guest_user=''
          guest_tcp="$(ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
            "$dc_user@172.17.60.30" 'bash -s --' "$vm_ip" <<'PROBE'
          if timeout 3 bash -c "</dev/tcp/$1/22" >/dev/null 2>&1; then printf PASS; else printf FAIL; fi
          PROBE
          )"
          if test "$guest_tcp" = FAIL; then
            ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
              "$dc_user@172.17.60.30" 'bash -s --' "$vm_id" "$vm_ip" "$guest_pub_b64" <<'QGAREPAIR'
          set -euo pipefail
          test "$(hostname -s)" = layersentry1
          ip -4 -o addr show dev enp6s18 | grep -Eq '(^|[[:space:]])172\.17\.60\.30/26([[:space:]]|$)'
          if test "$(id -u)" -eq 0; then SUDO=''; else sudo -n true; SUDO='sudo -n'; fi
          test "$($SUDO id -u)" = 0
          vm_id="$1"
          vm_ip="$2"
          guest_pub_b64="$3"
          read -r observed_name observed_state observed_lcm observed_ip deploy_id hypervisor network_mask gateway < <(
            sudo -n -u oneadmin onevm show "$vm_id" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); print(r.findtext("NAME") or "",r.findtext("STATE") or "",r.findtext("LCM_STATE") or "",r.findtext("TEMPLATE/NIC/IP") or "",r.findtext("DEPLOY_ID") or "",r.findtext("HISTORY_RECORDS/HISTORY/HOSTNAME") or "",r.findtext("TEMPLATE/NIC/NETWORK_MASK") or "",r.findtext("TEMPLATE/NIC/GATEWAY") or "")'
          )
          test "$observed_name" = ls-dr-v2-qual-alpine-20260928
          test "$observed_state" = 3 && test "$observed_lcm" = 3
          test "$observed_ip" = "$vm_ip"
          test -n "$deploy_id" && test -n "$hypervisor" && test -n "$network_mask" && test -n "$gateway"
          prefix="$(python3 -c 'import ipaddress,sys; print(ipaddress.IPv4Network("0.0.0.0/"+sys.argv[1]).prefixlen)' "$network_mask")"
          test "$prefix" -ge 8 && test "$prefix" -le 30
          sudo -n -u oneadmin ssh -o BatchMode=yes -o ConnectTimeout=5 "$hypervisor" 'bash -s --' \
            "$deploy_id" "$vm_ip" "$prefix" "$network_mask" "$gateway" "$guest_pub_b64" <<'HYPERVISOR_REPAIR'
          set -euo pipefail
          domain="$1"
          vm_ip="$2"
          prefix="$3"
          network_mask="$4"
          gateway="$5"
          guest_pub_b64="$6"
          virsh -c qemu:///system dominfo "$domain" | grep -q '^State:[[:space:]]*running$'
          command="set -eu; ip link set eth0 up; ip addr flush dev eth0 scope global || true; ip addr add $vm_ip/$prefix dev eth0; ip route replace default via $gateway dev eth0; mkdir -p /etc/network /root/.ssh; printf 'auto lo\\niface lo inet loopback\\n\\nauto eth0\\niface eth0 inet static\\n  address $vm_ip\\n  netmask $network_mask\\n  gateway $gateway\\n' > /etc/network/interfaces; printf '%s' '$guest_pub_b64' | base64 -d > /root/.ssh/authorized_keys; chmod 0700 /root/.ssh; chmod 0600 /root/.ssh/authorized_keys; command -v rc-service >/dev/null 2>&1 && rc-service sshd restart || true; sync"
          request="$(python3 -c 'import json,sys; print(json.dumps({"execute":"guest-exec","arguments":{"path":"/bin/sh","arg":["-c",sys.argv[1]],"capture-output":True}}))' "$command")"
          response="$(virsh -c qemu:///system qemu-agent-command "$domain" "$request")"
          pid="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["return"]["pid"])')"
          test "$pid" -ge 1
          for _ in $(seq 1 30); do
            status="$(virsh -c qemu:///system qemu-agent-command "$domain" "{\"execute\":\"guest-exec-status\",\"arguments\":{\"pid\":$pid}}")"
            read -r exited exitcode < <(printf '%s' "$status" | python3 -c 'import json,sys; r=json.load(sys.stdin)["return"]; print(str(bool(r.get("exited"))).lower(),r.get("exitcode",-1))')
            test "$exited" = true && break
            sleep 1
          done
          test "$exited" = true && test "$exitcode" = 0
          HYPERVISOR_REPAIR
          QGAREPAIR
            for _ in $(seq 1 30); do
              guest_tcp="$(ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
                "$dc_user@172.17.60.30" 'bash -s --' "$vm_ip" <<'PROBE_AFTER_REPAIR'
              if timeout 3 bash -c "</dev/tcp/$1/22" >/dev/null 2>&1; then printf PASS; else printf FAIL; fi
              PROBE_AFTER_REPAIR
              )"
              test "$guest_tcp" = PASS && break
              sleep 2
            done
          fi
          if test "$guest_tcp" = PASS; then
            for candidate_user in root layersentry-deploy rocky cloud-user almalinux centos; do
              if timeout 8 ssh -i "$guest_key" -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$work/guest_known_hosts" \
                -o "ProxyCommand=$proxy" -o ConnectTimeout=5 "$candidate_user@$vm_ip" \
                '{ test "$(id -u)" -eq 0 || sudo -n true; }' >/dev/null 2>&1; then
                guest_user="$candidate_user"
                break 2
              fi
            done
          fi
          if test -z "$guest_user"; then
            echo "GUEST_SSH_NOT_READY VM_ID=$vm_id IP=$vm_ip" >&2
            set +e
            ssh -i "$dc_key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/dc_known_hosts" \
              "$dc_user@172.17.60.30" 'bash -s --' "$vm_id" "$vm_ip" <<'DIAG' >&2
          set -euo pipefail
          test "$(hostname -s)" = layersentry1
          if test "$(id -u)" -eq 0; then SUDO=''; else sudo -n true; SUDO='sudo -n'; fi
          vm_id="$1"
          vm_ip="$2"
          echo "DC_TO_GUEST_ROUTE=$(ip route get "$vm_ip" | head -1)"
          if ping -c 1 -W 2 "$vm_ip" >/dev/null 2>&1; then echo DC_TO_GUEST_ICMP=PASS; else echo DC_TO_GUEST_ICMP=FAIL; fi
          if timeout 3 bash -c "</dev/tcp/$vm_ip/22" >/dev/null 2>&1; then echo DC_TO_GUEST_TCP22=PASS; else echo DC_TO_GUEST_TCP22=FAIL; fi
          sudo -n -u oneadmin onevm show "$vm_id" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); paths=("ID","NAME","STATE","LCM_STATE","DEPLOY_ID","HISTORY_RECORDS/HISTORY/HID","TEMPLATE/NIC/IP","TEMPLATE/CONTEXT/NETWORK","TEMPLATE/CONTEXT/TARGET","TEMPLATE/CONTEXT/SSH_PUBLIC_KEY"); print(" ".join(f"{p.replace(chr(47),chr(95))}={((r.findtext(p) or str(chr(45))).strip())!r}" for p in paths))'
          sudo -n -u oneadmin oneimage show 0 --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); paths=("ID","NAME","STATE","TEMPLATE/FORMAT","TEMPLATE/DEV_PREFIX","TEMPLATE/DRIVER","TEMPLATE/SIZE","TEMPLATE/OS_DISTRIBUTION","TEMPLATE/OS_VERSION","TEMPLATE/USERNAME"); print("BASE_IMAGE "+" ".join(f"{p.replace(chr(47),chr(95))}={((r.findtext(p) or str(chr(45))).strip())!r}" for p in paths))'
          read -r deploy_id hypervisor < <(sudo -n -u oneadmin onevm show "$vm_id" --xml | python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.stdin).getroot(); print(r.findtext("DEPLOY_ID") or "",r.findtext("HISTORY_RECORDS/HISTORY/HOSTNAME") or "")')
          test -n "$deploy_id" && test -n "$hypervisor"
          sudo -n -u oneadmin ssh -o BatchMode=yes -o ConnectTimeout=5 "$hypervisor" 'bash -s --' "$deploy_id" "$vm_id" <<'HYPERVISOR'
          set -euo pipefail
          deploy_id="$1"
          vm_id="$2"
          domain="$deploy_id"
          virsh -c qemu:///system dominfo "$domain" >/dev/null 2>&1 || domain="one-$vm_id"
          echo "HYPERVISOR_DOMAIN=$domain"
          virsh -c qemu:///system dominfo "$domain"
          virsh -c qemu:///system domiflist "$domain"
          virsh -c qemu:///system domifaddr "$domain" --source agent 2>/dev/null || true
          virsh -c qemu:///system domifaddr "$domain" --source lease 2>/dev/null || true
          virsh -c qemu:///system domifaddr "$domain" --source arp 2>/dev/null || true
          virsh -c qemu:///system domblklist "$domain" --details
          HYPERVISOR
          DIAG
            exit 61
          fi
          test -n "$guest_user"
          guest_ssh=(ssh -i "$guest_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/guest_known_hosts" \
            -o "ProxyCommand=$proxy" "$guest_user@$vm_ip")
          payload="$("${guest_ssh[@]}" 'set -eu; if test "$(id -u)" -eq 0; then SUDO=""; else SUDO="sudo -n"; fi; $SUDO lsblk -dn -o NAME,TYPE | grep -Eq "^vdb[[:space:]]+disk$"; if ! $SUDO blkid /dev/vdb >/dev/null 2>&1; then $SUDO mkfs.ext4 -F /dev/vdb >/dev/null; fi; $SUDO mkdir -p /srv/layersentry-data/generations; uuid=$($SUDO blkid -s UUID -o value /dev/vdb); grep -q "UUID=$uuid " /etc/fstab || echo "UUID=$uuid /srv/layersentry-data ext4 defaults,nofail 0 2" | $SUDO tee -a /etc/fstab >/dev/null; $SUDO mount /srv/layersentry-data 2>/dev/null || true; test "$(findmnt -n -o SOURCE /srv/layersentry-data)" = /dev/vdb; generation=$(date -u +%Y%m%dT%H%M%SZ); printf "%s\n" "layersentry-replication-v2" "source=dc" "vm_id='"$vm_id"'" "generation=$generation" | $SUDO tee "/srv/layersentry-data/generations/$generation.records" >/dev/null; $SUDO dd if=/dev/urandom of="/srv/layersentry-data/generations/$generation.payload" bs=1M count=64 status=none; $SUDO sha256sum "/srv/layersentry-data/generations/$generation.records" "/srv/layersentry-data/generations/$generation.payload" | $SUDO tee "/srv/layersentry-data/generations/$generation.sha256" >/dev/null; $SUDO sync; $SUDO sha256sum -c "/srv/layersentry-data/generations/$generation.sha256" >/dev/null; $SUDO sha256sum "/srv/layersentry-data/generations/$generation.records" "/srv/layersentry-data/generations/$generation.payload"')"
          records_sha="$(printf '%s\n' "$payload" | awk '$2 ~ /\.records$/ {print $1}')"
          payload_sha="$(printf '%s\n' "$payload" | awk '$2 ~ /\.payload$/ {print $1}')"
          test "${#records_sha}" -eq 64
          test "${#payload_sha}" -eq 64
          echo "REPLICATION_V2_SOURCE_READY VM_ID=$vm_id DATA_IMAGE_ID=$data_id IP=$vm_ip DATA_DEVICE=/dev/vdb RECORDS_SHA256=$records_sha PAYLOAD_SHA256=$payload_sha"
