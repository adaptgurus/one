name: Manoj OneSwap Ruby Raw Transport Diagnostic

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-oneswap-ruby-raw-transport-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: manoj-oneswap-ruby-raw-transport-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - name: Bind Manoj and preserve stopped source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          if($vm.State -ne 'Off'){throw "Source must remain Off: $($vm.State)"}
          if($n -ne 0){throw 'Unexpected checkpoint'}
          Write-Host 'RUBY_RAW_TRANSPORT_SOURCE_GATE=PASS'

      - name: Prepare restricted appliance key
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-ruby-raw-transport.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute raw changed-range read through OneSwap Ruby SSH transport
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          cat >/tmp/ls-ruby-raw-transport.rb <<'RUBY'
          require 'json'
          require 'yaml'
          require '/usr/lib/one/ruby/cli/one_helper/hyperv_helper'
          cfg=YAML.load_file('/etc/layersentry/oneswap/manoj-qual.yaml') || {}
          normalized={}
          cfg.each{|k,v| normalized[k.to_s.sub(/^:/,'').to_sym]=v}
          normalized[:hyperv_connection]='manoj-qual'
          profile=OneSwapHyperV::ConnectionProfile.from_options(normalized)
          transport=OneSwapHyperV::SSHTransport.new(profile)
          payload=<<~'POWERSHELL'
            $ErrorActionPreference='Stop'
            $ProgressPreference='SilentlyContinue'
            [Console]::OutputEncoding=[Text.Encoding]::UTF8
            $path='C:\LayerSentryLab\qualification\ls-migration-source-test\os.vhdx'
            $rct='rctX:e0cf6beb:4aad:4f4d:a8c0:8e5ef750b639:00000006'
            $vhd=Get-VHD -Path $path -ErrorAction Stop
            if([bool]$vhd.Attached){throw 'source VHDX unexpectedly attached before Ruby transport diagnostic'}
            $virtualSize=[int64]$vhd.Size
            $svc=Get-WmiObject -Namespace root/virtualization/v2 -Class Msvm_ImageManagementService
            $ranges=New-Object System.Collections.Generic.List[object]
            $offset=[int64]0
            $chunk=[int64](512*1024*1024)
            while($offset -lt $virtualSize){
              $remaining=$virtualSize-$offset
              $length=[Math]::Min($chunk,$remaining)
              $result=$svc.GetVirtualDiskChanges($path,$rct,'',$offset,$length)
              if($result.ReturnValue -ne 0){throw "GetVirtualDiskChanges failed code=$($result.ReturnValue) offset=$offset"}
              for($i=0;$i -lt @($result.ChangedByteOffsets).Count;$i++){
                $ranges.Add([pscustomobject]@{Offset=[int64]$result.ChangedByteOffsets[$i];Length=[int64]$result.ChangedByteLengths[$i]})
              }
              $processed=[int64]$result.ProcessedByteLength
              if($processed -le 0){throw 'GetVirtualDiskChanges returned zero processed bytes'}
              $offset += $processed
            }
            $mount=$null
            $source=$null
            $handle=$null
            try {
              $mount=Mount-VHD -Path $path -ReadOnly -NoDriveLetter -Passthru -ErrorAction Stop
              $diskObj=$mount | Get-Disk -ErrorAction Stop
              if(-not ('LayerSentry.RawDiskNativeRubyDiag' -as [type])){
                Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          using Microsoft.Win32.SafeHandles;
          namespace LayerSentry {
              public static class RawDiskNativeRubyDiag {
                  [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
                  public static extern SafeFileHandle CreateFileW(
                      string lpFileName,
                      uint dwDesiredAccess,
                      uint dwShareMode,
                      IntPtr lpSecurityAttributes,
                      uint dwCreationDisposition,
                      uint dwFlagsAndAttributes,
                      IntPtr hTemplateFile);
              }
          }
          "@
              }
              $slash=[string][char]92
              $rawPath=$slash+$slash+'.'+$slash+'PhysicalDrive'+$diskObj.Number
              $handle=[LayerSentry.RawDiskNativeRubyDiag]::CreateFileW($rawPath,[uint32]2147483648,[uint32]3,[IntPtr]::Zero,[uint32]3,[uint32]0,[IntPtr]::Zero)
              if($handle.IsInvalid){
                $win32=[Runtime.InteropServices.Marshal]::GetLastWin32Error()
                throw "CreateFileW failed for $rawPath win32=$win32"
              }
              $source=[IO.FileStream]::new($handle,[IO.FileAccess]::Read)
              $buffer=New-Object byte[] (1024*1024)
              $readTotal=[int64]0
              foreach($range in $ranges){
                $source.Seek([int64]$range.Offset,[IO.SeekOrigin]::Begin) | Out-Null
                $remaining=[int64]$range.Length
                while($remaining -gt 0){
                  $want=[int][Math]::Min($buffer.Length,$remaining)
                  $read=$source.Read($buffer,0,$want)
                  if($read -le 0){throw 'unexpected EOF during Ruby transport raw read'}
                  $readTotal += $read
                  $remaining -= $read
                }
              }
              [pscustomobject]@{
                Status='PASS'
                Ranges=$ranges.Count
                ChangedBytes=$readTotal
                DiskNumber=$diskObj.Number
                CanSeek=$source.CanSeek
              } | ConvertTo-Json -Compress
            }
            finally {
              if($null -ne $source){$source.Dispose(); $source=$null; $handle=$null}
              elseif($null -ne $handle){$handle.Dispose(); $handle=$null}
              if($null -ne $mount){Dismount-VHD -Path $path -ErrorAction SilentlyContinue}
            }
          POWERSHELL
          encoded=OneSwapHyperV::Util.powershell_encoded(payload)
          puts "RUBY_RAW_TRANSPORT_ENCODED_BYTES=#{encoded.bytesize}"
          puts "RUBY_RAW_TRANSPORT_THRESHOLD=#{OneSwapHyperV::SSHTransport::POWERSHELL_ENCODED_COMMAND_MAX_BYTES}"
          result=transport.powershell_json(payload, timeout: 180)
          puts "RUBY_RAW_TRANSPORT_RESULT=#{JSON.generate(result)}"
          raise "raw transport result failed" unless result['Status']=='PASS'
          raise "unexpected changed byte count" unless result['ChangedBytes'].to_i==12140544
          puts 'ONESWAP_RUBY_RAW_TRANSPORT=PASS'
          RUBY
          timeout --signal=TERM --kill-after=10s 240s ruby /tmp/ls-ruby-raw-transport.rb
          rc=$?
          rm -f /tmp/ls-ruby-raw-transport.rb
          exit $rc
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw "OneSwap Ruby raw transport diagnostic failed rc=$LASTEXITCODE"}

      - name: Re-prove source invariant
        if: always()
        shell: powershell
        run: |
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          Write-Host "FINAL_SOURCE_STATE=$($vm.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$n"
          if($vm.State -ne 'Off'){throw 'Diagnostic changed source state'}
          if($n -ne 0){throw 'Unexpected source checkpoint'}
