name: T2 Qualification Secret Inventory

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-qualification-secret-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Bind runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          Write-Host "RUNNER=$env:RUNNER_NAME COMPUTER=$env:COMPUTERNAME"

      - name: List qualification material names only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\LayerSentryLab\qualification'
          if(-not (Test-Path $root)){throw 'Qualification directory missing'}
          Get-ChildItem -LiteralPath $root -File -Recurse |
            Where-Object { $_.Name -match '(?i)enroll|token|support|root|password|controller|secret|code|qual' } |
            Select-Object Name,DirectoryName,Length,LastWriteTimeUtc |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 80 | Format-Table -AutoSize

      - name: Probe known qualification controller candidates
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          foreach($ip in @('10.250.10.10','10.250.10.11','10.250.10.12','10.250.10.13')){
            foreach($p in @(443,9443,2616,2633)){
              $c=New-Object Net.Sockets.TcpClient
              try{
                $a=$c.BeginConnect($ip,$p,$null,$null)
                $ok=$a.AsyncWaitHandle.WaitOne(500)
                if($ok){$c.EndConnect($a)}
                if($c.Connected){Write-Host "$ip PORT=$p OPEN"}
              }catch{}finally{$c.Close()}
            }
          }