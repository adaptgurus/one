name: Manoj HyperV RCT Delta Diagnostic

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-hyperv-rct-delta-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-rct-delta-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Measure retained RCT changed ranges read-only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}

          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $snaps=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue)
          Write-Host "SOURCE_STATE=$($vm.State)"
          Write-Host "SOURCE_CHECKPOINTS=$($snaps.Count)"
          if($vm.State -ne 'Off'){throw "Diagnostic requires source Off: $($vm.State)"}
          if($snaps.Count -ne 0){throw 'Unexpected user-visible checkpoint'}

          $sourceDisks=@(Get-VMHardDiskDrive -VM $vm | Sort-Object ControllerNumber,ControllerLocation | ForEach-Object {
            $vhd=Get-VHD -Path $_.Path -ErrorAction Stop
            [pscustomobject]@{
              Path=[string]$_.Path
              VirtualDiskId=[string]$vhd.DiskIdentifier
              VirtualSize=[int64]$vhd.Size
              ControllerNumber=[int]$_.ControllerNumber
              ControllerLocation=[int]$_.ControllerLocation
            }
          })
          if($sourceDisks.Count -ne 2){throw "Expected two source disks; found $($sourceDisks.Count)"}

          function Resolve-DiskPath([string]$instanceId, $sourceDisks) {
            $escaped=$instanceId.Replace("'","''")
            $sad=Get-WmiObject -Namespace root/virtualization/v2 -Class Msvm_StorageAllocationSettingData -Filter "InstanceID='$escaped'" -ErrorAction SilentlyContinue
            if($null -ne $sad -and $sad.HostResource -and $sad.HostResource.Count -gt 0){
              try {
                $hr=[wmi]$sad.HostResource[0]
                foreach($prop in @('Path','Name','DeviceID')){
                  $value=[string]$hr.$prop
                  if($value -match '\.vhdx$'){return $value}
                }
              } catch {}
            }
            foreach($disk in $sourceDisks){
              if($instanceId -like "*$($disk.VirtualDiskId)*"){return [string]$disk.Path}
            }
            $parts=@($instanceId.Split([char]92) | Where-Object {-not [string]::IsNullOrWhiteSpace($_)})
            if($parts.Count -ge 3 -and $parts[$parts.Count-1] -eq 'L'){
              $controller=$null; $location=$null
              try {
                $controller=[int]$parts[$parts.Count-3]
                $location=[int]$parts[$parts.Count-2]
              } catch {}
              if($null -ne $controller -and $null -ne $location){
                foreach($disk in $sourceDisks){
                  if([int]$disk.ControllerNumber -eq $controller -and [int]$disk.ControllerLocation -eq $location){
                    return [string]$disk.Path
                  }
                }
              }
            }
            return $null
          }

          function Wait-WmiJob([string]$jobPath) {
            $job=[wmi]$jobPath
            $deadline=(Get-Date).AddMinutes(10)
            while(($job.JobState -eq 3 -or $job.JobState -eq 4) -and (Get-Date) -lt $deadline){
              Start-Sleep 1
              $job.Get()
            }
            if($job.JobState -ne 7){throw "Hyper-V WMI job failed state=$($job.JobState) error=$($job.ErrorDescription)"}
          }

          $ns='root\virtualization\v2'
          $refs=@(Get-WmiObject -Namespace $ns -Class Msvm_VirtualSystemReferencePoint -Filter "VirtualSystemIdentifier='$($vm.VMId.Guid)'" -ErrorAction Stop)
          if($refs.Count -ne 1){throw "Expected one RCT reference; found $($refs.Count)"}
          $ref=$refs[0]
          if($ref.InstanceID -ne 'Microsoft:D54BEF1D-8852-437B-98EB-96391E6F6361'){throw "Unexpected reference: $($ref.InstanceID)"}
          $vd=@($ref.VirtualDiskIdentifiers)
          $ri=@($ref.ResilientChangeTrackingIdentifiers)
          if($vd.Count -ne 2 -or $ri.Count -ne 2){throw 'RCT reference arrays do not cover two disks'}

          $svc=Get-WmiObject -Namespace $ns -Class Msvm_ImageManagementService -ErrorAction Stop
          $chunk=[int64](512*1024*1024)
          $grandBytes=[int64]0
          $grandRanges=[int64]0

          for($d=0;$d -lt $vd.Count;$d++){
            $path=Resolve-DiskPath ([string]$vd[$d]) $sourceDisks
            if([string]::IsNullOrWhiteSpace($path)){throw "Cannot map reference disk $d to source path"}
            $disk=@($sourceDisks | Where-Object {$_.Path -eq $path})
            if($disk.Count -ne 1){throw "Mapped source path is not unique: $path"}
            $size=[int64]$disk[0].VirtualSize
            $rct=[string]$ri[$d]
            Write-Host "RCT_DISK_START index=$d path=$path size=$size rct=$rct"
            $offset=[int64]0
            $diskBytes=[int64]0
            $diskRanges=[int64]0
            $queries=0
            $swDisk=[Diagnostics.Stopwatch]::StartNew()
            while($offset -lt $size){
              $remaining=$size-$offset
              $length=[Math]::Min($chunk,$remaining)
              if($offset -eq 0 -and $length -eq $size -and $size -gt 1){$length=$size-1}
              $sw=[Diagnostics.Stopwatch]::StartNew()
              $result=$svc.GetVirtualDiskChanges($path,$rct,'',$offset,$length)
              if($result.ReturnValue -eq 4096){
                Wait-WmiJob $result.Job
                $result=$svc.GetVirtualDiskChanges($path,$rct,'',$offset,$length)
              }
              $sw.Stop()
              if($result.ReturnValue -ne 0){throw "GetVirtualDiskChanges failed code=$($result.ReturnValue) disk=$d offset=$offset length=$length"}
              $offsets=@($result.ChangedByteOffsets)
              $lengths=@($result.ChangedByteLengths)
              if($offsets.Count -ne $lengths.Count){throw "Changed range arrays mismatch disk=$d"}
              $queryBytes=[int64]0
              for($i=0;$i -lt $lengths.Count;$i++){$queryBytes += [int64]$lengths[$i]}
              $processed=[int64]$result.ProcessedByteLength
              if($processed -le 0){throw "GetVirtualDiskChanges returned zero processed bytes disk=$d offset=$offset"}
              $diskBytes += $queryBytes
              $diskRanges += $lengths.Count
              $queries++
              Write-Host "RCT_QUERY disk=$d query=$queries offset=$offset requested=$length processed=$processed ranges=$($lengths.Count) changed_bytes=$queryBytes elapsed_ms=$($sw.ElapsedMilliseconds)"
              $offset += $processed
            }
            $swDisk.Stop()
            Write-Host "RCT_DISK_SUMMARY index=$d queries=$queries ranges=$diskRanges changed_bytes=$diskBytes elapsed_ms=$($swDisk.ElapsedMilliseconds)"
            $grandBytes += $diskBytes
            $grandRanges += $diskRanges
          }
          Write-Host "RCT_TOTAL_RANGES=$grandRanges"
          Write-Host "RCT_TOTAL_CHANGED_BYTES=$grandBytes"
          Write-Host "RCT_DELTA_QUERY_DIAGNOSTIC=PASS"

      - name: Inspect retained Hyper-V staging files read-only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='C:\LayerSentryMigration\layersentry-hot-manoj-hv-ls-migration-source-test-20260924'
          Write-Host "STAGING_DIR=$dir"
          if(-not (Test-Path -LiteralPath $dir)){throw "Staging directory missing: $dir"}
          $files=@(Get-ChildItem -LiteralPath $dir -Recurse -File -ErrorAction Stop | Sort-Object FullName)
          Write-Host "STAGING_FILE_COUNT=$($files.Count)"
          foreach($f in $files){
            Write-Host ("STAGING_FILE path={0} bytes={1} modified={2}" -f $f.FullName,$f.Length,$f.LastWriteTimeUtc.ToString('o'))
          }
          $delta=@($files | Where-Object {$_.Name -like 'delta-*.lshv'})
          Write-Host "STAGING_DELTA_COUNT=$($delta.Count)"
          Write-Host "STAGING_DELTA_BYTES=$(($delta | Measure-Object -Property Length -Sum).Sum)"
          Write-Host 'STAGING_INSPECT=PASS'

      - name: Re-prove source invariant
        if: always()
        shell: powershell
        run: |
          $vm=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $vm.Name -ErrorAction SilentlyContinue).Count
          Write-Host "FINAL_SOURCE_STATE=$($vm.State)"
          Write-Host "FINAL_SOURCE_CHECKPOINTS=$n"
          if($vm.State -ne 'Off'){throw 'Diagnostic changed source state'}
          if($n -ne 0){throw 'Unexpected source checkpoint'}
          Write-Host 'RCT_DIAGNOSTIC_SOURCE_INVARIANT=PASS'
