name: LayerSentry Zendesk format once

on:
  push:
    branches:
      - feat/self-service-v5-ui-20260911
    paths:
      - '.github/workflows/layersentry-zendesk-format-once.yml'

permissions:
  contents: write

jobs:
  format-zendesk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/self-service-v5-ui-20260911
          persist-credentials: true
      - name: Apply exact Prettier line break
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/fireedge/src/server/routes/api/zendesk/functions.js')
          text = path.read_text()
          old = "  if (!(Number.isInteger(ticketId) && ticketId > 0 && body && user && password)) {"
          new = "  if (\n    !(Number.isInteger(ticketId) && ticketId > 0 && body && user && password)\n  ) {"
          if old not in text:
              raise SystemExit('Expected Zendesk validation expression was not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit formatter correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fireedge/src/server/routes/api/zendesk/functions.js
          git diff --cached --check
          git commit -m 'style(fireedge): finish Zendesk formatting'
          git push origin HEAD:feat/self-service-v5-ui-20260911
