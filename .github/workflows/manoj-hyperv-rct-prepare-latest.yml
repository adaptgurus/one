name: Manoj HyperV RCT Prepare Latest
# latest-after-pr20-cim-path-and-rct-map-fixes
# rerun-after-crash-baseline-fix
# corrected-state-path-and-live-reference-gate

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-hyperv-rct-prepare-latest.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-rct-prepare-latest
  cancel-in-progress: true

jobs:
  prepare:
    if: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150
    steps:
      - name: Bind Manoj and protect source before prepare
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source must be Running: $($src.State)"}
          $snaps=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue)
          if($snaps.Count -ne 0){throw "Source has $($snaps.Count) checkpoints"}
          if((Get-VM -Name 'ls-appliance-qual').State -ne 'Running'){throw 'OneSwap appliance not Running'}
          if((Get-VM -Name 'ls-fe2').State -ne 'Off'){throw 'FE2 authority VM must remain Off'}
          Write-Host "PREPARE_SOURCE_STATE=$($src.State)"
          Write-Host 'PREPARE_PROTECTED_PATH_BEFORE=PASS'

      - name: Prepare restricted appliance key and block baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-rct-prepare.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $before=& ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $tmp "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          if($LASTEXITCODE -ne 0){throw 'appliance block baseline failed'}
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($before -join [Environment]::NewLine)))
          "ONESWAP_BLOCKS_BEFORE_B64=$b64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Attach FE2 read-only authority child
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $fe2=(Get-VMHardDiskDrive -VMName 'ls-fe2' -ErrorAction Stop | Where-Object {$_.Path} | Sort-Object ControllerNumber,ControllerLocation | Select-Object -First 1).Path
          if(-not $fe2){throw 'FE2 disk missing'}
          $audit=Join-Path 'C:\LayerSentryLab\qualification' ("fe2-rct-prepare-$env:GITHUB_RUN_ID.vhdx")
          New-VHD -Path $audit -ParentPath $fe2 -Differencing -ErrorAction Stop | Out-Null
          Add-VMHardDiskDrive -VMName 'ls-appliance-qual' -ControllerType SCSI -Path $audit -ErrorAction Stop
          "FE2_AUDIT_VHD=$audit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 3

      - name: Run authenticated OneSwap RCT prepare
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $beforeText=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:ONESWAP_BLOCKS_BEFORE_B64))
          $before=@($beforeText -split [Environment]::NewLine | Where-Object {$_})
          $after=& ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          if($LASTEXITCODE -ne 0){throw 'appliance block inventory failed'}
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
            if [ "$exists" = "true" ]; then
              auth=$(sudo guestfish --ro -a "$dev" -i cat "$p")
              echo "TARGET_AUTHORITY_PATH=$p"
              break
            fi
          done
          [ -n "$auth" ]
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          printf '%s\n' "$auth" > "$tmp"
          chmod 600 "$tmp"
          export ONE_AUTH="$tmp"
          export ONE_XMLRPC="http://10.250.10.11:2633/RPC2"
          operation="manoj-hv-ls-migration-source-test-20260924"
          echo "RCT_PREPARE_OPERATION=$operation"
          echo "RCT_PREPARE_TARGET datastore=1 network=0"
          echo "RCT_PREPARE_SOURCE=ls-migration-source-test"
          set +e
          out=$(timeout --signal=TERM --kill-after=20s 7200s sudo -E /usr/bin/oneswap-hyperv ls-migration-source-test --hot --prepare --operation-id "$operation" --hyperv-connection manoj-qual --config-file /etc/layersentry/oneswap/manoj-qual.yaml --guest-os linux --expected-guest-macs 00:15:5d:00:1c:07 --uefi-sec-path /usr/share/OVMF/OVMF_CODE_4M.secboot.fd --qemu-ga --datastore 1 --network 0 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out" | sed -E 's/(password|secret|token|authorization|one_auth)[^ ]*/\1=<redacted>/Ig'
          if [ "$rc" -ne 0 ]; then
            echo "ONESWAP_RCT_PREPARE=FAIL rc=$rc"
            exit "$rc"
          fi
          echo "ONESWAP_RCT_PREPARE=PASS operation_id=$operation"
          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]
            c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"
            safe=op.gsub(/[^A-Za-z0-9_.-]/,"_")
            suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$operation")
          echo "PREPARED_STATE_PATH=$state"
          if [ ! -f "$state" ]; then echo "prepared state missing"; exit 44; fi
          python3 - "$state" <<'PY'
          import json,sys,os
          p=sys.argv[1]
          s=json.load(open(p))
          print("PREPARED_PHASE="+str(s.get("phase")))
          print("PREPARED_SOURCE_VM_ID="+str(s.get("source_vm_id")))
          print("PREPARED_REFERENCE_POINT_ID="+str(s.get("reference_point_id")))
          print("PREPARED_CONSISTENCY="+str(s.get("reference_consistency_level")))
          disks=s.get("disks",[])
          print("PREPARED_DISK_COUNT="+str(len(disks)))
          if s.get("phase")!="PREPARED": raise SystemExit("state is not PREPARED")
          if str(s.get("source_vm_id","")).lower()!="52baa8a1-675f-4225-8f37-66a60933b30c": raise SystemExit("source id mismatch")
          if int(s.get("reference_consistency_level",-1)) not in (1,2): raise SystemExit("reference consistency unsupported")
          if len(disks)!=2: raise SystemExit("prepared disk count mismatch")
          for i,d in enumerate(disks):
              path=d.get("prepared_raw_path","")
              expected=int(d.get("virtual_size",-1))
              actual=os.path.getsize(path) if path and os.path.isfile(path) else -1
              print(f"PREPARED_DISK_{i}_PATH={path}")
              print(f"PREPARED_DISK_{i}_SIZE={actual}")
              print(f"PREPARED_RCT_{i}={d.get('rct_id')}")
              if actual!=expected: raise SystemExit(f"prepared disk {i} size mismatch")
              if not str(d.get("rct_id","")).strip(): raise SystemExit(f"prepared disk {i} RCT id missing")
          print("DURABLE_PREPARED_STATE=PASS")
          PY
          '@
          $script=$script.Replace('__DEV__',$dev)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          $out=& ssh.exe -o LogLevel=ERROR -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          $rc=$LASTEXITCODE
          $out | ForEach-Object {Write-Host $_}
          if($rc -ne 0){throw "Authenticated OneSwap RCT prepare failed rc=$rc"}
          $refLine=@($out | Where-Object {$_ -like 'PREPARED_REFERENCE_POINT_ID=*'} | Select-Object -Last 1)
          if(-not $refLine){throw 'Durable state did not return reference id'}
          $expectedRef=$refLine.Substring('PREPARED_REFERENCE_POINT_ID='.Length)
          if([string]::IsNullOrWhiteSpace($expectedRef)){throw 'Durable reference id is empty'}

          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Running'){throw "Source changed state during prepare: $($src.State)"}
          $ns='root\virtualization\v2'
          $refs=@(Get-WmiObject -Namespace $ns -Class Msvm_VirtualSystemReferencePoint -Filter "VirtualSystemIdentifier='$($src.VMId.Guid)'" -ErrorAction Stop)
          $match=@($refs | Where-Object {$_.InstanceID -eq $expectedRef})
          Write-Host "PREPARED_LIVE_REFERENCE_COUNT=$($refs.Count)"
          if($match.Count -ne 1){throw "Durable reference missing/ambiguous on Hyper-V: $expectedRef"}
          $ref=$match[0]
          $vd=@($ref.VirtualDiskIdentifiers)
          $ri=@($ref.ResilientChangeTrackingIdentifiers)
          $usable=@($ri | Where-Object {-not [string]::IsNullOrWhiteSpace([string]$_)})
          Write-Host "PREPARED_LIVE_REFERENCE=$($ref.InstanceID)"
          Write-Host "PREPARED_LIVE_REFERENCE_TYPE=$($ref.ReferencePointType)"
          Write-Host "PREPARED_LIVE_CONSISTENCY=$($ref.ConsistencyLevel)"
          Write-Host "PREPARED_LIVE_VD_COUNT=$($vd.Count)"
          Write-Host "PREPARED_LIVE_RCT_COUNT=$($ri.Count)"
          if([int]$ref.ReferencePointType -ne 2){throw 'Prepared reference is not RCT type 2'}
          if([int]$ref.ConsistencyLevel -notin @(1,2)){throw 'Prepared reference consistency unsupported'}
          if([bool]$ref.HasAssociatedData){throw 'Prepared RCT reference unexpectedly has associated log data'}
          if($vd.Count -ne 2 -or $ri.Count -ne 2 -or $usable.Count -ne 2){throw 'Prepared RCT reference does not cover both source disks'}
          Write-Host 'PREPARED_LIVE_REFERENCE=PASS'

      - name: Detach and delete FE2 authority child
        if: always()
        shell: powershell
        run: |
          $audit=$env:FE2_AUDIT_VHD
          if($audit){
            Get-VMHardDiskDrive -VMName 'ls-appliance-qual' -ErrorAction SilentlyContinue | Where-Object {$_.Path -eq $audit} | Remove-VMHardDiskDrive -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            if(Test-Path $audit){Remove-Item -Force $audit -ErrorAction Stop}
          }
          Write-Host 'FE2_RCT_PREPARE_AUTH_CHILD_CLEANUP=PASS'

      - name: Verify source remains running after prepare
        if: always()
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $snaps=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue)
          Write-Host "SOURCE_AFTER_PREPARE_STATE=$($src.State)"
          Write-Host "SOURCE_AFTER_PREPARE_CHECKPOINTS=$($snaps.Count)"
          if($src.State -ne 'Running'){throw "Prepare changed source state: $($src.State)"}
          # RCT reference points are not Hyper-V checkpoints; user-visible checkpoints must remain zero.
          if($snaps.Count -ne 0){throw "Prepare created user-visible checkpoint(s): $($snaps.Count)"}
          if((Get-VM -Name 'ls-fe2').State -ne 'Off'){throw 'FE2 state changed'}
          Write-Host 'PREPARE_PROTECTED_PATH_AFTER=PASS'
