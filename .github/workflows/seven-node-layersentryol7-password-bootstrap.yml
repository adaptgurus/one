name: Seven Node layersentryol7 Password Bootstrap

on:
  workflow_dispatch:
    inputs:
      rotate_cloned_host_keys:
        description: Back up and regenerate cloned SSH host keys on layersentry1-6
        required: true
        type: boolean
        default: false
  push:
    branches:
      - lab/seven-node-foundation-20260926
    paths:
      - '.github/workflows/seven-node-layersentryol7-password-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: seven-node-layersentryol7-password-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    steps:
      - name: Bind exact runner and runtime credential
        env:
          LS_ROOT_PASSWORD: ${{ secrets.LAYERSENTRY_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME SLOT=${{ matrix.slot }}"
          if test "$RUNNER_NAME" != layersentryol7; then
            echo 'NON_TARGET_RUNNER_HOLD'
            echo 'LS_TARGET=false' >>"$GITHUB_ENV"
            sleep 90
            exit 0
          fi
          echo 'LS_TARGET=true' >>"$GITHUB_ENV"
          test -n "${LS_ROOT_PASSWORD:-}"
          echo 'RUNNER_BIND=PASS'
          echo 'RUNTIME_CREDENTIAL_PRESENT=true'
          echo 'PLAINTEXT_CREDENTIAL_LOGGED=false'

      - name: Rotate cloned host keys with rollback copies
        if: env.LS_TARGET == 'true' && (github.event_name == 'push' || inputs.rotate_cloned_host_keys == true)
        env:
          LS_ROOT_PASSWORD: ${{ secrets.LAYERSENTRY_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/layersentryol7-password-bootstrap"
          install -d -m 700 "$work"
          old_known="$work/known_hosts.pre-rotation"
          : >"$old_known"
          for ip in 172.17.60.30 172.17.60.31 172.17.60.32 172.17.60.33 172.17.60.34 172.17.60.35 172.17.60.36; do
            timeout 10 ssh-keyscan -T 5 -t ed25519,ecdsa,rsa "$ip" >>"$old_known" 2>/dev/null
          done
          chmod 600 "$old_known"
          awk '!/^#/ {print $1, $2, $3}' "$old_known" | while read -r host type keydata; do
            fingerprint=$(printf '%s' "$keydata" | base64 -d | openssl dgst -sha256 -binary | base64 | tr -d '=')
            printf '%s %s SHA256:%s\n' "$host" "$type" "$fingerprint"
          done | tee "$work/pre-rotation-fingerprints.txt"
          pre_unique=$(awk '$2 == "ssh-ed25519" {print $3}' "$old_known" | sort -u | wc -l)
          test "$pre_unique" -lt 7
          echo "PRE_ROTATION_UNIQUE_ED25519=$pre_unique"

          askpass="$work/rotation-askpass.sh"
          printf '%s\n' '#!/usr/bin/env bash' 'printf "%s" "$LS_ROOT_PASSWORD"' >"$askpass"
          chmod 700 "$askpass"
          export SSH_ASKPASS="$askpass"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=LayerSentry

          rotate=$(cat <<'REMOTE'
          set -euo pipefail
          backup="/root/layersentry-ssh-hostkeys-pre-rotation-__ROTATION_ID__"
          install -d -m 700 "$backup"
          cp -a /etc/ssh/ssh_host_*_key /etc/ssh/ssh_host_*_key.pub "$backup/"
          rm -f /etc/ssh/ssh_host_*_key /etc/ssh/ssh_host_*_key.pub
          if ! ssh-keygen -A || ! sshd -t; then
            cp -a "$backup"/* /etc/ssh/
            restorecon -RF /etc/ssh 2>/dev/null || true
            systemctl restart sshd
            echo HOST_KEY_ROTATION=ROLLED_BACK
            exit 1
          fi
          restorecon -RF /etc/ssh 2>/dev/null || true
          systemctl restart sshd
          echo "HOST_KEY_ROTATION=PASS BACKUP=$backup"
          REMOTE
          )
          rotate=${rotate/__ROTATION_ID__/${{ github.run_id }}}
          payload=$(printf '%s' "$rotate" | base64 -w0)
          for ip in 172.17.60.30 172.17.60.31 172.17.60.32 172.17.60.33 172.17.60.34 172.17.60.35; do
            remote="printf '%s' '$payload' | base64 -d | bash"
            setsid -w ssh -T \
              -o BatchMode=no \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=password \
              -o NumberOfPasswordPrompts=1 \
              -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$old_known" \
              "root@$ip" "$remote"
          done
          unset LS_ROOT_PASSWORD SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          rm -f "$askpass"

          sleep 5
          new_known="$work/known_hosts.post-rotation"
          : >"$new_known"
          for ip in 172.17.60.30 172.17.60.31 172.17.60.32 172.17.60.33 172.17.60.34 172.17.60.35 172.17.60.36; do
            timeout 10 ssh-keyscan -T 5 -t ed25519,ecdsa,rsa "$ip" >>"$new_known" 2>/dev/null
          done
          chmod 600 "$new_known"
          awk '!/^#/ {print $1, $2, $3}' "$new_known" | while read -r host type keydata; do
            fingerprint=$(printf '%s' "$keydata" | base64 -d | openssl dgst -sha256 -binary | base64 | tr -d '=')
            printf '%s %s SHA256:%s\n' "$host" "$type" "$fingerprint"
          done | tee "$work/post-rotation-fingerprints.txt"
          post_unique=$(awk '$2 == "ssh-ed25519" {print $3}' "$new_known" | sort -u | wc -l)
          test "$post_unique" -eq 7
          echo 'POST_ROTATION_UNIQUE_ED25519=7'
          echo 'HOST_KEY_ROTATION_ALL=PASS'

      - name: Establish durable deployment trust
        if: env.LS_TARGET == 'true'
        env:
          LS_ROOT_PASSWORD: ${{ secrets.LAYERSENTRY_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 /root/.ssh
          key=/root/.ssh/layersentry_lab_ed25519
          if ! test -f "$key"; then
            ssh-keygen -q -t ed25519 -N '' -C layersentryol7-lab-runner -f "$key"
          fi
          chmod 600 "$key"
          chmod 644 "$key.pub"
          public=$(cat "$key.pub")
          if [[ ! "$public" =~ ^ssh-ed25519\ [A-Za-z0-9+/=]+\ layersentryol7-lab-runner$ ]]; then
            echo 'UNEXPECTED_PUBLIC_KEY_FORMAT' >&2
            exit 1
          fi

          work="$RUNNER_TEMP/layersentryol7-password-bootstrap"
          install -d -m 700 "$work"
          known="$work/known_hosts"
          : >"$known"
          hosts=(
            'layersentry1=172.17.60.30'
            'layersentry2=172.17.60.31'
            'layersentry3=172.17.60.32'
            'layersentry4=172.17.60.33'
            'layersentry5=172.17.60.34'
            'layersentry6=172.17.60.35'
            'layersentryol7=172.17.60.36'
          )
          for entry in "${hosts[@]}"; do
            ip=${entry#*=}
            timeout 10 ssh-keyscan -T 5 -t ed25519,ecdsa,rsa "$ip" >>"$known" 2>/dev/null
          done
          chmod 600 "$known"
          awk '!/^#/ {print $1, $2, $3}' "$known" | while read -r host type keydata; do
            fingerprint=$(printf '%s' "$keydata" | base64 -d | openssl dgst -sha256 -binary | base64 | tr -d '=')
            printf '%s %s SHA256:%s\n' "$host" "$type" "$fingerprint"
          done | tee "$work/confirmed-session-fingerprints.txt"

          askpass="$work/askpass.sh"
          printf '%s\n' '#!/usr/bin/env bash' 'printf "%s" "$LS_ROOT_PASSWORD"' >"$askpass"
          chmod 700 "$askpass"
          export SSH_ASKPASS="$askpass"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=LayerSentry

          script=$(cat <<'REMOTE'
          set -euo pipefail
          u=layersentry-deploy
          id "$u" >/dev/null 2>&1 || useradd -m -s /bin/bash "$u"
          h=$(getent passwd "$u" | cut -d: -f6)
          install -d -m 700 -o "$u" -g "$u" "$h/.ssh"
          k='__PUBLIC_KEY__'
          touch "$h/.ssh/authorized_keys"
          grep -qxF "$k" "$h/.ssh/authorized_keys" || printf '%s\n' "$k" >>"$h/.ssh/authorized_keys"
          chown -R "$u:$u" "$h/.ssh"
          chmod 600 "$h/.ssh/authorized_keys"
          restorecon -RF "$h/.ssh" 2>/dev/null || true
          printf 'layersentry-deploy ALL=(ALL) NOPASSWD:ALL\n' >/etc/sudoers.d/90-layersentry-deploy
          chmod 440 /etc/sudoers.d/90-layersentry-deploy
          visudo -cf /etc/sudoers.d/90-layersentry-deploy
          echo DURABLE_TRUST_INSTALL=PASS
          REMOTE
          )
          script=${script/__PUBLIC_KEY__/$public}
          payload=$(printf '%s' "$script" | base64 -w0)

          for entry in "${hosts[@]}"; do
            name=${entry%%=*}
            ip=${entry#*=}
            remote="printf '%s' '$payload' | base64 -d | bash"
            setsid -w ssh -T \
              -o BatchMode=no \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=password \
              -o NumberOfPasswordPrompts=1 \
              -o ConnectTimeout=8 \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$known" \
              "root@$ip" "$remote"
            echo "PASSWORD_BOOTSTRAP_$name=PASS"
          done

          unset LS_ROOT_PASSWORD SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          rm -f "$askpass"
          echo 'PLAINTEXT_CREDENTIAL_PERSISTED=false'

      - name: Verify durable trust and retire password dependency
        if: env.LS_TARGET == 'true'
        shell: bash
        run: |
          set -euo pipefail
          key=/root/.ssh/layersentry_lab_ed25519
          known="$RUNNER_TEMP/layersentryol7-password-bootstrap/known_hosts"
          for ip in 172.17.60.30 172.17.60.31 172.17.60.32 172.17.60.33 172.17.60.34 172.17.60.35 172.17.60.36; do
            timeout 20 ssh -T -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" "layersentry-deploy@$ip" 'sudo -n true && hostname' | sed "s/^/VERIFY_$ip=/"
          done
          echo 'LAYERENTRYOL7_DURABLE_TRUST_ALL=PASS'
          echo 'PASSWORD_DEPENDENCY_RETIRED=true'

      - name: Upload non-secret bootstrap evidence
        if: always() && env.LS_TARGET == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layersentryol7-password-bootstrap-evidence
          path: |
            ${{ runner.temp }}/layersentryol7-password-bootstrap/pre-rotation-fingerprints.txt
            ${{ runner.temp }}/layersentryol7-password-bootstrap/post-rotation-fingerprints.txt
            ${{ runner.temp }}/layersentryol7-password-bootstrap/confirmed-session-fingerprints.txt
          if-no-files-found: warn
          retention-days: 7
