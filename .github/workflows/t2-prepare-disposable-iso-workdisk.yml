name: T2 Prepare Disposable ISO Work Disk

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-prepare-disposable-iso-workdisk.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Create and attach new disposable VHDX
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $vm='ls-iso-builder'
          $path='C:\LayerSentryLab\qualification\t2-durable-iso-work-37g.vhdx'
          $size=37GB
          if(Test-Path $path){
            $v=Get-VHD -Path $path
            if($v.Size -ne $size){throw "Existing disposable VHDX has wrong size: $($v.Size)"}
          } else {
            New-VHD -Path $path -Dynamic -SizeBytes $size | Out-Null
          }
          $attached=Get-VMHardDiskDrive -VMName $vm | Where-Object Path -eq $path
          if(-not $attached){Add-VMHardDiskDrive -VMName $vm -Path $path}
          $d=Get-VMHardDiskDrive -VMName $vm | Where-Object Path -eq $path
          if(-not $d){throw 'Disposable VHDX did not attach'}
          Write-Host "DISPOSABLE_VHDX=PASS path=$path size=$size controller=$($d.ControllerNumber):$($d.ControllerLocation)"

      - name: Discover and initialize only exact new guest disk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\iso-builder-key'; $known='C:\LayerSentryLab\qualification\known_hosts_builder'
          & icacls.exe $src /grant:r '*S-1-5-18:(R)' | Out-Null; & icacls.exe $known /grant:r '*S-1-5-18:(R)' | Out-Null
          $key=Join-Path $env:RUNNER_TEMP 't2-workdisk-key'; Copy-Item $src $key -Force
          & icacls.exe $key /grant:r '*S-1-5-18:(F)' | Out-Null; & icacls.exe $key /setowner '*S-1-5-18' | Out-Null; & icacls.exe $key /inheritance:r | Out-Null; & icacls.exe $key /grant:r '*S-1-5-18:(R)' | Out-Null
          & icacls.exe $src /remove:g '*S-1-5-18' | Out-Null
          $ssh=(Get-Command ssh.exe).Source
          $remote=@'
          set -euo pipefail
          size=39728447488
          mapfile -t candidates < <(lsblk -b -dn -o PATH,SIZE,TYPE,FSTYPE,MOUNTPOINT | awk -v s="$size" '$2==s && $3=="disk" && $4=="" && $5=="" {print $1}')
          test "${#candidates[@]}" -eq 1
          dev="${candidates[0]}"
          test -b "$dev"
          test "$(lsblk -b -dn -o SIZE "$dev" | tr -d ' ')" = "$size"
          test -z "$(lsblk -dn -o FSTYPE "$dev" | tr -d ' ')"
          test -z "$(lsblk -dn -o MOUNTPOINT "$dev" | tr -d ' ')"
          if ! sudo -n blkid "$dev" >/dev/null 2>&1; then
            sudo -n mkfs.xfs -f -L LST2ISOWORK "$dev" >/dev/null
          fi
          sudo -n mkdir -p /mnt/t2-durable-iso-work
          if ! mountpoint -q /mnt/t2-durable-iso-work; then sudo -n mount "$dev" /mnt/t2-durable-iso-work; fi
          test "$(findmnt -n -o SOURCE /mnt/t2-durable-iso-work)" = "$dev"
          sudo -n chown builder:builder /mnt/t2-durable-iso-work
          df -hT /mnt/t2-durable-iso-work
          echo DISPOSABLE_WORKDISK=PASS device="$dev"
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($remote -replace "`r",'')))
          & $ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -i $key builder@10.250.10.40 "printf '%s' '$b64' | base64 -d | bash"
          if($LASTEXITCODE -ne 0){throw 'Disposable work disk initialization failed'}
          & icacls.exe $key /grant:r '*S-1-5-18:(F)' | Out-Null; Remove-Item $key -Force