name: LayerSentry Password-to-Key Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    env:
      LS_ROOT_PASSWORD: ${{ secrets.LAYERSENTRY_ROOT_PASSWORD }}
    steps:
      - name: Bootstrap deployment key over password SSH
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME COMPUTERNAME=$env:COMPUTERNAME SLOT=${{ matrix.slot }}"
          if($env:RUNNER_NAME -ine 'WIN-GK6MO7T7OPC' -or $env:COMPUTERNAME -ine 'WIN-GK6MO7T7OPC'){
            Write-Host 'NON_TARGET_HOLD'
            Start-Sleep -Seconds 90
            exit 0
          }
          if([string]::IsNullOrWhiteSpace($env:LS_ROOT_PASSWORD)){ throw 'Required password secret is unavailable' }

          $dir='C:\ProgramData\LayerSentryLab\seven-node-bootstrap'
          $key=Join-Path $dir 'deploy_ed25519'
          $known=Join-Path $dir 'known_hosts'
          if(-not (Test-Path $key)){ throw 'Deployment SSH key is unavailable' }
          if(-not (Test-Path $known)){ throw 'Pinned SSH known_hosts is unavailable' }
          $public=(& ssh-keygen.exe -y -f $key | Select-Object -Last 1).Trim()
          if($public -notmatch '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)) [A-Za-z0-9+/=]+(?: .*)?$'){ throw 'Unexpected public key format' }

          $askpass=Join-Path $env:RUNNER_TEMP 'layersentry-bootstrap-askpass.exe'
          $src=@'
          using System;
          public class AskPass {
              public static void Main() {
                  Console.Write(Environment.GetEnvironmentVariable("LS_ROOT_PASSWORD"));
              }
          }
          '@
          Add-Type -TypeDefinition $src -Language CSharp -OutputAssembly $askpass -OutputType ConsoleApplication
          $env:SSH_ASKPASS=$askpass
          $env:SSH_ASKPASS_REQUIRE='force'
          $env:DISPLAY='LayerSentry'

          $script=@'
          set -euo pipefail
          u=layersentry-deploy
          id "$u" >/dev/null 2>&1 || useradd -m -s /bin/bash "$u"
          h=$(getent passwd "$u" | cut -d: -f6)
          install -d -m 700 -o "$u" -g "$u" "$h/.ssh"
          k='__PUBLIC_KEY__'
          touch "$h/.ssh/authorized_keys"
          grep -qxF "$k" "$h/.ssh/authorized_keys" || printf '%s\n' "$k" >> "$h/.ssh/authorized_keys"
          chown -R "$u:$u" "$h/.ssh"
          chmod 700 "$h/.ssh"
          chmod 600 "$h/.ssh/authorized_keys"
          restorecon -RF "$h/.ssh" 2>/dev/null || true
          printf 'layersentry-deploy ALL=(ALL) NOPASSWD:ALL\n' > /etc/sudoers.d/90-layersentry-deploy
          chmod 440 /etc/sudoers.d/90-layersentry-deploy
          visudo -cf /etc/sudoers.d/90-layersentry-deploy
          systemctl enable --now sshd
          echo PASSWORD_TO_KEY_BOOTSTRAP=PASS
          '@
          $script=$script.Replace('__PUBLIC_KEY__',$public).Replace("`r`n","`n")
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script))
          $failed=@()
          try {
            foreach($hostIp in @('172.17.60.31','172.17.60.32')){
              Write-Host "::group::$hostIp"
              $remote="printf '%s' '$b64' | base64 -d | bash"
              & ssh.exe -T -o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" "root@$hostIp" $remote
              if($LASTEXITCODE -ne 0){
                Write-Host "PASSWORD_BOOTSTRAP=$hostIp`:FAILED_RC_$LASTEXITCODE"
                $failed += $hostIp
              } else {
                & ssh.exe -T -i $key -o BatchMode=yes -o PreferredAuthentications=publickey -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" "layersentry-deploy@$hostIp" 'sudo -n true && echo KEY_LOGIN=PASS'
                if($LASTEXITCODE -ne 0){ throw "Key verification failed for $hostIp" }
                Write-Host "PASSWORD_BOOTSTRAP=$hostIp`:PASS"
              }
              Write-Host '::endgroup::'
            }
          } finally {
            Remove-Item Env:LS_ROOT_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item $askpass -Force -ErrorAction SilentlyContinue
          }
          if($failed.Count -gt 0){ throw ('Password bootstrap failed for: ' + ($failed -join ',')) }
          Write-Host 'PASSWORD_TO_KEY_BOOTSTRAP_ALL=PASS'
