name: LayerSentry Manoj OpenNebula DR probe

on:
  push:
    branches:
      - feat/layersentry-protection-domain-20260923
    paths:
      - .github/workflows/layersentry-manoj-opennebula-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Probe existing Manoj OpenNebula site
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $targets = @('10.250.10.10','10.250.10.11','10.250.10.13','10.250.10.20')
          $users = @('root','oneadmin','opc')
          foreach ($ip in $targets) {
            Write-Host "=== $ip ==="
            $tcp = Test-NetConnection -ComputerName $ip -Port 22 -WarningAction SilentlyContinue
            Write-Host "SSH_TCP=$($tcp.TcpTestSucceeded)"
            if (-not $tcp.TcpTestSucceeded) { continue }
            foreach ($user in $users) {
              $dest = "$user@$ip"
              Write-Host "-- TRY $dest --"
              $outFile = Join-Path $env:RUNNER_TEMP ("ssh-" + ($ip -replace '\.','-') + "-" + $user + ".out")
              $errFile = Join-Path $env:RUNNER_TEMP ("ssh-" + ($ip -replace '\.','-') + "-" + $user + ".err")
              $p = Start-Process -FilePath ssh.exe -ArgumentList @('-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=NUL','-o','ConnectTimeout=5',$dest,'hostname; id -un; command -v onehost || true; command -v oned || true; systemctl is-active opennebula 2>/dev/null || true; rpm -q opennebula 2>/dev/null || true') -NoNewWindow -Wait -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
              Write-Host "SSH_PROBE IP=$ip USER=$user RC=$($p.ExitCode)"
              if (Test-Path $outFile) { Get-Content $outFile | ForEach-Object { Write-Host "REMOTE $_" } }
              if ($p.ExitCode -eq 0) { Write-Host "SSH_AUTH_SUCCESS=$dest"; break }
            }
          }
