name: T2 Durable Observe Install Completion

on:
  push:
    branches:
      - ops/t2-install-4c4ac81
    paths:
      - .github/workflows/t2-durable-observe-install.yml

permissions:
  contents: read

jobs:
  observe:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Observe durable install after wait window
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner $env:RUNNER_NAME"}
          $name='ls-appliance-durable-qual'
          $vhd='C:\LayerSentryLab\qualification\ls-appliance-durable-qual\os.vhdx'
          $vm=Get-VM -Name $name -ErrorAction Stop
          if($vm.State -ne 'Running'){throw "Durable VM not running before observation: $($vm.State)"}
          $before=(Get-Item $vhd).Length
          if($before -lt 100000000){throw "Install had not started: $before"}
          Write-Host "OBSERVE_START_VHD_BYTES=$before"
          Start-Sleep -Seconds 480
          $vm=Get-VM -Name $name -ErrorAction Stop
          $after=(Get-Item $vhd).Length
          $out='C:\LayerSentryLab\evidence\t2-durable-5f3bda7\install-observe-8min.png'
          & 'C:\LayerSentryLab\qualification\capture_vm_thumbnail.ps1' -VM $name -Out $out
          if(-not(Test-Path $out)){throw 'Install observation screenshot missing'}
          Write-Host "OBSERVE_END_STATE=$($vm.State) VHD_BYTES=$after SCREENSHOT_BYTES=$((Get-Item $out).Length)"
          if($after -lt 2000000000){throw "Durable VHD did not reach expected installed size: $after"}

      - name: Upload observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-durable-install-observe-8min
          path: C:\LayerSentryLab\evidence\t2-durable-5f3bda7\install-observe-8min.png
          if-no-files-found: error
          retention-days: 7