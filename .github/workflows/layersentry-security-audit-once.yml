name: LayerSentry dev dependency audit once

on:
  push:
    branches:
      - feat/self-service-v5-ui-20260911
    paths:
      - '.github/workflows/layersentry-security-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/self-service-v5-ui-20260911
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print exact full audit findings
        run: |
          npm audit --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs=require('fs')
          const report=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'))
          console.log('FULL_AUDIT='+JSON.stringify(report?.metadata?.vulnerabilities ?? {}))
          for (const [name,v] of Object.entries(report.vulnerabilities||{}).sort(([a],[b])=>a.localeCompare(b))) {
            console.log(JSON.stringify({
              name,
              severity:v.severity,
              isDirect:v.isDirect,
              range:v.range,
              via:(v.via||[]).map(x=>typeof x==='string'?x:{source:x.source,name:x.name,severity:x.severity,title:x.title,range:x.range}),
              effects:v.effects,
              fixAvailable:v.fixAvailable
            }))
          }
          NODE
      - name: Print npm non-breaking fix proposal
        run: |
          cp package.json /tmp/package.before.json
          cp package-lock.json /tmp/package-lock.before.json
          npm audit fix --package-lock-only --ignore-scripts --no-audit --no-fund || true
          echo '--- package.json diff ---'
          diff -u /tmp/package.before.json package.json || true
          echo '--- lock top-level versions changed ---'
          node - <<'NODE'
          const fs=require('fs')
          const before=JSON.parse(fs.readFileSync('/tmp/package-lock.before.json','utf8'))
          const after=require('./package-lock.json')
          const names=new Set()
          for(const key of Object.keys(before.packages||{})) if(key.startsWith('node_modules/')&&!key.slice(13).includes('/node_modules/')) names.add(key.slice(13))
          for(const key of Object.keys(after.packages||{})) if(key.startsWith('node_modules/')&&!key.slice(13).includes('/node_modules/')) names.add(key.slice(13))
          for(const name of [...names].sort()){
            const a=before.packages?.[`node_modules/${name}`]?.version
            const b=after.packages?.[`node_modules/${name}`]?.version
            if(a!==b) console.log(`${name}: ${a} -> ${b}`)
          }
          NODE
