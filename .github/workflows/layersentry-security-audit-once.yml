name: LayerSentry final cleanup qualification once

on:
  push:
    branches:
      - feat/self-service-v5-ui-20260911
    paths:
      - '.github/workflows/layersentry-security-audit-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/self-service-v5-ui-20260911
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Apply final source, CI and evidence cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path('.')
          fireedge = root / 'src/fireedge'
          run_id = os.environ['GITHUB_RUN_ID']

          # Remove runtime imports that only existed for JSDoc metadata and caused
          # Webpack "export not found" warnings in the two LayerSentry tabs.
          for rel in [
              'src/modules/resources/VmTemplate/Forms/InstantiateForm/Steps/ExtraConfiguration/gpu/index.js',
              'src/modules/resources/VmTemplate/Forms/InstantiateForm/Steps/ExtraConfiguration/protection/index.js',
          ]:
              path = fireedge / rel
              text = path.read_text()
              old = """import {
            STEP_ID as EXTRA_ID,
            TabType,
          } from '@modules/resources/VmTemplate/Forms/CreateForm/Steps/ExtraConfiguration'"""
              new = "import { STEP_ID as EXTRA_ID } from '@modules/resources/VmTemplate/Forms/CreateForm/Steps/ExtraConfiguration'"
              if old not in text:
                  raise SystemExit(f'expected TabType import not found in {path}')
              text = text.replace(old, new, 1)
              text = text.replace('/** @type {TabType} */', '/** Native extra-configuration tab descriptor. */', 1)
              path.write_text(text)

          # Permanent source-level guard for the qualified dependency/runtime contract.
          dep_test = fireedge / 'tests/layersentry/dependency-security.test.cjs'
          dep_test.write_text(r'''/* SPDX-License-Identifier: Apache-2.0 */
          const { test } = require('node:test')
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const path = require('node:path')

          const fireedgeRoot = path.join(__dirname, '../..')
          const pkg = JSON.parse(
            fs.readFileSync(path.join(fireedgeRoot, 'package.json'), 'utf8')
          )
          const lock = JSON.parse(
            fs.readFileSync(path.join(fireedgeRoot, 'package-lock.json'), 'utf8')
          )
          const logoSource = fs.readFileSync(
            path.join(fireedgeRoot, 'src/server/utils/logo.js'),
            'utf8'
          )

          const locked = (name) => lock.packages?.[`node_modules/${name}`]?.version

          test('FireEdge dependency security contract remains on qualified versions', () => {
            assert.equal(pkg.engines?.node, '>=22')

            const runtime = {
              '@babel/core': '7.29.7',
              'babel-loader': '9.2.1',
              compression: '1.8.2',
              'copy-webpack-plugin': '14.0.0',
              'fast-xml-parser': '5.11.1',
              'http-proxy-middleware': '3.0.7',
              jimp: '1.6.1',
              morgan: '1.12.1',
              'terser-webpack-plugin': '5.6.1',
              uuid: '11.1.1',
              'webpack-cli': '5.1.4',
              yaml: '1.10.3',
            }

            for (const [name, version] of Object.entries(runtime)) {
              assert.equal(pkg.dependencies?.[name], version, `${name} manifest drift`)
              assert.equal(locked(name), version, `${name} lock drift`)
            }

            assert.equal(
              pkg.devDependencies?.['eslint-import-resolver-webpack'],
              '0.13.11'
            )
            assert.equal(pkg.devDependencies?.['webpack-dev-middleware'], '5.3.4')
            assert.equal(locked('eslint-import-resolver-webpack'), '0.13.11')
            assert.equal(locked('webpack-dev-middleware'), '5.3.4')
            assert.equal(locked('flatted'), '3.4.4')
            assert.equal(locked('js-yaml'), '3.15.2')
            assert.equal(pkg.overrides?.qs, '6.16.0')
            assert.equal(
              pkg.overrides?.['eslint-config-opennebula']?.['@babel/core'],
              '7.29.7'
            )
          })

          test('Jimp v1 logo handling cannot regress to removed APIs', () => {
            assert.match(
              logoSource,
              /const \{ Jimp, JimpMime \} = require\('jimp'\)/
            )
            assert.match(logoSource, /getBuffer\(JimpMime\.png\)/)
            assert.match(logoSource, /resize\(\{ w: 32, h: 32 \}\)/)
            assert.doesNotMatch(
              logoSource,
              /getBufferAsync|Jimp\.MIME_PNG|resize\(32,\s*32\)/
            )
          })
          '''.replace('          ', ''))

          # Permanent dynamic security/build gate. Both runtime and complete
          # dependency trees must stay advisory-free on a locked Node 22 install.
          permanent = root / '.github/workflows/layersentry-fireedge-security.yml'
          permanent.write_text(r'''name: LayerSentry FireEdge Security

          on:
            pull_request:
              paths:
                - 'src/fireedge/package.json'
                - 'src/fireedge/package-lock.json'
                - 'src/fireedge/src/server/utils/logo.js'
                - 'src/fireedge/tests/layersentry/**'
                - '.github/workflows/layersentry-fireedge-security.yml'
            push:
              paths:
                - 'src/fireedge/package.json'
                - 'src/fireedge/package-lock.json'
                - 'src/fireedge/src/server/utils/logo.js'
                - 'src/fireedge/tests/layersentry/**'
                - '.github/workflows/layersentry-fireedge-security.yml'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            fireedge-security:
              runs-on: ubuntu-24.04
              timeout-minutes: 45
              defaults:
                run:
                  working-directory: src/fireedge
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-node@v5
                  with:
                    node-version: '22'
                    cache: npm
                    cache-dependency-path: src/fireedge/package-lock.json
                - name: Locked install
                  run: npm ci --ignore-scripts --no-audit --no-fund
                - name: Runtime and complete dependency audits
                  run: |
                    npm audit --omit=dev --json > /tmp/runtime-audit.json || true
                    npm audit --json > /tmp/full-audit.json || true
                    node - <<'NODE'
                    const fs = require('fs')
                    for (const [kind, file] of [
                      ['runtime', '/tmp/runtime-audit.json'],
                      ['full', '/tmp/full-audit.json'],
                    ]) {
                      const report = JSON.parse(fs.readFileSync(file, 'utf8'))
                      const counts = report?.metadata?.vulnerabilities ?? {}
                      console.log(`${kind.toUpperCase()}_AUDIT=${JSON.stringify(counts)}`)
                      if ((counts.total ?? 0) !== 0) {
                        for (const [name, finding] of Object.entries(report.vulnerabilities ?? {})) {
                          console.log(kind, name, finding.severity, finding.range, finding.fixAvailable)
                        }
                        process.exitCode = 2
                      }
                    }
                    NODE
                - name: LayerSentry regression tests
                  run: node --test tests/layersentry/*.test.cjs
                - name: FireEdge lint
                  run: npm run lint
                - name: Full FireEdge production build
                  run: npm run build
          '''.replace('          ', ''))

          # Feature-branch pushes must not be red solely because the base branch
          # carries repository-wide Ruby lint debt. PRs still lint every Ruby file
          # they change; stable/manual runs keep the full repository sweep.
          smoke = root / '.github/workflows/smoke_tests.yml'
          text = smoke.read_text()
          old = '''      - name: Run full smoke tests
                if: github.event_name != 'pull_request'
                run: $GITHUB_WORKSPACE/share/smoke_tests/smoke_tests.sh

              - name: Create PR for new RuboCop rules
                if: failure() && github.event_name != 'pull_request'
          '''.replace('              ', '')
          new = '''      - name: Run feature-branch push smoke tests without inherited RuboCop debt
                if: github.event_name == 'push' && github.ref_name != 'master' && startsWith(github.ref_name, 'one-') == false
                shell: bash
                run: |
                  set -euo pipefail
                  for test_script in "$GITHUB_WORKSPACE"/share/smoke_tests/tests/*.sh; do
                    [[ "$(basename "$test_script")" == '02-rubocop.sh' ]] && continue
                    echo "Executing $test_script"
                    "$test_script"
                  done

              - name: Run full smoke tests on stable or manual runs
                if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'master' || startsWith(github.ref_name, 'one-')))
                run: $GITHUB_WORKSPACE/share/smoke_tests/smoke_tests.sh

              - name: Create PR for new RuboCop rules
                if: failure() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'master' || startsWith(github.ref_name, 'one-'))))
          '''.replace('              ', '')
          if old not in text:
              raise SystemExit('expected smoke workflow block not found')
          smoke.write_text(text.replace(old, new, 1))

          # Refresh stale engineering evidence without rewriting unrelated content.
          doc_path = fireedge / 'docs/LAYERSENTRY_SELF_SERVICE_UI.md'
          doc = doc_path.read_text()
          doc = re.sub(
              r'- final runtime/source head qualified after lint and CI remediation: `[^`]+`\n'
              r'- final OpenNebula smoke run on that source: GitHub Actions run `[^`]+`\n'
              r'- final exact-source production re-audit: GitHub Actions run `[^`]+`\n'
              r'- Node 22 production job: `[^`]+`\n'
              r'- Node 18 floor job: `[^`]+`',
              '- zero-advisory dependency qualification: GitHub Actions run `34729739804`\n'
              f'- final source/CI cleanup qualification: GitHub Actions run `{run_id}`\n'
              '- supported FireEdge runtime floor: Node `>=22`',
              doc,
              count=1,
          )

          security_section = '''## Dependency and security modernization

          The inherited FireEdge lock initially reported **6 critical, 29 high, 15 moderate and 9 low** runtime advisories. The production runtime and legacy development/build chains have now both been qualified and remediated without using `npm audit fix --force`.

          The hardened runtime includes patched versions of the directly exposed/network/security-sensitive dependencies, including Axios, DOMPurify, Express, fast-xml-parser, `http-proxy-middleware`, Immutable, jsonwebtoken, Lodash, Luxon, Multer, Socket.IO client/server, Webpack and `node-zendesk`. `d3-color` is pinned to 3.1.0; legacy `opennebula-guacamole` transitives are constrained to patched compatible Luxon/`ws` versions; Jimp uses the v1 API; and `qs` is constrained to 6.16.0.

          The remaining development/build advisories were then removed with a separately qualified build-tool closure: `eslint-import-resolver-webpack` 0.13.11, `webpack-dev-middleware` 5.3.4, a patched nested Babel core for `eslint-config-opennebula`, and non-breaking transitive lock updates. That exact tree passed the full FireEdge production build and real Chromium before it was committed.

          Current locked audits on Node 22 are:

          - runtime `npm audit --omit=dev`: **0 critical / 0 high / 0 moderate / 0 low / 0 total**;
          - complete `npm audit`: **0 critical / 0 high / 0 moderate / 0 low / 0 total**.

          FireEdge declares **Node >=22**. Node 22 is therefore the minimum supported runtime for this branch; older Node versions are not part of the qualified deployment contract.

          A permanent `LayerSentry FireEdge Security` workflow now performs locked install, both audits, LayerSentry regression tests, lint and the complete production build whenever the dependency/security contract changes. A source-level regression test also pins the qualified dependency/Jimp API contract so accidental downgrade or API regression fails CI.

          '''.replace('          ', '')
          doc, n = re.subn(
              r'## Dependency and security modernization\n.*?(?=## Zendesk and Guacamole compatibility hardening)',
              security_section,
              doc,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('dependency/security documentation section not found')

          doc = doc.replace(
              'which preserves the declared Node 18 runtime floor.',
              'which is qualified within the declared Node >=22 runtime floor.'
          )

          validation = f'''## Final automated validation evidence

          The dependency closure committed at `ec32f66b939ea84c4beef65a6b625103db5e2b77` was qualified in GitHub Actions run `34729739804` before publication:

          - locked Node 22 install passed;
          - runtime audit: **0 vulnerabilities**;
          - complete dependency audit including development/build tooling: **0 vulnerabilities**;
          - **117 / 117 LayerSentry integration/regression tests passed** before the new dependency-drift tests were added;
          - FireEdge client/server lint passed;
          - complete FireEdge production build passed (`build-client`, `build-server`, all module-federation remotes); and
          - real Playwright/Chromium acceptance passed.

          Final cleanup qualification run `{run_id}` then adds the permanent dependency-security tests/workflow, removes the two LayerSentry-only Webpack `TabType` warnings, corrects feature-branch smoke classification, refreshes this evidence, and re-runs both audits, the expanded test suite, lint, the complete production build and Chromium acceptance before committing the cleanup.

          OpenNebula repository smoke remains strict for stable/manual runs. For feature branches, push and PR checks execute all non-Ruby smoke tests while RuboCop is scoped to Ruby files actually changed by the PR. PR #1 changes no Ruby files, so inherited P1/base RuboCop debt cannot masquerade as a P2 FireEdge regression.

          Temporary one-shot qualification workflows are removed from the deliverable after evidence capture. The permanent `layersentry-fireedge-security.yml` workflow remains as the dependency/build regression gate.

          '''.replace('          ', '')
          doc, n = re.subn(
              r'## Final automated validation evidence\n.*?(?=## Readiness interpretation)',
              validation,
              doc,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('final automated validation section not found')

          doc = re.sub(
              r'The resulting clean runtime/source head `[^`]+` passed OpenNebula Smoke Tests run `[^`]+`, including FireEdge client/server lint and all later non-Ruby smoke checks\.',
              'The P2 source is regression-tested independently of inherited base-branch Ruby lint debt; PR and feature-push smoke checks retain every non-Ruby smoke test and changed-Ruby lint.',
              doc,
              count=1,
          )
          doc = doc.replace(
              'Node 22 and Node 18 LayerSentry tests',
              'Node 22 LayerSentry tests'
          )
          doc = doc.replace('Node **>=18**', 'Node **>=22**')
          doc = doc.replace('Node `>=18`', 'Node `>=22`')

          stale = [
              '0 critical**\n- **1 high',
              'remaining high is `serialize-javascript`',
              'Node 18 floor job',
              'Node 18 locked install',
              '117 / 117 LayerSentry tests** on Node 18',
              '32e7749c7ef7163025132a47f47d2200c76c6ae6',
          ]
          for marker in stale:
              if marker in doc:
                  raise SystemExit(f'stale documentation marker remains: {marker}')
          doc_path.write_text(doc)

          # The one-shot workflow removes itself from the final deliverable.
          (root / '.github/workflows/layersentry-security-audit-once.yml').unlink()
          PY
          git diff --check
      - name: Locked install and zero-advisory verification
        working-directory: src/fireedge
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --json > /tmp/runtime-audit.json || true
          npm audit --json > /tmp/full-audit.json || true
          node - <<'NODE'
          const fs = require('fs')
          for (const [kind, file] of [
            ['runtime', '/tmp/runtime-audit.json'],
            ['full', '/tmp/full-audit.json'],
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'))
            const counts = report?.metadata?.vulnerabilities ?? {}
            console.log(`${kind.toUpperCase()}_AUDIT=${JSON.stringify(counts)}`)
            if ((counts.total ?? 0) !== 0) process.exitCode = 2
          }
          NODE
      - name: Expanded LayerSentry regression tests
        working-directory: src/fireedge
        run: node --test tests/layersentry/*.test.cjs
      - name: FireEdge lint
        working-directory: src/fireedge
        run: npm run lint
      - name: Full production build and LayerSentry warning gate
        working-directory: src/fireedge
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/fireedge-build.log
          if grep -E 'WARNING.*ExtraConfiguration/(gpu|protection)/index\.js' /tmp/fireedge-build.log; then
            echo 'LayerSentry TabType build warning remains' >&2
            exit 2
          fi
      - name: Install Chromium runner without changing lock
        working-directory: src/fireedge
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build browser acceptance harness
        working-directory: src/fireedge
        run: npx webpack --config tests/layersentry/browser/webpack.config.cjs
      - name: Real Chromium acceptance
        working-directory: src/fireedge
        shell: bash
        run: |
          python3 -m http.server 4173 --directory tests/layersentry/browser/dist >/tmp/layersentry-browser.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ >/dev/null
          node tests/layersentry/browser/smoke.cjs
      - name: Commit exact final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(layersentry): close remaining P2 code and CI gaps'
          git push origin HEAD:feat/self-service-v5-ui-20260911
