name: LayerSentry security audit once

on:
  push:
    branches:
      - feat/self-service-v5-ui-20260911
    paths:
      - '.github/workflows/layersentry-security-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/self-service-v5-ui-20260911
          persist-credentials: false
      - name: Map direct dependency usage only
        run: |
          cd src/fireedge
          for token in "jimp" "fast-xml-parser" "uuid" "yaml" "morgan" "compression" "express" "copy-webpack-plugin" "terser-webpack-plugin" "@babel/core"; do
            echo "===== $token ====="
            git grep -n -i -- "$token" -- src webpack*.js '*.js' ':!package-lock.json' ':!package.json' 2>/dev/null | head -n 80 || true
          done
