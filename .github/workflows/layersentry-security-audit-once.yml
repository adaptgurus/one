name: LayerSentry security candidate once

on:
  push:
    branches:
      - feat/self-service-v5-ui-20260911
    paths:
      - '.github/workflows/layersentry-security-audit-once.yml'

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/self-service-v5-ui-20260911
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Apply security candidate in working tree only
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          const updates = {
            '@babel/core': '7.29.7',
            'babel-loader': '9.2.1',
            'compression': '1.8.2',
            'copy-webpack-plugin': '14.0.0',
            'fast-xml-parser': '5.11.1',
            'jimp': '1.6.1',
            'morgan': '1.12.1',
            'terser-webpack-plugin': '5.6.1',
            'uuid': '11.1.1',
            'webpack-cli': '5.1.4',
            'yaml': '1.10.3'
          }
          for (const [name, version] of Object.entries(updates)) {
            if (!(name in pkg.dependencies)) throw new Error(`missing direct dependency ${name}`)
            pkg.dependencies[name] = version
          }
          pkg.engines = { ...(pkg.engines || {}), node: '>=22' }
          pkg.overrides = { ...(pkg.overrides || {}), qs: '6.16.0' }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')

          const logoPath = 'src/server/utils/logo.js'
          let logo = fs.readFileSync(logoPath, 'utf8')
          logo = logo.replace("const Jimp = require('jimp')", "const { Jimp, JimpMime } = require('jimp')")
          logo = logo.replaceAll('getBufferAsync(Jimp.MIME_PNG)', 'getBuffer(JimpMime.png)')
          logo = logo.replace('const resizedImage = await image.resize(32, 32)', 'const resizedImage = image.resize({ w: 32, h: 32 })')
          if (logo.includes('getBufferAsync') || logo.includes('Jimp.MIME_PNG') || logo.includes('resize(32, 32)')) throw new Error('legacy Jimp v0 API remains')
          fs.writeFileSync(logoPath, logo)
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install generated candidate lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact candidate versions and runtime floor
        run: |
          node - <<'NODE'
          const pkg=require('./package.json')
          const lock=require('./package-lock.json')
          const expected={
            '@babel/core':'7.29.7','babel-loader':'9.2.1',compression:'1.8.2','copy-webpack-plugin':'14.0.0',
            'fast-xml-parser':'5.11.1',jimp:'1.6.1',morgan:'1.12.1','terser-webpack-plugin':'5.6.1',
            uuid:'11.1.1','webpack-cli':'5.1.4',yaml:'1.10.3',qs:'6.16.0'
          }
          if(pkg.engines?.node!=='>=22') throw new Error(`unexpected Node floor ${pkg.engines?.node}`)
          for (const [name,wanted] of Object.entries(expected)) {
            const actual=lock.packages[`node_modules/${name}`]?.version
            console.log(`${name}=${actual}`)
            if(actual!==wanted) process.exitCode=2
          }
          console.log('serialize-javascript='+lock.packages['node_modules/serialize-javascript']?.version)
          NODE
      - name: Runtime dependency audit must be zero
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs=require('fs')
          const report=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'))
          const counts=report?.metadata?.vulnerabilities ?? {}
          console.log('RUNTIME_AUDIT='+JSON.stringify(counts))
          if ((counts.total ?? 0) !== 0) {
            for (const [name,v] of Object.entries(report.vulnerabilities||{})) console.log('REMAINING',name,v.severity,v.range,v.fixAvailable)
            process.exitCode=2
          }
          NODE
      - name: Report complete dependency audit
        run: |
          npm audit --json > /tmp/full-audit.json || true
          node - <<'NODE'
          const fs=require('fs')
          const report=JSON.parse(fs.readFileSync('/tmp/full-audit.json','utf8'))
          console.log('FULL_AUDIT='+JSON.stringify(report?.metadata?.vulnerabilities ?? {}))
          NODE
      - name: Dependency API compatibility smoke
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict')
          const {Jimp,JimpMime}=require('jimp')
          const {XMLParser,XMLBuilder}=require('fast-xml-parser')
          const {v4}=require('uuid')
          const YAML=require('yaml')
          const qs=require('qs')
          ;(async()=>{
            const image=new Jimp({width:4,height:4,color:0xff0000ff})
            image.resize({w:2,h:2})
            const png=await image.getBuffer(JimpMime.png)
            assert.ok(Buffer.isBuffer(png)&&png.length>0)
            const parser=new XMLParser();const builder=new XMLBuilder()
            assert.equal(parser.parse(builder.build({root:{value:'ok'}})).root.value,'ok')
            assert.match(v4(),/^[0-9a-f-]{36}$/)
            assert.deepEqual(YAML.parse('a: 1\nb:\n  - x\n'),{a:1,b:['x']})
            assert.deepEqual(qs.parse('a[b]=1'),{a:{b:'1'}})
            console.log('dependency API smoke passed')
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE
      - name: LayerSentry regression tests
        run: node --test tests/layersentry/*.test.cjs
      - name: FireEdge lint
        run: npm run lint
      - name: Full FireEdge production build
        run: npm run build
      - name: Install Chromium runner without changing lock
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build browser acceptance harness
        run: npx webpack --config tests/layersentry/browser/webpack.config.cjs
      - name: Real Chromium acceptance
        run: |
          python3 -m http.server 4173 --directory tests/layersentry/browser/dist >/tmp/layersentry-browser.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ >/dev/null
          node tests/layersentry/browser/smoke.cjs
      - name: Commit exact qualified security update
        working-directory: .
        run: |
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fireedge/package.json src/fireedge/package-lock.json src/fireedge/src/server/utils/logo.js
          git diff --cached --check
          git commit -m 'security(fireedge): eliminate runtime dependency advisories'
          git push origin HEAD:feat/self-service-v5-ui-20260911
