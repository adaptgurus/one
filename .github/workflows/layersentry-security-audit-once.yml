name: LayerSentry dev dependency qualification once

on:
  push:
    branches:
      - feat/self-service-v5-ui-20260911
    paths:
      - '.github/workflows/layersentry-security-audit-once.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: src/fireedge
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/self-service-v5-ui-20260911
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Build zero-advisory dev candidate
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const p='package.json'
          const pkg=JSON.parse(fs.readFileSync(p,'utf8'))
          pkg.devDependencies['eslint-import-resolver-webpack']='0.13.11'
          pkg.devDependencies['webpack-dev-middleware']='5.3.4'
          pkg.overrides={
            ...(pkg.overrides||{}),
            'eslint-config-opennebula': {
              ...((pkg.overrides||{})['eslint-config-opennebula']||{}),
              '@babel/core':'7.29.7'
            }
          }
          fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\n')
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify zero full and runtime advisories
        run: |
          npm audit --json > /tmp/full.json || true
          npm audit --omit=dev --json > /tmp/runtime.json || true
          node - <<'NODE'
          const fs=require('fs')
          for(const [kind,file] of [['FULL','/tmp/full.json'],['RUNTIME','/tmp/runtime.json']]){
            const r=JSON.parse(fs.readFileSync(file,'utf8'))
            const counts=r?.metadata?.vulnerabilities||{}
            console.log(`${kind}_AUDIT=${JSON.stringify(counts)}`)
            if((counts.total||0)!==0){
              for(const [name,v] of Object.entries(r.vulnerabilities||{})) console.log(kind,'REMAINING',name,v.severity,v.range,v.fixAvailable)
              process.exitCode=2
            }
          }
          NODE
      - name: Verify resolved dependency contract
        run: |
          node - <<'NODE'
          const pkg=require('./package.json')
          const lock=require('./package-lock.json')
          if(pkg.engines?.node!=='>=22') throw new Error(`Node floor drifted: ${pkg.engines?.node}`)
          if(pkg.devDependencies?.['eslint-import-resolver-webpack']!=='0.13.11') throw new Error('resolver version drifted')
          if(pkg.devDependencies?.['webpack-dev-middleware']!=='5.3.4') throw new Error('webpack-dev-middleware version drifted')
          if(pkg.overrides?.['eslint-config-opennebula']?.['@babel/core']!=='7.29.7') throw new Error('nested Babel override missing')
          const topExpected={
            'eslint-import-resolver-webpack':'0.13.11',
            'webpack-dev-middleware':'5.3.4',
            'flatted':'3.4.4',
            'js-yaml':'3.15.2'
          }
          for(const [name,wanted] of Object.entries(topExpected)){
            const actual=lock.packages?.[`node_modules/${name}`]?.version
            console.log(`${name}=${actual}`)
            if(actual!==wanted) throw new Error(`${name} expected ${wanted}, got ${actual}`)
          }
          const nested=lock.packages?.['node_modules/eslint-config-opennebula/node_modules/@babel/core']?.version
          console.log(`eslint-config-opennebula/@babel/core=${nested || 'deduped to root'}`)
          if(nested && nested!=='7.29.7') throw new Error(`nested Babel remains ${nested}`)
          for(const [key,meta] of Object.entries(lock.packages||{})){
            if(key.endsWith('/bn.js')) console.log(`${key}=${meta.version}`)
          }
          NODE
          npm ls --all >/tmp/npm-ls.txt || { cat /tmp/npm-ls.txt; exit 1; }
      - name: LayerSentry regression tests
        run: node --test tests/layersentry/*.test.cjs
      - name: FireEdge lint
        run: npm run lint
      - name: Full FireEdge production build
        run: npm run build
      - name: Install Chromium runner without changing lock
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build browser acceptance harness
        run: npx webpack --config tests/layersentry/browser/webpack.config.cjs
      - name: Real Chromium acceptance
        run: |
          python3 -m http.server 4173 --directory tests/layersentry/browser/dist >/tmp/layersentry-browser.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ >/dev/null
          node tests/layersentry/browser/smoke.cjs
      - name: Commit exact qualified dependency closure
        working-directory: .
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fireedge/package.json src/fireedge/package-lock.json
          git diff --cached --check
          git commit -m 'security(fireedge): clear development dependency advisories'
          git push origin HEAD:feat/self-service-v5-ui-20260911
