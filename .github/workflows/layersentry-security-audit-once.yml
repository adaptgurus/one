name: LayerSentry final evidence qualification once

on:
  push:
    branches:
      - feat/self-service-v5-ui-20260911
    paths:
      - '.github/workflows/layersentry-security-audit-once.yml'

permissions:
  contents: write

jobs:
  qualify-final-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/self-service-v5-ui-20260911
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/fireedge/package-lock.json
      - name: Refresh exact evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path('.')
          doc_path = root / 'src/fireedge/docs/LAYERSENTRY_SELF_SERVICE_UI.md'
          doc = doc_path.read_text()
          run_id = os.environ['GITHUB_RUN_ID']

          evidence = (
              '- dependency closure commit: `ec32f66b939ea84c4beef65a6b625103db5e2b77`\n'
              '- zero-advisory dependency qualification: GitHub Actions run `34729739804`\n'
              f'- final source/CI/evidence qualification: GitHub Actions run `{run_id}`\n'
              '- supported FireEdge runtime floor: Node `>=22`'
          )
          doc, n = re.subn(
              r'- final runtime/source head qualified after lint and CI remediation: `[^`]+`\n'
              r'- final OpenNebula smoke run on that source: GitHub Actions run `[^`]+`\n'
              r'- final exact-source production re-audit: GitHub Actions run `[^`]+`\n'
              r'- Node 22 production job: `[^`]+`\n'
              r'- Node 18 floor job: `[^`]+`',
              evidence,
              doc,
              count=1,
          )
          if n != 1:
              raise SystemExit('evidence-base block not found')

          security = '''## Dependency and security modernization

          The inherited FireEdge lock initially reported **6 critical, 29 high, 15 moderate and 9 low** runtime advisories under `npm audit --omit=dev`. The production runtime and legacy development/build dependency trees have now both been remediated and qualified without using `npm audit fix --force`.

          The hardened runtime includes patched versions of the directly exposed/network/security-sensitive dependencies, including Axios, DOMPurify, Express, fast-xml-parser, `http-proxy-middleware`, Immutable, jsonwebtoken, Lodash, Luxon, Multer, Socket.IO client/server, Webpack and `node-zendesk`. `d3-color` is pinned to 3.1.0; legacy `opennebula-guacamole` transitives are constrained to patched compatible Luxon/`ws` versions; Jimp uses its v1 API; and `qs` is constrained to 6.16.0.

          Development/build-chain findings were removed with a separately qualified closure: `eslint-import-resolver-webpack` 0.13.11, `webpack-dev-middleware` 5.3.4, `@babel/core` 7.29.7 for `eslint-config-opennebula`, and compatible transitive lock updates. The exact tree was accepted only after tests, lint, the complete FireEdge production build and real Chromium passed.

          Current locked Node 22 audits are:

          - runtime `npm audit --omit=dev`: **0 critical / 0 high / 0 moderate / 0 low / 0 total**;
          - complete `npm audit`: **0 critical / 0 high / 0 moderate / 0 low / 0 total**.

          FireEdge declares **Node >=22**. Node 22 is the minimum qualified runtime for this branch.

          A permanent `LayerSentry FireEdge Security` workflow performs locked install, both audits, LayerSentry regression tests, lint and the complete production build whenever the dependency/security contract changes. `dependency-security.test.cjs` pins the qualified dependency and Jimp API contract so an accidental downgrade or API regression fails CI.

          '''.replace('          ', '')
          doc, n = re.subn(
              r'## Dependency and security modernization\n.*?(?=## Zendesk and Guacamole compatibility hardening)',
              security,
              doc,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('dependency/security section not found')

          doc = doc.replace(
              'which preserves the declared Node 18 runtime floor.',
              'within the declared Node >=22 runtime contract.'
          )
          doc = doc.replace(
              'Pull requests run every non-Ruby smoke test plus RuboCop on Ruby files actually changed by the PR; push/manual runs retain the full repository smoke suite.',
              'Pull requests run every non-Ruby smoke test plus RuboCop on Ruby files actually changed by the PR. Feature-branch pushes also run every non-Ruby smoke test, while stable/manual runs retain the full repository-wide RuboCop sweep.'
          )
          doc = re.sub(
              r'The resulting clean runtime/source head `[^`]+` passed OpenNebula Smoke Tests run `[^`]+`, including FireEdge client/server lint and all later non-Ruby smoke checks\.',
              'The P2 branch is regression-tested independently of inherited base-branch Ruby lint debt: PR and feature-push checks retain every non-Ruby smoke test, and any Ruby changed by a PR remains RuboCop-gated.',
              doc,
              count=1,
          )

          validation = f'''## Final automated validation evidence

          Dependency closure commit `ec32f66b939ea84c4beef65a6b625103db5e2b77` was qualified in GitHub Actions run `34729739804` before publication:

          - locked Node 22 install passed;
          - runtime audit: **0 vulnerabilities**;
          - complete audit including development/build dependencies: **0 vulnerabilities**;
          - **117 / 117 LayerSentry integration/regression tests passed** before the two dependency-contract tests were added;
          - FireEdge client/server lint passed;
          - complete FireEdge production build passed (`build-client`, `build-server`, all module-federation remotes); and
          - real Playwright/Chromium acceptance passed.

          Final qualification run `{run_id}` validates the final tree after the durable dependency tests/workflow, feature-push smoke correction, and GPU/Backup-&-DR `TabType` warning fixes:

          - runtime and complete audits must both remain **0 vulnerabilities**;
          - **119 / 119 LayerSentry tests** must pass;
          - FireEdge lint must pass;
          - the complete production build must pass;
          - the LayerSentry GPU/protection `TabType` Webpack warnings must be absent; and
          - real Chromium acceptance must pass.

          PR #1 changes no Ruby source. Stable/manual OpenNebula smoke continues the full repository RuboCop sweep; feature-branch push and PR checks retain all non-Ruby smoke coverage, with RuboCop scoped to Ruby actually changed by the PR. This prevents inherited P1/base RuboCop debt from being misreported as a P2 FireEdge regression without weakening changed-code checks.

          The one-shot qualification workflow removes itself before the final commit. The permanent `layersentry-fireedge-security.yml` workflow remains as the dependency/audit/build regression gate.

          '''.replace('          ', '')
          doc, n = re.subn(
              r'## Final automated validation evidence\n.*?(?=## Readiness interpretation)',
              validation,
              doc,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('final validation section not found')

          doc = doc.replace(
              'Node 22 and Node 18 LayerSentry tests',
              'Node 22 LayerSentry tests'
          )
          doc = doc.replace('Node **>=18**', 'Node **>=22**')
          doc = doc.replace('Node `>=18`', 'Node `>=22`')

          stale = [
              'remaining high is `serialize-javascript`',
              'Node 18',
              '0 critical**\n- **1 high',
              '32e7749c7ef7163025132a47f47d2200c76c6ae6',
              '34672189834',
          ]
          for marker in stale:
              if marker in doc:
                  raise SystemExit(f'stale evidence remains: {marker}')

          doc_path.write_text(doc)
          (root / '.github/workflows/layersentry-security-audit-once.yml').unlink()
          PY
          git diff --check
      - name: Locked install and zero-advisory verification
        working-directory: src/fireedge
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --json > /tmp/runtime-audit.json || true
          npm audit --json > /tmp/full-audit.json || true
          node - <<'NODE'
          const fs = require('fs')
          for (const [kind, file] of [
            ['runtime', '/tmp/runtime-audit.json'],
            ['full', '/tmp/full-audit.json'],
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'))
            const counts = report?.metadata?.vulnerabilities ?? {}
            console.log(`${kind.toUpperCase()}_AUDIT=${JSON.stringify(counts)}`)
            if ((counts.total ?? 0) !== 0) process.exitCode = 2
          }
          NODE
      - name: Expanded LayerSentry regression tests
        working-directory: src/fireedge
        run: node --test tests/layersentry/*.test.cjs
      - name: FireEdge lint
        working-directory: src/fireedge
        run: npm run lint
      - name: Full production build and LayerSentry warning gate
        working-directory: src/fireedge
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/fireedge-build.log
          if grep -E 'WARNING.*ExtraConfiguration/(gpu|protection)/index\.js' /tmp/fireedge-build.log; then
            echo 'LayerSentry TabType build warning remains' >&2
            exit 2
          fi
      - name: Install Chromium runner without changing lock
        working-directory: src/fireedge
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build browser acceptance harness
        working-directory: src/fireedge
        run: npx webpack --config tests/layersentry/browser/webpack.config.cjs
      - name: Real Chromium acceptance
        working-directory: src/fireedge
        shell: bash
        run: |
          python3 -m http.server 4173 --directory tests/layersentry/browser/dist >/tmp/layersentry-browser.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ >/dev/null
          node tests/layersentry/browser/smoke.cjs
      - name: Commit exact final evidence tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(layersentry): publish final zero-advisory qualification evidence'
          git push origin HEAD:feat/self-service-v5-ui-20260911
