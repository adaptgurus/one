          $after=& ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
