name: Manoj HyperV No-Write MORPHING Retry and Complete

on:
  push:
    branches:
      - qual/manoj-hyperv-migration-20260924
    paths:
      - '.github/workflows/manoj-hyperv-no-write-morph-retry-complete.yml'

permissions:
  contents: read

concurrency:
  group: manoj-hyperv-cutover-materialize
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - name: Bind Manoj and protect source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'MANOJ-TEST-INST'){throw "Wrong runner: $env:RUNNER_NAME"}
          if($env:COMPUTERNAME -ine 'MANOJ-TEST-INST'){throw "Wrong host: $env:COMPUTERNAME"}
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          $n=@(Get-VMSnapshot -VMName $src.Name -ErrorAction SilentlyContinue).Count
          Write-Host "SOURCE_BEFORE_STATE=$($src.State)"
          Write-Host "SOURCE_BEFORE_CHECKPOINTS=$n"
          if($src.State -ne 'Off'){throw "Recovery requires source Off: $($src.State)"}
          if($n -ne 0){throw 'Unexpected source checkpoint'}
          if((Get-VM -Name 'ls-appliance-qual' -ErrorAction Stop).State -ne 'Running'){throw 'OneSwap appliance not Running'}
          if((Get-VM -Name 'ls-fe2' -ErrorAction Stop).State -ne 'Off'){throw 'FE2 authority VM must remain Off'}
          Write-Host 'NO_WRITE_RETRY_SOURCE_GATE=PASS'

      - name: Prepare restricted appliance key and block baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\LayerSentryLab\qualification\keys\oneswap_qual_ed25519'
          $tmp=Join-Path $env:RUNNER_TEMP 'oneswap-no-write-retry.key'
          Copy-Item -Force $src $tmp
          & icacls.exe $tmp /inheritance:r | Out-Null
          & icacls.exe $tmp /grant:r '*S-1-5-18:F' | Out-Null
          & icacls.exe $tmp /setowner '*S-1-5-18' | Out-Null
          & ssh-keygen.exe -y -f $tmp *> $null
          if($LASTEXITCODE -ne 0){throw 'restricted appliance key invalid'}
          "ONESWAP_TEMP_KEY=$tmp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $before=& ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $tmp "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          if($LASTEXITCODE -ne 0){throw 'appliance block baseline failed'}
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($before -join [Environment]::NewLine)))
          "ONESWAP_BLOCKS_BEFORE_B64=$b64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove exact no-write retry state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          op="manoj-hv-ls-migration-source-test-20260924"
          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"
            safe=op.gsub(/[^A-Za-z0-9_.-]/,"_"); suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$op")
          python3 - "$state" <<'PY'
          import json,os,sys
          s=json.load(open(sys.argv[1])); root=os.path.dirname(sys.argv[1])
          print("RETRY_STATE_PHASE="+str(s.get("phase")))
          print("PRELAUNCH_RECOVERY_STARTED="+str(s.get("morph_prelaunch_recovery_started_at")))
          print("PRELAUNCH_RECOVERY_COMPLETED="+str(s.get("morph_prelaunch_recovery_completed_at")))
          print("NO_WRITE_RETRY_STARTED="+str(s.get("morph_no_write_retry_started_at")))
          if s.get("phase")!="MORPHING": raise SystemExit("not MORPHING")
          if not s.get("morph_prelaunch_recovery_started_at"): raise SystemExit("previous recovery start evidence missing")
          if s.get("morph_prelaunch_recovery_completed_at"): raise SystemExit("previous recovery unexpectedly completed")
          if s.get("morph_no_write_retry_started_at"): raise SystemExit("no-write retry already attempted")
          if s.get("delta_applied_at") or s.get("import_started_at") or s.get("template_id") or s.get("imported_at"):
              raise SystemExit("later phase evidence exists")
          xml=os.path.join(root,"final-libvirt.xml")
          if not os.path.isfile(xml) or os.path.getsize(xml)<=0: raise SystemExit("retained RAW XML missing")
          text=open(xml).read()
          expected=len(s.get("disks") or [])
          actual=text.count("<driver name='qemu' type='raw'/>")
          print("RETAINED_RAW_DRIVER_COUNT="+str(actual))
          if actual!=expected: raise SystemExit("retained RAW XML disk count mismatch")
          print("NO_WRITE_RETRY_STATE_GATE=PASS")
          PY
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'no-write retry state gate failed'}

      - name: Deploy exact no-write recovery runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $head='00d13174de2fe2df2dac60c400dc53a2178f61db'
          $files=@(
            'oneswap-hyperv',
            'hyperv_helper.rb',
            'hyperv_hot_helper.rb',
            'hyperv_hot_hardening.rb',
            'hyperv_import_recovery.rb',
            'hyperv_virtio_hardening.rb',
            'hyperv_network_hardening.rb'
          )
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $common=@('-o','LogLevel=ERROR','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=4','-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$known",'-o','ConnectTimeout=8','-i',$env:ONESWAP_TEMP_KEY)
          foreach($name in $files){
            $dst=Join-Path $env:RUNNER_TEMP $name
            & curl.exe -L --fail --silent --show-error --connect-timeout 8 --max-time 45 -o $dst "https://raw.githubusercontent.com/adaptgurus/one-swap/$head/$name"
            if($LASTEXITCODE -ne 0){throw "download failed: $name"}
            Write-Host ("RETRY_RUNTIME_SOURCE name={0} sha256={1}" -f $name,(Get-FileHash -Algorithm SHA256 $dst).Hash.ToLower())
            & scp.exe @common $dst "ci@10.250.10.32:/tmp/$name.no-write"
            if($LASTEXITCODE -ne 0){throw "scp failed: $name"}
          }
          $script=@'
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          deploy(){
            src="$1"; dst="$2"; mode="$3"
            ruby -c "$src"
            sudo cp -a "$dst" "$dst.before-no-write-retry-$stamp"
            sudo install -o root -g root -m "$mode" "$src" "$dst"
            sudo ruby -c "$dst"
          }
          deploy /tmp/oneswap-hyperv.no-write /usr/bin/oneswap-hyperv 0755
          deploy /tmp/hyperv_helper.rb.no-write /usr/lib/one/ruby/cli/one_helper/hyperv_helper.rb 0644
          deploy /tmp/hyperv_hot_helper.rb.no-write /usr/lib/one/ruby/cli/one_helper/hyperv_hot_helper.rb 0644
          deploy /tmp/hyperv_hot_hardening.rb.no-write /usr/lib/one/ruby/cli/one_helper/hyperv_hot_hardening.rb 0644
          deploy /tmp/hyperv_import_recovery.rb.no-write /usr/lib/one/ruby/cli/one_helper/hyperv_import_recovery.rb 0644
          deploy /tmp/hyperv_virtio_hardening.rb.no-write /usr/lib/one/ruby/cli/one_helper/hyperv_virtio_hardening.rb 0644
          deploy /tmp/hyperv_network_hardening.rb.no-write /usr/lib/one/ruby/cli/one_helper/hyperv_network_hardening.rb 0644
          rm -f /tmp/*.no-write
          grep -Fq -- '--recover-morphing-no-write' /usr/bin/oneswap-hyperv
          grep -Fq -- '--libguestfs-memsize' /usr/bin/oneswap-hyperv
          grep -Fq 'def recover_morphing_no_write_retry' /usr/lib/one/ruby/cli/one_helper/hyperv_import_recovery.rb
          grep -Fq 'LIBGUESTFS_MEMSIZE' /usr/lib/one/ruby/cli/one_helper/hyperv_hot_helper.rb
          grep -Fq 'LIBGUESTFS_MEMSIZE' /usr/lib/one/ruby/cli/one_helper/hyperv_hot_hardening.rb
          grep -Fq 'LIBGUESTFS_MEMSIZE' /usr/lib/one/ruby/cli/one_helper/hyperv_virtio_hardening.rb
          grep -Fq 'LIBGUESTFS_MEMSIZE' /usr/lib/one/ruby/cli/one_helper/hyperv_network_hardening.rb
          echo 'NO_WRITE_RETRY_RUNTIME_DEPLOY=PASS'
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe @common "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'no-write recovery runtime deployment failed'}

      - name: Prove libguestfs 1024 MB launch read-only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $script=@'
          set -euo pipefail
          op="manoj-hv-ls-migration-source-test-20260924"
          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"; safe=op.gsub(/[^A-Za-z0-9_.-]/,"_")
            suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$op")
          raw=$(python3 - "$state" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))["disks"][0]["prepared_raw_path"])
          PY
          )
          [ -f "$raw" ]
          echo "LIBGUESTFS_PREFLIGHT_RAW=$raw"
          LIBGUESTFS_MEMSIZE=1024 timeout --signal=TERM --kill-after=10s 180s guestfish --ro -a "$raw" run
          echo 'LIBGUESTFS_1024_READONLY_LAUNCH=PASS'
          '@
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'libguestfs 1024 MB read-only launch preflight failed'}

      - name: Attach FE2 read-only authority child
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $fe2=(Get-VMHardDiskDrive -VMName 'ls-fe2' -ErrorAction Stop | Where-Object {$_.Path} | Sort-Object ControllerNumber,ControllerLocation | Select-Object -First 1).Path
          if(-not $fe2){throw 'FE2 disk missing'}
          $audit=Join-Path 'C:\LayerSentryLab\qualification' ("fe2-no-write-retry-$env:GITHUB_RUN_ID.vhdx")
          New-VHD -Path $audit -ParentPath $fe2 -Differencing -ErrorAction Stop | Out-Null
          Add-VMHardDiskDrive -VMName 'ls-appliance-qual' -ControllerType SCSI -Path $audit -ErrorAction Stop
          "FE2_AUDIT_VHD=$audit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 3

      - name: Execute audited no-write MORPHING retry
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $beforeText=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:ONESWAP_BLOCKS_BEFORE_B64))
          $before=@($beforeText -split [Environment]::NewLine | Where-Object {$_})
          $after=& ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          if($LASTEXITCODE -ne 0){throw 'appliance block inventory failed'}
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
            if [ "$exists" = "true" ]; then auth=$(sudo guestfish --ro -a "$dev" -i cat "$p"); break; fi
          done
          [ -n "$auth" ]
          tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
          printf '%s\n' "$auth" > "$tmp"; chmod 600 "$tmp"
          export ONE_AUTH="$tmp"; export ONE_XMLRPC="http://10.250.10.11:2633/RPC2"
          op="manoj-hv-ls-migration-source-test-20260924"
          evidence="github-run-36126829958-job-108044774383-no-nbd-writes"

          sudo -E /usr/bin/oneswap-hyperv ls-migration-source-test \
            --hot --recover-morphing-no-write \
            --recovery-evidence "$evidence" \
            --libguestfs-memsize 1024 \
            --operation-id "$op" \
            --hyperv-connection manoj-qual \
            --config-file /etc/layersentry/oneswap/manoj-qual.yaml \
            --guest-os linux \
            --expected-guest-macs 00:15:5d:00:1c:07 \
            --uefi-sec-path /usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            --qemu-ga --cpu 0.5 --vcpu 2 --memory-mb 2560 \
            --datastore 1 --network 0

          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"; safe=op.gsub(/[^A-Za-z0-9_.-]/,"_")
            suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$op")
          python3 - "$state" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          print("NO_WRITE_RETRY_PHASE="+str(s.get("phase")))
          print("NO_WRITE_RETRY_EVIDENCE="+str(s.get("morph_no_write_retry_evidence")))
          print("NO_WRITE_RETRY_MEMSIZE="+str(s.get("morph_no_write_retry_libguestfs_memsize_mb")))
          print("NO_WRITE_RETRY_COMPLETED="+str(s.get("morph_no_write_retry_completed_at")))
          if s.get("phase")!="DELTA_APPLIED": raise SystemExit("retry did not reach DELTA_APPLIED")
          if not s.get("morph_no_write_retry_completed_at"): raise SystemExit("retry completion evidence missing")
          PY
          echo 'MORPHING_NO_WRITE_RETRY=PASS'
          '@
          $script=$script.Replace('__DEV__',$dev)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'audited no-write MORPHING retry failed; source remains Off'}

      - name: Resume restart-safe import to IMPORTED
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $beforeText=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:ONESWAP_BLOCKS_BEFORE_B64))
          $before=@($beforeText -split [Environment]::NewLine | Where-Object {$_})
          $after=& ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
            if [ "$exists" = "true" ]; then auth=$(sudo guestfish --ro -a "$dev" -i cat "$p"); break; fi
          done
          [ -n "$auth" ]
          tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
          printf '%s\n' "$auth" > "$tmp"; chmod 600 "$tmp"
          export ONE_AUTH="$tmp"; export ONE_XMLRPC="http://10.250.10.11:2633/RPC2"
          op="manoj-hv-ls-migration-source-test-20260924"
          sudo -E /usr/bin/oneswap-hyperv ls-migration-source-test \
            --hot --commit --libguestfs-memsize 1024 \
            --operation-id "$op" --hyperv-connection manoj-qual \
            --config-file /etc/layersentry/oneswap/manoj-qual.yaml \
            --guest-os linux --expected-guest-macs 00:15:5d:00:1c:07 \
            --uefi-sec-path /usr/share/OVMF/OVMF_CODE_4M.secboot.fd --qemu-ga \
            --cpu 0.5 --vcpu 2 --memory-mb 2560 --img-wait 1800 \
            --datastore 1 --network 0
          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"; safe=op.gsub(/[^A-Za-z0-9_.-]/,"_")
            suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$op")
          python3 - "$state" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          print("IMPORT_PHASE="+str(s.get("phase")))
          print("IMPORT_TEMPLATE_ID="+str(s.get("template_id")))
          print("IMPORT_IMAGE_COUNT="+str(len(s.get("image_imports") or [])))
          if s.get("phase")!="IMPORTED": raise SystemExit("import did not reach IMPORTED")
          if not isinstance(s.get("template_id"),int) or s["template_id"]<0: raise SystemExit("template id missing")
          PY
          echo 'ONESWAP_IMPORT_RECOVERY=PASS'
          '@
          $script=$script.Replace('__DEV__',$dev)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
          if($LASTEXITCODE -ne 0){throw 'restart-safe import did not prove IMPORTED'}

      - name: Verify source Off before materialization
        shell: powershell
        run: |
          $src=Get-VM -Name 'ls-migration-source-test' -ErrorAction Stop
          if($src.State -ne 'Off'){throw "No-dual-running gate failed: $($src.State)"}
          Write-Host 'SOURCE_OFF_BEFORE_TARGET=PASS'

      - name: Materialize target and wait for Running
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $known='C:\LayerSentryLab\qualification\oneswap-seed\known_hosts_appliance_v7'
          $beforeText=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:ONESWAP_BLOCKS_BEFORE_B64))
          $before=@($beforeText -split [Environment]::NewLine | Where-Object {$_})
          $after=& ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "lsblk -dnro NAME | sort"
          $new=@($after | Where-Object {$before -notcontains $_})
          if($new.Count -ne 1){throw "Expected one authority disk; found $($new.Count)"}
          $dev='/dev/'+$new[0]
          $script=@'
          set -euo pipefail
          dev="__DEV__"
          auth=""
          for p in /var/lib/one/.one/one_auth /etc/one/one_auth; do
            exists=$(sudo guestfish --ro -a "$dev" -i exists "$p" 2>/dev/null || echo false)
            if [ "$exists" = "true" ]; then auth=$(sudo guestfish --ro -a "$dev" -i cat "$p"); break; fi
          done
          [ -n "$auth" ]
          tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
          printf '%s\n' "$auth" > "$tmp"; chmod 600 "$tmp"
          export ONE_AUTH="$tmp"; export ONE_XMLRPC="http://10.250.10.11:2633/RPC2"
          op="manoj-hv-ls-migration-source-test-20260924"
          state=$(ruby -rdigest -ryaml -e '
            op=ARGV[0]; c=YAML.load_file("/etc/layersentry/oneswap/manoj-qual.yaml")||{}
            work=c["work_dir"]||c[:work_dir]||"/var/tmp"; safe=op.gsub(/[^A-Za-z0-9_.-]/,"_")
            suffix=Digest::SHA256.hexdigest(op)[0,16]
            puts File.join(work,"oneswap-hyperv-hot","#{safe}-#{suffix}","state.json")
          ' "$op")
          template_id=$(python3 - "$state" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))["template_id"])
          PY
          )
          target_name="ls-migration-source-test-migrated"
          existing=$(onevm list --xml | python3 -c "import sys,xml.etree.ElementTree as ET; r=ET.parse(sys.stdin).getroot(); xs=[v.findtext('ID') for v in r.findall('VM') if (v.findtext('NAME') or '')=='$target_name']; print(xs[0] if len(xs)==1 else '')")
          if [ -n "$existing" ]; then
            vm_id="$existing"; echo "TARGET_VM_ADOPTED id=$vm_id"
          else
            out=$(onetemplate instantiate "$template_id" --name "$target_name")
            printf '%s\n' "$out"
            vm_id=$(printf '%s\n' "$out" | sed -nE 's/.*VM ID: *([0-9]+).*/\1/p' | tail -1)
            [ -n "$vm_id" ]
          fi
          echo "TARGET_VM_ID=$vm_id"
          deadline=$((SECONDS+1200))
          while [ $SECONDS -lt $deadline ]; do
            xml=$(onevm show "$vm_id" --xml)
            st=$(printf '%s' "$xml" | python3 -c "import sys,xml.etree.ElementTree as ET; r=ET.fromstring(sys.stdin.read()); print((r.findtext('STATE') or '')+','+(r.findtext('LCM_STATE') or ''))")
            echo "TARGET_VM_STATE=$st"
            [ "$st" = "3,3" ] && break
            sleep 5
          done
          xml=$(onevm show "$vm_id" --xml)
          st=$(printf '%s' "$xml" | python3 -c "import sys,xml.etree.ElementTree as ET; r=ET.fromstring(sys.stdin.read()); print((r.findtext('STATE') or '')+','+(r.findtext('LCM_STATE') or ''))")
          [ "$st" = "3,3" ] || { onevm show "$vm_id"; exit 43; }
          echo "TARGET_VM_RUNNING=PASS id=$vm_id"
          '@
          $script=$script.Replace('__DEV__',$dev)
          $b64=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(([regex]::Replace($script,'\r',''))))
          & ssh.exe -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=8 -i $env:ONESWAP_TEMP_KEY "ci@10.250.10.32" "echo $b64 | base64 -d | sudo bash"
