name: LayerSentry Manoj lab credential preflight

on:
  push:
    branches:
      - fix/layersentry-vm-network-backup-20260921
    paths:
      - .github/workflows/layersentry-manoj-credential-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Test existing LayerSentry lab root credential candidates
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import pathlib
          import paramiko

          targets = {
              "ls-fe1": "10.250.10.11",
              "ls-kvm1": "10.250.10.20",
          }
          candidates = [
              pathlib.Path(r"C:\LayerSentryLab\qualification\durable-root-current.password"),
              pathlib.Path(r"C:\LayerSentryLab\qualification\qual-root-password.txt"),
              pathlib.Path(r"C:\LayerSentryLab\qualification\qual-root-ac7e14e.password"),
              pathlib.Path(r"C:\LayerSentryLab\qualification\qual-root-4c4ac81-35685057701.password"),
          ]

          usable = [p for p in candidates if p.is_file() and 0 < p.stat().st_size < 4096]
          if not usable:
              raise SystemExit("NO_LAYERSENTRY_ROOT_CANDIDATES")

          matches = []
          readable = 0
          for candidate in usable:
              try:
                  secret = candidate.read_text(encoding="utf-8").strip()
              except (OSError, UnicodeError):
                  print(f"CREDENTIAL_UNREADABLE FILE={candidate.name}")
                  continue
              readable += 1
              if not secret:
                  continue
              for name, host in targets.items():
                  client = paramiko.SSHClient()
                  client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  try:
                      client.connect(
                          host,
                          username="root",
                          password=secret,
                          look_for_keys=False,
                          allow_agent=False,
                          timeout=5,
                          banner_timeout=5,
                          auth_timeout=5,
                      )
                      _, stdout, _ = client.exec_command("hostname; id -u", timeout=5)
                      output = stdout.read().decode("utf-8", "replace").strip().splitlines()
                      print(f"CREDENTIAL_MATCH TARGET={name} FILE={candidate.name} HOST={output[0] if output else 'unknown'} UID={output[1] if len(output)>1 else 'unknown'}")
                      matches.append((name, candidate))
                  except Exception:
                      pass
                  finally:
                      client.close()

          if not matches:
              raise SystemExit(f"NO_MATCHING_LAYERSENTRY_ROOT_CREDENTIAL readable={readable} candidates={len(usable)}")
          '@
          $path = Join-Path $env:RUNNER_TEMP 'credential_preflight.py'
          Set-Content -Path $path -Value $script -Encoding UTF8
          python $path
